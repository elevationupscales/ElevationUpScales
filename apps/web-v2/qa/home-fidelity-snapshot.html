<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Web V2 Hero Mobile QA</title>
  <style>html,body{margin:0;width:100%;min-height:100%;background:#111}body{display:grid;place-items:start center;padding:8px;box-sizing:border-box}#qa{display:block;width:390px;height:844px;border:1px solid #333;background:#02070a}</style>
</head>
<body>
<iframe id="qa" title="Web V2 homepage mobile QA"></iframe>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/elevationupscales/ElevationUpScales/c33351ed62271d33ea1bede6882d37f3aa1a716f/apps/web-v2/src/';
  const files=['routes.js','styles.js','nav-styles.js','home-fidelity-styles.js','shell.js'];
  const parts=[];
  for(const file of files){
    const response=await fetch(base+file,{cache:'no-store'});
    if(!response.ok) throw new Error(file+': '+response.status);
    parts.push(await response.text());
  }
  let code=parts.join('\n').replace(/^import .*;\s*$/gm,'').replace(/\bexport\s+/g,'');
  code='(()=>{'+code+'\nwindow.__qa={renderPublicPage,styles,navStyles,homeFidelityStyles};})()';
  (0,eval)(code);

  const clientResponse=await fetch(base+'client.js',{cache:'no-store'});
  if(!clientResponse.ok) throw new Error('client.js: '+clientResponse.status);
  let clientCode=(await clientResponse.text()).replace(/^import .*;\s*$/gm,'').replace(/\bexport\s+/g,'');
  clientCode='(()=>{'+clientCode+'\nwindow.__qaClient=clientScript;})()';
  (0,eval)(clientCode);

  const routeInfo={path:'/',page:'home',title:'Elevation UpScales | Off-Grid Power • Supply • Logistics',description:'Elevation UpScales provides off-grid power, supply and logistics support for RV, solar, backup power, commercial systems and harder-to-serve markets.'};
  let html=window.__qa.renderPublicPage(routeInfo);
  html=html.replace('<link rel="stylesheet" href="/assets/app.css">','<style>'+window.__qa.styles+'\n'+window.__qa.navStyles+'\n'+window.__qa.homeFidelityStyles+'</style>');
  const safeClient=window.__qaClient.replace(/<\/script/gi,'<\\/script');
  html=html.replace('<script defer src="/assets/app.js"><' + '/script>','<script>'+safeClient+'<' + '/script>');
  document.getElementById('qa').srcdoc=html;
})().catch(error=>{document.body.innerHTML='<pre style="white-space:pre-wrap;color:#f66;background:#111;padding:20px">'+String(error.stack||error)+'</pre>'});
</script>
</body>
</html>
