<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="theme-color" content="#070707"><title>Report a Marketplace Issue | Elevation UpScales</title><link rel="stylesheet" href="/styles.css?v=3.0.3"><link rel="stylesheet" href="/site-shell.css?v=3.4.0"><link rel="stylesheet" href="/marketplace-listing.css?v=3.3.5-final"><script defer src="/site-shell.js?v=3.4.1"></script></head>
<body class="listing-page"><main class="issue-wrap"><section class="issue-card" aria-labelledby="issue-title"><p class="eyebrow">Elevation Marketplace <span class="marketplace-beta-status">BETA</span></p><h1 id="issue-title">Report an Issue</h1><p>If a Marketplace form, photo upload, submission, or page is not working, tell us what happened. This report is separate from the normal listing-submit endpoint.</p><form id="issue-form" class="issue-grid"><label>What went wrong?<select id="issue-type" required><option value="listing-form">Listing form / button</option><option value="photo-upload">Photo upload</option><option value="submission-failed">Submission failed</option><option value="marketplace-page">Marketplace page</option><option value="other">Other</option></select></label><label>What happened?<textarea id="issue-note" maxlength="800" required placeholder="Example: I selected four photos and Submit returned an error."></textarea></label><label>Name or contact <span class="issue-optional">(optional)</span><input id="issue-contact" maxlength="180" autocomplete="email" placeholder="Name, email, or phone"></label><p class="issue-context" id="issue-context"></p><div class="issue-actions"><button class="button button-primary" id="send-issue-report" type="submit">Send Issue Report</button><a class="button button-outline" id="back-to-form" href="/make-a-listing">Back to Selling</a><a class="button button-outline" id="text-support" href="sms:+12088134998?body=Hi%20Elevation%20UpScales%2C%20I%27m%20having%20trouble%20submitting%20a%20Marketplace%20listing.">Text Elevation</a></div><p id="issue-status" class="issue-status" role="status" aria-live="polite"></p></form></section></main><script>
(() => {
  const q=new URLSearchParams(location.search), page=q.get('page')||document.referrer||'/marketplace', stage=q.get('stage')||'user_report', requestRef=q.get('ref')||'', category=q.get('category')||'';
  const form=document.getElementById('issue-form'), status=document.getElementById('issue-status'), send=document.getElementById('send-issue-report'), back=document.getElementById('back-to-form'), context=document.getElementById('issue-context');
  const safeBack=page.startsWith('/')&&!page.startsWith('/api/')?page:'/make-a-listing'; back.href=safeBack; context.textContent=`Page: ${safeBack}${requestRef ? ` · Reference: ${requestRef}` : ''}`;
  form.addEventListener('submit', async (event) => {
    event.preventDefault(); send.disabled=true; send.textContent='Sending…'; status.textContent='Sending your report…';
    try {
      const response=await fetch('/api/marketplace/report-issue',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','X-EUS-Build':'v3.3.5-release-control-final'},body:JSON.stringify({type:document.getElementById('issue-type').value,page:safeBack,stage,requestRef,category,note:document.getElementById('issue-note').value,contact:document.getElementById('issue-contact').value,userAgent:navigator.userAgent,build:'v3.3.5-release-control-final'})});
      const data=await response.json().catch(()=>({})); if(!response.ok) throw new Error(data.error||'Could not send report');
      status.textContent=`Report received. Reference: ${data.reference||'submitted'}`; document.getElementById('issue-note').value='';
    } catch(error) { status.textContent=`${error.message||'Could not send report.'} You can still text Elevation UpScales using the button above.`; }
    finally { send.disabled=false; send.textContent='Send Issue Report'; }
  });
})();
</script></body></html>
