name: One-time Web V2 final render fix

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-final-render-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Apply render correction and test
        shell: bash
        run: |
          set -euo pipefail
          python deployment/v2/final_visual_render_fix.py
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
      - name: Commit render correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-final-render-fix.yml
          git rm deployment/v2/final_visual_render_fix.py
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Web V2: fix final visual asset rendering'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
