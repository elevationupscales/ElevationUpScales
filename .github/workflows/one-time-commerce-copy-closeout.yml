name: One-Time Commerce Copy Closeout

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  close-copy-regressions:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved public copy corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('site/store.html'): [
                  ('<strong>Hawaii Lithium Shipping</strong><small>Hawaii eligibility, rates, and island shipping information</small>',
                   '<strong>Hawaii Lithium Program</strong><small>Coming soon · request shipping availability</small>'),
              ],
              Path('site/solar-project.html'): [
                  ('Your location and progress stay attached to one Solar Lead.',
                   'Your location and progress stay attached to this solar build.'),
                  ('This choice helps Mission Control show where Solar Builder demand is coming from.',
                   'This choice helps Elevation route your Solar Builder request to the right service area.'),
                  ('Your location stays inside the Solar Lead for routing and follow-up. It is not copied into anonymous website analytics.',
                   'Your location stays attached to this solar build for routing and follow-up. It is not copied into anonymous website analytics.'),
                  ('Your Solar build is submitted when server storage is confirmed. Text, email, and call are optional follow-up actions.',
                   'Your Solar build is submitted when we confirm your request was received. Text, email, and call are optional follow-up actions.'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Verify source copy and preserved controls
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Hawaii Lithium Program' site/store.html
          grep -q 'Coming soon · request shipping availability' site/store.html
          grep -q 'Your location and progress stay attached to this solar build.' site/solar-project.html
          grep -q 'we confirm your request was received' site/solar-project.html
          if grep -Eqi 'Seller Hub|VERIFIED EBAY CATALOG|Verified from Seller Hub|Qualification in Progress|Intake Intent|Mission Control|Solar Lead|server storage|stored for management review' site/store.html site/rv-store.html site/solar-project.html site/lithium-batteries.html site/hawaii-lithium-batteries.html; then
            echo 'Forbidden customer-facing implementation copy remains.' >&2
            exit 1
          fi
          grep -q '208-813-4998' site/store.html
          grep -q '208-813-4998' site/rv-store.html
          grep -q 'blockedStates.includes(destinationState)' site/store-checkout-server.js

      - name: Commit approved copy closeout
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/store.html site/solar-project.html
          git commit -m 'Close Commerce public copy regressions'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy exact corrected production source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify affected production routes and controls
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in /store /rv-store /solar-project /hawaii-lithium-batteries; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o "/tmp/$(echo "$route" | tr '/' '_').html" -w '%{http_code}' "${base}${route}" || true)
            echo "${route} -> $code"
            test "$code" = "200"
          done
          curl -sS -L "${base}/store" > /tmp/store.html
          curl -sS -L "${base}/solar-project" > /tmp/solar.html
          curl -sS -L "${base}/hawaii-lithium-batteries" > /tmp/hawaii.html
          grep -q 'Hawaii Lithium Program' /tmp/store.html
          grep -q 'Coming soon · request shipping availability' /tmp/store.html
          grep -q 'Your location and progress stay attached to this solar build.' /tmp/solar.html
          if grep -Eqi 'Hawaii eligibility, rates|Mission Control|Solar Lead|server storage|Qualification in Progress' /tmp/store.html /tmp/solar.html /tmp/hawaii.html; then
            echo 'Forbidden public copy still visible after deploy.' >&2
            exit 1
          fi
          grep -q '208-813-4998' /tmp/store.html
          grep -q '208-813-4998' /tmp/hawaii.html
          config_code=$(curl -sS -o /tmp/checkout-config.json -w '%{http_code}' "${base}/api/store-checkout/config" || true)
          echo "checkout config -> $config_code"
          cat /tmp/checkout-config.json
          test "$config_code" = "200"
