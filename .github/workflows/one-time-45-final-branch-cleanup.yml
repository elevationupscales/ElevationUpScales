name: One-Time 4.5 Final Branch Cleanup
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-final-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Remove temporary 4.5 runners
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-45-*.yml
          if test -d .github/scripts; then rm -f .github/scripts/apply_45_* .github/scripts/repair_45_*; fi
          git status --short
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add -A
          if git diff --cached --quiet; then echo CLEAN_ALREADY=TRUE; exit 0; fi
          git commit -m "Retire temporary Elevation 4.5 verification runners"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
          echo BUILD_BRANCH_CLEANUP_SHA=$(git rev-parse HEAD)
