name: One-Time Elevation 4.4 Release A Production Gate

on:
  push:
    branches: [deploy/4.4-release-a-production-gate-2026-08-31]
    paths:
      - .github/workflows/one-time-44-release-a-production-gate.yml

permissions:
  contents: read
  deployments: write

env:
  EXPECTED_MAIN_SHA: 1809f257c7af31ef51f34673226d5adfcdf9b929
  CANDIDATE_SHA: 964494bcd2608ed14192e2ed001f1ea611f05aae
  CANONICAL_BASE: https://elevationupscales.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out production gate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out rollback production source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          path: rollback

      - name: Verify exact approved candidate and current main
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git cat-file -e "$CANDIDATE_SHA^{commit}"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$CANDIDATE_SHA"
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA"..."$CANDIDATE_SHA")"
          printf '%s\n' "$changed"
          test -n "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(coordination/handoffs/2026-08-31-elevation-44-storefront-final-polish-preview-receipt.md|site/_worker.js|site/lithium-batteries.html|site/lithium-shop.js|site/lithium-shop.css|site/rv-store.html|site/rv-store.js)$' | grep -q .; then
            echo 'Unexpected file outside approved Release A scope'; exit 1
          fi
          git diff --quiet "$EXPECTED_MAIN_SHA"..."$CANDIDATE_SHA" -- site/index.html site/store.html site/checkout.html site/catalog-admin-runtime.js site/store-checkout-server.js site/hawaii-lithium-runtime.js site/marketplace.html site/start-a-project.html site/solar-project.html
          git checkout "$CANDIDATE_SHA" -- site coordination/handoffs/2026-08-31-elevation-44-storefront-final-polish-preview-receipt.md
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check "$EXPECTED_MAIN_SHA" "$CANDIDATE_SHA" -- site
          grep -q 'data-lithium-search' site/lithium-batteries.html
          grep -q 'data-lithium-sort' site/lithium-batteries.html
          grep -q 'capacityWh' site/lithium-shop.js
          grep -q 'criticalDetails' site/rv-store.js
          grep -q 'elevation-lithium-social-card.webp' site/lithium-batteries.html
          grep -q 'hero-galaxy-rv.webp' site/rv-store.html
          ! grep -q 'lithium-card__sku' site/lithium-shop.js
          ! grep -q 'Loading products' site/rv-store.html

      - name: Deploy approved candidate to production Pages
        id: production_deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical production
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          base="${CANONICAL_BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project /admin; do
            code=$(curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"; test "$code" = "200"
          done
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping; do
            code=$(curl -sS --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/admin.json -w '%{http_code}' "$base$api" || true)
            echo "$api=$code"; test "$code" = "401"
          done
          curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --fail -D /tmp/lithium.headers "$base/lithium-batteries" -o /tmp/lithium.html
          curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --fail -D /tmp/rv.headers "$base/rv-store" -o /tmp/rv.html
          curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --fail "$base/api/store/catalog?section=lithium-batteries" -H 'Accept: application/json' -o /tmp/lithium.json
          curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --fail "$base/api/store-catalog?section=rv-outdoor" -H 'Accept: application/json' -o /tmp/rv.json
          curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --fail "$base/api/store-checkout/config" -o /tmp/checkout.json
          python - <<'PY'
          import json,re,html
          checkout=json.load(open('/tmp/checkout.json'))
          assert checkout.get('configured') is True, checkout
          assert checkout.get('credentialsConfigured') is True, checkout
          assert checkout.get('checkoutEnabled') is True, checkout
          assert checkout.get('liveCheckoutApproved') is True, checkout
          assert checkout.get('environment') == 'live', checkout
          def rows(path, section):
              data=json.load(open(path,encoding='utf-8')); out=[]
              for p in data.get('products',[]):
                  if not p: continue
                  status=str(p.get('publishStatus') or '').strip().lower()
                  if status and status!='published': continue
                  try: price=float(p.get('priceCents') or 0)
                  except: price=0
                  if price<=0: continue
                  stock=p.get('supplierStock')
                  try:
                      if stock is not None and float(stock)<=0: continue
                  except: pass
                  if section=='rv' and str(p.get('shippingStatus') or '').strip().lower()=='unverified': continue
                  out.append(p)
              return out
          lithium_rows=rows('/tmp/lithium.json','lithium'); rv_rows=rows('/tmp/rv.json','rv')
          lh=open('/tmp/lithium.html',encoding='utf-8').read(); rh=open('/tmp/rv.html',encoding='utf-8').read()
          assert lithium_rows and rv_rows
          lm=re.search(r'<strong data-lithium-count>(\d+)</strong>',lh); rm=re.search(r'<span id="rv-count">(\d+)</span>',rh)
          assert lm and int(lm.group(1))==len(lithium_rows),(lm.group(1) if lm else None,len(lithium_rows))
          assert rm and int(rm.group(1))==len(rv_rows),(rm.group(1) if rm else None,len(rv_rows))
          assert '0 current products' not in lh.lower()
          assert '0 current products' not in rh.lower()
          assert 'Loading products' not in lh
          assert 'Loading products' not in rh
          assert 'data-prerendered="true"' in lh and 'data-prerendered="true"' in rh
          assert 'data-lithium-search' in lh and 'data-lithium-sort' in lh
          assert 'elevation-lithium-social-card.webp' in lh and 'name="twitter:image"' in lh
          assert 'hero-galaxy-rv.webp' in rh and 'name="twitter:image"' in rh
          lithium_names=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="lithium-card"[\s\S]*?<h3>(.*?)</h3>',lh)]
          rv_names=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="rv-product-card"[\s\S]*?<h3>(.*?)</h3>',rh)]
          assert len(lithium_names)==len(lithium_rows)
          assert len(rv_names)==len(rv_rows)
          assert len(set(lithium_names)) >= min(5,len(lithium_names))
          assert any(re.search(r'\b(?:12|24|36|48)V\b',n,re.I) for n in lithium_names)
          assert any(re.search(r'\b\d{2,4}Ah\b',n,re.I) for n in lithium_names)
          expected=['20\' x 10\'','5.5 GPM','5.3 Gallon','297-Piece','120 Pcs','96 Piece','20W','30 LBS','95L','65A','16 ft','1500-Pound']
          hits=sum(any(detail.lower() in n.lower() for n in rv_names) for detail in expected)
          assert hits>=6,(hits,rv_names)
          evidence={'lithiumCount':len(lithium_rows),'lithiumUniqueTitles':len(set(lithium_names)),'rvCount':len(rv_rows),'rvCriticalDetailHits':hits,'checkout':'live-approved'}
          json.dump(evidence,open('/tmp/release-a-production-evidence.json','w'),indent=2)
          print(json.dumps(evidence,indent=2))
          PY
          grep -qi 'x-eus-storefront-prerender: lithium:' /tmp/lithium.headers
          grep -qi 'x-eus-storefront-prerender: rv:' /tmp/rv.headers

      - name: Roll back automatically if canonical verification failed
        if: steps.verify.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy rollback/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail after rollback
        if: steps.verify.outcome == 'failure'
        run: |
          echo 'Production verification failed; prior main was redeployed automatically.'
          exit 1

      - name: Record production PASS
        if: steps.verify.outcome == 'success'
        run: |
          echo '### Elevation 4.4 Release A — PRODUCTION PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Approved candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Previous main / rollback: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare deployment: ${{ steps.production_deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical storefront verification: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical live checkout: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin auth boundaries: PASS' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/release-a-production-evidence.json >> "$GITHUB_STEP_SUMMARY"
