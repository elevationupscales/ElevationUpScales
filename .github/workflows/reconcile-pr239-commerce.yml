name: Reconcile PR239 Commerce Structure

on:
  push:
    paths:
      - ".github/workflows/reconcile-pr239-commerce.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Import accepted non-homepage commerce structure from PR239
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/os-recon5-clean-commerce-vendor-2026-09-22 --no-tags
          src=origin/work/os-recon5-clean-commerce-vendor-2026-09-22
          files=(
            "deployment/qa/web-com-analytics-static.mjs"
            "deployment/qa/web-com-navigation-static.mjs"
            "site/_redirects"
            "site/clean-commerce-v1.css"
            "site/commercial/index.html"
            "site/site-shell.js"
            "site/sitemap.xml"
            "site/vendor/olight/index.html"
            "site/vendor/renogy/index.html"
            "site/vendor/sok-energy/index.html"
            "site/vendor/sungoldpower/index.html"
            "site/vendors/index.html"
          )
          for f in "${files[@]}"; do
            git checkout "$src" -- "$f"
          done
          git config user.name "Elevation UpScales Reconciliation"
          git config user.email "elevationupscales@gmail.com"
          git add "${files[@]}"
          git commit -m "reconcile: preserve PR239 commerce and vendor structure"
          git push origin HEAD:"$GITHUB_REF_NAME"
