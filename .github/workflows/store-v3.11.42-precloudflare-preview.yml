name: Store v3.11.42 Pre-Cloudflare Preview

on:
  push:
    branches:
      - feature/apparel-onsite-checkout-v3.11.42

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-store-v3-11-42-precloudflare-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out Store candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify lineage and protected public presentation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor origin/main HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          for protected in site/store.html site/store-catalog-resilience.js site/rv-store.html site/rv-store.js site/rv-ebay-catalog.js; do
            if printf '%s\n' "$changed" | grep -Fxq "$protected"; then
              echo "BLOCKED: public Store presentation file changed: $protected"
              exit 1
            fi
          done
          grep -q 'link.textContent = "Buy Now"' site/store-catalog-resilience.js
          grep -q 'buy.textContent = "Buy Now"' site/rv-store.js
          grep -q 'const APPAREL_MARKUP = 1.20' site/store-checkout-server.js
          grep -q 'const APPAREL_SHIPPING_CENTS = 700' site/store-checkout-server.js
          grep -q 'entry.shippingVerified !== true' site/_worker.js
          grep -q 'validUsAddress' site/_worker.js
          grep -q 'ensureStoreOrderTable' site/_worker.js

      - name: Check JavaScript and credentials
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          python - <<'PY'
          import re
          from pathlib import Path
          patterns = [
              re.compile(r'cfat_[A-Za-z0-9_-]+'),
              re.compile(r'github_pat_[A-Za-z0-9_]+'),
              re.compile(r'ghp_[A-Za-z0-9]+'),
              re.compile(r'sk_live_[A-Za-z0-9]+'),
              re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              re.compile(r'PAYPAL_CLIENT_SECRET\s*[=:]\s*["\'][^"\']+["\']'),
          ]
          for path in Path('site').rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if any(pattern.search(text) for pattern in patterns):
                  raise SystemExit(f'BLOCKED: credential-like value in {path}')
          print('syntax_and_credentials=PASS')
          PY

      - name: Deploy isolated Store candidate preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=store-v3-11-42-precloudflare
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke Store candidate preview
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          test -n "$base"

          for route in / /store /rv-store /checkout /start-a-project /marketplace /solar-project /admin-listings /admin-store-orders.html; do
            echo "Smoke ${base}${route}"
            code=$(curl --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-route.html --write-out '%{http_code}' "${base}${route}" || true)
            test "$code" = "200"
          done

          curl --silent --show-error --location --retry 8 --retry-all-errors "${base}/store-config.js" | grep -q 'store-checkout-routing.js?v=3.11.42'
          curl --silent --show-error --location --retry 8 --retry-all-errors "${base}/rv-store.js" | grep -q 'rv-checkout-routing.js?v=3.11.42'
          curl --silent --show-error --location --retry 8 --retry-all-errors "${base}/admin-listings.js" | grep -q 'admin-store-orders-link.js?v=3.11.42'

          config_code=$(curl --silent --show-error --output /tmp/eus-config.json --write-out '%{http_code}' "${base}/api/store-checkout/config")
          test "$config_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eus-config.json'))
          assert data['ok'] is True
          assert data['apparelMarkupPercent'] == 20
          assert data['apparelShippingPerItem'] == '7.00'
          print('checkout_config=PASS configured=', data.get('configured'))
          PY

          apparel_code=$(curl --silent --show-error --output /tmp/eus-apparel.json --write-out '%{http_code}' \
            -H "Origin: ${base}" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"source":"apparel","id":"black-and-gold-signature-t-shirt","quantity":1,"variantId":""}' \
            "${base}/api/store-checkout/quote")
          test "$apparel_code" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eus-apparel.json'))
          assert data['ok'] is True and data['source'] == 'apparel'
          assert data['unitPriceCents'] > 0
          assert data['shippingCents'] == 700
          assert data['totalCents'] == data['merchandiseCents'] + data['shippingCents']
          print('apparel_quote=PASS')
          PY

          rv_code=$(curl --silent --show-error --output /tmp/eus-rv.json --write-out '%{http_code}' \
            -H "Origin: ${base}" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"source":"rv","id":"999999999999","quantity":1,"ebayUrl":"https://www.ebay.com/itm/999999999999","shipping":{"state":"CO","postalCode":"80901"}}' \
            "${base}/api/store-checkout/quote")
          test "$rv_code" = "409"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/eus-rv.json'))
          assert data['fallback'] == 'ebay'
          assert data['ebayUrl'] == 'https://www.ebay.com/itm/999999999999'
          print('rv_fallback=PASS')
          PY

          admin_code=$(curl --silent --show-error --output /tmp/eus-admin.json --write-out '%{http_code}' "${base}/api/admin/store-orders")
          test "$admin_code" = "401"

          for internal in /worker-core.js /store-checkout-server.js /store-orders-admin-server.js; do
            code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${base}${internal}")
            test "$code" = "404"
          done

          headers=$(curl --silent --show-error --head "${base}/checkout")
          printf '%s' "$headers" | grep -qi 'content-security-policy:.*paypal.com'

      - name: Record preview receipt
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Store v3.11.42 pre-Cloudflare preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare Worker compile: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public route smoke: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel quote +20% / $7 shipping: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV unmapped eBay fallback: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Store Orders admin protection: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
