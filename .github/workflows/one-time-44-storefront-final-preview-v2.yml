name: One-Time Elevation 4.4 Storefront Final Preview v2

on:
  push:
    branches: [release/4.4-storefront-final-polish-2026-08-31]
    paths:
      - .github/workflows/one-time-44-storefront-final-preview-v2.yml

permissions:
  contents: read
  deployments: write

env:
  EXPECTED_MAIN_SHA: 1809f257c7af31ef51f34673226d5adfcdf9b929
  RELEASE_BRANCH: release/4.4-storefront-final-polish-2026-08-31
  CANONICAL_BASE: https://elevationupscales.com

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Verify lineage, scope and source
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/one-time-44-storefront-final-preview.yml|.github/workflows/one-time-44-storefront-final-preview-v2.yml|site/_worker.js|site/lithium-batteries.html|site/lithium-shop.js|site/lithium-shop.css|site/rv-store.html|site/rv-store.js|site/rv-store.css)$' | grep -q .; then
            echo 'Unexpected file outside Release A scope'; exit 1
          fi
          git diff --quiet "$EXPECTED_MAIN_SHA"...HEAD -- site/index.html site/store.html site/checkout.html site/catalog-admin-runtime.js site/store-checkout-server.js site/hawaii-lithium-runtime.js
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          grep -q 'data-lithium-search' site/lithium-batteries.html
          grep -q 'data-lithium-sort' site/lithium-batteries.html
          grep -q 'capacityWh' site/lithium-shop.js
          grep -q 'criticalDetails' site/rv-store.js
          grep -q 'hero-galaxy-rv.webp' site/rv-store.html
          grep -q 'elevation-lithium-social-card.webp' site/lithium-batteries.html
          grep -q 'shippingPresentation' site/_worker.js
          ! grep -q 'lithium-card__sku' site/lithium-shop.js
          ! grep -q 'Loading products' site/rv-store.html
          test -z "$(find site -type f -size +25M -print -quit)"
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site

      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=storefront-final-polish-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke protected routes and Admin auth
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"; test "$code" = "200"
          done
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping; do
            code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' "$base$api" || true)
            echo "$api=$code"; test "$code" = "401"
          done
          curl -sS -L --fail "$base/store" -o /tmp/apparel.html
          grep -q 'True Grit Trucker Hat' /tmp/apparel.html

      - name: Verify checkout protection on preview and live approval on canonical
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -sS -L --fail "$base/api/store-checkout/config" -o /tmp/checkout-preview.json
          curl -sS -L --fail "$CANONICAL_BASE/api/store-checkout/config" -o /tmp/checkout-canonical.json
          python - <<'PY'
          import json
          preview=json.load(open('/tmp/checkout-preview.json'))
          canonical=json.load(open('/tmp/checkout-canonical.json'))
          assert preview.get('credentialsConfigured') is True, preview
          assert preview.get('environment') == 'live', preview
          assert preview.get('configured') is False, preview
          assert preview.get('checkoutEnabled') is False, preview
          assert preview.get('liveCheckoutApproved') is False, preview
          assert canonical.get('configured') is True, canonical
          assert canonical.get('credentialsConfigured') is True, canonical
          assert canonical.get('checkoutEnabled') is True, canonical
          assert canonical.get('liveCheckoutApproved') is True, canonical
          assert canonical.get('environment') == 'live', canonical
          print('Preview live-checkout protection PASS; canonical live checkout PASS')
          PY

      - name: Verify Catalog, prerender, metadata and merchandising
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -sS -L --fail -D /tmp/lithium.headers "$base/lithium-batteries" -o /tmp/lithium.html
          curl -sS -L --fail -D /tmp/rv.headers "$base/rv-store" -o /tmp/rv.html
          curl -sS -L --fail "$base/api/store/catalog?section=lithium-batteries" -H 'Accept: application/json' -o /tmp/lithium.json
          curl -sS -L --fail "$base/api/store-catalog?section=rv-outdoor" -H 'Accept: application/json' -o /tmp/rv.json
          python - <<'PY'
          import json,re,html
          def rows(path, section):
              data=json.load(open(path,encoding='utf-8')); out=[]
              for p in data.get('products',[]):
                  if not p: continue
                  status=str(p.get('publishStatus') or '').strip().lower()
                  if status and status!='published': continue
                  try: price=float(p.get('priceCents') or 0)
                  except: price=0
                  if price<=0: continue
                  stock=p.get('supplierStock')
                  try:
                      if stock is not None and float(stock)<=0: continue
                  except: pass
                  if section=='rv' and str(p.get('shippingStatus') or '').strip().lower()=='unverified': continue
                  out.append(p)
              return out
          lithium_rows=rows('/tmp/lithium.json','lithium'); rv_rows=rows('/tmp/rv.json','rv')
          lh=open('/tmp/lithium.html',encoding='utf-8').read(); rh=open('/tmp/rv.html',encoding='utf-8').read()
          assert lithium_rows, 'HOLD: published Lithium Catalog set empty'
          assert rv_rows, 'HOLD: published RV Catalog set empty'
          lm=re.search(r'<strong data-lithium-count>(\d+)</strong>',lh); rm=re.search(r'<span id="rv-count">(\d+)</span>',rh)
          assert lm and int(lm.group(1))==len(lithium_rows),(lm.group(1) if lm else None,len(lithium_rows))
          assert rm and int(rm.group(1))==len(rv_rows),(rm.group(1) if rm else None,len(rv_rows))
          for body,label in ((lh,'Lithium'),(rh,'RV')):
              assert '0 current products' not in body, f'{label}: forbidden zero state'
              assert 'Loading products' not in body, f'{label}: forbidden loading state'
              assert 'data-prerendered="true"' in body, f'{label}: prerender missing'
          assert 'elevation-lithium-social-card.webp' in lh and 'name="twitter:image"' in lh
          assert 'hero-galaxy-rv.webp' in rh and 'name="twitter:image"' in rh
          assert 'data-lithium-search' in lh and 'data-lithium-sort' in lh
          lithium_names=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="lithium-card"[\s\S]*?<h3>(.*?)</h3>',lh)]
          rv_names=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="rv-product-card"[\s\S]*?<h3>(.*?)</h3>',rh)]
          assert len(lithium_names)==len(lithium_rows),(len(lithium_names),len(lithium_rows))
          assert len(rv_names)==len(rv_rows),(len(rv_names),len(rv_rows))
          assert len(set(lithium_names)) >= min(5,len(lithium_names)), f'Lithium titles remain too generic: {lithium_names[:10]}'
          assert any(re.search(r'\b(?:12|24|36|48)V\b',n,re.I) for n in lithium_names), lithium_names[:10]
          assert any(re.search(r'\b\d{2,4}Ah\b',n,re.I) for n in lithium_names), lithium_names[:10]
          expected=['20\' x 10\'','5.5 GPM','5.3 Gallon','297-Piece','120 Pcs','96 Piece','20W','30 LBS','95L','65A','16 ft','1500-Pound']
          hits=sum(any(detail.lower() in n.lower() for n in rv_names) for detail in expected)
          assert hits>=6,(hits,rv_names)
          cards=re.findall(r'<article class="lithium-card"[^>]*data-shipping-status="([^"]*)"[\s\S]*?<div class="lithium-card__shipping [^"]*" data-hawaii-status>(.*?)</div>',lh)
          for raw_status,raw_label in cards:
              status=html.unescape(raw_status).strip().lower(); label=html.unescape(re.sub('<[^>]+>','',raw_label)).strip()
              expected_label='Ships to the Lower 48' if status=='verified' else ('Shipping quote required' if status=='quote_required' else 'Check shipping availability')
              assert label==expected_label,(status,label,expected_label)
          evidence={'lithium':{'count':len(lithium_rows),'uniqueTitles':len(set(lithium_names)),'sampleNames':lithium_names[:8]},'rv':{'count':len(rv_rows),'criticalDetailHits':hits,'sampleNames':rv_names[:8]}}
          json.dump(evidence,open('/tmp/storefront-final-evidence.json','w'),indent=2)
          print(json.dumps(evidence,indent=2))
          PY
          grep -qi 'x-eus-storefront-prerender: lithium:' /tmp/lithium.headers
          grep -qi 'x-eus-storefront-prerender: rv:' /tmp/rv.headers

      - name: Record preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.4 Storefront Final Preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent/current main: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview checkout protection: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical checkout/PayPal configuration: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog/prerender parity: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin auth/Apparel/Marketplace protected boundaries: PASS' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/storefront-final-evidence.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: elevation-44-storefront-final-preview-evidence-v2
          path: |
            /tmp/storefront-final-evidence.json
            /tmp/checkout-preview.json
            /tmp/checkout-canonical.json
            /tmp/lithium.headers
            /tmp/rv.headers
          retention-days: 30
