name: Website Rebuild Phase 4-6 Preview Validation
on:
  push:
    branches: [runner/website-rebuild-finish-one-pass-2026-09-05]
permissions:
  contents: write
  deployments: write
env:
  TARGET_BRANCH: work/website-rebuild-finish-one-pass-2026-09-05
  EXPECTED_MAIN: 995ddef117be2ba5b26e154ea43409271fc938a9
  EXPECTED_SOURCE: 3ae1215e238e0f93876ef376914cd86645d1c7c9
jobs:
  validate-rebuild:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - name: Enforce lineage
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH" --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          git merge-base --is-ancestor origin/main HEAD
      - name: Generate Phase 4-6 repair candidate
        run: |
          set -euo pipefail
          python deployment/rebuild/split-worker-core.py
          python deployment/rebuild/finalize-cleanup.py
          python - <<'PY'
          from pathlib import Path
          import hashlib,re,subprocess
          changed=subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()
          out=['# Website Rebuild — Final Changed-File Manifest','',f'Base: `{subprocess.check_output(["git","rev-parse","origin/main"],text=True).strip()}`','', '| Path | SHA-256 |','|---|---|']
          for name in changed:
              p=Path(name)
              if p.is_file() and not name.endswith('WEBSITE_REBUILD_FINAL_MANIFEST.md'):
                  out.append(f'| `{name}` | `{hashlib.sha256(p.read_bytes()).hexdigest()}` |')
          Path('deployment/qa/WEBSITE_REBUILD_FINAL_MANIFEST.md').write_text('\n'.join(out)+'\n')
          names=set()
          for p in Path('site').rglob('*.js'):
              text=p.read_text(errors='ignore'); names.update(re.findall(r'\benv\.([A-Z][A-Z0-9_]*)\b',text))
          b=['# Cloudflare Binding / Environment Name Inventory','', 'Names only. No secret values are recorded. No binding configuration changes in this release.','']+[f'- `{x}`' for x in sorted(names)]+['','Schema unchanged from accepted production; no D1 migration/schema file is modified.','']
          Path('deployment/qa/CLOUDFLARE_BINDING_NAME_INVENTORY.md').write_text('\n'.join(b))
          PY
      - name: Static and parity gates
        run: |
          set -euo pipefail
          node deployment/qa/phase2a-admin-static.mjs
          node tests/shared-foundation.test.mjs
          node tests/core-route-registry.test.mjs
          node deployment/qa/sok-commercialization-static.mjs
          node deployment/qa/sok-full-line-static.mjs
          node deployment/qa/website-integrity-static.mjs
          git diff --check
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site src tests deployment/qa -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
          node -e "import('./site/worker-core.js').then(m=>{if(!m.default||typeof m.default.fetch!=='function')process.exit(1)})"
          ! grep -q 'async function handleAdminLogin' site/worker-core.js
          grep -q 'url.pathname.startsWith("/worker/")' site/_worker.js
          grep -q '"/worker/\*"' site/_routes.json
          ! grep -RniE 'tel:\+?1?719|sms:\+?1?719' site --include='*.html' --include='*.js'
          ! grep -q '/project-guides' site/sitemap.xml
          grep -q 'Start a Project' site/index.html
          grep -q '+1-208-813-4998' site/index.html
          grep -Rqs 'Authorized SOK Energy Dealer' site
          ! git diff --name-only origin/main | grep -Eq '(^|/)(commerce-schema-migrations|.*migration.*\.sql|wrangler\.toml)$'
          ! git diff --name-only origin/main | grep -Eq '^site/(store-checkout-server|promotion-runtime|shipping-rules-runtime|hawaii-lithium-runtime|sok-operations-runtime|sok-availability-runtime)\.js$'
          test -z "$(find site -type f -size +25M -print -quit)"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site src deployment; then exit 1; fi
      - name: Deploy isolated preview only
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=website-rebuild-clean-baseline-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Full preview regression
        env:
          BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          check_status() {
            local expected="$1"; shift
            local route="$1"
            local code
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/eus-response --write-out '%{http_code}' "$base$route" || true)
            echo "CHECK $route => $code (expected $expected)"
            if [ "$code" != "$expected" ]; then
              echo "BODY PREVIEW:"
              head -c 500 /tmp/eus-response || true
              echo
              return 1
            fi
          }
          for route in / /start-a-project /store /rv-store /marketplace /solar-project /sok-batteries /sok/sk12v100pc/ /sok/sk48v100n/ /sok-order.html /lithium-batteries /hawaii-lithium-batteries /checkout /admin /admin-store-orders /admin-inventory /admin-listings /admin-analytics /admin-system; do check_status 200 "$route"; done
          check_status 200 /api/health
          for route in /api/admin/operations /api/admin/inventory /api/admin/leads /api/admin/listings /api/admin/market-analytics; do check_status 401 "$route"; done
          for route in /worker-core.js /worker/core-context.js /worker/domains/admin-auth.js /sok-full-line-runtime.js /sok-full-line-data.js; do check_status 404 "$route"; done
          echo "RUN sok-commercialization-preview.sh"
          bash deployment/qa/sok-commercialization-preview.sh "$base"
          echo "RUN sok-full-line-preview.sh"
          bash deployment/qa/sok-full-line-preview.sh "$base"
          echo "RUN website-integrity-preview.sh"
          bash deployment/qa/website-integrity-preview.sh "$base"
      - name: Preserve validated non-production candidate
        id: candidate
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site src tests deployment package.json
          git commit -m "Generate Website Rebuild Phase 4-6 validated candidate"
          candidate_sha=$(git rev-parse HEAD)
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Summary
        run: |
          echo "STATUS: PHASE 4-6 PREVIEW VALIDATED — PRODUCTION UNCHANGED" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: ${{ steps.candidate.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.preview.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Main remains $EXPECTED_MAIN" >> "$GITHUB_STEP_SUMMARY"
