name: One-time production deploy v3.11.32 Store Funnel

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/triggers/v3.11.32-store-funnel.txt

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  deploy-store-funnel:
    name: Validate, deploy, and smoke Store funnel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate customer funnel source
        shell: bash
        run: |
          set -euo pipefail
          for file in site/index.html site/home-top.js site/site-shell.js site/store.html site/rv-store.html site/rv-store.js site/admin-store-analytics.js site/_worker.js site/_worker_core.js site/ebay-inventory-sync.js site/solar-project.html; do
            test -f "$file"
          done
          node --check site/home-top.js
          node --check site/site-shell.js
          node --check site/rv-store.js
          node --check site/admin-store-analytics.js
          node --check site/_worker.js
          node --check site/_worker_core.js
          node --check site/ebay-inventory-sync.js
          python - <<'PY'
          from pathlib import Path
          home=Path('site/home-top.js').read_text()
          store=Path('site/store.html').read_text()
          rv=Path('site/rv-store.html').read_text()
          rvjs=Path('site/rv-store.js').read_text()
          admin=Path('site/admin-store-analytics.js').read_text()
          worker=Path('site/_worker_core.js').read_text()
          solar=Path('site/solar-project.html').read_text()
          checks={
            'home RV destination': "href = '/rv-store'" in home,
            'home RV label': 'Shop RV & Outdoor' in home,
            'home apparel label': 'Shop Apparel' in home,
            'home shopper event': 'store_section_view' in home and 'rv_shop' in home,
            'rv shopper event': 'store_section_view' in rvjs and 'rv_shop' in rvjs,
            'apparel navigation': 'Apparel Store' in store,
            'rv navigation': 'RV & Outdoor Store' in store,
            'apparel categories': all(x in store for x in ['All Products','Apparel','Hats','Wall Art','Stickers','Digital']),
            'apparel fallback cards': store.count('class="market-product-card"') >= 10,
            'rv hero': 'mountain-bull-bear-header.webp' in rv,
            'rv shopping list': 'Shopping List' in rv,
            'rv buy now': 'Buy Now' in rvjs,
            'mission control store metric': 'RV Shop Views' in admin,
            'backend rv unique metric': 'rv_shop_sessions' in worker and 'store_section_view' in worker,
            'solar lineage': 'Stage 1 of 7' in solar,
          }
          failed=[name for name,ok in checks.items() if not ok]
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'), name)
          if failed: raise SystemExit('Validation failed: '+', '.join(failed))
          PY

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke customer funnel and stores
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/store" > /tmp/store.html
          apparel_count=$(grep -o 'class="market-product-card"' /tmp/store.html | wc -l)
          test "$apparel_count" -ge 10
          grep -q 'Apparel Store' /tmp/store.html
          grep -q 'RV & Outdoor Store' /tmp/store.html
          grep -q 'All Products' /tmp/store.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store" > /tmp/rv-store.html
          grep -q 'RV & Outdoor Store' /tmp/rv-store.html
          grep -q 'mountain-bull-bear-header.webp' /tmp/rv-store.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/home-top.js" > /tmp/home-top.js
          grep -q "href = '/rv-store'" /tmp/home-top.js
          grep -q 'Shop RV & Outdoor' /tmp/home-top.js
          grep -q 'Shop Apparel' /tmp/home-top.js
          curl --fail --silent --show-error --retry 4 --retry-delay 2 --max-time 90 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-inventory?release=3.11.32" > /tmp/inventory.json
          python - <<'PY'
          import json, os
          with open('/tmp/inventory.json', encoding='utf-8') as f:
              data=json.load(f)
          sync=data.get('supplierSync') or {}
          print('rv_inventory_count=', data.get('count'))
          print('rv_sync_status=', sync.get('status'))
          print('rv_sync_error=', sync.get('lastError'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"rv_inventory_count={int(data.get('count') or 0)}\n")
              out.write(f"rv_sync_status={str(sync.get('status') or 'unknown')}\n")
          PY
          echo "apparel_count=$apparel_count" >> "$GITHUB_OUTPUT"

      - name: Persist successful funnel deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/deployments
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          source_commit=$(git rev-parse HEAD)
          cat > .github/deployments/v3.11.32-store-funnel.txt <<EOF
          build=3.11.32-store-funnel
          source_commit=$source_commit
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$deployed_at
          apparel_server_rendered_products=${{ steps.smoke.outputs.apparel_count }}
          rv_inventory_count=${{ steps.smoke.outputs.rv_inventory_count }}
          rv_sync_status=${{ steps.smoke.outputs.rv_sync_status }}
          status=success
          EOF
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.32-store-funnel.txt
          git commit -m 'Record v3.11.32 Store funnel production deployment'
          git push origin HEAD:main
