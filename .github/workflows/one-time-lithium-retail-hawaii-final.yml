name: One-Time Lithium Retail Hawaii Final
on:
  push:
    branches:
      - release/lithium-retail-hawaii-logistics-2026-09-02
permissions:
  contents: write
  deployments: write
jobs:
  closeout:
    runs-on: ubuntu-24.04
    env:
      BASE_MAIN_SHA: c05b245bfa2af8e759507e8d78995f2819600936
      RELEASE_BRANCH: release/lithium-retail-hawaii-logistics-2026-09-02
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: release/lithium-retail-hawaii-logistics-2026-09-02
          fetch-depth: 0

      - name: Verify production baseline
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"

      - name: Build exact application candidate
        run: |
          set -euo pipefail
          cp scripts/one-time-lithium-hawaii-verify.mjs /tmp/lithium-hawaii-verify.mjs
          python3 scripts/one-time-lithium-hawaii-implement.py
          node --check site/lithium-shop.js
          node --check site/hawaii-lithium-program.js
          node --check site/hawaii-lithium-runtime.js
          node --check site/store-checkout.js
          node --check site/store-checkout-server.js
          node --check site/product-detail.js
          git diff --check
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site
          git rm scripts/one-time-lithium-hawaii-implement.py
          git rm scripts/one-time-lithium-hawaii-verify.mjs
          git rm .github/workflows/one-time-lithium-retail-hawaii-final.yml
          git commit -m "Implement licensed lithium retail and Hawaii consolidated freight"
          git push origin HEAD:"$RELEASE_BRANCH"
          echo "APP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify application scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          git diff --name-only "$BASE_MAIN_SHA".."$APP_SHA" | sort > /tmp/changed
          cat /tmp/changed
          test "$(wc -l < /tmp/changed)" -eq 15
          grep -qx 'site/terms.html' /tmp/changed
          grep -qx 'site/store-checkout-server.js' /tmp/changed
          grep -qx 'site/hawaii-lithium-runtime.js' /tmp/changed
          ! grep -E '^site/(index|marketplace|solar-project|start-a-project|admin)' /tmp/changed
          ! git diff "$BASE_MAIN_SHA".."$APP_SHA" | grep -E '^\+.*CREATE TABLE'

      - name: Deploy exact candidate to preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=lithium-hawaii-final-preview-2026-09-02

      - name: Install targeted browser verifier
        run: npm install --no-save playwright@1.55.0

      - name: Run targeted verification
        env:
          PREVIEW_BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          export CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME"
          node /tmp/lithium-hawaii-verify.mjs

      - name: Reverify main before production
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          test "$(git rev-parse HEAD)" = "$APP_SHA"

      - name: Deploy verified candidate to production
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=main

      - name: Record deployment
        run: |
          echo "APPLICATION_SHA=$APP_SHA"
          echo "PREVIEW_URL=${{ steps.preview.outputs.deployment-url }}"
          echo "PRODUCTION_URL=${{ steps.production.outputs.deployment-url }}"
          echo "LITHIUM RETAIL + HAWAII LOGISTICS PRODUCTION DEPLOY PASS"
