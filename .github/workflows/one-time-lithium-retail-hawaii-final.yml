name: One-Time Lithium Retail + Hawaii Logistics Final
on:
  push:
    branches: [release/lithium-retail-hawaii-logistics-2026-09-02]
permissions:
  contents: write
  deployments: write
jobs:
  implement-verify-deploy:
    runs-on: ubuntu-24.04
    env:
      BASE_MAIN_SHA: c05b245bfa2af8e759507e8d78995f2819600936
      RELEASE_BRANCH: release/lithium-retail-hawaii-logistics-2026-09-02
      WORKFLOW_PATH: .github/workflows/one-time-lithium-retail-hawaii-final.yml
    steps:
      - name: Checkout current release branch
        uses: actions/checkout@v6
        with:
          ref: release/lithium-retail-hawaii-logistics-2026-09-02
          fetch-depth: 0

      - name: Verify accepted production baseline
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"

      - name: Implement approved lithium retail and Hawaii logistics scope
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing replacement target: {label}")
              return text.replace(old, new, 1)

          # Lithium storefront identity + integrated shipping language.
          p='site/lithium-batteries.html'; s=read(p)
          s=s.replace('<strong>Hawaii Lithium Program</strong><small>Coming soon · request shipping availability</small>','<strong>Lithium Shipping &amp; Freight</strong><small>Hawaii consolidated freight · Alaska quote options</small>')
          s=replace_once(s,'<p class="eyebrow">ELEVATION UPSCALES · LITHIUM BATTERY SHOP</p>','<p class="eyebrow">ELEVATION UPSCALES · LITHIUM BATTERY SHOP</p><p class="lithium-retailer-badge"><strong>LICENSED LITHIUM BATTERY RETAILER</strong></p>','lithium retailer hero')
          s=s.replace('Prices and availability can change. Shipping depends on the exact product and destination. Hawaii availability is handled separately through the Hawaii Lithium Program.','Prices and availability can change. Shipping depends on the exact product and destination. <a href="/hawaii-lithium-batteries">Shipping to Alaska or Hawaii? See lithium shipping &amp; freight options.</a>')
          s=s.replace('<p class="eyebrow">HAWAII LITHIUM PROGRAM · COMING SOON</p><h2>Need a battery shipped to Hawaii?</h2><p>Request the exact battery and destination. Elevation will confirm availability, route and shipping cost before any Hawaii order moves forward.</p><a class="button button-outline" href="/hawaii-lithium-batteries">Request Hawaii Availability →</a>','<p class="eyebrow">LITHIUM SHIPPING &amp; FREIGHT</p><h2>Shipping to Alaska or Hawaii?</h2><p>Hawaii lithium batteries use consolidated freight at <strong>$99 per actual battery</strong> with warehouse or freight-terminal pickup. Alaska routing remains quote required where exact service and pricing have not been verified.</p><a class="button button-outline" href="/hawaii-lithium-batteries">View Shipping &amp; Freight Options →</a>')
          s=s.replace('<a href="/privacy">Privacy</a>','<a href="/privacy">Privacy</a><a href="/terms">Terms</a>')
          write(p,s)

          # Hawaii customer page: active integrated freight program, no duplicate store.
          p='site/hawaii-lithium-batteries.html'; s=read(p)
          s=s.replace('<title>Hawaii Lithium Shipping — Coming Soon | Elevation UpScales</title>','<title>Hawaii Lithium Shipping &amp; Freight | Elevation UpScales</title>')
          s=s.replace('Reserve a lithium battery or request Hawaii shipping availability through the Elevation UpScales Hawaii Lithium Program.','View current Elevation lithium inventory and request Hawaii consolidated freight at $99 per actual battery with warehouse pickup.')
          s=s.replace('<strong>Hawaii Lithium Program</strong><small>Coming soon · reservations and shipping availability</small>','<strong>Lithium Shipping &amp; Freight</strong><small>Hawaii consolidated freight · warehouse pickup</small>')
          s=re.sub(r'<section class="hawaii-program-hero">.*?</section>', '''<section class="hawaii-program-hero"><div class="container"><p class="eyebrow">ELEVATION UPSCALES, INC.</p><p class="hawaii-license"><strong>LICENSED LITHIUM BATTERY RETAILER</strong></p><h1>Hawaii Lithium Shipping &amp; Freight</h1><p class="hawaii-program-hero__copy">Shop the same Elevation Lithium Store inventory and use our consolidated Hawaii freight path for eligible large lithium batteries. Merchandise and freight stay separate, and every shipment remains subject to exact product, documentation, packaging, gross-weight, carrier-acceptance and scheduling checks.</p><div class="lithium-actions"><a class="button button-primary" href="#hawaii-products">View Hawaii Battery Inventory</a><a class="button button-outline" href="#hawaii-request">Request / Reserve</a><a class="text-link-inline" href="#how-it-works">How the Freight Process Works →</a></div><div class="hawaii-batch-banner"><p class="eyebrow">HAWAII CONSOLIDATED FREIGHT</p><h3>$99 per actual battery · Warehouse / Freight-Terminal Pickup Only</h3><p>1 battery = $99 freight · 2 batteries = $198 · 3 batteries = $297. Three compatible batteries is the current preferred consolidated-shipment target, but customers may request one, two or three. Orders of fewer than three compatible batteries may wait while Elevation combines compatible Hawaii orders.</p><p><strong>Estimated Shipment / Pickup Timing — Not Guaranteed.</strong> Final movement depends on exact battery compatibility, required documentation, packaging, actual packed gross weight, carrier acceptance and freight scheduling.</p></div></div></section>''',s,count=1,flags=re.S)
          s=s.replace('<p class="eyebrow">HOW IT WORKS</p><h2>Building a dependable Hawaii shipping process.</h2><p>Elevation reviews each exact battery and destination before presenting a supported Hawaii shipping option. Our company process tracks product identity, available documentation, packaging information, supplier origin, freight-provider requirements, destination handling, and current pricing.</p>','<p class="eyebrow">EXPANDING ACCESS TO OFF-GRID POWER IN HAWAII</p><h2>One Lithium Store. One coordinated Hawaii freight path.</h2><p>Large lithium batteries require specialized transportation that ordinary parcel networks often cannot provide to Hawaii. Elevation coordinates exact SKU verification, supplier availability, required SDS/MSDS and UN38.3 information where applicable, packaging and gross-weight review, mainland receiving, consolidation, freight booking, Hawaii terminal coordination and pickup notification.</p>')
          s=s.replace('<strong>1 · Request or Reserve</strong><p>Tell us which battery you need, your island, ZIP code, quantity, and intended use.</p>','<strong>1 · Choose / Request</strong><p>Select a current Catalog battery, quantity and Hawaii destination. The merchandise price remains separate from Hawaii freight.</p>')
          s=s.replace('<strong>2 · We Confirm the Product &amp; Route</strong><p>We review the exact battery, supplier availability, destination, freight option, documentation, and current shipping cost.</p>','<strong>2 · Elevation Verifies the Freight File</strong><p>We confirm the exact product, supplier availability, documentation, packaging, packed weight, route and carrier acceptance before tender.</p>')
          s=s.replace('<strong>3 · Join a Hawaii Shipment</strong><p>Compatible reservations can be grouped into an upcoming Hawaii freight shipment. We confirm timing and your final shipping amount before the order moves forward.</p>','<strong>3 · Consolidate &amp; Pick Up</strong><p>Compatible reservations are grouped toward a preferred three-battery shipment. After Hawaii arrival, customers receive terminal or warehouse release and pickup instructions.</p>')
          s=s.replace('<p class="eyebrow">EARLY ACCESS</p><h2>Request Hawaii availability.</h2><p>Reserve interest in a battery now and help us prioritize which battery sizes and islands should move first. This is an availability request, not a guaranteed order, and submitting it does not charge you.</p><p class="hawaii-request-disclosure">For routes still being established, Elevation may keep your request as an unpaid reservation until the exact product, supplier availability, route, shipping cost, and expected timing are ready for your confirmation.</p>','<p class="eyebrow">HAWAII FREIGHT REQUEST / RESERVATION</p><h2>Reserve a battery for Hawaii freight review.</h2><p>This request uses the existing Elevation Lithium Store and Hawaii logistics records. It does not create a separate Hawaii product or inventory record, and submitting it does not charge you.</p><p class="hawaii-request-disclosure"><strong>Hawaii lithium batteries move through consolidated freight.</strong> Orders of fewer than three compatible batteries may be held while Elevation combines them with other Hawaii battery orders. Three compatible batteries is the current preferred shipment target.</p>')
          s=s.replace('Submitting this form reserves your place for review. It does not charge you, guarantee availability, guarantee a ship date, or establish a final shipping price.','Submitting this form reserves your place for freight review. It does not charge you or guarantee a ship or pickup date. Hawaii consolidated freight is currently $99 per actual battery; extraordinary route changes are disclosed before any additional charge or shipment tender.')
          s=s.replace('Reserve for Next Hawaii Shipment</button>','Request / Reserve Hawaii Freight</button>')
          s=s.replace('<p class="eyebrow">HAWAII BATTERY OPTIONS</p><h2>Lithium Batteries for Hawaii</h2>','<p class="eyebrow">LIVE ELEVATION LITHIUM CATALOG</p><h2>Current Battery Inventory for Hawaii Requests</h2>')
          s=s.replace('Prices and availability may change. Hawaii shipping depends on the exact battery and destination. Elevation will confirm the applicable shipping option before an order moves forward.','These cards use the existing Elevation Lithium Catalog. Inventory is not duplicated for Hawaii. Hawaii freight is $99 per actual battery; warehouse pickup only. Current route, consolidation and timing details appear where existing logistics records support them.')
          s=s.replace('<a href="/privacy">Privacy</a>','<a href="/privacy">Privacy</a><a href="/terms">Terms</a>')
          s=s.replace('hawaii-lithium-program.css?v=4.3.2','hawaii-lithium-program.css?v=4.4.0').replace('lithium-shop.js?v=4.3.3','lithium-shop.js?v=4.4.4').replace('hawaii-lithium-program.js?v=4.3.2','hawaii-lithium-program.js?v=4.4.0')
          write(p,s)

          # Hawaii card presentation on the existing Catalog renderer.
          p='site/lithium-shop.js'; s=read(p)
          s=replace_once(s,'    const defaultShipping = hawaiiMode ? { label: "Hawaii availability by request", className: "is-researching" } : shipping;','    const defaultShipping = hawaiiMode ? { label: "Hawaii freight review", className: "is-researching" } : shipping;\n    const inventory = Number.isFinite(Number(product.supplierStock)) ? `${Math.max(0, Number(product.supplierStock))} available` : "Supplier-managed availability";','hawaii inventory label')
          s=replace_once(s,'    const actionMarkup = hawaiiMode\n      ? `<a class="button button-primary" href="#hawaii-request">Request Shipping Availability</a>`\n      : `<div class="lithium-card__actions"><a class="button button-outline" href="${esc(detailUrl)}">View Details</a><a class="button button-primary" href="${esc(checkoutUrl)}">Buy Now</a></div>`;','    const actionMarkup = hawaiiMode\n      ? `<div class="lithium-card__actions"><a class="button button-outline" href="${esc(detailUrl)}">View Details</a><a class="button button-primary" href="${esc(checkoutUrl + "&state=HI")}">Review Hawaii Freight</a></div>`\n      : `<div class="lithium-card__actions"><a class="button button-outline" href="${esc(detailUrl)}">View Details</a><a class="button button-primary" href="${esc(checkoutUrl)}">Buy Now</a></div>`;','hawaii card actions')
          s=replace_once(s,'        <div class="lithium-card__footer"><strong>${money.format(Number(product.priceCents || 0) / 100)}</strong>${actionMarkup}</div>\n        ${hawaiiMode ? `<a class="lithium-reserve-link" href="#hawaii-request" data-reserve-product="${esc(view.rawTitle || view.title)}">Request Hawaii Availability →</a>` : ""}','        <div class="lithium-card__footer"><strong>${money.format(Number(product.priceCents || 0) / 100)}</strong>${actionMarkup}</div>\n        ${hawaiiMode ? `<div class="hawaii-card-facts"><p><strong>Inventory</strong><span>${esc(inventory)}</span></p><p><strong>Hawaii Freight</strong><span>$99 per actual battery</span></p><p><strong>Preferred Shipment</strong><span>3 compatible batteries</span></p><p data-hawaii-batch><strong>Current Batch / Consolidation Status</strong><span>Checking current freight record…</span></p><p data-hawaii-timing><strong>Estimated Pickup Timing — Not Guaranteed</strong><span>Confirmed during freight coordination</span></p><p data-hawaii-route hidden><strong>Current Freight Route</strong><span></span></p><p><strong>Delivery Method</strong><span>Warehouse / freight-terminal pickup only</span></p></div><a class="lithium-reserve-link" href="#hawaii-request" data-reserve-product="${esc(view.rawTitle || view.title)}">Request / Reserve →</a>` : ""}','hawaii card facts')
          sync_new='''  async function syncStatus(cardEl) {
    const sku = String(cardEl.dataset.hawaiiSku || "").trim();
    const badge = cardEl.querySelector("[data-hawaii-status]");
    if (!sku || !badge) return;
    if (!hawaiiMode) {
      const shipping = lower48Shipping({ shippingStatus: cardEl.dataset.shippingStatus || "unverified" });
      badge.className = `lithium-card__shipping ${shipping.className}`;
      badge.textContent = shipping.label;
      return;
    }
    const batchEl = cardEl.querySelector("[data-hawaii-batch] span");
    const timingEl = cardEl.querySelector("[data-hawaii-timing] span");
    const routeRow = cardEl.querySelector("[data-hawaii-route]");
    const routeEl = routeRow?.querySelector("span");
    try {
      const response = await fetch(`/api/hawaii-lithium/status?sku=${encodeURIComponent(sku)}`, { headers: { Accept: "application/json" }, cache: "no-store" });
      const data = await response.json().catch(() => ({}));
      badge.className = "lithium-card__shipping";
      if (response.ok && data.status === "HAWAII SHIPPING AVAILABLE" && data.eligible === true) {
        badge.classList.add("is-approved"); badge.textContent = "Hawaii Shipping Available";
      } else if (response.ok && data.status === "HAWAII SHIPPING QUOTE REQUIRED") {
        badge.classList.add("is-quote"); badge.textContent = "Hawaii Freight Review Required";
      } else if (response.ok && data.status === "CURRENTLY UNAVAILABLE FOR HAWAII") {
        badge.classList.add("is-researching"); badge.textContent = "Currently unavailable for Hawaii";
      } else {
        badge.classList.add("is-researching"); badge.textContent = "Hawaii freight review";
      }
      if (batchEl) batchEl.textContent = data.consolidationStatus || "Awaiting consolidation / route review";
      if (timingEl) timingEl.textContent = data.estimatedPickupTiming || "Confirmed after consolidation and carrier scheduling";
      if (routeRow && routeEl && data.route) { routeEl.textContent = data.route; routeRow.hidden = false; }
    } catch (_) {
      badge.className = "lithium-card__shipping is-researching";
      badge.textContent = "Hawaii freight review";
      if (batchEl) batchEl.textContent = "Current freight record unavailable";
    }
  }
'''
          s=re.sub(r'  async function syncStatus\(cardEl\) \{.*?\n  \}\n\n  async function load\(\)',sync_new+'\n  async function load()',s,count=1,flags=re.S)
          write(p,s)

          # Enrich existing Hawaii public status API without exposing internal costs.
          p='site/hawaii-lithium-runtime.js'; s=read(p)
          s=replace_once(s,'const USES = new Set(["RV","Solar / Off-Grid","Home Backup","Marine","Van / Mobile Power","Other"]);','const USES = new Set(["RV","Solar / Off-Grid","Home Backup","Marine","Van / Mobile Power","Other"]);\nconst HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY = 9900;\nconst HAWAII_PREFERRED_CONSOLIDATION_UNITS = 3;','hawaii public constants')
          public_status='''async function publicStatus(request, env) {
  if(request.method!=="GET"&&request.method!=="HEAD")return json({error:"Method not allowed"},405,{Allow:"GET, HEAD"});
  const db=await ensureSchema(env); const url=new URL(request.url); const sku=clean(url.searchParams.get("sku"),180); const productId=clean(url.searchParams.get("productId"),120);
  const destination=clean(url.searchParams.get("island")||url.searchParams.get("destination"),80);
  const commonBase={customerFreightPerBatteryCents:HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY,preferredConsolidationUnits:HAWAII_PREFERRED_CONSOLIDATION_UNITS,warehousePickupOnly:true,consolidationDisclosure:"Orders of fewer than three compatible batteries may wait while Elevation combines compatible Hawaii orders. Three compatible batteries is the current preferred shipment target.",timingDisclosure:"Estimated shipment and pickup timing is not guaranteed."};
  const unresolved={status:"SHIPPING OPTIONS BEING CONFIRMED",badge:"CHECKING HAWAII SHIPPING",eligible:false,...commonBase,consolidationStatus:"Awaiting consolidation / route review",estimatedPickupTiming:"Confirmed after consolidation and carrier scheduling"};
  if(!sku&&!productId)return json(unresolved);
  const record=productId?await db.prepare("SELECT * FROM eus_lithium_shipping_records WHERE catalog_product_id=? LIMIT 1").bind(productId).first():await db.prepare("SELECT * FROM eus_lithium_shipping_records WHERE sku=? COLLATE NOCASE LIMIT 1").bind(sku).first();
  if(!record||record.hold||record.review_state!=="INTERNAL REQUIREMENTS SATISFIED")return json(unresolved);
  let dest=null;
  if(destination && ISLANDS.has(destination) && destination!=="Other / Confirm") {
    dest=await db.prepare("SELECT * FROM eus_lithium_destination_records WHERE shipping_record_id=? AND destination IN (?, 'Hawaii — General') ORDER BY CASE WHEN destination=? THEN 0 ELSE 1 END LIMIT 1").bind(record.id,destination,destination).first();
  } else {
    dest=await db.prepare("SELECT * FROM eus_lithium_destination_records WHERE shipping_record_id=? AND destination='Hawaii — General' LIMIT 1").bind(record.id).first();
  }
  const batch=await db.prepare(`SELECT b.status,b.terminal,b.estimated_departure_window,b.estimated_arrival_window
    FROM eus_hawaii_batch_orders bo JOIN eus_hawaii_shipping_batches b ON b.batch_id=bo.batch_id
    WHERE bo.sku=? COLLATE NOCASE AND bo.hold=0 AND b.status NOT IN ('COMPLETE','CANCELLED','HOLD')
    ORDER BY b.updated_at DESC LIMIT 1`).bind(record.sku).first().catch(()=>null);
  const batchState=upper(batch?.status||"");
  const consolidationStatus=({"BUILDING":"Awaiting Consolidation","NEEDS VOLUME":"Awaiting Consolidation","QUOTE NEEDED":"Awaiting Consolidation","QUOTE RECEIVED":"Awaiting Consolidation","DOCS REVIEW":"Awaiting Consolidation","READY TO COMMIT":"Batch Ready","CUSTOMER CONFIRMATION":"Batch Ready","BOOKED":"Freight Scheduled","IN TRANSIT":"In Transit","ARRIVED":"Ready for Hawaii Pickup","DELIVERING":"Ready for Hawaii Pickup"})[batchState]||"Awaiting Consolidation";
  const estimatedPickupTiming=clean(batch?.estimated_arrival_window,180)||"Confirmed after consolidation, carrier scheduling and Hawaii terminal availability";
  const origin=clean(dest?.origin_location,180); const terminal=clean(batch?.terminal,180); const route=(origin&&terminal)?`${origin} → ${terminal}`:"";
  const common={...commonBase,consolidationStatus,estimatedPickupTiming,...(route?{route}:{})};
  const state=dest?.eligibility_state||"NOT CHECKED";
  if(state==="APPROVED")return json({status:"HAWAII SHIPPING AVAILABLE",badge:"HAWAII SHIPPING AVAILABLE",eligible:true,destination:dest.destination,...common});
  if(["QUOTE REQUIRED","CARRIER QUOTE NEEDED","QUOTE RECEIVED"].includes(state))return json({status:"HAWAII SHIPPING QUOTE REQUIRED",badge:"HAWAII SHIPPING QUOTE REQUIRED",eligible:false,destination:dest?.destination||destination||"Hawaii — General",...common});
  if(state==="NOT ELIGIBLE"||state==="HOLD")return json({status:"CURRENTLY UNAVAILABLE FOR HAWAII",badge:"CURRENTLY UNAVAILABLE FOR HAWAII",eligible:false,destination:dest?.destination||destination||"Hawaii — General",...common});
  return json({...unresolved,destination:dest?.destination||destination||"Hawaii — General",...common});
}
'''
          s=re.sub(r'async function publicStatus\(request, env\) \{.*?\n\}\n\nfunction quoteExpired',public_status+'\nfunction quoteExpired',s,count=1,flags=re.S)
          write(p,s)

          # Server-authoritative Hawaii freight quote. Lower-48 path remains unchanged.
          p='site/store-checkout-server.js'; s=read(p)
          s=replace_once(s,'const MAX_QTY = 10;','const MAX_QTY = 10;\nconst HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY = 9900;\nconst HAWAII_PREFERRED_CONSOLIDATION_UNITS = 3;','checkout hawaii constants')
          s=s.replace('  if (actualBattery && destinationState==="HI") return {ok:false,status:409,error:"Hawaii lithium battery shipping requires the Hawaii Lithium Program and a separate shipping quote"};\n','')
          s=s.replace('  if (destinationState && blockedStates.includes(destinationState)) return {ok:false,status:409,...(source==="rv"?{fallback:"ebay",ebayUrl:clean(entry.ebayUrl||raw?.ebayUrl,300)}:{}),error:"This Doba item is not available for the selected shipping state"};','  if (destinationState && blockedStates.includes(destinationState) && !(actualBattery && destinationState==="HI")) return {ok:false,status:409,...(source==="rv"?{fallback:"ebay",ebayUrl:clean(entry.ebayUrl||raw?.ebayUrl,300)}:{}),error:"This Doba item is not available for the selected shipping state"};')
          s=replace_once(s,'  const batteryUnitsPerItem = actualBattery ? batteryUnitsPerCatalogUnit(product) : 0;\n  const shippingPerCatalogItem = actualBattery ? config.batteryShippingCents * batteryUnitsPerItem : Number.parseInt(String(entry.shippingCents ?? ""),10);','  const batteryUnitsPerItem = actualBattery ? batteryUnitsPerCatalogUnit(product) : 0;\n  const hawaiiFreight = actualBattery && destinationState === "HI";\n  const shippingPerCatalogItem = hawaiiFreight ? HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY * batteryUnitsPerItem : (actualBattery ? config.batteryShippingCents * batteryUnitsPerItem : Number.parseInt(String(entry.shippingCents ?? ""),10));','hawaii shipping math')
          s=replace_once(s,'    battery:{actualBattery,batteryUnitsPerItem,shippingPerBatteryCents:actualBattery?config.batteryShippingCents:0},\n    doba:{itemNo:clean(entry.itemNo,120),skuId:clean(entry.skuId,120),spuNo:clean(entry.spuNo,120)}','    battery:{actualBattery,batteryUnitsPerItem,shippingPerBatteryCents:actualBattery?(hawaiiFreight?HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY:config.batteryShippingCents):0},\n    ...(hawaiiFreight?{hawaii:{customerFreightPerBatteryCents:HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY,preferredConsolidationUnits:HAWAII_PREFERRED_CONSOLIDATION_UNITS,warehousePickupOnly:true,requiresReservation:true,consolidationStatus:qty*batteryUnitsPerItem>=HAWAII_PREFERRED_CONSOLIDATION_UNITS?"Batch quantity target reached — final logistics gates still apply":"Awaiting compatible consolidation",timing:"Estimated shipment / pickup timing — not guaranteed",requestUrl:`/hawaii-lithium-batteries?productId=${encodeURIComponent(id)}&product=${encodeURIComponent(clean(entry.name||raw?.name,240))}&qty=${qty}#hawaii-request`}}:{}),\n    doba:{itemNo:clean(entry.itemNo,120),skuId:clean(entry.skuId,120),spuNo:clean(entry.spuNo,120)}','hawaii quote payload')
          s=replace_once(s,'  const quote = await quoteStoreItem(raw, env);\n  if (!quote.ok) return json(quote, quote.status || 400);\n  const address = normalizeAddress(raw?.shipping);','  const quote = await quoteStoreItem(raw, env);\n  if (!quote.ok) return json(quote, quote.status || 400);\n  if (quote.hawaii?.requiresReservation) return json({error:"Hawaii lithium orders use consolidated freight reservation before payment and carrier tender.",hawaiiFreight:true,requestUrl:quote.hawaii.requestUrl,quote},409);\n  const address = normalizeAddress(raw?.shipping);','block paypal for hawaii reservation')
          write(p,s)

          # Checkout presentation: Hawaii quote, no residential-delivery implication, no PayPal capture before freight reservation.
          p='site/checkout/index.html'; s=read(p)
          s=s.replace('/store-checkout.css?v=3.11.42b','/store-checkout.css?v=4.4.0').replace('/store-checkout.js?v=3.11.42b','/store-checkout.js?v=4.4.0')
          s=replace_once(s,'        <h1>Secure Checkout</h1>','        <h1>Secure Checkout</h1>\n        <p id="checkout-lithium-retailer" class="eus-checkout-retailer" hidden>Elevation UpScales, Inc. · <strong>Licensed Lithium Battery Retailer</strong></p>','checkout retailer trust')
          s=s.replace('<div class="eus-checkout-section-label">Contact & shipping</div>','<div id="checkout-contact-shipping-label" class="eus-checkout-section-label">Contact &amp; shipping</div>')
          s=s.replace('<div class="eus-checkout-fields">','<div id="checkout-shipping-fields" class="eus-checkout-fields">',1)
          s=s.replace('<div><dt>Shipping</dt><dd id="checkout-shipping">—</dd></div>','<div><dt id="checkout-shipping-label">Shipping</dt><dd id="checkout-shipping">—</dd></div>')
          s=replace_once(s,'        <div id="checkout-status" class="eus-checkout-status" role="status">Loading checkout…</div>','        <section id="checkout-hawaii-freight" class="eus-checkout-hawaii" hidden><p class="eus-checkout-step">HAWAII LITHIUM SHIPPING &amp; FREIGHT</p><h3>Warehouse Pickup Only</h3><p><strong>Hawaii Consolidated Freight — $99 per actual battery.</strong></p><p id="checkout-hawaii-math"></p><p>Orders of fewer than three compatible batteries may be held while Elevation combines them with other Hawaii battery orders. Three compatible batteries is the current preferred shipment target.</p><p><strong>Estimated Shipment / Pickup Timing — Not Guaranteed.</strong> Timing depends on consolidation, supplier inventory, documentation, packaging, carrier scheduling, mainland receiving, ocean freight and Hawaii terminal availability.</p><a id="checkout-hawaii-reserve" class="eus-checkout-hawaii-cta" href="/hawaii-lithium-batteries#hawaii-request">Request / Reserve Hawaii Freight</a></section>\n\n        <div id="checkout-status" class="eus-checkout-status" role="status">Loading checkout…</div>','checkout hawaii panel')
          s=s.replace('</main>\n</body>','</main>\n  <footer class="eus-checkout-legal"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>\n</body>')
