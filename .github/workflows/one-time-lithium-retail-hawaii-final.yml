      - name: Deploy exact candidate to targeted preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=lithium-hawaii-final-preview-2026-09-02

      - name: Install targeted browser verifier
        run: npm install --no-save playwright@1.55.0

      - name: Targeted lithium and Hawaii verification
        env:
          PREVIEW_BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          export CHROME
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const base=process.env.PREVIEW_BASE.replace(/\/$/,'');
          const headers={Accept:'application/json'};
          const catalogResponse=await fetch(base+'/api/store/catalog?section=lithium-batteries',{headers});
          assert.equal(catalogResponse.ok,true,'Lithium Catalog unavailable');
          const catalog=await catalogResponse.json();
          assert.ok(Array.isArray(catalog.products)&&catalog.products.length>0,'No live lithium Catalog products');
          let chosen=null, lower=null;
          for(const p of catalog.products){
            const r=await fetch(base+'/api/store-checkout/quote',{method:'POST',headers:{...headers,'Content-Type':'application/json','Origin':base},body:JSON.stringify({source:'lithium',id:p.id,quantity:1,shipping:{state:'CO'}})});
            const q=await r.json().catch(()=>({}));
            if(r.ok&&q?.battery?.actualBattery&&q?.battery?.batteryUnitsPerItem===1){chosen=p;lower=q;break;}
          }
          assert.ok(chosen,'No one-battery live lithium SKU available for targeted verification');
          assert.equal(lower.battery.shippingPerBatteryCents,2799,'Lower-48 per-battery shipping changed');
          assert.equal(lower.shippingCents,2799,'Lower-48 one-battery shipping changed');
          for(const [qty,expected] of [[1,9900],[2,19800],[3,29700]]){
            const r=await fetch(base+'/api/store-checkout/quote',{method:'POST',headers:{...headers,'Content-Type':'application/json','Origin':base},body:JSON.stringify({source:'lithium',id:chosen.id,quantity:qty,shipping:{state:'HI'}})});
            const q=await r.json().catch(()=>({}));
            assert.equal(r.ok,true,`Hawaii quote ${qty} failed: ${q.error||''}`);
            assert.equal(q.shippingCents,expected,`Hawaii freight math qty ${qty}`);
            assert.equal(q.hawaii.customerFreightPerBatteryCents,9900);
            assert.equal(q.hawaii.preferredConsolidationUnits,3);
            assert.equal(q.hawaii.warehousePickupOnly,true);
            assert.equal(q.hawaii.requiresReservation,true);
            assert.equal(q.totalCents,q.merchandiseCents+expected);
          }
          const create=await fetch(base+'/api/store-checkout/orders',{method:'POST',headers:{...headers,'Content-Type':'application/json','Origin':base},body:JSON.stringify({source:'lithium',id:chosen.id,quantity:1,customer:{email:'targeted-check@example.com'},shipping:{fullName:'Targeted Check',address1:'1 Aloha St',city:'Honolulu',state:'HI',postalCode:'96815',countryCode:'US'}})});
          const createBody=await create.json().catch(()=>({}));
          assert.equal(create.status,409,'Hawaii freight should reserve before PayPal capture');
          assert.equal(createBody.hawaiiFreight,true);
          assert.ok(String(createBody.requestUrl||'').includes('/hawaii-lithium-batteries'));

          const terms=await (await fetch(base+'/terms')).text();
          assert.ok(terms.includes('Licensed Lithium Battery Retailer'));
          assert.ok(terms.includes('Colorado sales-tax license'));
          assert.ok(terms.includes('$99 per actual battery'));
          assert.ok(terms.includes('$27.99 per actual battery'));

          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
            const page=await browser.newPage({viewport});
            const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
            await page.goto(base+'/lithium-batteries',{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1600);
            assert.equal(errors.length,0,errors.join('; '));
            assert.ok((await page.locator('body').innerText()).includes('LICENSED LITHIUM BATTERY RETAILER'));
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),false,'Lithium horizontal overflow');
            await page.goto(base+'/hawaii-lithium-batteries',{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(2200);
            const hiText=await page.locator('body').innerText();
            for(const text of ['Hawaii Lithium Shipping & Freight','$99 per actual battery','Warehouse / Freight-Terminal Pickup Only','Estimated Shipment / Pickup Timing — Not Guaranteed','Three compatible batteries']) assert.ok(hiText.includes(text),`Hawaii page missing ${text}`);
            assert.ok(await page.locator('[data-lithium-grid] .lithium-card').count()>0,'Hawaii Catalog cards missing');
            assert.ok((await page.locator('[data-lithium-grid] .lithium-card').first().innerText()).includes('Hawaii Freight'));
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),false,'Hawaii horizontal overflow');
            const productUrl=base+`/product?id=${encodeURIComponent(chosen.id)}&store=lithium`;
            await page.goto(productUrl,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1600);
            assert.equal(await page.locator('[data-lithium-retailer]').isVisible(),true,'Lithium retailer trust missing on product detail');
            assert.equal(await page.locator('[data-lithium-freight-link]').isVisible(),true,'Lithium freight link missing on product detail');
            await page.goto(base+`/checkout/?source=lithium&id=${encodeURIComponent(chosen.id)}&name=${encodeURIComponent(chosen.title||chosen.name||'Lithium Battery')}&state=HI`,{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(2200);
            assert.equal(await page.locator('#checkout-hawaii-freight').isVisible(),true,'Hawaii checkout freight panel missing');
            const checkoutText=await page.locator('.eus-checkout-card').innerText();
            assert.ok(checkoutText.includes('Hawaii Consolidated Freight'));
            assert.ok(checkoutText.includes('$99.00'));
            assert.ok(checkoutText.includes('Warehouse Pickup Only'));
            assert.equal(await page.locator('#checkout-paypal').isVisible(),false,'PayPal should not bypass Hawaii freight reservation');
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),false,'Checkout horizontal overflow');
            await page.close();
          }
          await browser.close();
          console.log('LITHIUM_HAWAII_TARGETED_VERIFICATION_PASS',chosen.id,catalog.products.length);
          NODE
          node verify.mjs
          rm -f verify.mjs

