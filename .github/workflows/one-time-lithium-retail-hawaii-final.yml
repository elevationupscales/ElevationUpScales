          # Public business Terms / disclosures page and legal link from Privacy.
          terms='''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><meta name="description" content="Elevation UpScales, Inc. business terms and retail disclosures."><link rel="canonical" href="https://elevationupscales.com/terms"><link rel="icon" href="/assets/favicon.png" type="image/png"><title>Terms &amp; Business Disclosures | Elevation UpScales</title><link rel="stylesheet" href="/styles.css?v=3.0.3"><link rel="stylesheet" href="/site-shell.css?v=3.11.30"><link rel="stylesheet" href="/mobile-audit.css?v=3.0.3"><script defer src="/site-shell.js?v=3.11.46"></script></head><body class="home-page project-page"><a class="skip-link" href="#main">Skip to content</a><header class="eus-header"><div class="container eus-header__inner"><a class="eus-brand" href="/" aria-label="Elevation UpScales home"><img alt="Elevation UpScales bull and polar bear emblem" height="80" src="/assets/logo-mark.webp" width="128"><span class="eus-wordmark"><strong>ELEVATION</strong><span class="eus-wordmark__sub">UPSCALES</span><small class="eus-wordmark__tagline">Elevate the Experience</small></span></a><a class="button button-outline" href="/">Back Home</a></div></header><main id="main"><section class="service-page-hero"><div class="container"><p class="eyebrow">TERMS &amp; BUSINESS DISCLOSURES</p><h1>Elevation UpScales, Inc.</h1><p>Business identity, retail, shipping and customer-order disclosures for Elevation UpScales.</p></div></section><section class="section"><div class="container privacy-content"><h2>Business identity</h2><p>Elevation UpScales, Inc. is a Colorado corporation and holds a Colorado sales-tax license. The sales-tax license is separate from trade-specific, contractor, carrier, manufacturer or transportation qualifications.</p><h2>Licensed Lithium Battery Retailer</h2><p><strong>Licensed Lithium Battery Retailer.</strong> Elevation UpScales, Inc. is a Colorado corporation and licensed retail business offering lithium batteries and related RV, solar, and off-grid power products through its retail operations. The term “Licensed Lithium Battery Retailer” describes Elevation UpScales, Inc.’s licensed retail status and the product category it offers for sale. Manufacturer authorization, carrier approval, hazardous-materials qualifications, and transportation certifications are separate statuses and are represented only when specifically applicable.</p><h2>Product, inventory and pricing</h2><p>Published product availability, supplier inventory, prices and shipping options can change. Elevation uses its current Catalog and supplier information when presenting products and rechecks applicable order values during checkout or freight review. Internal supplier cost is not a customer-facing price.</p><h2>Lithium shipping</h2><p>Lower-48 shipping for actual lithium batteries is currently $27.99 per actual battery where standard lithium checkout is supported. Alaska service and pricing remain quote required where exact routing has not been verified.</p><p>Hawaii lithium batteries use consolidated freight. The current customer freight price is $99 per actual battery, separate from merchandise. Orders of fewer than three compatible batteries may wait while Elevation combines compatible Hawaii orders. Three compatible batteries is the current preferred shipment target, not a guaranteed departure trigger.</p><p>Hawaii lithium fulfillment is warehouse or freight-terminal pickup only. Residential lithium delivery is not currently offered through this program. Shipment and pickup timing is estimated and not guaranteed; timing can change because of consolidation, supplier inventory, exact battery documentation, packaging, actual packed gross weight, carrier scheduling, mainland receiving, ocean freight and Hawaii terminal availability.</p><h2>Transportation roles</h2><p>Elevation may coordinate exact product/SKU verification, supplier availability, SDS/MSDS and UN38.3 documentation where required, packed dimensions and gross weight, freight documentation, mainland receiving, consolidation, freight booking, Hawaii movement, terminal coordination and customer pickup notification. Elevation does not represent itself as a regulator, testing laboratory, battery manufacturer or freight carrier unless a separate status is specifically stated.</p><h2>Extraordinary route changes</h2><p>If an extraordinary carrier or route change creates a materially different customer requirement before shipment, Elevation will disclose that situation before collecting an additional charge or tendering the shipment. Additional freight charges are not silently added.</p><h2>Contact</h2><p>Questions may be sent to <a href="mailto:casey@elevationupscales.com">casey@elevationupscales.com</a> or <a href="tel:+12088134998">208-813-4998</a>.</p><p><strong>Last updated:</strong> September 2, 2026</p></div></section></main><footer class="site-footer"><div class="container footer-grid"><div class="footer-brand"><img alt="" height="80" src="/assets/logo.webp" width="80"><div><strong>Elevation UpScales, Inc.</strong><p>Home Services • RV Services • Solar &amp; Off-Grid • Elevation Stores • Marketplace</p></div></div><div class="footer-contact"><a href="tel:+12088134998">208-813-4998</a><a href="mailto:casey@elevationupscales.com">casey@elevationupscales.com</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div><p class="copyright">© <span id="year"></span> Elevation UpScales, Inc. · Colorado Springs, CO.</p></div></footer></body></html>'''
