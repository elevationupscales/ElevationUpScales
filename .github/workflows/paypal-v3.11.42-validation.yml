name: PayPal v3.11.42 Candidate Validation

on:
  push:
    branches:
      - feature/paypal-checkout-v3.11.42

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify candidate lineage and protected source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          main_sha="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$main_sha" HEAD
          git diff --exit-code origin/main -- site/_worker.js site/store.html site/store-config.js site/rv-store.html site/solar-project.html site/start-a-project.html site/marketplace.html

      - name: Validate prepared PayPal files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/pay.html
          test -f site/paypal-checkout.css
          test -f site/paypal-checkout.js
          test -f site/paypal-checkout-server.js
          test -f PAYPAL-CHECKOUT-v3.11.42-HANDOFF.md
          grep -q '/api/paypal/config' site/paypal-checkout.js
          grep -q '/api/paypal/orders' site/paypal-checkout.js
          grep -q 'PAYPAL_CLIENT_SECRET' site/paypal-checkout-server.js
          grep -q 'PAYPAL_ENV' site/paypal-checkout-server.js
          grep -q 'api-m.sandbox.paypal.com' site/paypal-checkout-server.js
          grep -q 'api-m.paypal.com' site/paypal-checkout-server.js
          grep -q 'NO_SHIPPING' site/paypal-checkout-server.js
          grep -q 'This page does not replace the separate Fourthwall apparel checkout or eBay seller checkout' site/pay.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/paypal-checkout.js
          node --input-type=module --check < site/paypal-checkout-server.js

      - name: Block credential values
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIqE '(A[0-9A-Z]{70,}|cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site/pay* PAYPAL-CHECKOUT-v3.11.42-HANDOFF.md; then
            echo 'Credential-like value found in PayPal candidate.'
            exit 1
          fi

      - name: Record validation receipt
        shell: bash
        run: |
          echo '### PayPal v3.11.42 prepared candidate' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Parent main: $(git rev-parse origin/main)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Protected source unchanged: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'JavaScript syntax: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Credential scan: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Activation: BLOCKED pending Worker/CSP wiring and Cloudflare PayPal secrets' >> "$GITHUB_STEP_SUMMARY"
