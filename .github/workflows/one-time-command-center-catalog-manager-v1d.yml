name: One-Time Command Center Catalog Manager v1 Final

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[catalog-manager-v1d]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 50

      - name: Validate final source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e8f157e5474a396ee80e07073b33ff77fa19c29d HEAD
          test -f site/admin-catalog.html
          test -f site/admin-catalog.css
          test -f site/admin-catalog.js
          test -f site/catalog-admin-server.js
          grep -q 'Store Catalog Manager' site/admin-catalog.html
          grep -q 'previewToken' site/catalog-admin-server.js
          grep -q 'eus_catalog_meta' site/catalog-admin-server.js
          grep -Fq 'const pipe = !lines[0].includes' site/admin-catalog.js
          grep -q 'href="/admin-catalog"' site/admin-inventory.html
          grep -q '"/catalog-admin-server.js"' site/_routes.json
          grep -q 'catalog-admin-server.js' site/_worker.js
          grep -q 'shippingVerified !== true' site/store-checkout-server.js
          grep -q 'hold_issue' site/store-orders-admin-server.js
          test -f site/lithium-batteries.html
          test -f site/hawaii-lithium-batteries.html
          grep -q 'Hawaii Shipping Quote Required' site/hawaii-lithium-batteries.html
          node --check site/catalog-admin-server.js
          node --check site/admin-catalog.js
          node --check site/store-orders-admin-server.js
          node --check site/admin-store-orders.js
          node --check site/_worker.js

      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 3
          smoke() {
            local base="$1"
            local route code
            for route in / /store /rv-store /solar-project /lithium-batteries /hawaii-lithium-batteries /checkout /admin-catalog /admin-inventory.html /admin-store-orders.html; do
              code=$(curl -sS -L --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 -o /tmp/page.html -w '%{http_code}' "${base%/}${route}" || true)
              echo "route ${route}: ${code}"
              test "$code" = "200" || return 1
            done
            curl -sS -L --connect-timeout 5 --max-time 20 --fail "${base%/}/admin-catalog" | grep -q 'Store Catalog Manager'
            curl -sS -L --connect-timeout 5 --max-time 20 --fail "${base%/}/lithium-batteries" | grep -q 'Lithium Battery Shop'
            curl -sS -L --connect-timeout 5 --max-time 20 --fail "${base%/}/hawaii-lithium-batteries" | grep -q 'Hawaii Shipping Quote Required'
          }
          if ! smoke "${DEPLOYMENT_URL%/}"; then sleep 6; smoke "$PRODUCTION_URL"; fi

          auth_code=$(curl -sS -o /tmp/catalog-auth.json -w '%{http_code}' "${PRODUCTION_URL}/api/admin/catalog" || true)
          echo "catalog unauthenticated status=${auth_code}"
          cat /tmp/catalog-auth.json
          test "$auth_code" = "401"
          grep -q 'Admin login required' /tmp/catalog-auth.json

          source_code=$(curl -sS -o /tmp/catalog-source.txt -w '%{http_code}' "${PRODUCTION_URL}/catalog-admin-server.js" || true)
          echo "catalog server source status=${source_code}"
          test "$source_code" = "404"

          orders_code=$(curl -sS -o /tmp/orders-auth.json -w '%{http_code}' "${PRODUCTION_URL}/api/admin/store-orders" || true)
          echo "store orders unauthenticated status=${orders_code}"
          test "$orders_code" = "401"

          curl -sS -L --connect-timeout 5 --max-time 20 --fail "${PRODUCTION_URL}/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true)throw new Error('Apparel PayPal checkout regression');
          console.log('apparel_paypal=PASS');
          NODE

          rv_code=$(curl -sS -o /tmp/rv.json -w '%{http_code}' -X POST "${PRODUCTION_URL}/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/checkout/' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true)
          echo "verified RV quote status=${rv_code}"
          test "$rv_code" = "200"
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('/tmp/rv.json','utf8'));if(q.ok!==true||q.totalCents!==6500)throw new Error('RV direct quote regression')"

          fallback_code=$(curl -sS -o /tmp/fallback.json -w '%{http_code}' -X POST "${PRODUCTION_URL}/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/checkout/' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631058246","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631058246","name":"Quick Set Brown Pop-Up Gazebo"}' || true)
          echo "held RV fallback status=${fallback_code}"
          test "$fallback_code" = "409"
          node -e "const fs=require('fs');const q=JSON.parse(fs.readFileSync('/tmp/fallback.json','utf8'));if(q.fallback!=='ebay'||q.ebayUrl!=='https://www.ebay.com/itm/168631058246')throw new Error('eBay fallback regression')"

      - name: Receipt
        run: |
          echo '### Command Center Store Catalog Manager v1 — FINAL' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog Manager: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin auth + server-source protection: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Bulk preview/import architecture: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'CSV / TSV / copied Markdown tables: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Single product + URL draft: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Doba fulfillment operations: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lithium / Hawaii parent release: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel PayPal: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV direct checkout + eBay fallback: PASS' >> "$GITHUB_STEP_SUMMARY"
