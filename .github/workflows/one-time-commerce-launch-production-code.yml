name: One-Time Commerce Launch Production Code

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  deploy-commerce-foundation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate accepted application lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor f65c8b4778e1ae9897ed3a26a846bae4b07d04be HEAD
          node --check site/apparel-provider-runtime.js
          node --check site/admin-commerce-media.js
          node --check site/store-checkout-server.js
          node --check site/_worker.js
          node --check site/rv-store.js
          grep -q 'apparel-provider-runtime.js' site/_routes.json
          grep -q 'catalogRvEntry' site/store-checkout-server.js
          grep -q 'rv-category-rail' site/rv-store.js
      - name: Deploy application foundation
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify live foundation
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
          PROD: https://elevationupscales.com
        run: |
          set -euo pipefail
          smoke(){
            base="${1%/}"
            for route in / /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /store /rv-store /checkout /marketplace /start-a-project /solar-project /lithium-batteries /hawaii-lithium-batteries /admin-commerce-media.js /admin-commerce-media.css; do
              code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "${base}${route}" || true); echo "${base}${route} -> ${code}"; test "$code" = "200";
            done
            for api in /api/admin/catalog /api/admin/apparel-providers /api/admin/doba-csv-sync; do code=$(curl -sS -o /tmp/api -w '%{http_code}' "${base}${api}" || true); test "$code" = "401"; done
            for runtime in /apparel-provider-runtime.js /doba-csv-sync-runtime.js /store-checkout-server.js; do code=$(curl -sS -o /tmp/private -w '%{http_code}' "${base}${runtime}" || true); test "$code" = "404"; done
            test "$(curl -sS -o /tmp/config -w '%{http_code}' "${base}/api/store-checkout/config" || true)" = "200"
          }
          if ! smoke "$BASE"; then sleep 8; smoke "$PROD"; fi
      - name: Record foundation receipt
        run: |
          echo '### Commerce Launch production foundation' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '- Provider/media/RV-checkout foundation: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Product data publishing: NOT YET RUN' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deployment: `${{ steps.deploy.outputs.deployment-url }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-commerce-launch-production-code.yml
          git commit -m 'Remove completed Commerce Launch production foundation workflow'
          git push origin HEAD:main
