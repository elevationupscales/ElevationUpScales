name: One-Time 4.5 Release Gate Cleanup Resume

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths: [.github/workflows/one-time-45-release-gate-cleanup-resume.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/4.5-production-reconciliation-2026-09-02
          fetch-depth: 0
      - name: Apply stale assertion cleanup
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cc5f59fa8d7374d41d51ec56a0e91e20198cb612 HEAD
          python - <<'PY'
          from pathlib import Path
          p=Path('site/rv-store.js'); s=p.read_text()
          marker='// Deployment compatibility: fallbackCatalog was superseded by the current prerendered catalog fallback path.\n'
          if s.count(marker)!=1: raise SystemExit('rv-store compatibility marker mismatch')
          p.write_text(s.replace(marker,'',1))

          p=Path('.github/workflows/deploy-pages.yml'); s=p.read_text()
          old="          grep -q 'fallbackCatalog' site/rv-store.js\n"
          new="          grep -q 'elevation-catalog' site/rv-store.js\n          ! grep -q 'fallbackCatalog' site/rv-store.js\n"
          if s.count(old)!=1: raise SystemExit('deploy-pages stale assertion mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('.github/workflows/release-candidate-gate.yml'); s=p.read_text()
          old="""          # Current RV/eBay storefront architecture.\n          test -f site/rv-store.html\n          test -f site/rv-store.js\n          test -f site/rv-ebay-catalog.js\n          grep -q 'VERIFIED EBAY CATALOG' site/rv-store.html\n          grep -q 'window.EUS_VERIFIED_EBAY_CATALOG' site/rv-ebay-catalog.js\n          grep -q 'elevationupscalesshop' site/rv-store.js\n          ! grep -q 'rv-store-hero__media' site/rv-store.html\n"""
          new="""          # Current Catalog-driven RV storefront architecture.\n          test -f site/rv-store.html\n          test -f site/rv-store.js\n          grep -q '/api/store-catalog?section=rv-outdoor' site/rv-store.js\n          grep -q 'elevation-catalog' site/rv-store.js\n          ! grep -q '&ebay=' site/rv-store.js\n          ! grep -q 'fallbackCatalog' site/rv-store.js\n          ! grep -q 'rv-store-hero__media' site/rv-store.html\n"""
          if s.count(old)!=1: raise SystemExit('release-candidate stale RV assertion mismatch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate cleaned release gates
        run: |
          set -euo pipefail
          node --check site/rv-store.js
          git diff --check
          grep -Fq '/api/store-catalog?section=rv-outdoor' site/rv-store.js
          grep -Fq 'elevation-catalog' site/rv-store.js
          ! grep -Fq 'fallbackCatalog' site/rv-store.js
          ! grep -Fq 'elevationupscalesshop' .github/workflows/release-candidate-gate.yml
          grep -Fq "! grep -q 'fallbackCatalog' site/rv-store.js" .github/workflows/deploy-pages.yml
          ! grep -Fxq "          grep -q 'fallbackCatalog' site/rv-store.js" .github/workflows/deploy-pages.yml
      - name: Commit cleanup and retire temporary runners
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-45-release-gate-cleanup.yml
          rm -f .github/workflows/one-time-45-release-gate-cleanup-resume.yml
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add -A
          git commit -m 'Repair stale release gate assertions'
          git push origin HEAD:repair/4.5-production-reconciliation-2026-09-02
