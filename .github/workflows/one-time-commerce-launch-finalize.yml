name: One-Time Commerce Launch Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  verify-and-close-commerce-launch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify accepted application source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 95ce329e4b81f24162413663c6e16919c086d93b HEAD
          node --check site/store-checkout-server.js
          node --check site/apparel-provider-runtime.js
          node --check site/admin-commerce-media.js
          node --check site/rv-store.js
          grep -q 'blockedStates.includes(destinationState)' site/store-checkout-server.js
          grep -q 'rv-category-rail' site/rv-store.js
          grep -q 'handleApparelProviderAdminApi' site/_worker.js
          grep -q 'apparel-provider-runtime.js' site/_routes.json
          grep -q 'printful' site/admin-catalog.html
          grep -q 'spreadconnect' site/admin-inventory.html

      - name: Redeploy authoritative clean production source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify public, Admin and server boundaries
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          finalizer_code=$(curl -sS -o /tmp/finalizer -w '%{http_code}' -H 'Content-Type: application/json' --data '{}' "${base}/api/admin/commerce-launch-finalize" || true)
          provider_code=$(curl -sS -o /tmp/provider -w '%{http_code}' "${base}/api/admin/apparel-providers" || true)
          echo "retired one-run finalizer -> $finalizer_code"
          echo "protected provider API -> $provider_code"
          test "$finalizer_code" != "200"
          test "$provider_code" = "401"
          for route in / /store /rv-store /checkout /marketplace /start-a-project /solar-project /lithium-batteries /hawaii-lithium-batteries /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /admin-analytics; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "${base}${route}" || true)
            echo "${route} -> $code"
            test "$code" = "200"
          done
          for runtime in /apparel-provider-runtime.js /doba-csv-sync-runtime.js /store-checkout-server.js; do
            code=$(curl -sS -o /tmp/private -w '%{http_code}' "${base}${runtime}" || true)
            echo "private ${runtime} -> $code"
            test "$code" = "404"
          done

      - name: Verify final Doba public disposition
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 "${base}/api/store-catalog?section=rv-outdoor" > /tmp/public-catalog.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/public-catalog.json'))
          rows=d.get('products',d if isinstance(d,list) else [])
          ids={str(r.get('id','')) for r in rows}
          published={
            'cat-8449060f-d3fc-4dd0-ac94-141092454544','cat-b36ff198-bbc5-4fd8-865d-270382ece6bc','cat-52b285ef-76e0-4acf-a492-c7eec62408ce','cat-b6adca49-b96f-4de2-bbea-60a79a3b7079',
            'cat-59226068-e44e-481e-b67e-06fa6c294b75','cat-85ebf249-e2d1-49e8-aba0-0e9f643dc0fd','cat-a8fd162f-5445-4259-9d8c-598ba588a238','cat-4523393a-1d6f-4d78-a24c-39a207149080',
            'cat-ff419c65-ebbd-426d-b410-d02524d62e51','cat-70ed4d85-0814-44ff-bd7a-3d511867decc','cat-bc00615a-8dc8-470a-ab3a-23b81b8b3b8f','cat-2cc952ec-f424-487f-a71b-20e7c38c3645'
          }
          review={
            'cat-8d7ec42f-4fb3-438c-9d40-78cf53eab2a8','cat-8f553d2d-184d-40eb-a46c-1c13c71f28da','cat-b9b87f43-af02-41dc-b5ef-a71cbbf04fcc','cat-26208ea0-43db-4ec3-8abe-8c576fbd7bec',
            'cat-834cf68a-e6f4-4c8c-a5c6-0c5683da5d9f','cat-8356190a-6519-4a10-818d-fca3c2de6957','cat-fee00faa-8fb9-47f6-b9ae-ce6a6b215e1e','cat-849b6f78-ed09-4798-97f8-37e0945f1eca',
            'cat-1ac4dd10-e7f5-4816-8a96-b5055c61c534','cat-b99c2b06-2dfe-4241-9bff-62825d874d07'
          }
          missing=published-ids
          leaked=review&ids
          assert not missing,('published products missing',missing)
          assert not leaked,('review products leaked public',leaked)
          categories={r.get('category') for r in rows}
          assert {'Tools & Workshop','Solar & Off-Grid','RV Essentials & Water','Automotive, ATV & Towing','Travel & Organization'}.issubset(categories),categories
          for r in rows:
              if r.get('id') in published:
                  assert int(r.get('priceCents') or 0)>0,r
                  assert r.get('shippingStatus')=='verified',r
                  assert r.get('primaryImage'),r
          print('public_rv_products=',len(rows))
          print('new_published_verified=',len(published))
          print('new_review_not_public=',len(review))
          print('categories=',sorted(x for x in categories if x))
          PY

      - name: Verify Catalog-backed RV checkout gates
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          allowed='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"CO"}}'
          blocked='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"HI"}}'
          zero='{"source":"rv","id":"cat-b99c2b06-2dfe-4241-9bff-62825d874d07","quantity":1,"shipping":{"state":"CO"}}'
          allowed_code=$(curl -sS -o /tmp/quote-allowed.json -w '%{http_code}' -H "Origin: ${base}" -H 'Content-Type: application/json' --data "$allowed" "${base}/api/store-checkout/quote" || true)
          blocked_code=$(curl -sS -o /tmp/quote-blocked.json -w '%{http_code}' -H "Origin: ${base}" -H 'Content-Type: application/json' --data "$blocked" "${base}/api/store-checkout/quote" || true)
          zero_code=$(curl -sS -o /tmp/quote-zero.json -w '%{http_code}' -H "Origin: ${base}" -H 'Content-Type: application/json' --data "$zero" "${base}/api/store-checkout/quote" || true)
          echo "CO quote -> $allowed_code"; cat /tmp/quote-allowed.json
          echo "HI quote -> $blocked_code"; cat /tmp/quote-blocked.json
          echo "zero-stock quote -> $zero_code"; cat /tmp/quote-zero.json
          test "$allowed_code" = "200"
          test "$blocked_code" = "409"
          test "$zero_code" = "409"
          curl -sS -L "${base}/rv-store.js" | grep -q 'rv-category-rail'

      - name: Create final production receipt and close workflow
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p coordination/handoffs/commerce
          cat > coordination/handoffs/commerce/Elevation_UpScales_Commerce_Launch_FINAL_PRODUCTION_RECEIPT_2026-08-29.md <<EOF
          # Elevation UpScales Commerce Launch — Final Production Receipt

          **Date:** 2026-08-29  
          **Disposition:** PASS / PRODUCTION VERIFIED  
          **Owner authorization:** Granted in Deployment Manager chat

          ## Source and deployment
          - Doba source SHA-256: `f1c4ed36338ae5ac078e38a07175b994c9300f7af4473eef34fb3eea6211d7eb`
          - Stage 0 run: `33238177644` — PASS
          - Commerce application preview run: `33239206514` — PASS
          - Destination-hardening preview run: `33239366178` — PASS
          - Production foundation run: `33239280674` — PASS
          - Atomic reconciliation run: `33239617246` — data transaction PASS; its first closeout verification was superseded by this verification-only closeout
          - Final clean production deployment: `${DEPLOYMENT_URL}`

          ## Doba finalization
          - Existing Item-No records reconciled to current Doba supplier SKU: **10**
          - New Doba products priced/categorized: **22**
          - New products published after readiness gate: **12**
          - New products retained Draft/HOLD: **10**
          - Historical HOLD products preserved: **3/3**
          - Stage 0 supplier-cost validation: **10/10**
          - Snapshot mode remains **Partial**; missing movie-screen record was not changed by Stage 0.

          ## Publishing rules enforced
          Published new Doba products required positive stock above the low-stock review band, exact current supplier SKU, primary image, explicit shipping scope/method/cost data, positive retail price, at least $5 direct contribution, at least 20% direct contribution margin, and Catalog-backed server checkout.

          The 10 retained records remain non-public because of low/zero stock, unresolved variant-family presentation, or assortment review.

          ## Checkout verification
          - Colorado/lower-48 quote for a published Catalog-backed Doba product: **PASS / 200**
          - Hawaii quote for the same lower-48-only product: **BLOCKED / 409**
          - Zero-stock Doba product quote: **BLOCKED / 409**
          - Browser-provided price is not authoritative; server Catalog/source values remain authoritative.

          ## Admin / commerce UX
          - Product thumbnails: deployed
          - Store/category/provider filtering: deployed
          - RV Store category rail: deployed
          - Small lazy-loaded thumbnails and responsive/mobile controls: deployed
          - Inventory polling reduced from 3 seconds to 15 seconds

          ## Apparel provider model
          - Fourthwall read/reconcile adapter: **DEPLOYED**
          - Fourthwall current connection state: **Not Configured** (no verified Storefront token in production at closeout)
          - Printful adapter state: **Not Configured**
          - Spreadconnect adapter state: **Not Configured**
          - No provider is represented as Connected without credentials plus a successful server-side reconciliation.

          ## Security / regression
          - Provider Admin API requires Admin authentication
          - Provider/Doba/server runtime modules return 404 directly
          - Temporary one-run Commerce finalizer is absent after cleanup
          - Store, RV Store, checkout, Marketplace, Start a Project, Solar, Lithium/Hawaii and core Admin routes returned HTTP 200 in final regression

          ## Deferred review products
          - 4 solar/camping-light variants: customer-facing variant distinction required
          - 3 MPPT variants: two zero-stock; one low-stock/review
          - 1 low-stock travel/organization product
          - 1 zero-stock propane water heater
          - 1 Other/Review distillation product awaiting assortment decision

          ## Rollback
          Create `baseline-2026-08-29-commerce-launch-apparel-providers` from the final post-receipt `main` commit after this workflow self-removes.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coordination/handoffs/commerce/Elevation_UpScales_Commerce_Launch_FINAL_PRODUCTION_RECEIPT_2026-08-29.md
          git rm .github/workflows/one-time-commerce-launch-finalize.yml
          git commit -m 'Close Commerce Launch production release'
          git push origin HEAD:main
          echo '### Commerce Launch final closeout' >> "$GITHUB_STEP_SUMMARY"
          echo '- Final verification: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- Doba: 10 reconciled / 22 priced / 12 published / 10 review / 3 historical HOLDs preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Provider states: Fourthwall Not Configured; Printful Not Configured; Spreadconnect Not Configured' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production: `${DEPLOYMENT_URL}`' >> "$GITHUB_STEP_SUMMARY"
