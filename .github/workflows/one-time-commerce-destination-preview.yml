name: One-Time Commerce Destination Preview
on:
  push:
    branches: [main]
permissions:
  contents: write
  deployments: write
jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/commerce-launch-apparel-providers
          fetch-depth: 0
      - name: Validate hardening
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "20139425c4761e6245deb8c6a26956316bb9e8a2"
          node --check site/store-checkout-server.js
          grep -q 'blockedStates.includes(destinationState)' site/store-checkout-server.js
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=github-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke checkout and stores
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in /rv-store /checkout /admin-catalog /admin-channels /store /marketplace /solar-project /hawaii-lithium-batteries; do test "$(curl -sS -L --retry 6 -o /tmp/x -w '%{http_code}' "${base}${route}")" = "200"; done
          test "$(curl -sS -o /tmp/x -w '%{http_code}' "${base}/apparel-provider-runtime.js")" = "404"
          test "$(curl -sS -o /tmp/x -w '%{http_code}' "${base}/api/admin/apparel-providers")" = "401"
      - name: Receipt
        run: |
          echo 'Destination hardening preview: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview: `${{ steps.deploy.outputs.deployment-url }}`' >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-commerce-destination-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed destination preview workflow'
          git push origin main
