name: One-Time Elevation 4.3 Stabilization Candidate

on:
  push:
    branches: [stabilization/elevation-4-3-2026-08-29]

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-4-3-stabilization-candidate
  cancel-in-progress: false

jobs:
  stabilize-preview:
    if: github.event.head_commit.message == 'Start Elevation 4.3 stabilization candidate'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: stabilization/elevation-4-3-2026-08-29
          fetch-depth: 0

      - name: Enforce accepted parent
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "66163dfccc770388a6646dc6b01a608388ff7095"
          git merge-base --is-ancestor 66163dfccc770388a6646dc6b01a608388ff7095 HEAD

      - name: Apply targeted stabilization patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, json

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          def regex_once(path, pattern, repl, flags=re.S):
              p=Path(path); text=p.read_text(encoding='utf-8'); new,count=re.subn(pattern,repl,text,count=1,flags=flags)
              if count != 1: raise SystemExit(f'{path}: regex expected one match, found {count}: {pattern[:120]}')
              p.write_text(new,encoding='utf-8')

          replace_once('site/store.html',
              '<script defer src="store-config.js?v=3.0.3"></script><script defer src="store-patch-8.js?v=3.0.3"></script>',
              '<script defer src="store-config.js?v=3.0.3"></script><script defer src="store-checkout-routing.js?v=3.11.43"></script><script defer src="store-patch-8.js?v=3.0.3"></script>')
          replace_once('site/admin-listings.html',
              '<script defer src="/admin-listings.js?v=3.11.19-login-state"></script>',
              '<script defer src="/admin-listings.js?v=3.11.19-login-state"></script>\n<script defer src="/admin-store-orders-link.js?v=3.11.42"></script>')

          regex_once('site/_worker.js', r'const APPAREL_ROUTING_LOADER = `.*?const CHECKOUT_CSP = \[', 'const CHECKOUT_CSP = [')
          regex_once('site/_worker.js', r'async function appendRuntimeLoader\(response, loader\) \{.*?function checkoutResponse\(response\) \{', 'function checkoutResponse(response) {')
          regex_once('site/_worker.js', r'function validEmail\(value\) \{.*?async function checkoutRequestBody\(request\) \{.*?\n\}', '')
          replace_once('site/_worker.js',
              '    const isQuote = url.pathname === "/api/store-checkout/quote";\n    const isCreate = url.pathname === "/api/store-checkout/orders";\n\n    if ((isQuote || isCreate) && request.method === "POST") {\n      if (!sameOriginPost(request)) return checkoutJson({ error: "Cross-origin request denied" }, 403);\n      const raw = await checkoutRequestBody(request);\n      const source = clean(raw.source, 20).toLowerCase();\n      if (!["apparel", "rv"].includes(source)) return checkoutJson({ error: "Invalid store source" }, 400);\n      if (!validQuantity(raw.quantity)) return checkoutJson({ error: "Quantity must be from 1 to 10" }, 400);\n\n      if (source === "rv") {\n        const entry = verifiedRvEntry(env, raw);\n        if (entry && !rvDestinationAllowed(entry, raw)) return rvFallback(raw, entry, "This Doba item is not available for the selected shipping state");\n        // Catalog-backed Doba products are authoritatively checked in store-checkout-server.js.\n        // Legacy static map entries retain the preflight destination guard above.\n      }\n\n      if (isCreate) {\n        if (!validEmail(raw?.customer?.email)) return checkoutJson({ error: "A valid customer email is required" }, 400);\n        if (!validUsAddress(raw?.shipping)) return checkoutJson({ error: "A valid U.S. shipping address is required" }, 400);\n        if (!await ensureStoreOrderTable(env)) return checkoutJson({ error: "Store order storage is not configured" }, 503);\n      }\n    }\n\n    if (url.pathname === "/api/store-checkout/config" ||\n        isQuote ||\n        isCreate ||\n        /^\\/api\\/store-checkout\\/orders\\/[A-Z0-9]{8,40}\\/capture$/i.test(url.pathname)) {\n      return handleStoreCheckoutApi(request, env, url.pathname);\n    }',
              '    const isQuote = url.pathname === "/api/store-checkout/quote";\n    const isCreate = url.pathname === "/api/store-checkout/orders";\n    const isCapture = /^\\/api\\/store-checkout\\/orders\\/[A-Z0-9]{8,40}\\/capture$/i.test(url.pathname);\n\n    if ((isQuote || isCreate || isCapture) && request.method === "POST" && !sameOriginPost(request)) {\n      return checkoutJson({ error: "Cross-origin request denied" }, 403);\n    }\n\n    if (url.pathname === "/api/store-checkout/config" || isQuote || isCreate || isCapture) {\n      return handleStoreCheckoutApi(request, env, url.pathname);\n    }')
