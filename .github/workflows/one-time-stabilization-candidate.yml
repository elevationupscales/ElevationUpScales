let schemaPromise = null;
async function runMigrations(db) {
  await db.prepare(`CREATE TABLE IF NOT EXISTS eus_schema_migrations (id TEXT PRIMARY KEY, schema_version TEXT NOT NULL, description TEXT NOT NULL, applied_at TEXT NOT NULL)`).run();
  for (const migration of MIGRATIONS) {
    const applied = await db.prepare("SELECT id FROM eus_schema_migrations WHERE id=? LIMIT 1").bind(migration.id).first();
    if (applied) continue;
    for (const statement of migration.statements) await db.prepare(statement).run();
    await db.prepare("INSERT OR IGNORE INTO eus_schema_migrations(id,schema_version,description,applied_at) VALUES(?,?,?,?)").bind(migration.id,COMMERCE_SCHEMA_VERSION,migration.description,new Date().toISOString()).run();
  }
  return db;
}
export async function ensureCommerceSchema(env) {
  const db = env?.MARKETPLACE_DB;
  if (!db || typeof db.prepare !== "function") throw new Error("Commerce database is not configured");
  if (!schemaPromise) schemaPromise = runMigrations(db).catch((error)=>{schemaPromise=null;throw error;});
  return schemaPromise;
}
