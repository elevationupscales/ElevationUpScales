          ! grep -q 'appendHtmlLoader' site/_worker.js
          ! grep -q 'RV_ROUTING_LOADER' site/_worker.js
          ! grep -q 'APPAREL_ROUTING_LOADER' site/_worker.js
          ! grep -q 'ADMIN_COMMAND_CENTER_LOADER' site/_worker.js
          ! grep -q 'ensureStoreOrderTable' site/_worker.js
          ! grep -q 'CREATE TABLE IF NOT EXISTS eus_store_orders' site/_worker.js
          ! grep -q 'CREATE TABLE IF NOT EXISTS eus_store_orders' site/store-checkout-server.js
          grep -q 'sameOriginPost' site/_worker.js
          grep -q 'validQuantity' site/store-checkout-server.js
          grep -q 'validEmail' site/store-checkout-server.js
          grep -q 'paypalTokenCache' site/store-checkout-server.js
          grep -q 'fetchFourthwallProductExact' site/store-checkout-server.js
          grep -q 'catalogApparelReference' site/store-checkout-server.js
          grep -q 'COMMERCE_SCHEMA_VERSION' site/commerce-schema-migrations.js
          ! grep -q 'async function upsertState' site/sync-admin-runtime.js
          ! grep -q 'CREATE TABLE IF NOT EXISTS eus_sync_runs' site/sync-admin-runtime.js
          ! grep -q 'CREATE TABLE IF NOT EXISTS eus_catalog_provider_links' site/apparel-provider-runtime.js
          grep -q 'ensureCommerceSchema' site/sync-admin-runtime.js
          grep -q 'ensureCommerceSchema' site/apparel-provider-runtime.js
          ! grep -q '"/store-config.js"' site/_routes.json
          ! grep -q '"/rv-store.js"' site/_routes.json
          ! grep -q '"/admin-listings.js"' site/_routes.json
          grep -q '"/commerce-schema-migrations.js"' site/_routes.json
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check

      - name: Commit stabilization candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/store.html site/admin-listings.html site/_worker.js site/_routes.json site/store-checkout-server.js site/sync-admin-runtime.js site/apparel-provider-runtime.js site/commerce-schema-migrations.js
          git commit -m 'Apply Elevation 4.3 production stabilization'
          git push origin HEAD:stabilization/elevation-4-3-2026-08-29
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated stabilization preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=stabilization-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview regression matrix
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /checkout /marketplace /start-a-project /solar-project /solar-services /home-services /lithium-batteries /hawaii-lithium-batteries /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /admin-analytics /admin-system; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "${base}${route}" || true)
            echo "$route -> $code"; test "$code" = "200"
          done
          test "$(curl -sS -o /tmp/catalog.json -w '%{http_code}' "${base}/api/store-catalog?section=rv-outdoor" || true)" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/catalog.json')); rows=d.get('products',d if isinstance(d,list) else []); assert len(rows)>=12,len(rows); print('public_catalog_products=',len(rows))
          PY
          test "$(curl -sS -o /tmp/admin.json -w '%{http_code}' "${base}/api/admin/sync" || true)" = "401"
          test "$(curl -sS -o /tmp/sched.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"target":"all","runId":"stabilization-unauthorized"}' "${base}/api/sync/run" || true)" = "401"
          for runtime in /worker-core.js /store-checkout-server.js /sync-admin-runtime.js /apparel-provider-runtime.js /commerce-schema-migrations.js; do code=$(curl -sS -o /tmp/private -w '%{http_code}' "${base}${runtime}" || true); echo "$runtime -> $code"; test "$code" = "404"; done

          origin="$base"
          rv='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"CO"}}'
          hi='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"HI"}}'
          zero='{"source":"rv","id":"cat-b99c2b06-2dfe-4241-9bff-62825d874d07","quantity":1,"shipping":{"state":"CO"}}'
          apparel='{"source":"apparel","id":"elevation-upscales-true-grit-trucker-hat","quantity":1}'
          quote(){ curl -sS -o "$2" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data "$1" "${base}/api/store-checkout/quote" || true; }
          test "$(quote "$rv" /tmp/rv.json)" = "200"
          test "$(quote "$hi" /tmp/hi.json)" = "409"
          test "$(quote "$zero" /tmp/zero.json)" = "409"
          test "$(quote "$apparel" /tmp/apparel.json)" = "200"
          test "$(quote '{"source":"bogus","id":"x","quantity":1}' /tmp/source.json)" = "400"
          test "$(quote '{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":99,"shipping":{"state":"CO"}}' /tmp/qty.json)" = "400"
          test "$(curl -sS -o /tmp/missing.json -w '%{http_code}' -H 'Content-Type: application/json' --data "$rv" "${base}/api/store-checkout/quote" || true)" = "403"
          test "$(curl -sS -o /tmp/foreign.json -w '%{http_code}' -H 'Origin: https://example.com' -H 'Content-Type: application/json' --data "$rv" "${base}/api/store-checkout/quote" || true)" = "403"

          bad_email='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"customer":{"email":"bad"},"shipping":{"fullName":"Test User","address1":"1 Main St","city":"Denver","state":"CO","postalCode":"80202","countryCode":"US"}}'
          bad_address='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"customer":{"email":"test@example.com"},"shipping":{"fullName":"Test User","address1":"1 Main St","city":"Denver","state":"COLORADO","postalCode":"x","countryCode":"US"}}'
          test "$(curl -sS -o /tmp/bademail.json -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data "$bad_email" "${base}/api/store-checkout/orders" || true)" = "400"
          test "$(curl -sS -o /tmp/badaddress.json -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data "$bad_address" "${base}/api/store-checkout/orders" || true)" = "400"

          test "$(curl -sS -o /tmp/config.json -w '%{http_code}' "${base}/api/store-checkout/config" || true)" = "200"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/config.json')); assert d.get('configured') is True; assert d.get('credentialsConfigured') is True; assert d.get('checkoutEnabled') is True; assert d.get('environment')=='live'; print('paypal_config=live-enabled')
          PY
          curl -sS -L "${base}/store" -o /tmp/store.html; curl -sS -L "${base}/rv-store" -o /tmp/rvstore.html; curl -sS -L "${base}/hawaii-lithium-batteries" -o /tmp/hawaii.html
          test "$(grep -o 'store-checkout-routing.js' /tmp/store.html | wc -l)" = "1"
          test "$(grep -o 'rv-checkout-routing.js' /tmp/rvstore.html | wc -l)" = "1"
          grep -q '208-813-4998' /tmp/store.html; grep -q '208-813-4998' /tmp/rvstore.html; grep -qi 'Coming Soon' /tmp/hawaii.html
          ! grep -Eqi 'guaranteed Hawaii|automatic.*Hawaii' /tmp/hawaii.html

      - name: Record preview receipt
        shell: bash
        env:
          CANDIDATE: ${{ steps.commit.outputs.sha }}
          PREVIEW: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.3 stabilization preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent: 66163dfccc770388a6646dc6b01a608388ff7095" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo 'Loader/checkout/schema/security regression: PASS' >> "$GITHUB_STEP_SUMMARY"

      - name: Retire one-time candidate workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-stabilization-candidate.yml
          git commit -m 'Retire stabilization candidate workflow'
          git push origin HEAD:stabilization/elevation-4-3-2026-08-29
