async function catalogApparelReference(env,id) {
  const wanted=clean(id,300),db=env?.MARKETPLACE_DB;
  if(!wanted||!db||typeof db.prepare!=="function") return {slug:wanted,catalogProductId:"",providerProductId:""};
  try {
    const like=`%/products/${wanted}`;
    const row=await db.prepare(`SELECT i.id,i.source_url,m.fourthwall_product_id,l.provider_product_id,l.provider_product_url,l.provider_state FROM eus_inventory_items i JOIN eus_catalog_meta m ON m.inventory_item_id=i.id LEFT JOIN eus_catalog_provider_links l ON l.catalog_product_id=i.id AND l.provider='fourthwall' WHERE m.store_section='apparel' AND (i.id=? OR m.fourthwall_product_id=? OR l.provider_product_id=? OR lower(i.source_url) LIKE lower(?) OR lower(l.provider_product_url) LIKE lower(?)) ORDER BY CASE WHEN l.provider_state='MAPPED' THEN 0 ELSE 1 END LIMIT 1`).bind(wanted,wanted,wanted,like,like).first();
    if(!row) return {slug:wanted,catalogProductId:"",providerProductId:""};
    const slug=slugFromUrl(row.provider_product_url)||slugFromUrl(row.source_url)||clean(row.fourthwall_product_id,300)||clean(row.provider_product_id,300)||wanted;
    return {slug,catalogProductId:clean(row.id,140),providerProductId:clean(row.provider_product_id||row.fourthwall_product_id,300)};
  } catch(error) { console.error(JSON.stringify({event:"apparel_catalog_reference_error",message:clean(error?.message,240)})); return {slug:wanted,catalogProductId:"",providerProductId:""}; }
}
async function fetchFourthwallProductExact(reference) {
  const slug=clean(reference?.slug,300); if(!slug) return null;
