name: SEO Sweep Preview

on:
  push:
    paths:
      - ".github/workflows/seo-sweep-preview.yml"

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            site
            deployment/qa
            package.json

      - name: Run SEO and canonical QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          npm run qa:secrets
          git diff --check

      - name: Deploy isolated Cloudflare SEO preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=seo-sweep-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview SEO headers and routes
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE%/}"
          npm run qa:preview -- "$base"
          for route in / /sok-batteries /hawaii-lithium-batteries /vendors /vendor/olight /commercial; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$base$route")"
            test "$code" = "200"
            header="$(curl -sSI "$base$route" | tr -d '\r' | grep -i '^x-robots-tag:' || true)"
            echo "$route => $code | $header"
            echo "$header" | grep -qi 'noindex'
          done

      - name: Receipt
        run: |
          echo "SEO sweep preview: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment: NOT PERFORMED" >> "$GITHUB_STEP_SUMMARY"
