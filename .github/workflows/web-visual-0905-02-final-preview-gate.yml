name: WEB-VISUAL-0905-02 Final Preview Gate

on:
  push:
    branches:
      - control/web-visual-0905-02-preview-final-20260905

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-visual-0905-02-final-preview
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 1ab4f033b395a441336428cf651a89d2921b4b3c
      CANDIDATE_SHA: 37e6f88a490af4ec62ebe7a0c5d88b7ae38df2c4
      PROD: https://elevationupscales.com
    steps:
      - name: Check out exact approved candidate
        uses: actions/checkout@v6
        with:
          ref: 37e6f88a490af4ec62ebe7a0c5d88b7ae38df2c4
          fetch-depth: 0

      - name: Re-resolve lineage and six-file scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$PARENT_SHA"
          test "$(git rev-list --count "$PARENT_SHA".."$CANDIDATE_SHA")" = "1"
          git diff --name-only "$PARENT_SHA".."$CANDIDATE_SHA" | sort > /tmp/files
          cat >/tmp/expected <<'EOF'
          site/assets/brand/storefront-wordmark.note.txt
          site/assets/brand/storefront-wordmark.webp
          site/index.html
          site/retail-first.css
          site/sok-batteries.html
          site/sok-order.html
          EOF
          diff -u /tmp/expected /tmp/files
          git diff --quiet "$PARENT_SHA".."$CANDIDATE_SHA" -- site/store.html site/store-checkout-server.js site/store-checkout.js site/promotion-runtime.js site/shipping-rules-runtime.js site/hawaii-lithium-runtime.js site/sok-operations-runtime.js site/sok-availability-runtime.js site/sok-full-line-data.js site/sok-full-line-runtime.js site/worker/domains/marketplace.js site/worker/domains/inventory.js
          test ! -e site/assets/store/signature-tshirt-preview.webp
          echo lineage_scope_and_protected_systems=PASS

      - name: Canonical static and commerce gates
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          node deployment/qa/web-com-commerce-regression.mjs
          git diff --check
          git diff --exit-code

      - id: deploy
        name: Deploy exact candidate to isolated preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=web-visual-0905-02-preview-final
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Canonical preview route and security regression
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          npm run qa:preview -- "${BASE%/}"

      - name: Prove Apparel image is identical pre-existing baseline defect
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          prod_code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "$PROD/assets/store/signature-tshirt-preview.webp" || true)
          preview_code=$(curl -sS -L --retry 4 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "${BASE%/}/assets/store/signature-tshirt-preview.webp" || true)
          echo "production_signature_tshirt_asset=$prod_code"
          echo "preview_signature_tshirt_asset=$preview_code"
          test "$prod_code" = "404"
          test "$preview_code" = "404"
          git diff --quiet "$PARENT_SHA".."$CANDIDATE_SHA" -- site/store.html
          test ! -e site/assets/store/signature-tshirt-preview.webp
          echo apparel_missing_asset=ACCEPTED_PREEXISTING_BASELINE_NONREGRESSION

      - name: Install browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Desktop and mobile visual regression
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          cat > visual-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base=process.env.BASE.replace(/\/$/,'');
          const knownDoba=new Set([
          'https://image.doba.com/dg-eEVQqaHdDocC/d0102x3l1q7.jpg','https://image.doba.com/dg-CgDsqtEybcJo/d0102x3l1qy.jpg','https://image.doba.com/dg-ypbFvdQOHJPO/d0102x39tyw.jpg','https://image.doba.com/dg-dDbWvRCtOYcV/d0102x33e6a.jpg','https://image.doba.com/dg-cTqYVKfUvJPZ/d0102x33faa.jpg','https://image.doba.com/dg-IWqtDsoiQYPk/d0102x3gzmy.jpg','https://image.doba.com/dg-mRVWhjUkzobT/d0102hi2mdu.jpg','https://image.doba.com/dg-NJvhDVeOdPoK/d01027hhe07.jpg','https://image.doba.com/dg-izqBvdHZFYPh/d0102x3gzza.jpg','https://image.doba.com/dg-NYvlbtCveJoy/d01027hh7s7.jpg','https://image.doba.com/dg-KdDkqaHQFJoG/d0102x3l10g.jpg','https://image.doba.com/dg-KEbwDrHOUYcM/d0102x3l1jv.jpg','https://image.doba.com/dg-zJqpVdQSlPco/d01027hh7bv.jpg','https://image.doba.com/dg-zoDEvlKWsJPQ/d0102x33esy.jpg','https://image.doba.com/dg-eRqkVZENCoJU/d0102x3l10u.jpg','https://image.doba.com/dg-StVaqvCSMYol/d0102x39f27.jpg','https://image.doba.com/dg-RiqmvzsmOoJt/d01027hriww.jpg','https://image.doba.com/dg-lvVjbTeWzJoD/d01027hh70v.jpg','https://image.doba.com/dg-duqeDbKUWJcn/d0102x39fga.jpg','https://image.doba.com/dg-IvVbDGCUhoPc/d0102x39f2y.jpg']);
          const acceptedPath='/assets/store/signature-tshirt-preview.webp';
          const accepted=(url)=>{if(knownDoba.has(url))return true;try{return new URL(url).pathname===acceptedPath}catch{return false}};
          const api=await fetch(base+'/api/store-products');
          if(!api.ok) throw new Error('store-products API '+api.status);
          const raw=await api.json();
          const rows=Array.isArray(raw)?raw:(raw.products||raw.items||raw.results||raw.data?.products||[]);
          const live=rows.find(p=>p&&(p.id||p.sku)&&String(p.publishStatus||p.publish_status||'published').toLowerCase()==='published');
          if(!live) throw new Error('No current published product for detail QA');
          const productId=String(live.id||live.sku);
          const section=String(live.storeSection||live.store_section||'').toLowerCase().includes('lithium')?'lithium':'rv';
          const routes=[['home','/'],['lithium','/lithium-batteries'],['sok-catalog','/sok-batteries'],['sok-12v','/sok/sk12v100pc/'],['sok-48v','/sok/sk48v100n/'],['sok-order','/sok-order.html?sku=SK12V100PC&intent=purchase_options'],['rv-store','/rv-store'],['hawaii','/hawaii-lithium-batteries'],['product',`/product?id=${encodeURIComponent(productId)}&store=${section}`],['checkout','/checkout/?source=apparel&id=black-and-gold-signature-t-shirt'],['apparel','/store']];
          const browser=await chromium.launch({headless:true});
          const viewports=[['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const report=[]; const acceptedHits=new Set();
          for(const [mode,viewport] of viewports){
            const context=await browser.newContext({viewport});
            for(const [name,path] of routes){
              const page=await context.newPage(); const failed=[];
              page.on('response',r=>{const t=r.request().resourceType();if(r.status()>=400&&['document','stylesheet','script','image'].includes(t)) failed.push({status:r.status(),type:t,url:r.url()})});
              const response=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});
              if(!response||response.status()!==200) throw new Error(`${mode} ${path} document ${response?.status()}`);
              await page.waitForTimeout(1800);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>3) throw new Error(`${mode} ${path} horizontal overflow ${overflow}px`);
              const badImages=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>{const s=getComputedStyle(i);return s.display!=='none'&&s.visibility!=='hidden'&&i.getBoundingClientRect().width>2&&(!i.complete||i.naturalWidth===0)}).map(i=>i.currentSrc||i.src||i.alt));
              for(const u of [...badImages,...failed.filter(x=>x.type==='image').map(x=>x.url)]) if(accepted(u)) acceptedHits.add(u);
              const newBad=badImages.filter(u=>!accepted(u));
              const newFailed=failed.filter(x=>!(x.type==='image'&&accepted(x.url)));
              if(newBad.length) throw new Error(`${mode} ${path} new broken images: ${newBad.join(' | ')}`);
              if(newFailed.length) throw new Error(`${mode} ${path} new broken assets: ${newFailed.map(x=>`${x.status} ${x.type} ${x.url}`).join(' | ')}`);
              const brand=page.locator('.eus-brand>img').first();
              if(await brand.count()){
                const mark=await brand.evaluate(el=>({content:getComputedStyle(el).content,objectFit:getComputedStyle(el).objectFit,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height}));
                if(name==='apparel'){
                  if(String(mark.content).includes('storefront-wordmark')) throw new Error(`${mode} /store wordmark leaked into Apparel`);
                }else{
                  if(!String(mark.content).includes('storefront-wordmark')) throw new Error(`${mode} ${path} storefront wordmark missing`);
                  if(mark.objectFit!=='contain') throw new Error(`${mode} ${path} wordmark object-fit=${mark.objectFit}`);
                  if(mark.w<120||mark.h<35||mark.h>100) throw new Error(`${mode} ${path} wordmark box ${mark.w}x${mark.h}`);
                }
              }
              if(name==='home'){
                if(!(await page.locator('.retail-hero').isVisible())) throw new Error(`${mode} homepage hero missing`);
                if(!(await page.locator('.retail-hero .button').first().isVisible())) throw new Error(`${mode} homepage CTA missing`);
              }
              if(name==='sok-order'&&(await page.locator('form input').count())<3) throw new Error(`${mode} SOK order fields missing`);
              if(name==='product'){
                const status=await page.locator('[data-product-status]').textContent().catch(()=>'');
                if(/unavailable|unable|error/i.test(String(status))) throw new Error(`${mode} product status ${status}`);
              }
              if(name==='checkout'){
                const status=await page.locator('#checkout-status').textContent().catch(()=>'');
                if(/item is unavailable|checkout item is unavailable/i.test(String(status))) throw new Error(`${mode} checkout status ${status}`);
              }
              if(mode==='mobile'){
                const toggle=page.locator('.eus-menu-toggle').first();
                if(await toggle.count()&&await toggle.isVisible()){
                  await toggle.click(); await page.waitForTimeout(150);
                  if((await toggle.getAttribute('aria-expanded'))!=='true') throw new Error(`mobile ${path} menu failed`);
                }
              }
              await page.screenshot({path:`visual-evidence/${name}-${mode}.png`,fullPage:true});
              report.push({mode,path,status:200,overflow,acceptedBaselineFailures:[...new Set([...badImages,...failed.map(x=>x.url)].filter(accepted))]});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-evidence/report.json',JSON.stringify({base,productId,section,acceptedBaselineHits:[...acceptedHits].sort(),report},null,2));
          console.log(`routes_verified=${report.length}`);
          console.log(`accepted_baseline_failure_urls=${acceptedHits.size}`);
          console.log('candidate_caused_broken_assets=0');
          console.log('desktop_mobile_visual=PASS');
          NODE
          node visual-smoke.mjs

      - name: Verify preview PayPal production-secret boundary
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "${BASE%/}/api/store-checkout/config" -o /tmp/config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/config.json'))
          assert d.get('ok') is True
          if d.get('environment') == 'live':
              assert d.get('checkoutEnabled') is False
              assert not d.get('clientId')
          print('preview_paypal_safety=PASS')
          print('preview_paypal_transaction=EXPECTED_NOT_VERIFIED')
          PY

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-0905-02-final-preview-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          echo '### WEB-VISUAL-0905-02 final preview gate — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Parent/current main: $PARENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate-caused broken assets: ZERO / PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '20 Doba failures: ACCEPTED PRE-EXISTING BASELINE / NON-REGRESSION VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel signature T-shirt image 404: ACCEPTED PRE-EXISTING BASELINE / NON-REGRESSION VERIFIED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop/mobile storefront visual regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview PayPal: expected not verified / production secret boundary preserved' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED by this workflow' >> "$GITHUB_STEP_SUMMARY"
