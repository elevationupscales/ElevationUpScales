name: Deploy RV Shop preview

on:
  push:
    branches:
      - store-rv-ebay-analytics-v3.11.27

permissions:
  contents: write
  deployments: write

jobs:
  preview:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check out Store release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)
      - name: Deploy isolated Cloudflare preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=rv-shop-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record preview
        shell: bash
        run: |
          echo "### RV Shop preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch alias: https://rv-shop-preview.elevationupscales.pages.dev" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove one-shot preview workflow
        shell: bash
        run: |
          rm -f .github/workflows/deploy-rv-shop-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Preview v3.11.27 RV Shop integration'
          git push origin HEAD:store-rv-ebay-analytics-v3.11.27
