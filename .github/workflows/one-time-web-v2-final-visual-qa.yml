name: One-time Web V2 owner recovery QA
# Owner hard gate: recovery QA only. No merge, candidate, deployment, production pointer, or Legacy action.
on:
  push:
    branches:
      - work/web-v2-owner-recovery-e0db198-2026-09-14
    paths:
      - .github/workflows/one-time-web-v2-final-visual-qa.yml
      - apps/web-v2/src/sok-product-merchandising-styles.js
      - apps/web-v2/src/final-visual-styles.js
      - apps/web-v2/test/owner-recovery-hero.test.mjs
      - apps/web-v2/public/assets/hero/store-rv-solar-technician-clean.webp
      - apps/web-v2/public/assets/hero/.store-hero-chunk-*.txt
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-owner-recovery-e0db198-2026-09-14
      - name: Materialize owner-reviewed clean store hero asset
        shell: bash
        run: |
          set -euo pipefail
          hero_dir="apps/web-v2/public/assets/hero"
          target="$hero_dir/store-rv-solar-technician-clean.webp"
          if test -f "$hero_dir/.store-hero-chunk-00.txt"; then
            cat "$hero_dir"/.store-hero-chunk-{00..09}.txt | tr -d '[:space:]' | sed 's/=$//' | base64 --decode > "$target"
            file "$target" | grep -q 'Web/P image'
            test "$(stat -c%s "$target")" -eq 59364
            echo '975dbe4e50f6d1535b58ff2f4bd7310fcc640b9964064a1c1a831fb408b20287  '"$target" | sha256sum -c -
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$target"
            git rm -f "$hero_dir"/.store-hero-chunk-{00..09}.txt
            git rm -f --ignore-unmatch "$hero_dir/store-rv-solar-technician-clean.webp.b64"
            git commit -m "Web V2 recovery: materialize owner-reviewed clean store hero"
            git push origin HEAD:work/web-v2-owner-recovery-e0db198-2026-09-14
          fi
          file "$target" | grep -q 'Web/P image'
          test "$(stat -c%s "$target")" -eq 59364
          echo '975dbe4e50f6d1535b58ff2f4bd7310fcc640b9964064a1c1a831fb408b20287  '"$target" | sha256sum -c -
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - run: npm ci --ignore-scripts --prefix apps/web-v2
      - name: Run Web V2 tests
        run: npm --prefix apps/web-v2 test
      - name: Start local Worker
        shell: bash
        run: |
          cd apps/web-v2
          npx -y wrangler@4.131.1 dev --local --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for i in {1..45}; do curl -fsS http://127.0.0.1:8787/healthz >/dev/null && exit 0; sleep 1; done
          cat /tmp/wrangler.log
          exit 1
      - name: Capture owner-review desktop/mobile screenshots
        shell: bash
        run: |
          npx -y playwright@1.55.0 install --with-deps chromium
          mkdir -p visual-qa
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1536,960" --full-page http://127.0.0.1:8787/ visual-qa/home-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:8787/ visual-qa/home-mobile.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="1536,960" --full-page http://127.0.0.1:8787/store visual-qa/store-desktop.png
          npx -y playwright@1.55.0 screenshot --browser chromium --viewport-size="390,844" --full-page http://127.0.0.1:8787/store visual-qa/store-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: web-v2-e0db198-recovery-qa
          path: visual-qa/*.png
          if-no-files-found: error
