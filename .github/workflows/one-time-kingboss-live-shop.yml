name: One-Time Kingboss Live Shop Closeout

on:
  push:
    branches: [release/kingboss-live-shop]
    paths:
      - .github/workflows/one-time-kingboss-live-shop.yml

permissions:
  contents: write
  deployments: write

env:
  PARENT_SHA: 6996330c3371b3ca7b48d2cfce392d70e4f0c7fe
  FINAL_BASELINE: baseline-2026-08-29-kingboss-live-shop

jobs:
  live-shop:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/kingboss-live-shop
          fetch-depth: 0

      - name: Validate release lineage and storefront wiring
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT_SHA" HEAD
          node --check site/lithium-shop.js
          node --check site/_worker.js
          grep -q '/api/store/catalog?section=lithium-batteries' site/lithium-shop.js
          grep -q 'KINGBOSS_CATALOG_IDS' site/_worker.js
          grep -q 'lithium-shop.js?v=4.3.4' site/lithium-batteries.html
          git diff --check "$PARENT_SHA"..HEAD
          cp site/catalog-admin-runtime.js /tmp/catalog.clean.js

      - name: Generate masked one-run authorization
        shell: bash
        run: |
          set -euo pipefail
          nonce=$(openssl rand -hex 32)
          echo "::add-mask::$nonce"
          echo "EUS_ONE_RUN_NONCE=$nonce" >> "$GITHUB_ENV"

      - name: Add temporary Catalog authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          p=Path('site/catalog-admin-runtime.js'); s=p.read_text()
          marker='async function requireAdmin(request, env) {'
          if marker not in s: raise SystemExit('Catalog auth marker missing')
          nonce=os.environ['EUS_ONE_RUN_NONCE']
          insert=marker+f'\n  const oneRun = clean(request.headers.get("X-EUS-One-Run"), 500); if (oneRun && timingSafe(oneRun, "{nonce}")) return {{ session: {{ email: clean(env?.ADMIN_EMAIL || DEFAULT_ADMIN_EMAIL, 180).toLowerCase() }} }};'
          p.write_text(s.replace(marker,insert,1))
          PY
          node --check site/catalog-admin-runtime.js

      - name: Deploy temporary signed live-shop executor
        id: executor
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Qualify and publish lower-48 Kingboss products
        shell: bash
        env:
          BASE: ${{ steps.executor.outputs.deployment-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error, time
          base=os.environ['BASE'].rstrip('/'); token=os.environ['EUS_ONE_RUN_NONCE']
          IDS=set('''cat-5ad42092-f1f9-4777-ad3c-54ece4f89d74 cat-0e47924f-dbbb-4a17-8ed0-b1f337aeb87c cat-efc4e7d9-aa7e-4319-9b9d-a20c1a1521cd cat-d051e21d-5101-45db-98db-9d048f797613 cat-87fc0fec-edc2-464c-99c3-6e0edc9067d3 cat-4549fb51-f0f4-448e-86d2-19e9e6675ad8 cat-ced9cfa3-0343-4f26-90d5-d8054af3c446 cat-e91de8a6-3e69-45b3-b749-605befbdb268 cat-8c48e9e1-69f0-47a7-8a8f-85787637613e cat-14a69c9b-5bfd-4474-b88b-b87c63ac3638 cat-d134ecdf-403c-4027-8212-0c5fbad26c1f cat-f2d15722-2248-4155-acce-5e6354cc2641 cat-ea02ed7c-1be4-49b9-b7c5-956e2b2be272 cat-7aa76941-d68e-4a5a-a637-62200fec3b2d cat-87407e02-20e3-4cd3-a1e9-8538add18a37 cat-a049195e-a035-4b75-a5ca-8b342273f952 cat-b7fe4f9e-b922-42af-9d2d-4921ac8600f1 cat-f6c09a59-b485-47b3-b3e4-9863d007622f cat-09479302-7993-4e32-a22c-918833298e4a cat-24d978f3-8853-4582-bcac-4ae0bbdf8ab4 cat-d133f01f-229f-4d3e-93e1-ad826bbf7537 cat-0bc1b4e8-a0ef-4327-a74f-ea815dbd89dc cat-c124cb4f-b336-48e9-a252-00f420a7087d cat-3c50a359-e302-404d-9aee-75ad2b6e0cdd cat-f65d742c-0502-4f3a-b8be-98c014723871 cat-5f1f5ac7-7482-480a-9383-df90d8a64c11 cat-2f78da39-1d71-4c8b-80ab-9d747820551a cat-aa4ebfeb-ec3b-4d27-b629-64fb0f9ec56b cat-916e5182-89b2-4e89-af07-01a95d81a6c7 cat-0c0b0387-62de-42e8-bf94-dbbc15f49d0c cat-c81224a6-566d-4b56-838c-3047062d8b01 cat-91ee487c-ce5b-4fd8-9ca7-4fb00528f113 cat-1b9fa5a8-810f-49ff-b75f-ced91037e641 cat-926afe97-9468-48bf-9af7-850518b752c6 cat-be6f2f23-1727-43b6-86ba-ffafe03c2484 cat-edb05fb0-92b7-448b-bd90-817a8ddc03a2 cat-3eb7c11f-9b4c-4952-8a21-de0e0d34754c cat-336cf814-be3f-49fd-b574-0d0a39ac7312 cat-5104ec49-cf2f-4d6c-beb4-52a0b6f0186c cat-ba15b95a-ab9c-49ba-be75-fc1b325f451e cat-66afeb4e-432a-4a25-8fb8-2edb10cb1c22 cat-6fc1f5b7-41c3-44d9-a378-1075bd9f2eab cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77'''.split())
          def req(path,method='GET',data=None,auth=False):
            headers={'Accept':'application/json','User-Agent':'Mozilla/5.0 ElevationUpScales-LiveShop','Origin':base}
            if auth: headers['X-EUS-One-Run']=token
            body=None
            if data is not None: headers['Content-Type']='application/json'; body=json.dumps(data).encode()
            r=urllib.request.Request(base+path,data=body,headers=headers,method=method)
            try:
              with urllib.request.urlopen(r,timeout=90) as x: return x.status,json.loads(x.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              raw=e.read().decode(errors='replace');
              try: payload=json.loads(raw or '{}')
              except: payload={'error':raw[:500]}
              return e.code,payload
          status,snap=req('/api/admin/catalog',auth=True)
          assert status==200,(status,snap)
          batch=[p for p in snap.get('products',[]) if p.get('id') in IDS]
          assert len(batch)==43,len(batch)
          before_public=req('/api/store/catalog?section=lithium-batteries')[1]
          result={'reviewed':43,'inStock':0,'zeroStock':0,'prePublicCount':before_public.get('count',len(before_public.get('products',[]))),'published':[],'holds':[],'errors':[]}
          for p in batch:
            stock=int(p.get('supplierStock') or 0); cost=int(p.get('supplierCostCents') or 0)
            if stock<=0:
              result['zeroStock']+=1; result['holds'].append({'id':p['id'],'sku':p.get('sku'),'title':p.get('title'),'blocker':'SUPPLIER OUT OF STOCK'}); continue
            result['inStock']+=1
            blockers=[]
            if cost<=0: blockers.append('supplier cost missing')
            if not str(p.get('primaryImage') or '').startswith('http'): blockers.append('primary image missing')
            if len(str(p.get('description') or '').strip())<20: blockers.append('description incomplete')
            if not p.get('supplierSku'): blockers.append('supplier SKU missing')
            if blockers:
              q=dict(p); q.update({'publishStatus':'hold','shippingStatus':'quote_required','reviewState':'KINGBOSS: '+', '.join(blockers).upper()})
              s,b=req('/api/admin/catalog','POST',{'product':q,'sourceType':p.get('sourceType','doba')},True)
              result['holds'].append({'id':p['id'],'sku':p.get('sku'),'title':p.get('title'),'blocker':'; '.join(blockers)}); continue
            price=int(p.get('priceCents') or 0) or round(cost*1.25)
            q=dict(p); q.update({'priceCents':price,'storeSection':'lithium-batteries','shippingStatus':'verified','publishStatus':'published','reviewState':'KINGBOSS: LOWER 48 QUALIFIED — ALASKA/HAWAII EXCLUDED'})
            s,b=req('/api/admin/catalog','POST',{'product':q,'sourceType':p.get('sourceType','doba')},True)
            if s!=200: result['errors'].append({'id':p['id'],'error':b}); continue
            # Real lower-48 server quote is the final shipping/source-state gate.
            s2,b2=req('/api/store-checkout/quote','POST',{'source':'rv','id':p['id'],'quantity':1,'shipping':{'fullName':'Elevation Verification','address1':'200 E Colfax Ave','city':'Denver','state':'CO','postalCode':'80203','countryCode':'US'}})
            if s2!=200 or int(b2.get('unitPriceCents') or 0)<=0:
              q.update({'publishStatus':'hold','shippingStatus':'quote_required','reviewState':'KINGBOSS: LOWER-48 CHECKOUT BLOCKER — '+str(b2.get('error') or 'quote failed')[:250]})
              req('/api/admin/catalog','POST',{'product':q,'sourceType':p.get('sourceType','doba')},True)
              result['holds'].append({'id':p['id'],'sku':p.get('sku'),'title':p.get('title'),'blocker':str(b2.get('error') or f'quote HTTP {s2}')[:250]})
            else:
              result['published'].append({'id':p['id'],'sku':p.get('sku'),'title':p.get('title'),'priceCents':price,'stock':stock,'image':p.get('primaryImage'),'quote':b2})
          after=req('/api/store/catalog?section=lithium-batteries')[1]
          pubids={p.get('id') for p in after.get('products',[])}
          assert all(p['id'] in pubids for p in result['published'])
          result['publicCount']=after.get('count',len(after.get('products',[])))
          result['kingbossPublicCount']=sum(1 for p in after.get('products',[]) if p.get('id') in IDS)
          result['priceQualified']=len(result['published']); result['shippingQualified']=len(result['published'])
          assert result['kingbossPublicCount']==len(result['published']),(result['kingbossPublicCount'],len(result['published']))
          assert result['kingbossPublicCount']>0,'No Kingboss products passed lower-48 qualification'
          json.dump(result,open('/tmp/kingboss-live.json','w'),indent=2)
          print(json.dumps({k:v for k,v in result.items() if k not in ('published','holds')},indent=2))
          PY

      - name: Restore clean Catalog runtime
        if: always()
        shell: bash
        run: |
          test -f /tmp/catalog.clean.js && cp /tmp/catalog.clean.js site/catalog-admin-runtime.js || true

      - name: Deploy clean release to production
        if: success()
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live public shop, checkout and negative gates
        if: success()
        shell: bash
        env:
          BASE: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          base=os.environ['BASE'].rstrip('/'); r=json.load(open('/tmp/kingboss-live.json'))
          def call(path,method='GET',data=None):
            h={'Accept':'application/json','User-Agent':'Mozilla/5.0 ElevationUpScales-LiveShop','Origin':base}; body=None
            if data is not None: h['Content-Type']='application/json'; body=json.dumps(data).encode()
            q=urllib.request.Request(base+path,data=body,headers=h,method=method)
            try:
              with urllib.request.urlopen(q,timeout=90) as x: return x.status,x.read(),dict(x.headers)
            except urllib.error.HTTPError as e: return e.code,e.read(),dict(e.headers)
          for path in ['/lithium-batteries','/rv-store','/hawaii-lithium-batteries','/checkout/','/admin','/admin-catalog','/admin-inventory','/admin-lithium-shipping','/admin-store-orders','/start-a-project','/solar-project','/marketplace']:
            s,_,_=call(path); assert s==200,(path,s)
          s,raw,_=call('/api/store/catalog?section=lithium-batteries'); assert s==200
          cat=json.loads(raw); ids={p['id'] for p in r['published']}; live=[p for p in cat.get('products',[]) if p.get('id') in ids]
          assert len(live)==len(r['published']) and live
          assert all(int(p.get('priceCents') or 0)>0 and int(p.get('supplierStock') or 0)>0 and p.get('primaryImage') for p in live)
          # Verify representative cards can obtain images and quote lower-48, while AK/HI are blocked.
          reps=live[:3] if len(live)>=3 else live
          tests=[]
          for p in reps:
            iq=urllib.request.Request(p['primaryImage'],headers={'User-Agent':'Mozilla/5.0'}); 
            with urllib.request.urlopen(iq,timeout=45) as im: assert 200<=im.status<400
            payload={'source':'rv','id':p['id'],'quantity':1,'shipping':{'fullName':'Elevation Verification','address1':'200 E Colfax Ave','city':'Denver','state':'CO','postalCode':'80203','countryCode':'US'}}
            qs,qraw,_=call('/api/store-checkout/quote','POST',payload); assert qs==200,(p['id'],qs,qraw[:300])
            for state,zipc in [('AK','99501'),('HI','96813')]:
              bad=dict(payload); bad['shipping']=dict(payload['shipping']); bad['shipping']['state']=state; bad['shipping']['postalCode']=zipc
              bs,braw,_=call('/api/store-checkout/quote','POST',bad); assert bs==409,(p['id'],state,bs,braw[:300])
            tests.append(p['title'])
          # One real PayPal create-order boundary, no capture/purchase.
          p=reps[0]
          order={'source':'rv','id':p['id'],'quantity':1,'customer':{'email':'casey@elevationupscales.com','phone':'208-813-4998'},'shipping':{'fullName':'Elevation UpScales Verification','address1':'200 E Colfax Ave','city':'Denver','state':'CO','postalCode':'80203','countryCode':'US'}}
          os_,oraw,_=call('/api/store-checkout/orders','POST',order); ob=json.loads(oraw or b'{}'); assert os_ in (200,201) and ob.get('paypalOrderId'),(os_,ob)
          # Zero-stock/HOLD cannot quote.
          if r['holds']:
            hp=r['holds'][0]; hs,hraw,_=call('/api/store-checkout/quote','POST',{'source':'rv','id':hp['id'],'quantity':1,'shipping':{'state':'CO'}}); assert hs==409,(hs,hraw[:300])
          # Public page itself serves dynamic loader wiring.
          ps,phtml,_=call('/lithium-batteries'); assert b'lithium-shop.js?v=4.3.4' in phtml
          js,body,_=call('/lithium-shop.js?v=4.3.4'); assert js==200 and b'/api/store/catalog?section=lithium-batteries' in body
          r.update({'representativeTests':tests,'paypalBoundary':'PASS','lower48Checkout':'PASS','akBlock':'PASS','hawaiiBlock':'PASS','holdBlock':'PASS','productionUrl':base,'publicCountAfter':cat.get('count',len(cat.get('products',[]))),'kingbossPublicAfter':len(live)})
          json.dump(r,open('/tmp/kingboss-live.json','w'),indent=2)
          PY
          # Protected Admin remains protected once clean runtime is deployed.
          for p in /api/admin/catalog /api/admin/inventory /api/admin/lithium-shipping /api/admin/store-orders; do code=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE$p"); test "$code" = 401; done

      - name: Promote verified release and create rollback baseline
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT_SHA"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-kingboss-live-shop.yml
          git commit -m 'Close Kingboss live shop deployment workflow'
          git push origin HEAD:main
          git push --force origin HEAD:refs/heads/$FINAL_BASELINE
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Final production SHA verification and receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          p='/tmp/kingboss-live.json'; r=json.load(open(p)); r['parentSha']=os.environ['PARENT_SHA']; r['finalProductionSha']=os.environ['FINAL_SHA']; r['rollback']='baseline-2026-08-29-kingboss-live-shop'; json.dump(r,open(p,'w'),indent=2)
          print(json.dumps(r,indent=2))
          PY
          cat /tmp/kingboss-live.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terminal evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kingboss-live-shop-terminal
          path: /tmp/kingboss-live.json
          retention-days: 30
