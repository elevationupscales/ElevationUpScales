name: One-Time Phase 3 Admin Production

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  deploy-phase3-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out current production source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate Phase 3 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c69093f0728c790c0dbbbfdbc9288ac3eba6698d HEAD
          for f in site/admin.html site/admin-command-center.js site/admin-command-center.css site/admin-overview.js site/admin-analytics.html site/admin-analytics-v2.js site/admin-channels.html site/admin-channels.js site/admin-catalog.html site/admin-catalog.js site/catalog-admin-runtime.js site/_worker.js; do test -f "$f"; done
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/admin-analytics-v2.js
          node --check site/admin-channels.js
          node --check site/admin-catalog.js
          node --check site/catalog-admin-runtime.js
          node --check site/_worker.js
          grep -q 'Admin Command Center' site/admin.html
          grep -q 'TikTok Shop' site/admin-catalog.html
          grep -q 'ADMIN_COMMAND_CENTER_LOADER' site/_worker.js
          grep -q '/admin.html /admin 301' site/_redirects
          for file in site/solar-project.html site/solar-project/index.html; do
            grep -q 'Elevation reviews final fit, protection, and pricing.' "$file"
            ! grep -q 'Casey verifies final fit, protection, and pricing.' "$file"
          done
          ! grep -Eqi 'Lithium Batteries Shipped to Hawaii|Qualification in Progress|Hawaii Shipping Qualification in Progress|DOT approved|hazmat approved|carrier approved|ships anywhere|free Hawaii shipping' site/hawaii-lithium-batteries.html site/lithium-batteries.html
      - name: Deploy Phase 3 to Cloudflare production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify production routes and security boundaries
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          verify_base(){
            base="${1%/}"
            for route in / /store /rv-store /checkout /start-a-project /marketplace /solar-project /lithium-batteries /hawaii-lithium-batteries /admin /admin-listings /admin-catalog /admin-inventory /admin-store-orders /admin-lithium-shipping /admin-analytics /admin-channels /admin-command-center.js /admin-command-center.css; do
              code=$(curl --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-smoke --write-out '%{http_code}' "${base}${route}" || true)
              echo "${base}${route} -> ${code:-curl-error}"
              test "$code" = "200"
            done
            admin=$(curl --silent --show-error --location --retry 5 --retry-all-errors "${base}/admin")
            analytics=$(curl --silent --show-error --location --retry 5 --retry-all-errors "${base}/admin-analytics")
            channels=$(curl --silent --show-error --location --retry 5 --retry-all-errors "${base}/admin-channels")
            catalog=$(curl --silent --show-error --location --retry 5 --retry-all-errors "${base}/admin-catalog")
            hawaii=$(curl --silent --show-error --location --retry 5 --retry-all-errors "${base}/hawaii-lithium-batteries")
            printf '%s' "$admin" | grep -q 'Admin Command Center'
            printf '%s' "$analytics" | grep -q 'Business Analytics'
            printf '%s' "$channels" | grep -q 'Channels / Stores'
            printf '%s' "$catalog" | grep -q 'TikTok Shop'
            printf '%s' "$hawaii" | grep -q 'COMING SOON'
            if printf '%s' "$hawaii" | grep -Eqi 'Lithium Batteries Shipped to Hawaii|Qualification in Progress|Hawaii Shipping Qualification in Progress|DOT approved|hazmat approved|carrier approved|ships anywhere|free Hawaii shipping'; then exit 1; fi
            session_code=$(curl --silent --output /tmp/session.json --write-out '%{http_code}' "${base}/api/admin/session" || true)
            test "$session_code" = "200"
            for api in /api/admin/store-orders /api/admin/catalog /api/admin/inventory /api/admin/opportunities /api/admin/lithium-shipping; do
              code=$(curl --silent --output /tmp/protected.json --write-out '%{http_code}' "${base}${api}" || true)
              echo "protected ${api} -> ${code}"
              test "$code" = "401"
            done
            checkout_code=$(curl --silent --output /tmp/checkout-config.json --write-out '%{http_code}' "${base}/api/store-checkout/config" || true)
            test "$checkout_code" = "200"
          }
          if ! verify_base "$DEPLOYMENT_URL"; then sleep 8; verify_base "$PRODUCTION_URL"; fi
      - name: Record Phase 3 production receipt
        shell: bash
        run: |
          {
            echo '### Elevation Admin Phase 3 production'
            echo "Source: $(git rev-parse HEAD)"
            echo 'Admin seller/fulfillment shell: PASS'
            echo 'Analytics + Channels: PASS'
            echo 'Protected API unauthenticated boundaries: PASS'
            echo 'Store / Marketplace / Solar / Hawaii regression routes: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove one-time Phase 3 production workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-phase3-production.yml
          git commit -m 'Remove completed Phase 3 production workflow'
          git push origin HEAD:main
