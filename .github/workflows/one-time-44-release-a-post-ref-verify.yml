name: One-Time Elevation 4.4 Release A Post-Ref Verify

on:
  push:
    branches: [deploy/4.4-release-a-production-gate-2026-08-31]
    paths:
      - .github/workflows/one-time-44-release-a-post-ref-verify.yml

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 964494bcd2608ed14192e2ed001f1ea611f05aae
  CANONICAL_BASE: https://elevationupscales.com

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository production source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Verify main and canonical storefront alignment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          base="${CANONICAL_BASE%/}"
          stamp="post-ref-$EXPECTED_MAIN_SHA"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o /tmp/page.html -w '%{http_code}' "$base$route?release=$stamp")
            echo "$route=$code"; test "$code" = "200"
          done
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping; do
            code=$(curl -sS --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/admin.json -w '%{http_code}' "$base$api" || true)
            echo "$api=$code"; test "$code" = "401"
          done
          curl -sS -L --fail -H 'Cache-Control: no-cache' "$base/lithium-batteries?release=$stamp" -o /tmp/lithium.html
          curl -sS -L --fail -H 'Cache-Control: no-cache' "$base/rv-store?release=$stamp" -o /tmp/rv.html
          curl -sS -L --fail "$base/api/store/catalog?section=lithium-batteries" -H 'Accept: application/json' -o /tmp/lithium.json
          curl -sS -L --fail "$base/api/store-catalog?section=rv-outdoor" -H 'Accept: application/json' -o /tmp/rv.json
          curl -sS -L --fail "$base/api/store-checkout/config" -o /tmp/checkout.json
          python - <<'PY'
          import json,re
          checkout=json.load(open('/tmp/checkout.json'))
          assert checkout.get('configured') is True, checkout
          assert checkout.get('credentialsConfigured') is True, checkout
          assert checkout.get('checkoutEnabled') is True, checkout
          assert checkout.get('liveCheckoutApproved') is True, checkout
          assert checkout.get('environment') == 'live', checkout
          def rows(path, section):
              data=json.load(open(path)); out=[]
              for p in data.get('products',[]):
                  status=str(p.get('publishStatus') or '').strip().lower()
                  if status and status!='published': continue
                  try: price=float(p.get('priceCents') or 0)
                  except: price=0
                  if price<=0: continue
                  stock=p.get('supplierStock')
                  try:
                      if stock is not None and float(stock)<=0: continue
                  except: pass
                  if section=='rv' and str(p.get('shippingStatus') or '').strip().lower()=='unverified': continue
                  out.append(p)
              return out
          lithium=rows('/tmp/lithium.json','lithium'); rv=rows('/tmp/rv.json','rv')
          lh=open('/tmp/lithium.html').read(); rh=open('/tmp/rv.html').read()
          assert 'data-lithium-search' in lh and 'data-lithium-sort' in lh
          assert 'data-prerendered="true"' in lh and 'data-prerendered="true"' in rh
          lm=re.search(r'<strong data-lithium-count>(\d+)</strong>',lh); rm=re.search(r'<span id="rv-count">(\d+)</span>',rh)
          assert lm and int(lm.group(1))==len(lithium)
          assert rm and int(rm.group(1))==len(rv)
          assert len(lithium)==38,(len(lithium),)
          assert len(rv)==19,(len(rv),)
          print({'main':'aligned','lithium':len(lithium),'rv':len(rv),'checkout':'live-approved'})
          PY
