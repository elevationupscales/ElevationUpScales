name: Temporary PayPal live proof board sync

on:
  push:
    branches:
      - ops/paypal-live-proof-board-sync-0911

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/paypal-live-proof-board-sync-0911
      - name: Reconcile canonical board and write acceptance receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          board = Path('operations/CURRENT_WORK_BOARD.md')
          text = board.read_text()
          original = text

          old_baseline = '**Last source-state reconciliation baseline:** `18b8d752278faf2d73e8d309a66d855b1a0ffe54`'
          new_baseline = '**Last source-state reconciliation baseline:** `3aed2c99ef751882c298362b4c2596bf38a2117f`'
          if old_baseline not in text:
              raise SystemExit('Expected reconciliation baseline not found')
          text = text.replace(old_baseline, new_baseline, 1)

          lines = text.splitlines()
          counts = {'p0':0, 'renogy_index':0, 'renogy_active':0, 'universal':0}
          out = []
          for line in lines:
              if line.startswith('| Shopify first-sale acceleration + PayPal cart integration |'):
                  counts['p0'] += 1
                  line = '| Shopify first-sale acceleration + PayPal cart integration | **Operating System Project Manager / Company Operations**; MASTER DEVELOPER + Shopify/Ecommerce execution; vendor managers supply verified SKU facts | ACTIVE — NATIVE SHOPIFY CHECKOUT LIVE / CUSTOM PAYPAL LIVE / FIRST REAL PAYPAL ORDER OPEN | **P0 OWNER DIRECTED / #1 COMPANY PRIORITY** | Shopify password gate is CLOSED and native Shopify payment-entry checkout remains live. Custom Elevation PayPal production acceptance is now proven at `3aed2c99ef751882c298362b4c2596bf38a2117f`: LIVE PayPal credentials are configured, live checkout is approved/enabled, canonical SOK quote returns HTTP 200, PayPal SDK/button render is confirmed, and malicious or missing-Origin POSTs remain denied with 403. No synthetic paid transaction will be manufactured; the remaining external trigger is the first real paid PayPal order and downstream fulfillment receipt. | Keep both working payment paths live. Move first-real-order proof to the back as an external event. Route vendor managers to return the first 5–10 low-friction, margin-safe, supplier-verified promotion candidates with fresh SKU/price/MAP/sellability/fulfillment checks; push free/owned traffic only to proven buy paths. On the first PayPal order, reverify exact SKU/source, confirm capture and durable order persistence, route fulfillment, and record the receipt. Keep PayPal SDK v6 as a later improvement unless the currently working v5 path develops a live defect. | Repeatable direct-site cart/checkout/order-routing path is proven **and** first verified Elevation website PayPal order is received and routed to fulfillment, closing the current startup-revenue phase | `PAYPAL_CART_INTEGRATION_REVENUE_DIRECTIVE_2026-09-11.md`; `STARTUP_REVENUE_PHASE_NONBLOCKING_ORDER_STANDARD_2026-09-11.md`; `PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md`; Shopify live QA 2026-09-11 |'
              elif line.startswith('| Renogy Dealer / Catalog / Commerce Integration |'):
                  counts['renogy_index'] += 1
                  line = line.replace('SALES-FIRST CATALOG ACTIVATION ACTIVE / zero live Renogy Shopify products at recon', 'SALES-FIRST CATALOG ACTIVATION ACTIVE / 5 Shopify DRAFT products staged / activation gates open')
              elif line.startswith('| Renogy sales-first catalog / live commerce activation |'):
                  counts['renogy_active'] += 1
                  line = line.replace('ZERO LIVE RENOGY PRODUCTS AT RECON', '5 SHOPIFY DRAFTS STAGED / ACTIVATION GATES OPEN')
              elif line.startswith('| Universal catalog live vendor integration acceptance |'):
                  counts['universal'] += 1
                  line = line.replace('Renogy had zero Shopify products at sales-first recon', 'Renogy has 5 Shopify DRAFT products staged with per-SKU activation gates still open')
              out.append(line)

          if counts != {'p0':1, 'renogy_index':1, 'renogy_active':1, 'universal':1}:
              raise SystemExit(f'Unexpected board row counts: {counts}')

          text = '\n'.join(out) + ('\n' if original.endswith('\n') else '')
          closed_marker = '# CLOSED / PROTECTED FROM RECREATION'
          closed_note = '- Custom Elevation PayPal checkout origin/quote blocker — CLOSED by PR #128 and production run #39 at `3aed2c99ef751882c298362b4c2596bf38a2117f`; canonical quote, LIVE configuration, and PayPal button render are proven. Do not recreate this technical blocker. The remaining proof is the first real paid order through capture, durable order record, and fulfillment routing.'
          if closed_note not in text:
              if closed_marker not in text:
                  raise SystemExit('Closed section marker missing')
              text = text.replace(closed_marker, closed_marker + '\n\n' + closed_note, 1)

          board.write_text(text)

          receipt = Path('operations/PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md')
          receipt.write_text('''# Elevation UpScales — PayPal Direct Checkout Live Acceptance Receipt\n\n**Date:** 2026-09-11 MDT  \n**Owner:** Casey Young  \n**Lane:** Operating System / Company Operations / Commerce  \n**Status:** TECHNICALLY LIVE / FIRST REAL PAID ORDER PROOF OPEN\n\n## Accepted production state\n\n- Current accepted production source: `3aed2c99ef751882c298362b4c2596bf38a2117f`.\n- PR #128 repaired the canonical Elevation checkout Origin validation without opening cross-origin POST access.\n- Production deploy workflow run `34660573945` / run #39 completed successfully: canonical QA, repository credential scan, Cloudflare deployment, deployed-application smoke, canonical-domain smoke, and receipt all passed.\n- Public checkout configuration reports PayPal environment `live`, credentials configured, checkout enabled, live checkout approved, and a browser client ID available.\n- Canonical SOK test quote `sok-sk12v100pc` returns HTTP 200 with product `SOK SK12V100PC 12.8V 100Ah 1280Wh LiFePO4 Battery`, quantity 1, unit price 31900 cents, shipping 0 cents, total 31900 cents.\n- Canonical Elevation Origin POST is accepted. An arbitrary external Origin and a missing Origin both remain rejected with HTTP 403.\n- GitHub-hosted headless Chrome reached the live checkout, rendered the exact SOK product, reached `Secure PayPal checkout ready.`, and found PayPal button/frame render evidence.\n- Native Shopify checkout remains a separate working payment path and was not disabled or replaced by this repair.\n\n## What is not being fabricated\n\nNo synthetic live payment will be created merely to manufacture an order receipt. The remaining acceptance event is the first real paid Elevation website PayPal transaction.\n\nOn that first real order, execute:\n\n**PAYMENT CAPTURE → DURABLE ELEVATION ORDER RECORD → EXACT SKU/SOURCE REVERIFY → SUPPLIER PURCHASE/ACCEPTANCE → TRACKING → DELIVERY → RECEIPT**\n\nAbsence of the first order is an external-event gate only. It does not block promotion-candidate verification, catalog work, traffic preparation, or the working Shopify payment path.\n\n## Next executable P0 work\n\nRoute vendor managers to return the first 5–10 low-friction, margin-safe, supplier-verified products for promotion. Each candidate must be freshly checked for exact SKU, current customer price/MAP, sellability, fulfillment path, and channel readiness before traffic is pushed.\n\nThe current PayPal browser SDK path is working in production. Do not perform an SDK migration merely to create work; treat a v6 migration as a later improvement unless the live v5 path develops a defect or a new capability requires it.\n''')
          PY
          rm .github/workflows/tmp-paypal-live-proof-board-sync.yml
          git diff --check
          git status --short
          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add operations/CURRENT_WORK_BOARD.md operations/PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md .github/workflows/tmp-paypal-live-proof-board-sync.yml
          git commit -m 'Ops: record live PayPal acceptance and reconcile board'
          git push origin HEAD:ops/paypal-live-proof-board-sync-0911
