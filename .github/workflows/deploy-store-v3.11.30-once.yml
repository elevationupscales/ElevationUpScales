name: Complete storefronts v3.11.35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-store-v3.11.30-once.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  complete-storefronts:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate protected systems and final RV catalog
        shell: bash
        run: |
          set -euo pipefail
          node --check site/rv-ebay-catalog.js
          node --check site/rv-store.js
          node --check site/store-patch-8.js
          grep -q 'Stage 1 of 7' site/solar-project.html
          grep -q 'data-jump="panels"' site/solar-project.html
          grep -q 'data-jump="services"' site/solar-project.html
          cmp -s site/solar-project.html site/solar-project/index.html
          grep -q '/start-a-project' site/index.html
          test -f site/marketplace.html
          grep -q 'rv-ebay-catalog.js?v=3.11.35' site/rv-store.html
          grep -q 'https://www.ebay.com/itm/' site/rv-ebay-catalog.js
          ! grep -q 'setInterval' site/rv-store.js
          ! grep -q '/api/store-inventory' site/rv-store.js
          python - <<'PY'
          import re
          from pathlib import Path
          text=Path('site/rv-ebay-catalog.js').read_text(encoding='utf-8')
          ids=re.findall(r'\["(\d{12})",', text)
          assert len(ids)==49, f'expected 49 eBay listings, got {len(ids)}'
          assert len(set(ids))==49, 'duplicate eBay listing numbers'
          print('ebay_verified=',len(ids))
          PY

      - name: Build real Seller Hub image asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets/store
          base64 -d site/rv-ebay-sprite-data.txt > site/assets/store/ebay49-sprite.webp
          test "$(wc -c < site/assets/store/ebay49-sprite.webp)" -gt 15000
          test "$(head -c 4 site/assets/store/ebay49-sprite.webp)" = 'RIFF'

      - name: Capture full Fourthwall catalog and install resilient fallback
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 \
            'https://aab79f09.elevationupscales.pages.dev/api/store-products?finalize=1' \
            -H 'Accept: application/json' -o /tmp/fourthwall.json; then
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 \
              'https://elevationupscales-shop.fourthwall.com/collections/all.json' \
              -H 'Accept: application/json' -o /tmp/fourthwall.json
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/fourthwall.json').read_text(encoding='utf-8'))
          if isinstance(data,list): products=data
          else:
              products=(data.get('products') or data.get('items') or data.get('results') or
                        (data.get('collection') or {}).get('products') or
                        (data.get('data') or {}).get('products') or [])
          assert isinstance(products,list), 'Fourthwall payload is not a product list'
          assert len(products)>=28, f'expected at least 28 Fourthwall products, got {len(products)}'
          Path('site/fourthwall-catalog-snapshot.json').write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f'count={len(products)}\n')
          print('fourthwall_products=',len(products))
          PY
          python - <<'PY'
          from pathlib import Path
          path=Path('site/store-patch-8.js')
          text=path.read_text(encoding='utf-8')
          snapshot='/fourthwall-catalog-snapshot.json?v=3.11.35'
          if snapshot not in text:
              start=text.index('/collections/all.json')
              anchor='      }\n    ];'
              pos=text.index(anchor,start)
              addition='''      },
      async () => {
        const response = await fetch("/fourthwall-catalog-snapshot.json?v=3.11.35", { headers: { Accept: "application/json" }, cache: "force-cache" });
        if (!response.ok) throw new Error(`Catalog snapshot returned ${response.status}`);
        return response.json();
      }
    ];'''
              text=text[:pos]+addition+text[pos+len(anchor):]
              path.write_text(text,encoding='utf-8')
          PY
          node --check site/store-patch-8.js
          grep -q '/fourthwall-catalog-snapshot.json?v=3.11.35' site/store-patch-8.js

      - name: Commit finalized source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          rm -f site/rv-ebay-sprite-data.txt site/rv-ebay-sprite.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A site/assets/store/ebay49-sprite.webp site/fourthwall-catalog-snapshot.json site/store-patch-8.js site/rv-ebay-sprite-data.txt site/rv-ebay-sprite.css
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize verified Fourthwall and eBay storefront catalogs'
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy completed source to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke all customer routes and storefront assets
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          for route in / /start-a-project /store /rv-store /marketplace; do
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL$route" > "/tmp$(echo "$route" | tr '/' '_').html"
          done
          grep -q 'Start a Project' /tmp_.html
          grep -q 'Elevation Apparel' /tmp_store.html
          grep -q 'VERIFIED EBAY CATALOG' /tmp_rv-store.html
          grep -q 'rv-ebay-catalog.js?v=3.11.35' /tmp_rv-store.html
          grep -q 'Marketplace' /tmp_marketplace.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-ebay-catalog.js?v=3.11.35" -o /tmp/ebay.js
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store.js?v=3.11.35" -o /tmp/rv.js
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/assets/store/ebay49-sprite.webp" -o /tmp/ebay.webp
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/fourthwall-catalog-snapshot.json?v=3.11.35" -o /tmp/snapshot.json
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-products?smoke=3.11.35" -o /tmp/live.json
          test "$(wc -c < /tmp/ebay.webp)" -gt 15000
          test "$(head -c 4 /tmp/ebay.webp)" = 'RIFF'
          ! grep -q 'setInterval' /tmp/rv.js
          ! grep -q '/api/store-inventory' /tmp/rv.js
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          ebay=Path('/tmp/ebay.js').read_text(encoding='utf-8')
          ids=re.findall(r'\["(\d{12})",',ebay)
          assert len(ids)==49 and len(set(ids))==49, f'eBay live count {len(ids)}'
          def count(path):
              data=json.loads(Path(path).read_text(encoding='utf-8'))
              if isinstance(data,list): return len(data)
              products=(data.get('products') or data.get('items') or data.get('results') or (data.get('collection') or {}).get('products') or (data.get('data') or {}).get('products') or [])
              return len(products)
          snapshot=count('/tmp/snapshot.json'); live=count('/tmp/live.json')
          assert snapshot>=28, f'snapshot count {snapshot}'
          assert live>=28, f'live Fourthwall count {live}'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'apparel={live}\n'); f.write('ebay=49\n')
          print('apparel=',live,'ebay=',len(ids))
          PY

      - name: Record v3.11.35 completion receipt
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p .github/deployments
          cat > .github/deployments/v3.11.35-storefront-complete.txt <<EOF
          build=3.11.35-storefront-complete
          source_commit=${{ steps.source.outputs.sha }}
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          apparel_catalog_count=${{ steps.smoke.outputs.apparel }}
          ebay_catalog_count=${{ steps.smoke.outputs.ebay }}
          ebay_images=Seller Hub thumbnails
          buy_links=direct eBay item URLs
          scroll_refresh=disabled
          status=success
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.35-storefront-complete.txt
          git commit -m 'Record v3.11.35 completed storefront deployment'
          git push origin HEAD:main
