name: Complete storefronts v3.11.35

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-store-v3.11.30-once.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate protected systems and completed storefront source
        shell: bash
        run: |
          set -euo pipefail
          node --check site/rv-ebay-catalog.js
          node --check site/rv-store.js
          node --check site/store-patch-8.js
          grep -q 'Stage 1 of 7' site/solar-project.html
          grep -q 'data-jump="panels"' site/solar-project.html
          grep -q 'data-jump="services"' site/solar-project.html
          cmp -s site/solar-project.html site/solar-project/index.html
          grep -q '/start-a-project' site/index.html
          test -f site/marketplace.html
          grep -q 'rv-ebay-catalog.js?v=3.11.35' site/rv-store.html
          grep -q 'SPRITE_DATA_PATH' site/rv-store.js
          ! grep -q 'setInterval' site/rv-store.js
          ! grep -q '/api/store-inventory' site/rv-store.js
          ebay_count=$(grep -oE '\["[0-9]{12}",' site/rv-ebay-catalog.js | wc -l)
          test "$ebay_count" -eq 49
          unique_count=$(grep -oE '\["[0-9]{12}",' site/rv-ebay-catalog.js | sort -u | wc -l)
          test "$unique_count" -eq 49
          base64 -d site/rv-ebay-sprite-data.txt > /tmp/ebay49.webp
          test "$(head -c 4 /tmp/ebay49.webp)" = 'RIFF'
          test "$(wc -c < /tmp/ebay49.webp)" -gt 15000

      - name: Deploy completed storefronts to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke customer routes and both storefront catalogs
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          for route in / /start-a-project /store /rv-store /marketplace; do
            curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL$route" > "/tmp$(echo "$route" | tr '/' '_').html"
          done
          grep -q 'Start a Project' /tmp_.html
          grep -q 'Elevation Apparel' /tmp_store.html
          grep -q 'VERIFIED EBAY CATALOG' /tmp_rv-store.html
          grep -q 'rv-ebay-catalog.js?v=3.11.35' /tmp_rv-store.html
          grep -q 'Marketplace' /tmp_marketplace.html

          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-ebay-catalog.js?v=3.11.35" -o /tmp/ebay.js
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store.js?v=3.11.35" -o /tmp/rv.js
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-ebay-sprite-data.txt?v=3.11.35" -o /tmp/sprite.txt
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-products?smoke=3.11.35" -o /tmp/apparel.json

          ebay_count=$(grep -oE '\["[0-9]{12}",' /tmp/ebay.js | wc -l)
          test "$ebay_count" -eq 49
          ! grep -q 'setInterval' /tmp/rv.js
          ! grep -q '/api/store-inventory' /tmp/rv.js
          base64 -d /tmp/sprite.txt > /tmp/live-sprite.webp
          test "$(head -c 4 /tmp/live-sprite.webp)" = 'RIFF'

          apparel_count=$(python -c 'import json; d=json.load(open("/tmp/apparel.json")); p=d if isinstance(d,list) else (d.get("products") or d.get("items") or d.get("results") or (d.get("collection") or {}).get("products") or (d.get("data") or {}).get("products") or []); print(len(p))')
          test "$apparel_count" -ge 28
          echo "apparel_count=$apparel_count" >> "$GITHUB_OUTPUT"
          echo "ebay_count=$ebay_count" >> "$GITHUB_OUTPUT"

      - name: Record completed storefront release
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p .github/deployments
          cat > .github/deployments/v3.11.35-storefront-complete.txt <<EOF
          build=3.11.35-storefront-complete
          source_commit=$(git rev-parse HEAD)
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          apparel_catalog_count=${{ steps.smoke.outputs.apparel_count }}
          ebay_catalog_count=${{ steps.smoke.outputs.ebay_count }}
          ebay_images=Seller Hub thumbnails
          buy_links=direct eBay item URLs
          scroll_refresh=disabled
          status=success
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.35-storefront-complete.txt
          git commit -m 'Record v3.11.35 completed storefront deployment'
          git push origin HEAD:main
