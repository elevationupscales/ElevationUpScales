name: One-Time Authorized Doba 5188501 Launch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-doba-5188501-authorized-main.yml

permissions:
  contents: write

env:
  SOURCE_SHA256: cdf7b0a1695eaa267161fde529bef6c4725477d2e354fe374ecd29c0ed9ad08a
  SOURCE_BYTES: "874962"
  SOURCE_ROWS: "134"
  SOURCE_COLUMNS: "163"
  SOURCE_FILENAME: US_Dropshipping_Product_Data_with_25%_Markup_20260829_5188501.csv
  INPUT_BRANCH: ops/doba-store-launch-20260829

jobs:
  launch:
    if: contains(github.event.head_commit.message, '[doba-5188501-authorized]')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct exact isolated launch package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$INPUT_BRANCH:refs/remotes/origin/$INPUT_BRANCH"
          mkdir -p /tmp/doba
          git show "origin/$INPUT_BRANCH:.deployment-input/doba-20260829-5188501/000.b64" | base64 --decode > /tmp/doba/source.xz
          git show "origin/$INPUT_BRANCH:.deployment-input/doba-20260829-5188501/launch.mjs" > /tmp/doba/launch.mjs
          xz -t /tmp/doba/source.xz
          xz -dc /tmp/doba/source.xz > /tmp/doba/source.csv
          test "$(wc -c < /tmp/doba/source.csv | tr -d ' ')" = "$SOURCE_BYTES"
          test "$(sha256sum /tmp/doba/source.csv | awk '{print $1}')" = "$SOURCE_SHA256"
          python - <<'PY'
          import csv, os
          with open('/tmp/doba/source.csv',newline='',encoding='utf-8-sig') as f:
              r=csv.reader(f); h=next(r); rows=list(r)
          assert len(h)==int(os.environ['SOURCE_COLUMNS'])
          assert len(rows)==int(os.environ['SOURCE_ROWS'])
          print('source verification PASS',len(rows),len(h))
          PY
      - name: Reconcile and publish curated inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          cp site/doba-csv-sync-runtime.js /tmp/doba/runtime.mjs
          echo 'export { ensureSchema, createPreview, applyRun };' >> /tmp/doba/runtime.mjs
          cd /tmp/doba
          node launch.mjs
      - name: Verify live storefront
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://elevationupscales.com/rv-store > /tmp/doba/rv-store.html
          curl -fsS --retry 3 https://elevationupscales.com/api/store/catalog > /tmp/doba/catalog.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/doba/receipt.json'))
          c=json.load(open('/tmp/doba/catalog.json'))
          products=c.get('products',c if isinstance(c,list) else [])
          assert isinstance(products,list), 'invalid public catalog shape'
          assert len(products)>=r['publishedAfter'], (len(products),r['publishedAfter'])
          print('public catalog PASS',len(products),'publishedAfter',r['publishedAfter'])
          PY
          grep -qi 'RV' /tmp/doba/rv-store.html
      - name: Write launch summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          p=json.load(open('/tmp/doba/receipt.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Doba 5188501 Curated Store Launch — PASS\n')
              f.write(f"- Exact export fingerprint: `{p['fingerprint']}`\n")
              f.write(f"- Rows: {p['preview']['rowCount']} / existing matches: {p['preview']['itemMatchCount']} / new staged: {p['newSourceRows']}\n")
              f.write(f"- Published: **{p['published']}** / review: {p['review']} / HOLD: {p['held']}\n")
              f.write(f"- RV/Outdoor public count: {p['publishedBefore']} → **{p['publishedAfter']}**\n")
              f.write(f"- Pre-existing HOLD records preserved: {p['preExistingHoldsPreserved']}\n")
              f.write('- Lithium auto-publish guard: PASS\n')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: doba-5188501-curated-store-launch
          path: |
            /tmp/doba/receipt.json
            /tmp/doba/catalog.json
          retention-days: 14
      - name: Retire one-time workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-doba-5188501-authorized-main.yml
          git commit -m 'Remove completed Doba 5188501 one-time launch workflow'
          git push origin HEAD:main
