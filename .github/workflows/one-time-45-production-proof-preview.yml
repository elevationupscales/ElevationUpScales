name: One-Time 4.5 Production Proof and Preview

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths: [.github/workflows/one-time-45-production-proof-preview.yml]

permissions:
  contents: read
  deployments: write

jobs:
  prove-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/4.5-production-reconciliation-2026-09-02
          fetch-depth: 0

      - name: Prove candidate lineage and source invariants
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "cc5f59fa8d7374d41d51ec56a0e91e20198cb612"
          git merge-base --is-ancestor "$current_main" HEAD
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          grep -q 'Hawaii Lithium Shipping & Freight' site/site-shell.js
          ! grep -q 'Hawaii Lithium Program' site/site-shell.js
          ! grep -q '&ebay=' site/rv-store.js
          ! grep -q '&ebay=' site/_worker.js
          ! grep -q 'params.get("ebay")' site/store-checkout.js
          ! grep -q 'raw?.ebayUrl\|raw.ebayUrl' site/store-checkout-server.js
          ! grep -q 'fallbackCatalog' site/rv-store.js
          grep -q 'PROMOTION_START_AT="2026-09-03T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'PROMOTION_END_AT="2026-09-08T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'couponPercent:25' site/promotion-runtime.js
          grep -q 'everydayMarkupPercent:35' site/promotion-runtime.js
          grep -q 'promoMarkupPercent:60' site/promotion-runtime.js
          grep -q 'batteryShippingCents:2799' site/promotion-runtime.js

      - name: Directly verify canonical production Lithium and customer routes
        id: production
        run: |
          set -euo pipefail
          base="https://elevationupscales.com"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/lithium.json','utf8'));
          const products=Array.isArray(data.products)?data.products:[];
          console.log(`PRODUCTION_LITHIUM_COUNT=${products.length}`);
          if(products.length!==38) throw new Error(`Expected 38 live Lithium Catalog products, got ${products.length}`);
          if(products.some(p=>!(Number(p.priceCents)>0))) throw new Error('A live Lithium product has no positive customer price');
          const first=products[0];
          if(!first?.id) throw new Error('No product id in live Lithium Catalog');
          fs.writeFileSync('/tmp/product-id',String(first.id));
          console.log(`PRODUCTION_SAMPLE_ID=${first.id}`);
          console.log(`PRODUCTION_SAMPLE_PRICE_CENTS=${first.priceCents}`);
          console.log(`PRODUCTION_SAMPLE_SHIPPING=${first.shippingStatus||''}`);
          NODE
          id="$(cat /tmp/product-id)"
          for route in / /lithium-batteries /hawaii-lithium-batteries /checkout/ "/product?id=${id}&store=lithium"; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "PRODUCTION_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/" -o /tmp/home.html
          grep -q 'Hawaii Lithium Shipping &amp; Freight' /tmp/home.html
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/lithium.html
          grep -q 'data-prerendered="true"' /tmp/lithium.html
          grep -q '<strong data-lithium-count>38</strong>' /tmp/lithium.html
          curl -fsSL --retry 8 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/hawaii.html
          grep -q '\$99 per actual battery' /tmp/hawaii.html
          grep -q 'Awaiting Consolidation' /tmp/hawaii.html
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/prod-promo.json
          echo "PRODUCTION_PROMOTION=$(cat /tmp/prod-promo.json)"
          if curl -fsSL --retry 8 --retry-all-errors "$base/site-shell.js" | grep -q 'Hawaii Lithium Program'; then
            echo 'PRODUCTION_SHARED_SHELL=STALE_CONFIRMED_EXPECTED_REPAIR'
          else
            echo 'PRODUCTION_SHARED_SHELL=ALREADY_CORRECT'
          fi

      - name: Deploy isolated reconciliation preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=production-reconciliation-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke repaired candidate preview
        id: preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          test -n "$base"
          echo "PREVIEW_URL=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /marketplace; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/preview.html -w '%{http_code}' "$base$route")
            echo "PREVIEW_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/site-shell.js" -o /tmp/shell.js
          grep -q 'Hawaii Lithium Shipping & Freight' /tmp/shell.js
          ! grep -q 'Hawaii Lithium Program' /tmp/shell.js
          curl -fsSL --retry 8 --retry-all-errors "$base/rv-store.js" -o /tmp/rv-store.js
          grep -q '/api/store-catalog?section=rv-outdoor' /tmp/rv-store.js
          ! grep -q '&ebay=' /tmp/rv-store.js
          ! grep -q 'fallbackCatalog' /tmp/rv-store.js
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/preview-lithium.json
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/preview-lithium.json','utf8'));
          const products=Array.isArray(data.products)?data.products:[];
          console.log(`PREVIEW_LITHIUM_COUNT=${products.length}`);
          if(products.length!==38) throw new Error(`Preview expected 38 Lithium products, got ${products.length}`);
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/preview-lithium.html
          grep -q 'data-prerendered="true"' /tmp/preview-lithium.html
          grep -q '<strong data-lithium-count>38</strong>' /tmp/preview-lithium.html
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/preview-promo.json
          node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/preview-promo.json','utf8'));
          console.log('PREVIEW_PROMOTION='+JSON.stringify(p));
          if(p.startAt!=='2026-09-03T06:00:00.000Z') throw new Error('Unexpected promotion start');
          if(p.endAt!=='2026-09-08T06:00:00.000Z') throw new Error('Unexpected promotion end');
          if(Date.now()<Date.parse(p.startAt) && p.active!==false) throw new Error('Promotion active before approved start window');
          if(Date.now()>=Date.parse(p.endAt) && p.active!==false) throw new Error('Promotion active after approved end window');
          NODE

      - name: Record proof summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.5 production reconciliation proof' >> "$GITHUB_STEP_SUMMARY"
          echo 'Current production parent: cc5f59fa8d7374d41d51ec56a0e91e20198cb612' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production Lithium Catalog: 38/38 PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
