name: Build ELEVATION OS 2.0 Peter Startup Package

on:
  push:

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Build startup package
        shell: bash
        run: |
          set -euo pipefail

          ROOT="build/ELEVATION_OS_2.0_PETER"
          mkdir -p             "$ROOT/02_MASTER_CONTROL"             "$ROOT/03_CORE_CONTROL"             "$ROOT/04_PETER_GIT_LANE"             "$ROOT/05_AI_WORKER_RESET"             "$ROOT/06_PROJECT_ROUTING"             "$ROOT/07_PUBLIC_DATA_AND_SECURITY"

          cp operations/elevation-os-2.0/00_START_HERE.md "$ROOT/00_START_HERE.md"
          cp operations/elevation-os-2.0/README.md "$ROOT/README.md"
          cp operations/elevation-os-2.0/01_OS_2_0_OVERVIEW.md "$ROOT/01_OS_2_0_OVERVIEW.md"

          cp operations/MASTER_SOP_V1_0.md "$ROOT/02_MASTER_CONTROL/MASTER_SOP_V1_0.md"
          cp operations/MASTER_SOP_V1_1.md "$ROOT/02_MASTER_CONTROL/MASTER_SOP_V1_1.md"
          cp operations/OS_1_1_INTEGRATION_SPEC.md "$ROOT/02_MASTER_CONTROL/OS_1_1_INTEGRATION_SPEC.md"
          cp operations/OS_1_1_EXECUTION_HANDOFF_SOP.md "$ROOT/02_MASTER_CONTROL/OS_1_1_EXECUTION_HANDOFF_SOP.md"

          cp operations/MASTER_OS_GLOSSARY_V1_0.md "$ROOT/03_CORE_CONTROL/MASTER_OS_GLOSSARY_V1_0.md"
          cp operations/README.md "$ROOT/03_CORE_CONTROL/README_OPERATIONS.md"
          {
            printf '%s\n\n' '# SNAPSHOT ONLY — BEFORE EXECUTION RESOLVE LIVE `operations/CURRENT_WORK_BOARD.md` FROM CURRENT `main`.'
            printf '%s\n\n' 'This copy is included only for startup orientation. Live accepted Git supersedes this snapshot for current state.'
            cat operations/CURRENT_WORK_BOARD.md
          } > "$ROOT/03_CORE_CONTROL/CURRENT_WORK_BOARD_SNAPSHOT.md"

          cp operations/PETER_GIT_COLLABORATION_WORKFLOW_V1_0.md "$ROOT/04_PETER_GIT_LANE/PETER_GIT_COLLABORATION_WORKFLOW_V1_0.md"
          cp operations/PETER_PROJECT_STARTER_V2_2026-09-10.md "$ROOT/04_PETER_GIT_LANE/PETER_PROJECT_STARTER_V2_2026-09-10.md"
          cp operations/peter/PETER_MANAGER_INDEX.md "$ROOT/04_PETER_GIT_LANE/PETER_MANAGER_INDEX.md"
          cp operations/peter/PETER_CURRENT_WORKTREE.md "$ROOT/04_PETER_GIT_LANE/PETER_CURRENT_WORKTREE.md"
          cp operations/peter/PETER_HANDOFF_LOG.md "$ROOT/04_PETER_GIT_LANE/PETER_HANDOFF_LOG.md"

          cp operations/elevation-os-2.0/PETER_CHATGPT_PROJECT_START_PROMPT.md "$ROOT/05_AI_WORKER_RESET/PETER_CHATGPT_PROJECT_START_PROMPT.md"
          cp operations/elevation-os-2.0/PETER_AI_WORKER_RESET_PROMPT.md "$ROOT/05_AI_WORKER_RESET/PETER_AI_WORKER_RESET_PROMPT.md"
          cp operations/elevation-os-2.0/CUSTOMER_FACING_COLLATERAL_WORKER_PROFILE.md "$ROOT/05_AI_WORKER_RESET/CUSTOMER_FACING_COLLATERAL_WORKER_PROFILE.md"
          cp operations/elevation-os-2.0/GIT_FIRST_STARTUP_CHECKLIST.md "$ROOT/05_AI_WORKER_RESET/GIT_FIRST_STARTUP_CHECKLIST.md"

          cp operations/PROJECT_LANE_MANAGER_SPECIALIST_STANDARD_2026-09-10.md "$ROOT/06_PROJECT_ROUTING/PROJECT_LANE_MANAGER_SPECIALIST_STANDARD_2026-09-10.md"
          cp operations/VENDOR_PROJECT_SOURCE_STANDARD_2026-09-10.md "$ROOT/06_PROJECT_ROUTING/VENDOR_PROJECT_SOURCE_STANDARD_2026-09-10.md"
          cp operations/CROSS_GPT_COMMUNICATION_AND_APPROVAL_SOP_2026-09-10.md "$ROOT/06_PROJECT_ROUTING/CROSS_GPT_COMMUNICATION_AND_APPROVAL_SOP_2026-09-10.md"

          cp operations/INTERNAL_WORKER_CONFIDENTIALITY_IP_AND_FILE_USE_POLICY.md "$ROOT/07_PUBLIC_DATA_AND_SECURITY/INTERNAL_WORKER_CONFIDENTIALITY_IP_AND_FILE_USE_POLICY.md"

          cat > "$ROOT/PACKAGE_SOURCE.md" <<EOF
          # ELEVATION OS 2.0 — Package Source

          **Package:** ELEVATION_OS_2.0_PETER
          **Repository:** elevationupscales/ElevationUpScales
          **Build commit:** ${GITHUB_SHA}
          **Build ref:** ${GITHUB_REF}
          **Build time UTC:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          This ZIP is a one-time startup/bootstrap package.

          **PACKAGE TEACHES THE SYSTEM → LIVE GIT CONTROLS CURRENT STATE.**

          After startup, Peter's ChatGPT must re-resolve current `main` and use current accepted Git state rather than treating this package as live operational authority.
          EOF

          (
            cd "$ROOT"
            find . -type f ! -name MANIFEST_SHA256.txt -print0               | sort -z               | xargs -0 sha256sum > MANIFEST_SHA256.txt
            sha256sum -c MANIFEST_SHA256.txt
          )

          echo "Package files:"
          find "$ROOT" -type f -print | sort

      - name: Upload ELEVATION OS 2.0 package
        uses: actions/upload-artifact@v4
        with:
          name: ELEVATION_OS_2.0_PETER
          path: build/ELEVATION_OS_2.0_PETER/
          if-no-files-found: error
          retention-days: 30
