name: One-Time 4.5 Production Reconciliation Resume

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths:
      - .github/workflows/one-time-45-production-reconciliation-resume.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/4.5-production-reconciliation-2026-09-02
          fetch-depth: 0

      - name: Confirm lineage and apply corrected repair
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cc5f59fa8d7374d41d51ec56a0e91e20198cb612 HEAD
          test "${GITHUB_REF_NAME}" = "repair/4.5-production-reconciliation-2026-09-02"
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Correct the exact shared-shell array entry. This is the only part that
          # failed in the first runner; that failed job committed no source changes.
          p=Path('site/site-shell.js')
          s=p.read_text()
          old='["/hawaii-lithium-batteries", "Hawaii Lithium Program", "Coming soon · reservations and Hawaii shipping availability"],'
          new='["/hawaii-lithium-batteries", "Hawaii Lithium Shipping & Freight", "Hawaii consolidated freight · Alaska quote options"],'
          if s.count(old)!=1: raise SystemExit(f'shared Hawaii nav exact-match count={s.count(old)}')
          p.write_text(s.replace(old,new,1))

          # Reuse the already-reviewed repair body from the first runner beginning
          # at promotion timing. This avoids maintaining two divergent patch bodies.
          workflow=Path('.github/workflows/one-time-45-production-reconciliation-candidate.yml').read_text()
          start='          # 2. Labor Day campaign timing: reliability guard only. Pricing policy is unchanged.\n'
          end='          PY\n\n      - name: Validate candidate source'
          if start not in workflow or end not in workflow: raise SystemExit('unable to locate prior repair body')
          body=workflow.split(start,1)[1].split(end,1)[0]
          code=textwrap.dedent(start+body)
          exec(compile(code,'reconciliation-repair.py','exec'),{'Path':Path})
          PY

      - name: Validate candidate source and policy boundaries
        run: |
          set -euo pipefail
          for file in site/site-shell.js site/promotion-runtime.js site/admin-promotion.js site/rv-store.js site/rv-checkout-routing.js site/_worker.js site/store-checkout.js site/store-checkout-server.js; do
            node --check "$file"
          done
          git diff --check

          grep -q 'Hawaii Lithium Shipping & Freight' site/site-shell.js
          ! grep -q 'Hawaii Lithium Program' site/site-shell.js
          ! grep -q 'Coming soon · reservations and Hawaii shipping availability' site/site-shell.js

          grep -q 'PROMOTION_START_AT="2026-09-03T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'PROMOTION_END_AT="2026-09-08T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'manualActive:' site/promotion-runtime.js
          grep -q 'windowState:' site/promotion-runtime.js

          # Pricing policy values must be byte-present and unchanged.
          grep -q 'couponPercent:25' site/promotion-runtime.js
          grep -q 'everydayMarkupPercent:35' site/promotion-runtime.js
          grep -q 'promoMarkupPercent:60' site/promotion-runtime.js
          grep -q 'batteryShippingCents:2799' site/promotion-runtime.js

          ! grep -q 'params.set("ebay"' site/rv-store.js
          ! grep -q '&ebay=' site/rv-checkout-routing.js
          ! grep -q '&ebay=' site/_worker.js
          ! grep -q 'params.get("ebay")' site/store-checkout.js
          ! grep -q 'raw?.ebayUrl\|raw.ebayUrl' site/store-checkout-server.js
          grep -q 'catalogRvFallbackUrl' site/store-checkout-server.js
          grep -q 'm.ebay_item_id' site/store-checkout-server.js

          python - <<'PY'
          from datetime import datetime
          start=datetime.fromisoformat('2026-09-03T06:00:00+00:00')
          end=datetime.fromisoformat('2026-09-08T06:00:00+00:00')
          assert start < end
          assert (end-start).total_seconds() == 5*24*60*60
          print('campaign_window_hours=',(end-start).total_seconds()/3600)
          PY

          for protected in \
            site/start-a-project.html \
            site/solar-project.html \
            site/hawaii-lithium-runtime.js \
            site/hawaii-lithium-batteries.html \
            site/lithium-shop.js \
            site/lithium-batteries.html \
            site/catalog-admin-runtime.js \
            site/marketplace.html; do
            git diff --quiet cc5f59fa8d7374d41d51ec56a0e91e20198cb612 -- "$protected"
          done

      - name: Commit candidate and retire temporary runners
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-45-production-reconciliation-candidate.yml
          rm .github/workflows/one-time-45-production-reconciliation-resume.yml
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/site-shell.js site/promotion-runtime.js site/admin-promotion.js site/rv-store.js site/rv-checkout-routing.js site/_worker.js site/store-checkout.js site/store-checkout-server.js .github/workflows/one-time-45-production-reconciliation-candidate.yml .github/workflows/one-time-45-production-reconciliation-resume.yml
          git commit -m 'Repair production navigation promotion timing and RV fallback'
          git push origin HEAD:repair/4.5-production-reconciliation-2026-09-02
