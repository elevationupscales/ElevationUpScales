name: HOME-HERO-SLIDES-0905-07 Header Brand Repair

on:
  push:
    branches:
      - work/home-hero-slides-0905-07-header-brand-repair

permissions:
  contents: read
  deployments: write

env:
  EXPECTED_PARENT: 83f2761750cf975f54ae91aed31c52ffee349e55
  WORK_BRANCH: work/home-hero-slides-0905-07-header-brand-repair

jobs:
  validate-and-preview:
    name: validate-reference-render-and-preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out owner takeover candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce current management lineage
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$EXPECTED_PARENT" "$candidate"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Application parent: $EXPECTED_PARENT"
          echo "Candidate: $candidate"

      - name: Enforce presentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$EXPECTED_PARENT"...HEAD)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(site/assets/brand/storefront-wordmark\.webp|\.github/workflows/home-hero-slides-0905-05-preview\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "BLOCKED: unexpected files in owner takeover slideshow candidate"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Validate reference-led source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/home-hero-slides.js
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('site/home-hero-slides.json', 'utf8'));
          const active = Array.isArray(cfg.slides) ? cfg.slides.filter((s) => s && s.active !== false) : [];
          if (cfg.schemaVersion !== 1) throw new Error('Unexpected schema');
          if (active.length < 4) throw new Error('Expected 4+ active slides');
          if (active[0].image !== '/assets/brand/storefront-wordmark.webp') throw new Error('Storefront wordmark must remain first slide');
          if (!active.some((s) => s.layout === 'reference-partnership')) throw new Error('SOK partnership slide missing');
          if (!active.some((s) => s.headline === 'SK12V100PC')) throw new Error('SK12V100PC missing');
          if (!active.some((s) => s.headline === 'SK48V100N')) throw new Error('SK48V100N missing');
          const local = (value) => {
            if (!value || !String(value).startsWith('/')) return;
            if (!fs.existsSync(`site${value}`)) throw new Error(`Missing local asset: site${value}`);
          };
          for (const s of active) {
            if (!s.image || !s.alt) throw new Error(`Slide ${s.id || 'unknown'} missing image/alt`);
            local(s.image); local(s.backgroundImage); local(s.brandImage);
            for (const p of Array.isArray(s.products) ? s.products : []) local(p?.image);
          }
          NODE
          grep -q 'data-home-hero-slides' site/index.html
          grep -q 'root.dataset.referenceSlides' site/home-hero-slides.js
          grep -q 'reference-storefront-hero' site/home-hero-slides.js
          grep -q 'reference-solutions__grid' site/home-hero-slides.css
          grep -q 'home-hero-reference__featured-product' site/home-hero-slides.css
          git diff --check

      - name: Canonical committed-source QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --exit-code

      - name: Install DOM integration harness
        shell: bash
        run: npm install --no-save --package-lock=false jsdom@26

      - name: Execute rendered reference integration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { JSDOM } from 'jsdom';
          const html = fs.readFileSync('site/index.html', 'utf8');
          const config = JSON.parse(fs.readFileSync('site/home-hero-slides.json', 'utf8'));
          const script = fs.readFileSync('site/home-hero-slides.js', 'utf8');
          const dom = new JSDOM(html, { url: 'https://preview.local/', runScripts: 'outside-only', pretendToBeVisual: true });
          dom.window.matchMedia = () => ({ matches: false });
          dom.window.fetch = async () => ({ ok: true, json: async () => config });
          dom.window.eval(script);
          await new Promise((resolve) => setTimeout(resolve, 120));
          const root = dom.window.document.querySelector('[data-home-hero-slides]');
          if (root?.dataset.slideshowReady !== 'true') throw new Error('Slideshow did not initialize');
          if (Number(root.dataset.slideCount) < 4 || Number(root.dataset.referenceSlides) < 4) throw new Error('Reference carousel incomplete');
          if (root.dataset.controlsReady !== 'true') throw new Error('Controls missing');
          if (!dom.window.document.querySelector('[data-reference-flagship]')) throw new Error('Flagship first fold missing');
          if (!dom.window.document.querySelector('[data-reference-trust]')) throw new Error('Trust strip missing');
          if (!dom.window.document.querySelector('[data-reference-solutions]')) throw new Error('Solution grid missing');
          if (dom.window.document.querySelectorAll('.reference-solution-card').length !== 7) throw new Error('Seven solution cards required');
          if (dom.window.document.body.dataset.referenceShellReady !== 'true') throw new Error('Retail shell not enhanced');
          const before = root.dataset.activeSlide;
          root.querySelector('[data-home-hero-next]').click();
          if (root.dataset.activeSlide === before) throw new Error('Next control failed');
          dom.window.close();
          console.log('Rendered reference storefront DOM: PASS');
          NODE
          git diff --exit-code

      - name: Deploy isolated owner takeover preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=home-hero-slides-0905-07-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview regression and deployed integration
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          npm run qa:preview -- "$base"
          curl -sS -L --fail "$base/" -o /tmp/home.html
          grep -q 'data-home-hero-slides' /tmp/home.html
          curl -sS -L --fail "$base/home-hero-slides.json" -o /tmp/slides.json
          curl -sS -L --fail "$base/home-hero-slides.js?v=1.0.0" -o /tmp/slides.js
          curl -sS -L --fail "$base/home-hero-slides.css?v=1.0.0" -o /tmp/slides.css
          grep -q 'reference-storefront-hero' /tmp/slides.js
          grep -q 'reference-solutions__grid' /tmp/slides.css
          BASE="$base" node --input-type=module - <<'NODE'
          import { JSDOM } from 'jsdom';
          const base = process.env.BASE;
          const html = await fetch(`${base}/`).then((r) => { if (!r.ok) throw new Error(`home ${r.status}`); return r.text(); });
          const cfg = await fetch(`${base}/home-hero-slides.json`).then((r) => r.json());
          const script = await fetch(`${base}/home-hero-slides.js?v=1.0.0`).then((r) => r.text());
          const dom = new JSDOM(html, { url: `${base}/`, runScripts: 'outside-only', pretendToBeVisual: true });
          dom.window.matchMedia = () => ({ matches: false });
          dom.window.fetch = async () => ({ ok: true, json: async () => cfg });
          dom.window.eval(script);
          await new Promise((resolve) => setTimeout(resolve, 130));
          const root = dom.window.document.querySelector('[data-home-hero-slides]');
          if (root?.dataset.slideshowReady !== 'true') throw new Error('Deployed slideshow did not initialize');
          if (!dom.window.document.querySelector('[data-reference-flagship]')) throw new Error('Deployed flagship missing');
          if (dom.window.document.querySelectorAll('.reference-solution-card').length !== 7) throw new Error('Deployed solution grid incomplete');
          dom.window.close();
          console.log('Deployed reference storefront DOM: PASS');
          NODE

      - name: Install browser visual harness
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile owner evidence
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          BASE="${BASE%/}" node --input-type=module - <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base = process.env.BASE;
          const browser = await chromium.launch({ headless: true });
          const evidence = {};
          async function capture(name, viewport, fullPageName) {
            const page = await browser.newPage({ viewport });
            await page.goto(`${base}/`, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(() => document.body?.dataset?.referenceShellReady === 'true', null, { timeout: 15000 });
            await page.waitForSelector('[data-reference-flagship]', { state: 'visible' });
            await page.waitForSelector('[data-reference-solutions]', { state: 'visible' });
            await page.waitForTimeout(2500);
            const markers = await page.evaluate(() => ({
              title: document.title,
              flagship: Boolean(document.querySelector('[data-reference-flagship]')),
              trust: Boolean(document.querySelector('[data-reference-trust]')),
              solutions: document.querySelectorAll('.reference-solution-card').length,
              carouselReady: document.querySelector('[data-home-hero-slides]')?.dataset?.slideshowReady,
              h1: document.querySelector('[data-reference-flagship] h1')?.innerText || '',
              bodyWidth: document.body.scrollWidth,
              viewportWidth: window.innerWidth,
              viewportHeight: window.innerHeight
            }));
            const brand = await page.locator('.reference-header-wordmark').evaluate((img) => ({ complete: img.complete, naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight }));
            if (!brand.complete || brand.naturalWidth !== 1200 || brand.naturalHeight !== 360) throw new Error(`${name} header wordmark failed: ${JSON.stringify(brand)}`);
            if (markers.viewportWidth !== viewport.width || markers.viewportHeight !== viewport.height) throw new Error(`${name} viewport mismatch`);
            if (!markers.flagship || !markers.trust || markers.solutions !== 7 || markers.carouselReady !== 'true') throw new Error(`${name} visual markers incomplete`);
            if (markers.bodyWidth > markers.viewportWidth + 4) throw new Error(`${name} horizontal overflow: ${markers.bodyWidth} > ${markers.viewportWidth}`);
            evidence[name] = markers;
            await page.screenshot({ path: `visual-evidence/${name}-viewport.png`, fullPage: false });
            await page.screenshot({ path: `visual-evidence/${fullPageName}`, fullPage: true });
            await page.close();
          }
          await capture('desktop-1536x1024', { width: 1536, height: 1024 }, 'desktop-full.png');
          await capture('mobile-390x844', { width: 390, height: 844 }, 'mobile-full.png');
          await browser.close();
          fs.writeFileSync('visual-evidence/evidence.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE

      - name: Upload owner visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: home-hero-slides-0905-07-header-brand-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Candidate immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "${{ steps.lineage.outputs.candidate }}"

      - name: Owner takeover preview receipt
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### HOME-HERO-SLIDES-0905-07 — HEADER BRAND REPAIR + TRUE VIEWPORT EVIDENCE PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent: $EXPECTED_PARENT" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: ${{ steps.lineage.outputs.candidate }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Flagship reference composition: PRESENT' >> "$GITHUB_STEP_SUMMARY"
          echo 'Seven-card Shop by Solution: PRESENT' >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop 1536×1024 evidence: CAPTURED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Mobile 390×844 evidence: CAPTURED' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
