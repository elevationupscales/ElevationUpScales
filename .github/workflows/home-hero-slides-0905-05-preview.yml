name: HOME-HERO-SLIDES-0905-05 Owner Takeover Preview

on:
  push:
    branches:
      - work/home-hero-slides-0905-05-owner-takeover

permissions:
  contents: read
  deployments: write

concurrency:
  group: home-hero-slides-0905-05-preview
  cancel-in-progress: false

env:
  EXPECTED_PARENT: cd97d178c8e205a816441fb8d86f140e2bbd5502
  WORK_BRANCH: work/home-hero-slides-0905-05-owner-takeover

jobs:
  validate-and-preview:
    name: validate-reference-render-and-preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out owner takeover candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce current management lineage
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          current_main="$(git rev-parse origin/main)"
          candidate="$(git rev-parse HEAD)"
          test "$current_main" = "$EXPECTED_PARENT"
          git merge-base --is-ancestor "$current_main" "$candidate"
          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Current main: $current_main"
          echo "Candidate: $candidate"

      - name: Enforce presentation-only scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$EXPECTED_PARENT"...HEAD)"
          printf '%s\n' "$changed"
          test -n "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(site/index\.html|site/home-hero-slides\.(css|js|json)|\.github/workflows/home-hero-slides-0905-05-preview\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "BLOCKED: unexpected files in owner takeover slideshow candidate"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Validate reference-led slideshow source contract
        shell: bash
        run: |
          set -euo pipefail
          node --check site/home-hero-slides.js
          node - <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('site/home-hero-slides.json', 'utf8'));
          if (cfg.schemaVersion !== 1) throw new Error('Unexpected slideshow schemaVersion');
          const active = Array.isArray(cfg.slides) ? cfg.slides.filter((s) => s && s.active !== false) : [];
          if (active.length < 4) throw new Error(`Owner takeover requires >=4 active slides; found ${active.length}`);
          if (active[0].image !== '/assets/brand/storefront-wordmark.webp') throw new Error('Approved storefront wordmark must remain first active slide');
          if (!(Number(cfg.rotationMs) >= 4500)) throw new Error('Rotation interval is missing or too short');
          const reference = active.filter((s) => String(s.layout || '').startsWith('reference-'));
          if (reference.length < 4) throw new Error(`Reference-led creative must own the launch rotation; found ${reference.length}`);
          if (!active.some((s) => s.layout === 'reference-partnership')) throw new Error('Authorized SOK partnership slide missing');
          if (!active.some((s) => s.headline === 'SK12V100PC')) throw new Error('SK12V100PC showcase slide missing');
          if (!active.some((s) => s.headline === 'SK48V100N')) throw new Error('SK48V100N showcase slide missing');
          const checkLocal = (value, label) => {
            if (!value || typeof value !== 'string' || !value.startsWith('/')) return;
            const local = `site${value}`;
            if (!fs.existsSync(local)) throw new Error(`Missing local ${label}: ${local}`);
          };
          for (const slide of active) {
            if (!slide.image || !slide.alt) throw new Error(`Slide ${slide.id || '(unnamed)'} missing image/alt`);
            checkLocal(slide.image, 'slide asset');
            checkLocal(slide.backgroundImage, 'background asset');
            checkLocal(slide.brandImage, 'brand asset');
            for (const product of Array.isArray(slide.products) ? slide.products : []) checkLocal(product?.image, 'product asset');
          }
          NODE
          grep -q 'home-hero-slides.css?v=1.0.0' site/index.html
          grep -q 'home-hero-slides.js?v=1.0.0' site/index.html
          grep -q 'data-home-hero-slides' site/index.html
          grep -q 'data-slides-src="/home-hero-slides.json"' site/index.html
          ! grep -q '<section class="retail-hero"' site/index.html
          grep -q 'root.dataset.referenceSlides' site/home-hero-slides.js
          grep -q 'home-hero-reference--partnership' site/home-hero-slides.css
          grep -q 'home-hero-reference__featured-product' site/home-hero-slides.css
          git diff --check

      - name: Canonical committed-source QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --exit-code

      - name: Install DOM integration harness
        shell: bash
        run: npm install --no-save --package-lock=false jsdom@26

      - name: Execute rendered reference slideshow integration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { JSDOM } from 'jsdom';
          const html = fs.readFileSync('site/index.html', 'utf8');
          const config = JSON.parse(fs.readFileSync('site/home-hero-slides.json', 'utf8'));
          const script = fs.readFileSync('site/home-hero-slides.js', 'utf8');
          const dom = new JSDOM(html, { url: 'https://preview.local/', runScripts: 'outside-only', pretendToBeVisual: true });
          dom.window.matchMedia = () => ({ matches: false });
          dom.window.fetch = async () => ({ ok: true, json: async () => config });
          dom.window.eval(script);
          await new Promise((resolve) => setTimeout(resolve, 100));
          const root = dom.window.document.querySelector('[data-home-hero-slides]');
          if (!root) throw new Error('Slideshow root not rendered');
          if (root.dataset.slideshowReady !== 'true') throw new Error('Slideshow did not initialize');
          if (Number(root.dataset.slideCount) < 4) throw new Error('Rendered slide count below owner takeover requirement');
          if (Number(root.dataset.referenceSlides) < 4) throw new Error('Reference-led slides did not render');
          if (root.dataset.controlsReady !== 'true') throw new Error('Slideshow controls did not render');
          if (root.querySelectorAll('.home-hero-slide--reference').length < 4) throw new Error('Reference creative DOM missing');
          if (!root.querySelector('.home-hero-slide--partnership .home-hero-reference__products')) throw new Error('SOK partnership product deck missing');
          if (root.querySelectorAll('.home-hero-reference__featured-product').length < 2) throw new Error('Product showcase media missing');
          if (!root.querySelector('[data-home-hero-prev]') || !root.querySelector('[data-home-hero-next]')) throw new Error('Previous/next controls missing');
          if (root.querySelectorAll('[data-home-hero-dot]').length !== Number(root.dataset.slideCount)) throw new Error('Pagination count mismatch');
          if (!root.querySelector('[data-home-hero-pause]')) throw new Error('Pause control missing');
          const before = root.dataset.activeSlide;
          root.querySelector('[data-home-hero-next]').click();
          if (root.dataset.activeSlide === before) throw new Error('Next control did not advance active slide');
          dom.window.close();
          console.log('Rendered reference slideshow DOM: PASS');
          NODE
          git diff --exit-code

      - name: Deploy isolated owner takeover preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=home-hero-slides-0905-05-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Preview regression and deployed reference integration
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          npm run qa:preview -- "$base"
          curl -sS -L --fail "$base/" -o /tmp/home.html
          grep -q 'data-home-hero-slides' /tmp/home.html
          curl -sS -L --fail "$base/home-hero-slides.json" -o /tmp/slides.json
          node -e "const c=require('/tmp/slides.json'); const a=c.slides.filter(s=>s&&s.active!==false); const r=a.filter(s=>String(s.layout||'').startsWith('reference-')); if(a.length<4||r.length<4) process.exit(1); if(a[0].image!=='/assets/brand/storefront-wordmark.webp') process.exit(1)"
          curl -sS -L --fail "$base/home-hero-slides.js?v=1.0.0" -o /tmp/slides.js
          curl -sS -L --fail "$base/home-hero-slides.css?v=1.0.0" -o /tmp/slides.css
          grep -q 'root.dataset.referenceSlides' /tmp/slides.js
          grep -q 'home-hero-reference--partnership' /tmp/slides.css
          BASE="$base" node --input-type=module - <<'NODE'
          import { JSDOM } from 'jsdom';
          const base = process.env.BASE;
          const html = await fetch(`${base}/`).then((r) => { if (!r.ok) throw new Error(`home ${r.status}`); return r.text(); });
          const cfg = await fetch(`${base}/home-hero-slides.json`).then((r) => { if (!r.ok) throw new Error(`json ${r.status}`); return r.json(); });
          const script = await fetch(`${base}/home-hero-slides.js?v=1.0.0`).then((r) => { if (!r.ok) throw new Error(`js ${r.status}`); return r.text(); });
          const dom = new JSDOM(html, { url: `${base}/`, runScripts: 'outside-only', pretendToBeVisual: true });
          dom.window.matchMedia = () => ({ matches: false });
          dom.window.fetch = async () => ({ ok: true, json: async () => cfg });
          dom.window.eval(script);
          await new Promise((resolve) => setTimeout(resolve, 110));
          const root = dom.window.document.querySelector('[data-home-hero-slides]');
          if (root?.dataset.slideshowReady !== 'true') throw new Error('Deployed slideshow did not initialize');
          if (Number(root.dataset.slideCount) < 4 || Number(root.dataset.referenceSlides) < 4) throw new Error('Deployed reference rotation incomplete');
          if (root.dataset.controlsReady !== 'true') throw new Error('Deployed controls did not render');
          const before = root.dataset.activeSlide;
          root.querySelector('[data-home-hero-next]').click();
          if (root.dataset.activeSlide === before) throw new Error('Deployed next control did not advance');
          dom.window.close();
          console.log('Deployed reference slideshow DOM: PASS');
          NODE

      - name: Candidate immutability
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "${{ steps.lineage.outputs.candidate }}"

      - name: Owner takeover preview receipt
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### HOME-HERO-SLIDES-0905-05 — OWNER TAKEOVER PREVIEW PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent: $EXPECTED_PARENT" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: ${{ steps.lineage.outputs.candidate }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Reference-led active slides: 4+' >> "$GITHUB_STEP_SUMMARY"
          echo 'SOK partnership + SK12V100PC + SK48V100N creative: PRESENT' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rendered controls/pagination interaction: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
