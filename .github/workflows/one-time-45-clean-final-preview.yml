name: One-Time 4.5 Clean Final Preview
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-clean-final-preview.yml
permissions:
  contents: read
  deployments: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact clean candidate
        uses: actions/checkout@v6
        with:
          ref: ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          fetch-depth: 0
      - name: Source, lineage and release-tree gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ed2eaee5a01e3a5f23e1322eb63fa03c058220a6"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-45-*' -print -quit)"
          test -z "$(find .github/scripts -maxdepth 1 -type f \( -name 'apply_45_*' -o -name 'repair_45_*' \) -print -quit)"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          grep -q '"/hawaii-lithium-batteries"' site/_routes.json
          grep -q '/api/hawaii-lithium/statuses' site/lithium-shop.js
          ! grep -q 'fetch(`/api/hawaii-lithium/status?sku=' site/lithium-shop.js
          grep -q 'hawaii-address-delivery' site/shipping-rules-runtime.js
          grep -q 'const identity=\[product?.title,product?.name,product?.sku,product?.supplierSku\]' site/promotion-runtime.js
          grep -q 'Checking exact-SKU Hawaii eligibility' site/store-checkout.js
          grep -q 'WHAT HAPPENS NEXT' site/checkout/index.html
          echo SOURCE_GATE=PASS
      - name: Deploy exact candidate to isolated Cloudflare preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=commerce45cleanfinal
      - name: Routes, Catalog, Shipping Rules and prerender
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          echo "PREVIEW=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do
            code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 -o /tmp/r -w '%{http_code}' "$base$route" || true)
            echo "ROUTE $route=$code"
            test "$code" = 200
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/featured" -o /tmp/featured.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/hawaii-lithium/statuses" -o /tmp/statuses.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=CO&quantity=2&batteryUnits=1" -o /tmp/co.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          test "$(curl -sS -o /tmp/admin-rules -w '%{http_code}' "$base/api/admin/shipping-rules")" = 401
          node <<'NODE'
          const fs=require('fs');
          const li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[];
          const rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[];
          const f=JSON.parse(fs.readFileSync('/tmp/featured.json'));
          const rules=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[];
          const st=JSON.parse(fs.readFileSync('/tmp/statuses.json'));
          const co=JSON.parse(fs.readFileSync('/tmp/co.json')),hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json'));
          if(li.length!==38) throw Error('Lithium count '+li.length);
          if(rv.length<1) throw Error('RV empty');
          if((f.lithium||[]).length!==4||(f.rv||[]).length!==4) throw Error('Featured not 4+4');
          for(const p of [...f.lithium,...f.rv]) if(!(Number(p.priceCents)>0)||!p.image||!p.buyUrl||!p.detailUrl) throw Error('Featured incomplete');
          const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');
          if(l?.rateCents!==2799||l?.calculation!=='per_battery'||!l?.enabled) throw Error('Lower48 rule');
          if(h?.rateCents!==9900||h?.calculation!=='per_battery'||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3) throw Error('HI rule');
          if(!d?.quoteRequired||d?.rateCents!==0) throw Error('HI delivery rule');
          if(!a?.quoteRequired||a?.rateCents!==0) throw Error('AK rule');
          if(co.status!=='shipping_available'||co.shippingCents!==5598) throw Error('CO resolver');
          if(hi.status!=='shipping_available'||hi.shippingCents!==19800) throw Error('HI resolver');
          if(ak.status!=='review_required'||ak.shippingCents!==0) throw Error('AK resolver');
          const states={shipping_available:[],review_required:[],unavailable:[]};
          for(const p of li){const s=st.statuses?.[p.id]||st.statuses?.[String(p.sku||'').toLowerCase()];if(s&&states[s.customerState])states[s.customerState].push(p.id)}
          console.log(`COUNTS LITHIUM=${li.length} RV=${rv.length} FEATURED=4+4`);
          console.log('HAWAII_STATES='+JSON.stringify(Object.fromEntries(Object.entries(states).map(([k,v])=>[k,v.length]))));
          fs.writeFileSync('/tmp/states.json',JSON.stringify(states));
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/li.html
          curl -fsSL --retry 8 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/hi.html
          curl -fsSL --retry 8 --retry-all-errors "$base/rv-store" -o /tmp/rv.html
          node <<'NODE'
          const fs=require('fs');const li=fs.readFileSync('/tmp/li.html','utf8'),hi=fs.readFileSync('/tmp/hi.html','utf8'),rv=fs.readFileSync('/tmp/rv.html','utf8');
          const a=(li.match(/class="lithium-card"/g)||[]).length,b=(hi.match(/class="lithium-card"/g)||[]).length,c=(rv.match(/class="rv-product-card"/g)||[]).length;
          console.log(`PRERENDER LITHIUM=${a} HAWAII=${b} RV=${c}`);
          if(a!==38||b!==38||c<1||!li.includes('data-prerendered="true"')||!hi.includes('data-prerendered="true"')||!rv.includes('data-prerendered="true"')) throw Error('prerender');
          if(!hi.includes('Honolulu warehouse / freight-terminal')||!hi.includes('Additional charge · quote required')) throw Error('Hawaii wording');
          NODE
      - name: Checkout authority and known battery regression
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          node <<'NODE'
          (async()=>{
            const fs=require('fs'),base=process.env.BASE.replace(/\/$/,''),products=(JSON.parse(fs.readFileSync('/tmp/li.json')).products||[]).filter(x=>Number(x.priceCents)>0),states=JSON.parse(fs.readFileSync('/tmp/states.json'));
            async function post(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}
            const knownId='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77',known=products.find(x=>x.id===knownId);if(!known)throw Error('Known battery missing');
            const co=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'CO'}});
            if(co.status!==200||co.body?.battery?.actualBattery!==true||co.body.shippingCents!==2799||co.body.shippingRule?.rateCents!==2799) throw Error('Known Lower48 '+JSON.stringify(co));
            const hi=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'HI'}});
            if(hi.status!==200||hi.body.hawaii?.customerState!=='review_required'||hi.body.hawaii?.paymentAllowed!==false||hi.body.shippingCents!==0) throw Error('Known HI '+JSON.stringify(hi));
            const order=await post('/api/store-checkout/orders',{source:'lithium',id:known.id,name:known.title,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview Review',state:'HI',countryCode:'US'}});
            if(order.status!==409||!order.body.hawaiiFreight) throw Error('HI review payment block '+order.status);
            let actualCount=0;
            for(const p of products){const q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'CO'}});if(q.status===200&&q.body?.battery?.actualBattery){actualCount++;if(q.body.shippingCents!==2799*Number(q.body.battery.batteryUnitsPerItem||1)||q.body.shippingRule?.rateCents!==2799)throw Error('Battery rule '+p.id)}}
            if(actualCount<1) throw Error('No batteries classified');
            const ak=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'AK'}});if(ak.status!==409||!String(ak.body.error||'').includes('Freight Review Required')) throw Error('AK boundary');
            console.log('KNOWN_12V100AH_LOWER48=BATTERY|2799');console.log('KNOWN_12V100AH_HAWAII=REVIEW_REQUIRED');console.log('KNOWN_12V100AH_PAYMENT_BLOCK=PASS');console.log('CLASSIFIED_ACTUAL_BATTERIES='+actualCount);console.log('ALASKA_REVIEW=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Browser performance, immediate Hawaii state and UX
        env:
          PREVIEW: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > verify.mjs <<'NODE'
          import fs from 'fs';import{chromium}from'playwright';
          const base=process.env.PREVIEW.replace(/\/$/,'');
          const before={'/':{requests:28,apiRequests:1,dom:271},'/lithium-batteries':{requests:39,apiRequests:3,dom:765},'/hawaii-lithium-batteries':{requests:57,apiRequests:41,dom:1613},'/rv-store':{requests:42,apiRequests:3,dom:516}};
          const browser=await chromium.launch({headless:true});const after={};
          for(const route of Object.keys(before)){
            const ctx=await browser.newContext({viewport:{width:1280,height:900}}),page=await ctx.newPage(),req=[],api=[];
            page.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});
            await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1800);const n=req.length;await page.waitForTimeout(2500);const idle=req.length-n;
            const snap=await page.evaluate(()=>({dom:document.getElementsByTagName('*').length,images:document.images.length,scripts:document.scripts.length}));
            after[route]={...snap,requests:req.length,apiRequests:api.length,idleRequests:idle,api:api.map(u=>new URL(u).pathname)};
            console.log('PERF_BEFORE '+route+' '+JSON.stringify(before[route]));console.log('PERF_AFTER '+route+' '+JSON.stringify(after[route]));
            if(idle!==0)throw Error(route+' idle request activity');
            if(route==='/'){if(await page.locator("[data-home-products='lithium'] .home-product-card").count()!==4||await page.locator("[data-home-products='rv'] .home-product-card").count()!==4)throw Error('homepage cards');if(api.some(u=>u.includes('/api/store/catalog')||u.includes('/api/store-catalog')))throw Error('homepage full Catalog')}
            if(route==='/lithium-batteries'&&api.some(u=>new URL(u).pathname==='/api/store/catalog'))throw Error('Lithium duplicate Catalog');
            if(route==='/rv-store'&&api.some(u=>new URL(u).pathname==='/api/store-catalog'))throw Error('RV duplicate Catalog');
            if(route==='/hawaii-lithium-batteries'){
              const singles=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/status').length,batches=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/statuses').length,catalogs=api.filter(u=>new URL(u).pathname==='/api/store/catalog').length;
              if(singles!==0||batches>1||catalogs!==0)throw Error(`Hawaii request pattern ${singles}/${batches}/${catalogs}`);
              if(after[route].requests>=57||after[route].apiRequests>=41)throw Error('Hawaii network load');
              if(await page.locator('.lithium-card').count()!==38)throw Error('Hawaii cards');
              const labels=await page.locator('[data-hawaii-status]').allTextContents();if(labels.some(v=>!['Shipping Available','Freight Review Required','Currently Unavailable'].includes(v.trim())))throw Error('Hawaii labels');
              if(await page.locator("a[href*='#hawaii-request']").count()<1)throw Error('review flow link');
            }
            await ctx.close();
          }
          const knownId='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';const ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage();
          await page.goto(`${base}/checkout/?source=lithium&id=${knownId}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForTimeout(800);
          if(!(await page.locator('#checkout-hawaii-freight').isVisible()))throw Error('immediate Hawaii panel');
          if(await page.locator('#checkout-address1').isVisible())throw Error('street address visible while HI loads');
          if(await page.locator('#checkout-paypal').isVisible())throw Error('PayPal visible while eligibility unresolved');
          const early=await page.locator('#checkout-hawaii-state').innerText();if(!early.includes('Checking'))throw Error('missing immediate checking state '+early);
          await page.waitForFunction(()=>document.querySelector('#checkout-hawaii-state')?.textContent?.includes('Freight Review Required'),null,{timeout:15000});
          const txt=await page.locator('#checkout-hawaii-freight').innerText();if(!txt.includes('Honolulu warehouse / freight-terminal pickup location')||!txt.includes('Additional delivery charges apply'))throw Error('HI wording');
          if(!(await page.locator('#checkout-name').isVisible())||!(await page.locator('#checkout-email').isVisible()))throw Error('contact fields');
          if(await page.locator('#checkout-address1').isVisible())throw Error('street address after HI result');
          if(await page.locator('#checkout-paypal').isVisible())throw Error('PayPal review-required');
          if(!(await page.locator('#checkout-hawaii-reserve').isVisible()))throw Error('review CTA');
          await ctx.close();await browser.close();fs.writeFileSync('/tmp/perf.json',JSON.stringify(after,null,2));
          NODE
          PREVIEW="$PREVIEW" node verify.mjs
      - name: Promotion controls and final receipt
        env:
          PREVIEW: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${PREVIEW%/}"
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/promo.json
          node <<'NODE'
          const p=require('/tmp/promo.json');
          if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z')throw Error('promo window');
          if(p.windowState!=='active')throw Error('promo current window '+p.windowState);
          if(p.batteryShippingCents!==2799)throw Error('promo battery shipping');
          if(p.active&&p.couponPercent!==25)throw Error('promo percent');
          console.log('PROMOTION='+JSON.stringify({active:p.active,manualActive:p.manualActive,windowState:p.windowState,couponPercent:p.couponPercent,startAt:p.startAt,endAt:p.endAt,batteryShippingCents:p.batteryShippingCents}));
          NODE
          echo "FINAL_CLEAN_PREVIEW=PASS"
          echo "APPLICATION_SHA=ed2eaee5a01e3a5f23e1322eb63fa03c058220a6"
          echo "PREVIEW_URL=$base"
