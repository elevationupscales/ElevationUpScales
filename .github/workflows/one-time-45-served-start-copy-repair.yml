name: One-Time 4.5 Served Start Copy Repair
on:
  push:
    branches:
      - hotfix/4.5-final-copy-footer-verification-2026-09-03
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Repair served Start-a-Project copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/4.5-final-copy-footer-verification-2026-09-03
          fetch-depth: 0
      - name: Repair actual served Start-a-Project page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/start-a-project.html')
          s=p.read_text()
          old1='Choose the closest match. Home, RV, and Solar remain the underlying Project families while Intake Intent tells management what kind of help brought you here.'
          new1='Pick the closest match. We’ll narrow the details on the next step.'
          old2='You can call Elevation now or continue the structured intake so the project is stored for management review.'
          new2='Need immediate help? Call now. Or continue the intake so the project is saved for follow-up.'
          if old1 not in s: raise SystemExit('served intent copy marker missing')
          if old2 not in s: raise SystemExit('served emergency copy marker missing')
          s=s.replace(old1,new1,1).replace(old2,new2,1).replace('stored for management review','saved for follow-up')
          p.write_text(s)
          for path in ('site/start-a-project.html','site/start-a-project/index.html'):
              text=Path(path).read_text().lower()
              for banned in ('underlying project families','intake intent tells management','management review'):
                  assert banned not in text,(path,banned)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = 'site/start-a-project.html'
      - name: Commit served copy repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/start-a-project.html
          git commit -m 'Remove internal jargon from served project intake'
          git push origin HEAD:hotfix/4.5-final-copy-footer-verification-2026-09-03
