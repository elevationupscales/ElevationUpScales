name: One-time SOK Commercialization Build v3

on:
  push:
    branches:
      - work/sok-4-6-catalog-commercialization-2026-09-04
    paths:
      - .github/workflows/one-time-sok-commercialization-build-v3.yml

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/sok-4-6-catalog-commercialization-2026-09-04
          fetch-depth: 0

      - name: Guard current production lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor origin/main HEAD
          test -f deployment/one-time-sok-commercialization-build.py

      - name: Repair QA generator and apply commercialization build
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('deployment/one-time-sok-commercialization-build.py')
          text=p.read_text()
          old=r'.join("\n");for(const event of analytics)'
          new=r'.join("\\n");for(const event of analytics)'
          if old not in text:
              raise SystemExit('expected QA generator escape marker not found')
          p.write_text(text.replace(old,new,1))
          PY
          python3 deployment/one-time-sok-commercialization-build.py

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          node deployment/qa/sok-commercialization-static.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          git status --short

      - name: Remove one-time build tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/one-time-sok-commercialization-build.yml \
            .github/workflows/one-time-sok-commercialization-build-v2.yml \
            .github/workflows/one-time-sok-commercialization-build-v3.yml \
            deployment/one-time-sok-commercialization-build.py

      - name: Commit commercialization candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add .github/workflows/release-candidate-gate.yml deployment/qa site
          git add -u
          git commit -m "Complete SOK catalog commercialization candidate"
          git push origin HEAD:work/sok-4-6-catalog-commercialization-2026-09-04
          echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Dispatch isolated RC gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          gh workflow run release-candidate-gate.yml \
            --ref work/sok-4-6-catalog-commercialization-2026-09-04 \
            -f candidate_ref=work/sok-4-6-catalog-commercialization-2026-09-04 \
            -f expected_parent_sha="$(git rev-parse origin/main)" \
            -f release_label=sok-4-6-catalog-commercialization
          echo "Candidate ${{ steps.commit.outputs.candidate_sha }} pushed; Release Candidate Gate dispatched."
