name: One-time SOK Full-Line Catalog Build

on:
  push:
    branches:
      - runner/sok-full-line-catalog-build-2026-09-04

permissions:
  contents: write

concurrency:
  group: one-time-sok-full-line-catalog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build runner
        uses: actions/checkout@v6
        with:
          ref: runner/sok-full-line-catalog-build-2026-09-04
          path: runner
      - name: Check out target branch
        uses: actions/checkout@v6
        with:
          ref: work/sok-full-line-catalog-2026-09-04
          fetch-depth: 0
          path: target
      - name: Install media tooling
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Build full SOK catalog and local media
        run: python runner/deployment/one-time-sok-full-line-finalize.py target
      - name: Validate candidate before commit
        working-directory: target
        run: |
          set -euo pipefail
          node deployment/qa/sok-commercialization-static.mjs
          node deployment/qa/sok-full-line-static.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          test -z "$(find site -type f -size +25M -print -quit)"
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site
      - name: Commit one-pass candidate
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "Elevation Release Automation"
          git config user.email "release@elevationupscales.com"
          git add site deployment/qa .github/workflows/release-candidate-gate.yml
          git status --short
          git diff --cached --quiet && { echo "No candidate changes to commit"; exit 1; }
          git commit -m "Complete SOK full-line shoppable catalog"
          git push origin HEAD:work/sok-full-line-catalog-2026-09-04
