name: One-Time Supplier Cost and Logistics Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-cost-logistics-fix.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: one-time-cost-logistics-fix
  cancel-in-progress: false

jobs:
  repair-and-deploy:
    name: Repair cost truth and logistics economics
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Record parent
        id: parent
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply one-time repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/fix-cost-logistics.py

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          node --check site/catalog-admin-runtime.js
          node --check site/worker-core.js
          node --check site/hawaii-lithium-runtime.js
          node --check site/admin-inventory.js
          git diff --check

          grep -q 'KNOWN_DOBA_COST_REFERENCE' site/catalog-admin-runtime.js
          grep -q 'supplier_cost_backfilled' site/catalog-admin-runtime.js
          grep -q 'Doba product cannot publish with a missing/zero supplier cost' site/catalog-admin-runtime.js
          grep -q 'Active Doba items require a non-zero supplier cost' site/worker-core.js
          grep -q 'Physical Inventory Cost' site/admin-inventory.html
          grep -q 'Supplier product cost must be greater than \$0 before route approval' site/hawaii-lithium-runtime.js
          grep -q 'catalog supplier cost is missing or zero' site/hawaii-lithium-runtime.js
          grep -q 'costDataComplete' site/hawaii-lithium-runtime.js

          # Preserve critical commerce/logistics boundaries.
          grep -q 'entry.shippingVerified !== true' site/_worker.js
          grep -q 'blockedStates' site/_worker.js
          grep -q 'FULL REVIEW REQUIRED' site/hawaii-lithium-runtime.js
          grep -q 'READY TO COMMIT' site/hawaii-lithium-runtime.js
          grep -q 'BOOKED' site/hawaii-lithium-runtime.js
          grep -q 'inventory_recheck_required' site/hawaii-lithium-runtime.js

      - name: Commit repaired application source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "elevationupscales"
          git config user.email "caseymyoung@gmail.com"
          git add site/catalog-admin-runtime.js site/worker-core.js site/admin-inventory.html site/hawaii-lithium-runtime.js
          if git diff --cached --quiet; then
            echo "No source changes were needed."
          else
            git commit -m "Fix supplier costs and logistics economics [cost-logistics-fix]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy isolated preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=github-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_URL%/}"
          test -n "$base"
          for route in / /admin-inventory.html /admin-catalog /admin-lithium-shipping.html /rv-store /store /checkout /hawaii-lithium-batteries /solar-project /start-a-project /marketplace; do
            code=$(curl --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 2 --output /tmp/eus-preview.html --write-out '%{http_code}' "${base}${route}")
            echo "${route} -> ${code}"
            test "$code" = "200"
          done
          curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/admin-inventory.html" | grep -q 'Physical Inventory Cost'

      - name: Deploy repaired source to production
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production routes and trigger safe cost backfill
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.production.outputs.deployment-url }}
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          smoke() {
            local base="${1%/}"
            for route in / /admin-inventory.html /admin-catalog /admin-lithium-shipping.html /rv-store /store /checkout /hawaii-lithium-batteries /solar-project /start-a-project /marketplace; do
              code=$(curl --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 45 --output /tmp/eus-prod.html --write-out '%{http_code}' "${base}${route}" || true)
              echo "${base}${route} -> ${code}"
              [[ "$code" == "200" ]] || return 1
            done
          }
          deployment="${DEPLOYMENT_URL%/}"
          if ! smoke "$deployment"; then
            sleep 8
            smoke "$PRODUCTION_URL"
          fi

          # Hit the production catalog API. The catalog runtime performs an idempotent
          # backfill only for known Doba records whose stored supplier cost is still 0.
          catalog_json=$(curl --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 45 "${PRODUCTION_URL}/api/store-catalog?section=rv-outdoor")
          python - "$catalog_json" <<'PY'
          import json, sys
          body=json.loads(sys.argv[1])
          count=int(body.get('count', 0))
          assert count > 0, f'expected non-empty RV catalog, got {count}'
          print('production_rv_catalog_count=', count)
          PY

          inventory_html=$(curl --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/admin-inventory.html")
          printf '%s' "$inventory_html" | grep -q 'Physical Inventory Cost'

          # Public Hawaii language must remain conservative.
          hawaii_html=$(curl --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 3 "${PRODUCTION_URL}/hawaii-lithium-batteries")
          ! printf '%s' "$hawaii_html" | grep -Eqi 'free Hawaii shipping|ships anywhere|DOT approved|hazmat approved|carrier approved'

      - name: Record deployment receipt summary
        shell: bash
        run: |
          {
            echo '### Supplier cost + logistics repair'
            echo "Parent: ${{ steps.parent.outputs.sha }}"
            echo "Application SHA: ${{ steps.commit.outputs.sha }}"
            echo "Preview: ${{ steps.preview.outputs.deployment-url }}"
            echo "Production: ${{ steps.production.outputs.deployment-url }}"
            echo 'Result: source validation, preview smoke, production smoke, and catalog backfill trigger PASS'
          } >> "$GITHUB_STEP_SUMMARY"
