name: One-Time Catalog Server Cache Purge

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  purge-and-verify:
    if: ${{ contains(github.event.head_commit.message, '[catalog-cache-purge]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify deployment-specific Worker protection
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/deploy-source.txt -w '%{http_code}' 'https://c1e7d03e.elevationupscales.pages.dev/catalog-admin-server.js' || true)
          echo "deployment source status=${code}"
          test "$code" = "404"

      - name: Purge cached custom-domain server source
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          zones=$(curl -sS --fail -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=elevationupscales.com&account.id=${CLOUDFLARE_ACCOUNT_ID}")
          zone_id=$(printf '%s' "$zones" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.[0]?.id)process.exit(2);process.stdout.write(j.result[0].id)})")
          test -n "$zone_id"
          response=$(curl -sS --fail -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache" --data '{"files":["https://elevationupscales.com/catalog-admin-server.js"]}')
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(j.success!==true)process.exit(3);console.log('targeted_cache_purge=PASS')})"

      - name: Verify custom-domain protection and commerce health
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          source_code=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/source.txt -w '%{http_code}' 'https://elevationupscales.com/catalog-admin-server.js' || true)
          echo "custom-domain source status=${source_code}"
          test "$source_code" = "404"
          auth_code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' 'https://elevationupscales.com/api/admin/catalog' || true)
          echo "catalog unauthenticated status=${auth_code}"
          test "$auth_code" = "401"
          grep -q 'Admin login required' /tmp/auth.json
          for route in /admin-catalog /lithium-batteries /hawaii-lithium-batteries /store /rv-store /solar-project /checkout; do
            code=$(curl -sS -L --connect-timeout 5 --max-time 20 -o /tmp/page.html -w '%{http_code}' "https://elevationupscales.com${route}" || true)
            echo "${route}=${code}"
            test "$code" = "200"
          done
          curl -sS --fail 'https://elevationupscales.com/api/store-checkout/config' > /tmp/config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));if(c.environment!=='live'||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true)throw new Error('PayPal regression')"

      - name: Receipt
        run: |
          echo '### Catalog Manager cache/security completion' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fresh deployment server source: 404' >> "$GITHUB_STEP_SUMMARY"
          echo 'Targeted Cloudflare cache purge: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Custom-domain server source: 404' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog API unauthenticated: 401' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commerce routes + PayPal: PASS' >> "$GITHUB_STEP_SUMMARY"
