          assert old in s; s=s.replace(old,new,1)
          s=s.replace('/store-checkout.css?v=4.4.0','/store-checkout.css?v=4.5.3',1).replace('/store-checkout.js?v=4.5.2','/store-checkout.js?v=4.5.3',1)
          p.write_text(s)

