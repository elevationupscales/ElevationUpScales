name: One-Time 4.5 Combined Commerce Hotfix Builder

on:
  push:
    branches:
      - runner/4.5-combined-build-2026-09-03

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/4.5-combined-commerce-hawaii-audit-2026-09-03
          fetch-depth: 0
      - name: Apply combined Hawaii and Lithium pricing corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Lithium-only protected merchandise floor. RV/Outdoor behavior remains unchanged.
          p=Path('site/promotion-runtime.js'); s=p.read_text()
          old='export function roundMarkup(costCents,markupPercent){const cost=int(costCents,0);return cost>0?Math.round(cost*(100+Number(markupPercent||0))/100):0;}\n'
          assert old in s
          new=old+'''export function protectedLithiumPricing(costCents,couponPercent=25){const cost=int(costCents,0),percent=Math.max(0,Math.min(100,int(couponPercent,25)));if(cost<=0)return{listCents:0,promoFloorCents:0};const promoFloorCents=Math.ceil(cost*1.20);let listCents=Math.ceil(cost*1.60);while(listCents-Math.round(listCents*percent/100)<promoFloorCents)listCents+=1;return{listCents,promoFloorCents};}\n'''
          s=s.replace(old,new,1)
          pattern=r'export function pricingForProduct\(product,config\)\{.*?\nexport function applyCoupon'
          m=re.search(pattern,s,re.S); assert m
          replacement='''export function pricingForProduct(product,config){
  const original=Math.max(0,int(product?.priceCents??product?.price_cents,0));
  if(!config?.available)return{priceCents:original,promotion:{active:false,eligible:false,couponEligible:false,reason:"promotion configuration unavailable"}};
  const cost=Math.max(0,int(product?.supplierCostCents??product?.costCents??product?.cost_cents,0));
  const section=sectionOf(product),supplier=supplierOf(product);
  const eligible=supplier==="doba"&&config.eligibleSections.includes(section)&&cost>0;
  const basis=config.active?config.promoMarkupPercent:config.everydayMarkupPercent;
  const protectedLithium=eligible&&section==="lithium-batteries";
  const floor=protectedLithium?protectedLithiumPricing(cost,config.couponPercent):null;
  const dynamicList=eligible?roundMarkup(cost,basis):original;
  const list=eligible?Math.max(dynamicList,Number(floor?.listCents||0)):original;
  const couponEligible=Boolean(config.active&&eligible);
  const discountOne=couponEligible?Math.round(list*config.couponPercent/100):0;
  const couponPrice=couponEligible?list-discountOne:list;
  return{priceCents:list,promotion:{active:Boolean(config.active),eligible,couponEligible,couponCode:couponEligible?config.couponCode:"",couponPercent:couponEligible?config.couponPercent:0,pricingMode:eligible?(protectedLithium?"lithium-protected-floor":config.active?"labor_day":"everyday"):"existing",markupPercent:eligible?basis:null,listPriceCents:list,couponPriceCents:couponPrice,shippingDiscounted:false,apparelEligible:false,protectedFloorApplied:Boolean(protectedLithium),protectedNormalFloorCents:floor?.listCents||0,protectedPromoFloorCents:floor?.promoFloorCents||0,reason:eligible?"":cost<=0?"verified supplier cost required":"product/provider excluded"}};
}
export function applyCoupon'''
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s)

          # 2) Server-rendered Hawaii listings: same Catalog product, separate Hawaii presentation.
          p=Path('site/_worker.js'); s=p.read_text()
          old='import { handlePromotionPublicApi, handlePromotionAdminApi } from "./promotion-runtime.js";'
          new='import { handlePromotionPublicApi, handlePromotionAdminApi, batteryUnitsPerCatalogUnit } from "./promotion-runtime.js";'
          assert old in s; s=s.replace(old,new,1)
          pattern=r'function lithiumCard\(product,hawaii=false\)\{.*?\}\nfunction rvCard'
          m=re.search(pattern,s,re.S); assert m
          replacement=r'''function lithiumCard(product,hawaii=false){const id=clean(product?.id||product?.sku,140);const sku=clean(product?.sku||product?.id,160);const view=lithiumView(product);const image=clean(product?.primaryImage||product?.images?.[0]||"/assets/logo.webp",1000);const detail=`/product?id=${encodeURIComponent(id)}&store=lithium${hawaii?"&program=hawaii":""}`;const checkout=`/checkout/?source=lithium&id=${encodeURIComponent(id)}&name=${encodeURIComponent(clean(product?.title||view.title,240))}${hawaii?"&state=HI":""}`;const review=`/hawaii-lithium-batteries?productId=${encodeURIComponent(id)}&product=${encodeURIComponent(clean(product?.title||view.title,240))}&qty=1#hawaii-request`;const shipping=hawaii?{label:"Checking Hawaii Availability",className:"is-quote"}:shippingPresentation(product);const inventory=Number.isFinite(Number(product?.supplierStock))?`${Math.max(0,Number(product.supplierStock))} available`:"Supplier-managed availability";const batteryUnits=hawaii?batteryUnitsPerCatalogUnit(product):0;const merchandiseCents=Number(product?.priceCents||0);const pickupFreightCents=batteryUnits>0?9900*batteryUnits:0;const pickupPriceCents=merchandiseCents+pickupFreightCents;return `<article class="lithium-card" data-product-id="${htmlEsc(id)}" data-hawaii-sku="${htmlEsc(sku)}" data-shipping-status="${htmlEsc(clean(product?.shippingStatus,30))}"${hawaii?` data-hawaii-merchandise-cents="${merchandiseCents}" data-hawaii-battery-units="${batteryUnits}"`:""}><div class="lithium-card__image"><a class="lithium-card__detail-link" href="${htmlEsc(detail)}" aria-label="View ${htmlEsc(view.title)} details"><img src="${htmlEsc(image)}" alt="${htmlEsc(view.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer"></a></div><div class="lithium-card__body"><p class="lithium-card__category">${htmlEsc(view.category)}</p><h3><a class="lithium-card__title-link" href="${htmlEsc(detail)}">${htmlEsc(view.title)}</a></h3>${view.specs?`<p class="lithium-card__spec-line">${htmlEsc(view.specs)}</p>`:""}<div class="lithium-card__shipping ${shipping.className}" data-hawaii-status>${htmlEsc(shipping.label)}</div>${hawaii?`<div class="hawaii-card-simple"><p><strong>Availability</strong><span>${htmlEsc(inventory)}</span></p><p><strong>Hawaii Pickup Price</strong><span data-hawaii-pickup-price>${batteryUnits>0?htmlEsc(money(pickupPriceCents)):"Freight Review Required"}</span></p><p><strong>Included Freight</strong><span>To our Honolulu warehouse / pickup location</span></p><p><strong>Address Delivery</strong><span>Additional charge · quote required</span></p></div>`:""}<div class="lithium-card__footer"><strong>${hawaii&&batteryUnits>0?htmlEsc(money(pickupPriceCents)):htmlEsc(money(product?.priceCents))}</strong><div class="lithium-card__actions"><a class="button button-outline" href="${htmlEsc(detail)}">View Details</a><a class="button button-primary"${hawaii?` data-hawaii-action data-checkout-url="${htmlEsc(checkout)}" data-review-url="${htmlEsc(review)}" href="${htmlEsc(review)}"`: ` href="${htmlEsc(checkout)}"`}>${hawaii?"Check Hawaii Availability":"Buy Now"}</a></div></div></div></article>`;}
function rvCard'''
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s)

          # 3) Client Hawaii listings mirror server-rendered presentation and enforce eligibility action.
          p=Path('site/lithium-shop.js'); s=p.read_text()
          anchor='''  function lower48Shipping(product) {
'''
          assert anchor in s
          helper='''  function batteryUnitsFor(product) {
    const title = textOnly(product?.title || product?.name || "").toLowerCase();
    const description = textOnly(product?.description || "").toLowerCase();
    const category = textOnly(product?.category || "").toLowerCase();
    const identity = `${title} ${String(product?.sku || "").toLowerCase()}`;
    const excluded = /battery\s*(?:box|case|tray|holder)|power\s*bank|power\s*station|\bcharger\b|charging\s*cable|\bcable\b|adapter|connector|terminal|monitor|meter|accessor/;
    const positive = /\blifepo4\b|\blithium(?:[- ]ion| iron phosphate)?\b[^.]{0,100}\bbatter(?:y|ies)\b|\bbatter(?:y|ies)\b[^.]{0,100}\b(?:12|24|36|48)\s*v\b|\b\d{2,4}\s*ah\b[^.]{0,100}\bbatter(?:y|ies)\b/;
    if (excluded.test(identity)) return 0;
    if (!positive.test(identity) && (excluded.test(description.slice(0,500)) || !positive.test(`${description} ${category}`))) return 0;
    const pack = title.match(/\b([2-9])\s*[- ]?(?:pack|pcs?|pieces?)\b/); if (pack) return Math.min(10, Number(pack[1]) || 1);
    const times = title.match(/\b([2-9])\s*[x×]\s*\d{2,4}\s*ah\b/); if (times) return Math.min(10, Number(times[1]) || 1);
    if (/\bdual\b|\btwo[- ]pack\b/.test(title)) return 2;
    return 1;
  }

'''
          s=s.replace(anchor,helper+anchor,1)
          pattern=r'  function card\(product\) \{.*?\n  \}\n\n  function renderCategories'
          m=re.search(pattern,s,re.S); assert m
          replacement=r'''  function card(product) {
    const sku = String(product.sku || product.id || "").trim();
    const id = String(product.id || "").trim();
    const view = viewFor(product);
    const shipping = lower48Shipping(product);
    const detailUrl = `/product?id=${encodeURIComponent(id)}&store=lithium${hawaiiMode ? "&program=hawaii" : ""}`;
    const checkoutUrl = `/checkout/?source=lithium&id=${encodeURIComponent(id)}&name=${encodeURIComponent(view.rawTitle || view.title)}${hawaiiMode ? "&state=HI" : ""}`;
    const reviewUrl = `/hawaii-lithium-batteries?productId=${encodeURIComponent(id)}&product=${encodeURIComponent(view.rawTitle || view.title)}&qty=1#hawaii-request`;
