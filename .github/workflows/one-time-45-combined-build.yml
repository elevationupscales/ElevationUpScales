name: One-Time 4.5 Combined Commerce Hotfix Builder

on:
  push:
    branches:
      - runner/4.5-combined-build-2026-09-03

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: hotfix/4.5-combined-commerce-hawaii-audit-2026-09-03
          fetch-depth: 0
      - name: Apply combined corrections
        run: python3 <(curl -fsSL "https://raw.githubusercontent.com/elevationupscales/ElevationUpScales/${{ github.sha }}/.github/scripts/combined_hotfix_patch.py")
        shell: bash
      - name: Validate combined source
        shell: bash
        run: |
          set -euo pipefail
          for f in site/promotion-runtime.js site/_worker.js site/lithium-shop.js site/product-detail.js site/store-checkout-server.js site/store-checkout.js; do node --check "$f"; done
          git diff --check
          file site/assets/homepage-option-2-lithium-solar.webp site/assets/homepage-option-3-home-rv-lifestyle.webp | tee /tmp/images.txt
          grep -q 'Web/P image' /tmp/images.txt
          grep -q 'lithium-protected-floor' site/promotion-runtime.js
          grep -q 'Hawaii Pickup Price' site/lithium-shop.js
          grep -q 'program=hawaii' site/lithium-shop.js
          grep -q 'pickupPriceCents' site/store-checkout-server.js
          grep -q 'Hawaii Pickup Price' site/checkout/index.html
          grep -q '208-813-4998' site/checkout/index.html
          grep -q 'WHAT HAPPENS NEXT' site/checkout/index.html
          ! grep -q '&ebay=' site/product-detail.js
      - name: Validate protected pricing math
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {protectedLithiumPricing} from './site/promotion-runtime.js';
          for (const cost of [1,11054,19183,24237,99999]) {
            const x=protectedLithiumPricing(cost,25);
            const after=x.listCents-Math.round(x.listCents*.25);
            if (x.listCents < Math.ceil(cost*1.60)) throw new Error(`normal floor failed ${cost}`);
            if (after < Math.ceil(cost*1.20)) throw new Error(`promo floor failed ${cost}`);
          }
          JS
      - name: Commit combined application changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          test "$(git rev-parse HEAD)" = "aa3960ed6d1178618678e7f34838d7fe08529f61"
          git add site/promotion-runtime.js site/_worker.js site/lithium-shop.js site/product-detail.js site/store-checkout-server.js site/store-checkout.js site/store-checkout.css site/checkout/index.html
          git commit -m 'Complete combined Hawaii pricing and checkout hotfix'
          git push origin HEAD:hotfix/4.5-combined-commerce-hawaii-audit-2026-09-03
          echo "Combined candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
