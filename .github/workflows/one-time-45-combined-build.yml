    const hawaiiPickupFreightCents = Number(next.hawaii?.pickupFreightCents ?? next.shippingCents ?? 0);
    const hawaiiPickupPriceCents = Number(next.hawaii?.pickupPriceCents ?? next.totalCents ?? 0);
    shippingEl.textContent = money(isHawaii ? hawaiiPickupFreightCents : next.shippingCents);
    if (shippingLabelEl) shippingLabelEl.textContent = isHawaii ? "Included Honolulu freight" : "Shipping";
    if (merchandiseLabelEl) merchandiseLabelEl.textContent = isHawaii ? (Number(next.discountCents) > 0 ? "Battery after Labor Day discount" : "Battery") : "Merchandise after coupon";
    if (listMerchandiseRow) listMerchandiseRow.hidden = isHawaii;
    if (totalLabelEl) totalLabelEl.textContent = isHawaii ? "Hawaii Pickup Price" : "Total";
    totalEl.textContent = money(isHawaii ? hawaiiPickupPriceCents : next.totalCents);
'''
          assert old in s; s=s.replace(old,new,1)
          pattern=r'      if \(hawaiiMath\) \{.*?\n      \}\n      if \(shippingEl\) shippingEl\.textContent = customerState === "shipping_available" \? money\(next\.shippingCents\) : \(customerState === "unavailable" \? "Unavailable" : "Review required"\);'
          m=re.search(pattern,s,re.S); assert m
          replacement='''      if (hawaiiPickupPriceEl) hawaiiPickupPriceEl.textContent = money(hawaiiPickupPriceCents);
      if (hawaiiMath) hawaiiMath.textContent = `Includes ${money(hawaiiPickupFreightCents)} freight to our Honolulu warehouse / pickup location. Freight is not discounted. Quantity: ${next.quantity}.`;
      if (shippingEl) shippingEl.textContent = money(hawaiiPickupFreightCents);'''
          s=s[:m.start()]+replacement+s[m.end():]
          p.write_text(s)

          # 7) Small styling for the single Hawaii pickup price, no redesign.
          p=Path('site/store-checkout.css'); s=p.read_text()
          if '.eus-checkout-hawaii-price' not in s:
            s += '\n.eus-checkout-hawaii-price{font-size:1.15rem;margin:.65rem 0}.eus-checkout-hawaii-price strong{color:#f0bd45}.eus-checkout-hawaii-price span{font-weight:800}\n'
          p.write_text(s)
          PY

          for f in site/promotion-runtime.js site/_worker.js site/lithium-shop.js site/product-detail.js site/store-checkout-server.js site/store-checkout.js; do node --check "$f"; done
          git diff --check
          file site/assets/homepage-option-2-lithium-solar.webp site/assets/homepage-option-3-home-rv-lifestyle.webp
          grep -q 'lithium-protected-floor' site/promotion-runtime.js
          grep -q 'Hawaii Pickup Price' site/lithium-shop.js
          grep -q 'program=hawaii' site/lithium-shop.js
          grep -q 'pickupPriceCents' site/store-checkout-server.js
          grep -q 'Hawaii Pickup Price' site/checkout/index.html
          grep -q '208-813-4998' site/checkout/index.html
          grep -q 'WHAT HAPPENS NEXT' site/checkout/index.html
          ! grep -q '&ebay=' site/product-detail.js
      - name: Validate protected pricing math
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {protectedLithiumPricing} from './site/promotion-runtime.js';
          for (const cost of [1,11054,19183,24237,99999]) {
            const x=protectedLithiumPricing(cost,25);
            const after=x.listCents-Math.round(x.listCents*.25);
            if (x.listCents < Math.ceil(cost*1.60)) throw new Error(`normal floor failed ${cost}`);
            if (after < Math.ceil(cost*1.20)) throw new Error(`promo floor failed ${cost}`);
          }
          JS
