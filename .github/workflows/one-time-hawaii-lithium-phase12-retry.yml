name: One-Time Hawaii Lithium Phase 1.2 Retry

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[hawaii-phase12-retry]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30
      - name: Parent and source validation
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bb8d2cd71d8f69da6adf1f5cb0046fe3ff36a67a HEAD
          node --check site/hawaii-lithium-runtime.js
          node --check site/admin-lithium-shipping.js
          node --check site/hawaii-lithium-program.js
          node --check site/lithium-shop.js
          node --check site/rv-store.js
          python - <<'PY'
          import re, html
          from pathlib import Path
          text='\n'.join(Path(p).read_text() for p in ['site/hawaii-lithium-batteries.html','site/lithium-batteries.html','site/rv-store.html'])
          text=re.sub(r'<script\b[^>]*>.*?</script>',' ',text,flags=re.I|re.S)
          text=re.sub(r'<style\b[^>]*>.*?</style>',' ',text,flags=re.I|re.S)
          text=html.unescape(re.sub(r'<[^>]+>',' ',text)).lower()
          text=re.sub(r'\s+',' ',text)
          banned=['phase 1','phase 2','safeguard','fallback','product rule','verified record','supplier record','source snapshot','catalog management','routing','seller hub','api','hold state','internal target','approved path','safe path','deployment','doba mapping','ebay mapping','unfiltered supplier dump']
          found=[term for term in banned if term in text]
          if found: raise SystemExit('Visible public copy contains internal terminology: '+', '.join(found))
          PY
      - name: Integrate Worker and customer navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          worker=Path('site/_worker.js'); w=worker.read_text()
          anchor='import { handleCatalogAdminApi, handleCatalogPublicApi } from "./catalog-admin-runtime.js";'
          imp='import { handleHawaiiLithiumAdminApi, handleHawaiiLithiumPublicApi } from "./hawaii-lithium-runtime.js";'
          if imp not in w: w=w.replace(anchor,anchor+'\n'+imp,1)
          old='["/worker-core.js", "/store-checkout-server.js", "/store-orders-admin-server.js", "/catalog-admin-server.js", "/catalog-admin-runtime.js"]'
          new='["/worker-core.js", "/store-checkout-server.js", "/store-orders-admin-server.js", "/catalog-admin-server.js", "/catalog-admin-runtime.js", "/hawaii-lithium-runtime.js"]'
          w=w.replace(old,new,1)
          pub='    if (url.pathname === "/api/store-catalog") {\n      return handleCatalogPublicApi(request, env, url.pathname);\n    }\n'
          if 'handleHawaiiLithiumPublicApi(request, env, url.pathname)' not in w: w=w.replace(pub,pub+'\n    if (url.pathname.startsWith("/api/hawaii-lithium/")) {\n      return handleHawaiiLithiumPublicApi(request, env, url.pathname);\n    }\n',1)
          adm='    if (url.pathname === "/api/admin/catalog" || url.pathname.startsWith("/api/admin/catalog/")) {\n      return handleCatalogAdminApi(request, env, url.pathname);\n    }\n'
          if 'handleHawaiiLithiumAdminApi(request, env, url.pathname)' not in w: w=w.replace(adm,adm+'\n    if (url.pathname === "/api/admin/lithium-shipping" || url.pathname.startsWith("/api/admin/lithium-shipping/")) {\n      return handleHawaiiLithiumAdminApi(request, env, url.pathname);\n    }\n',1)
          worker.write_text(w)
          routes=Path('site/_routes.json'); d=json.loads(routes.read_text());
          if '/hawaii-lithium-runtime.js' not in d['include']: d['include'].append('/hawaii-lithium-runtime.js')
          routes.write_text(json.dumps(d,indent=2)+'\n')
          shell=Path('site/site-shell.js'); s=shell.read_text().replace('["/hawaii-lithium-batteries", "Hawaii Lithium Shipping", "Hawaii eligibility, rates, and island shipping information"]','["/hawaii-lithium-batteries", "Hawaii Lithium Program", "Coming soon · reservations and Hawaii shipping availability"]'); shell.write_text(s)
          admin=Path('site/admin-catalog.html'); a=admin.read_text(); nav='<a class="button button-outline" href="/admin-store-orders.html">Store Orders</a>'; add=nav+'<a class="button button-outline" href="/admin-lithium-shipping.html">Lithium Shipping Matrix</a>'
          if 'href="/admin-lithium-shipping.html"' not in a: a=a.replace(nav,add,1)
          admin.write_text(a)
          home=Path('site/index.html'); h=home.read_text(); h=h.replace('<a href="/hawaii-lithium-batteries"><span><strong>Hawaii Lithium Shipping</strong><small>Hawaii eligibility, rates, and island shipping information</small></span></a>','<a href="/hawaii-lithium-batteries"><span><strong>Hawaii Lithium Program</strong><small>Coming soon · reserve for upcoming Hawaii shipments</small></span></a>'); h=h.replace('<a class="text-link-inline" href="/hawaii-lithium-batteries">Hawaii Lithium Shipping →</a>','<a class="text-link-inline" href="/hawaii-lithium-batteries"><strong>COMING SOON</strong> · Hawaii Lithium Program →</a>'); home.write_text(h)
          PY
          node --check site/_worker.js
          node --check site/site-shell.js
          grep -Fq 'handleHawaiiLithiumPublicApi' site/_worker.js
          grep -Fq 'handleHawaiiLithiumAdminApi' site/_worker.js
          grep -Fq '/hawaii-lithium-runtime.js' site/_routes.json
          grep -Fq 'COMING SOON</strong> · Hawaii Lithium Program' site/index.html
          grep -Fq 'Lithium Shipping Matrix' site/admin-catalog.html
          grep -Fq 'entry.shippingVerified !== true' site/store-checkout-server.js
          grep -Fq 'Secure checkout' site/checkout.html
          ! grep -Fq 'Sandbox checkout' site/checkout.html
      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/_worker.js site/_routes.json site/site-shell.js site/admin-catalog.html site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Hawaii Lithium Program Phase 1.2'
            git push origin HEAD:main
          fi
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Production verification
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 6
          for route in / /store /rv-store /marketplace /start-a-project /solar-project /lithium-batteries /hawaii-lithium-batteries /checkout /admin-catalog /admin-lithium-shipping; do
            code=$(curl -sS -L --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 -o /tmp/page.html -w '%{http_code}' "${PRODUCTION_URL}${route}" || true); echo "${route}=${code}"; test "$code" = "200";
          done
          curl -sS -L --fail "$PRODUCTION_URL/hawaii-lithium-batteries" > /tmp/hawaii.html
          grep -Fq 'COMING SOON · HAWAII LITHIUM PROGRAM' /tmp/hawaii.html
          grep -Fq 'Reserve for Next Hawaii Shipment' /tmp/hawaii.html
          ! grep -Fiq 'Phase 1 shipping safeguards' /tmp/hawaii.html
          curl -sS -L --fail "$PRODUCTION_URL/lithium-batteries" > /tmp/lithium.html
          grep -Fq 'Hawaii Lithium Program' /tmp/lithium.html
          ! grep -Fiq 'supplier/listing snapshot' /tmp/lithium.html
          curl -sS -L --fail "$PRODUCTION_URL/rv-store" > /tmp/rv.html
          grep -Fq 'RV & Outdoor gear selected by Elevation.' /tmp/rv.html
          ! grep -Fiq 'Seller Hub Order' /tmp/rv.html
          ! grep -Fiq 'protected checkout routing' /tmp/rv.html
          admin_code=$(curl -sS -o /tmp/adminapi.json -w '%{http_code}' "$PRODUCTION_URL/api/admin/lithium-shipping" || true); echo "admin=${admin_code}"; test "$admin_code" = "401"
          status_code=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$PRODUCTION_URL/api/hawaii-lithium/status?sku=DOES-NOT-EXIST" || true); echo "status=${status_code}"; test "$status_code" = "200"
          node - <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));if(s.eligible!==false||s.status!=='QUALIFICATION IN PROGRESS')throw new Error('Unqualified SKU exposed');
          NODE
          runtime_code=$(curl -sS -o /tmp/runtime.txt -w '%{http_code}' "$PRODUCTION_URL/hawaii-lithium-runtime.js" || true); test "$runtime_code" = "404"
          curl -sS --fail "$PRODUCTION_URL/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true)throw new Error('PayPal regression');
          NODE
          rv_code=$(curl -sS -o /tmp/rvquote.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true); test "$rv_code" = "200"
          held_code=$(curl -sS -o /tmp/held.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631058246","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631058246","name":"Quick Set Brown Pop-Up Gazebo"}' || true); test "$held_code" = "409"
          curl -sS --fail "$PRODUCTION_URL/api/marketplace/listings" > /tmp/market.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/market.json','utf8'));if(Number(d.count??d.listings?.length??0)<1)throw new Error('Marketplace regression');
          NODE
      - name: Receipt
        run: |
          echo '### Hawaii Lithium Program Phase 1.2 — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Coming Soon + unpaid reservation experience: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Shipping Matrix + batch pooling infrastructure: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unqualified product public eligibility gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public copy cleanup: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal / RV checkout / Marketplace: PASS' >> "$GITHUB_STEP_SUMMARY"
