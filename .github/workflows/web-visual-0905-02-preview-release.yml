name: WEB-VISUAL-0905-02 Preview + Visual Regression

on:
  push:
    branches:
      - control/web-visual-0905-02-release-20260905

permissions:
  contents: read
  deployments: write

concurrency:
  group: web-visual-0905-02-preview
  cancel-in-progress: false

jobs:
  preview-and-verify:
    runs-on: ubuntu-latest
    env:
      PARENT_SHA: 1ab4f033b395a441336428cf651a89d2921b4b3c
      CANDIDATE_SHA: 37e6f88a490af4ec62ebe7a0c5d88b7ae38df2c4
    steps:
      - name: Check out exact owner-approved candidate
        uses: actions/checkout@v6
        with:
          ref: 37e6f88a490af4ec62ebe7a0c5d88b7ae38df2c4
          fetch-depth: 0

      - name: Re-resolve lineage and exact release scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse origin/main)" = "$PARENT_SHA"
          git merge-base --is-ancestor "$PARENT_SHA" "$CANDIDATE_SHA"
          test "$(git rev-list --count "$PARENT_SHA".."$CANDIDATE_SHA")" = "1"
          git diff --name-only "$PARENT_SHA".."$CANDIDATE_SHA" | sort > /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt | tr -d ' ')" = "6"
          for file in \
            site/assets/brand/storefront-wordmark.note.txt \
            site/assets/brand/storefront-wordmark.webp \
            site/index.html \
            site/retail-first.css \
            site/sok-batteries.html \
            site/sok-order.html; do
            grep -Fxq "$file" /tmp/actual-files.txt
          done
          test -s site/assets/brand/storefront-wordmark.webp
          echo "wordmark_sha256=$(sha256sum site/assets/brand/storefront-wordmark.webp | awk '{print $1}')"
          cat /tmp/actual-files.txt
          echo "lineage_scope=PASS"

      - name: Verify protected systems remain byte-unchanged from production parent
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            site/store-checkout-server.js \
            site/store-checkout.js \
            site/promotion-runtime.js \
            site/shipping-rules-runtime.js \
            site/hawaii-lithium-runtime.js \
            site/sok-operations-runtime.js \
            site/sok-availability-runtime.js \
            site/sok-full-line-data.js \
            site/sok-full-line-runtime.js \
            site/worker/domains/marketplace.js \
            site/worker/domains/inventory.js; do
            git diff --quiet "$PARENT_SHA".."$CANDIDATE_SHA" -- "$file"
          done
          echo "protected_system_diff=PASS"

      - name: Run canonical repository and commerce gates
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          node deployment/qa/web-com-commerce-regression.mjs
          git diff --check
          git diff --exit-code

      - name: Verify storefront identity contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "/assets/brand/storefront-wordmark.webp" site/retail-first.css
          grep -Fq "object-fit:contain" site/retail-first.css
          grep -Fq "body.retail-store-shell:not(:has(.shop-intro))" site/retail-first.css
          grep -Fq "Power Beyond<br>the Grid." site/index.html
          grep -Fq "Authorized SOK Energy Dealer" site/index.html
          grep -Fq "shop-intro" site/store.html
          echo "storefront_identity_contract=PASS"

      - id: deploy
        name: Deploy exact candidate to isolated Cloudflare preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=web-visual-0905-02-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run canonical preview regression
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          echo "preview_url=$BASE"
          npm run qa:preview -- "${BASE%/}"

      - name: Install headless visual verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Desktop + mobile storefront visual regression
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          cat > visual-smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base = process.env.BASE.replace(/\/$/, '');
          const api = await fetch(base + '/api/store-products');
          if (!api.ok) throw new Error('store-products API ' + api.status);
          const raw = await api.json();
          const rows = Array.isArray(raw) ? raw : (raw.products || raw.items || raw.results || raw.data?.products || []);
          const live = rows.find(p => p && (p.id || p.sku) && String(p.publishStatus || p.publish_status || 'published').toLowerCase() === 'published');
          if (!live) throw new Error('No current published product available for product-detail visual QA');
          const productId = String(live.id || live.sku);
          const section = String(live.storeSection || live.store_section || '').toLowerCase().includes('lithium') ? 'lithium' : 'rv';
          const routes = [
            ['home','/'],
            ['lithium','/lithium-batteries'],
            ['sok-catalog','/sok-batteries'],
            ['sok-12v','/sok/sk12v100pc/'],
            ['sok-48v','/sok/sk48v100n/'],
            ['sok-order','/sok-order.html?sku=SK12V100PC&intent=purchase_options'],
            ['rv-store','/rv-store'],
            ['hawaii','/hawaii-lithium-batteries'],
            ['product',`/product?id=${encodeURIComponent(productId)}&store=${section}`],
            ['checkout','/checkout/?source=apparel&id=black-and-gold-signature-t-shirt'],
            ['apparel','/store']
          ];
          const browser = await chromium.launch({headless:true});
          const viewports = [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]];
          const report=[];
          for (const [mode, viewport] of viewports) {
            const context = await browser.newContext({viewport});
            for (const [name, path] of routes) {
              const page = await context.newPage();
              const broken=[];
              page.on('response', r => {
                const t=r.request().resourceType();
                if (r.status() >= 400 && ['document','stylesheet','script','image'].includes(t)) broken.push(`${r.status()} ${t} ${r.url()}`);
              });
              const response = await page.goto(base + path, {waitUntil:'domcontentloaded', timeout:45000});
              if (!response || response.status() !== 200) throw new Error(`${mode} ${path} document status ${response?.status()}`);
              await page.waitForTimeout(1800);
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
              if (overflow > 3) throw new Error(`${mode} ${path} horizontal overflow ${overflow}px`);
              const badImages = await page.locator('img').evaluateAll(imgs => imgs.filter(i => {
                const s=getComputedStyle(i); return s.display!=='none' && s.visibility!=='hidden' && i.getBoundingClientRect().width>2 && (!i.complete || i.naturalWidth===0);
              }).map(i => i.currentSrc || i.src || i.alt));
              if (badImages.length) throw new Error(`${mode} ${path} broken visible images: ${badImages.join(' | ')}`);
              if (broken.length) throw new Error(`${mode} ${path} broken assets: ${broken.join(' | ')}`);
              const brand = page.locator('.eus-brand>img').first();
              if (await brand.count()) {
                const mark = await brand.evaluate(el => ({content:getComputedStyle(el).content, objectFit:getComputedStyle(el).objectFit, w:el.getBoundingClientRect().width, h:el.getBoundingClientRect().height}));
                if (name === 'apparel') {
                  if (String(mark.content).includes('storefront-wordmark')) throw new Error(`${mode} /store storefront wordmark leaked into Apparel`);
                } else {
                  if (!String(mark.content).includes('storefront-wordmark')) throw new Error(`${mode} ${path} storefront wordmark missing`);
                  if (mark.objectFit !== 'contain') throw new Error(`${mode} ${path} wordmark object-fit=${mark.objectFit}`);
                  if (mark.w < 120 || mark.h < 35 || mark.h > 100) throw new Error(`${mode} ${path} wordmark box ${mark.w}x${mark.h}`);
                }
              }
              if (name === 'home') {
                if (!(await page.locator('.retail-hero').isVisible())) throw new Error(`${mode} homepage hero not visible`);
                if (!(await page.locator('.retail-hero .button').first().isVisible())) throw new Error(`${mode} homepage primary CTA not visible`);
              }
              if (name === 'sok-order' && (await page.locator('form input').count()) < 3) throw new Error(`${mode} SOK order form fields missing`);
              if (name === 'product') {
                const status = await page.locator('[data-product-status]').textContent().catch(()=> '');
                if (/unavailable|unable|error/i.test(String(status))) throw new Error(`${mode} valid product page status: ${status}`);
              }
              if (name === 'checkout') {
                const status = await page.locator('#checkout-status').textContent().catch(()=> '');
                if (/item is unavailable|checkout item is unavailable/i.test(String(status))) throw new Error(`${mode} eligible checkout did not load: ${status}`);
              }
              if (mode === 'mobile') {
                const toggle = page.locator('.eus-menu-toggle').first();
                if (await toggle.count() && await toggle.isVisible()) {
                  await toggle.click();
                  await page.waitForTimeout(150);
                  if ((await toggle.getAttribute('aria-expanded')) !== 'true') throw new Error(`mobile ${path} menu did not open`);
                }
              }
              await page.screenshot({path:`visual-evidence/${name}-${mode}.png`, fullPage:true});
              report.push({mode,path,status:200,overflow});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-evidence/report.json', JSON.stringify({base,productId,section,report},null,2));
          console.log(`desktop_mobile_visual_routes=${report.length}`);
          console.log('desktop_mobile_visual=PASS');
          NODE
          node visual-smoke.mjs
          rm -f visual-smoke.mjs

      - name: Verify preview PayPal safety boundary
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "${BASE%/}/api/store-checkout/config" -o /tmp/config.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/config.json'))
          assert d.get('ok') is True
          if d.get('environment') == 'live':
              assert d.get('checkoutEnabled') is False
              assert not d.get('clientId')
          print('preview_paypal_safety=PASS')
          print('preview_paypal_transaction=EXPECTED_NOT_VERIFIED')
          PY

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: web-visual-0905-02-preview-evidence
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          echo '### WEB-VISUAL-0905-02 preview gate — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Parent/current main: $PARENT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Exact six-file presentation scope: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical repository + commerce QA: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop/mobile visual regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel Bull + Bear exclusion: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview PayPal transaction: EXPECTED NOT VERIFIED by owner rule' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED by this workflow' >> "$GITHUB_STEP_SUMMARY"
