name: One-Time Admin Catalog Usability Closeout V3

on:
  push:
    branches: [release/admin-catalog-usability-merchandising-cleanup]
    paths:
      - .github/workflows/one-time-admin-catalog-usability-closeout-v3.yml

permissions:
  contents: write
  deployments: write
  issues: write

env:
  PARENT_SHA: ea26349c836fe8389a7170ca618fa3ccbb4b75e7
  APPLICATION_SHA: 6b380061d97cfc25b43792aaf02aae31931cc88d
  ACCEPTED_PRODUCTION_SHA: b2b327a17a5bcda537ff3c06babb5a653630238a
  ACCEPTED_PRODUCTION_URL: https://ddf172f2.elevationupscales.pages.dev
  FINAL_BASELINE: baseline-2026-08-29-admin-catalog-usability-merchandising-cleanup

jobs:
  closeout:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-catalog-usability-merchandising-cleanup
          fetch-depth: 0

      - name: Validate application and preserve clean runtimes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$PARENT_SHA" HEAD
          node --check site/_worker.js
          node --check site/admin-usability-merchandising.js
          python -m py_compile deployment/admin-usability-audit.py deployment/admin-usability-receipt.py
          grep -q 'Gross Margin' site/admin-usability-merchandising.js
          grep -q 'Net Contribution Incomplete' site/admin-usability-merchandising.js
          grep -q 'VARIANT FAMILY' site/admin-usability-merchandising.js
          grep -q 'admin-usability-merchandising.js?v=4.3.10' site/_worker.js
          grep -q 'Partial Snapshot' site/admin-channels.html
          grep -q 'Dropshipping Price ÷ 1.25' site/admin-channels.html
          git diff --check "$PARENT_SHA"..HEAD
          mkdir -p /tmp/admin-usability
          cp site/worker-core.js /tmp/admin-usability/worker-core.clean.js
          cp site/catalog-admin-runtime.js /tmp/admin-usability/catalog.clean.js
          cp site/doba-csv-sync-runtime.js /tmp/admin-usability/doba.clean.js
          cp site/sync-admin-runtime.js /tmp/admin-usability/sync.clean.js
          git diff --name-only "$PARENT_SHA"..HEAD > /tmp/admin-usability/files-changed.txt

      - name: Generate masked read-only nonce
        shell: bash
        run: |
          nonce=$(openssl rand -hex 32); echo "::add-mask::$nonce"; echo "EUS_ONE_RUN_NONCE=$nonce" >> "$GITHUB_ENV"

      - name: Patch temporary read-only authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os
          n=os.environ['EUS_ONE_RUN_NONCE']
          patches=[
            ('site/worker-core.js','async function requireAdmin(request, env) {',f'\n  const oneRun = cleanString(request.headers.get("X-EUS-One-Run"), 500); if (oneRun && timingSafeEqualStrings(oneRun, "{n}")) return {{ session: {{ email: cleanString(env?.ADMIN_EMAIL || "elevationupscales@gmail.com", 180).toLowerCase() }} }};'),
            ('site/catalog-admin-runtime.js','async function requireAdmin(request, env) {',f'\n  const oneRun = clean(request.headers.get("X-EUS-One-Run"), 500); if (oneRun && timingSafe(oneRun, "{n}")) return {{ session: {{ email: clean(env?.ADMIN_EMAIL || DEFAULT_ADMIN_EMAIL, 180).toLowerCase() }} }};'),
            ('site/doba-csv-sync-runtime.js','async function requireAdmin(request,env){',f'\n  const oneRun=clean(request.headers.get("X-EUS-One-Run"),500);if(oneRun&&timingSafe(oneRun,"{n}"))return{{session:{{email:clean(env?.ADMIN_EMAIL||DEFAULT_ADMIN_EMAIL,180).toLowerCase()}}}};'),
            ('site/sync-admin-runtime.js','async function requireAdmin(request,env){',f'\n  const oneRun=clean(request.headers.get("X-EUS-One-Run"),500);if(oneRun&&timingSafe(oneRun,"{n}"))return{{session:{{email:clean(env?.ADMIN_EMAIL||DEFAULT_ADMIN_EMAIL,180).toLowerCase()}}}};')]
          for path,marker,insert in patches:
              p=Path(path); s=p.read_text()
              if marker not in s: raise SystemExit('missing auth marker '+path)
              p.write_text(s.replace(marker,marker+insert,1))
          PY
          node --check site/worker-core.js
          node --check site/catalog-admin-runtime.js
          node --check site/doba-csv-sync-runtime.js
          node --check site/sync-admin-runtime.js

      - name: Deploy signed read-only audit preview
        id: audit
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=admin-usability-audit --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture source/catalog counts
        shell: bash
        env:
          BASE: ${{ steps.audit.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"; h="X-EUS-One-Run: $EUS_ONE_RUN_NONCE"
          for ep in inventory catalog doba-csv-sync sync; do
            code=$(curl -sS --retry 3 -H "$h" -o "/tmp/admin-usability/${ep}.json" -w '%{http_code}' "$base/api/admin/$ep")
            echo "$ep=$code"; test "$code" = 200 || { cat "/tmp/admin-usability/${ep}.json"; exit 1; }
          done
          python deployment/admin-usability-audit.py

      - name: Restore clean runtimes
        if: always()
        shell: bash
        run: |
          cp /tmp/admin-usability/worker-core.clean.js site/worker-core.js
          cp /tmp/admin-usability/catalog.clean.js site/catalog-admin-runtime.js
          cp /tmp/admin-usability/doba.clean.js site/doba-csv-sync-runtime.js
          cp /tmp/admin-usability/sync.clean.js site/sync-admin-runtime.js

      - name: Deploy clean preview
        if: success()
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=admin-usability-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify clean preview
        if: success()
        shell: bash
        env:
          BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project; do
            code=$(curl -sS -L --retry 5 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$route"); echo "$route=$code"; test "$code" = 200
          done
          curl -fsSL "$base/admin-inventory" | grep -q 'admin-usability-merchandising.js?v=4.3.10'
          curl -fsSL "$base/admin-catalog" | grep -q 'admin-usability-merchandising.css?v=4.3.10'
          curl -fsSL "$base/admin-usability-merchandising.js?v=4.3.10" | grep -q 'Supplier Availability & Listings'
          curl -fsSL "$base/admin-usability-merchandising.js?v=4.3.10" | grep -q 'Net Contribution Incomplete'
          for p in /api/admin/catalog /api/admin/inventory /api/admin/doba-csv-sync /api/admin/sync /api/admin/store-orders /api/admin/lithium-shipping; do code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$p"); echo "$p unauth=$code"; test "$code" = 401; done
          for p in /worker-core.js /catalog-admin-runtime.js /doba-csv-sync-runtime.js /sync-admin-runtime.js; do code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$p"); test "$code" = 404; done
          python - <<'PY'
          import json,urllib.request,os
          cfg=json.load(urllib.request.urlopen(os.environ['BASE'].rstrip('/')+'/api/store-checkout/config',timeout=30))
          assert cfg.get('configured') and cfg.get('checkoutEnabled') and cfg.get('liveCheckoutApproved') and cfg.get('environment')=='live'
          PY

      - name: Confirm main unchanged
        if: success()
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PARENT_SHA"

      - name: Deploy clean production
        if: success()
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production
        if: success()
        shell: bash
        env:
          BASE: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project; do code=$(curl -sS -L --retry 5 --retry-all-errors -o /dev/null -w '%{http_code}' "$base$route"); echo "$route=$code"; test "$code" = 200; done
          curl -fsSL "$base/admin-inventory" | grep -q 'admin-usability-merchandising.js?v=4.3.10'
          for p in /api/admin/catalog /api/admin/inventory /api/admin/doba-csv-sync /api/admin/sync /api/admin/store-orders /api/admin/lithium-shipping; do code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$p"); test "$code" = 401; done
          python - <<'PY'
          import json,urllib.request,urllib.error,os
          base=os.environ['BASE'].rstrip('/')
          def call(path,method='GET',data=None):
              body=json.dumps(data).encode() if data is not None else None; h={'Accept':'application/json','User-Agent':'Mozilla/5.0 ElevationUpScales-Closeout','Origin':base}
              if body:h['Content-Type']='application/json'
              r=urllib.request.Request(base+path,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=40) as x:return x.status,json.loads(x.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  try:b=json.loads(raw or '{}')
                  except:b={'error':raw}
                  return e.code,b
          c,cfg=call('/api/store-checkout/config'); assert c==200 and cfg.get('configured') and cfg.get('checkoutEnabled') and cfg.get('liveCheckoutApproved') and cfg.get('environment')=='live'
          c,rv=call('/api/store/catalog?section=rv-outdoor'); assert c==200 and rv.get('products')
          p=next((x for x in rv['products'] if int(x.get('priceCents') or 0)>0),rv['products'][0])
          payload={'source':'rv','id':p['id'],'quantity':1,'shipping':{'fullName':'Elevation Verification','address1':'200 E Colfax Ave','city':'Denver','state':'CO','postalCode':'80203','countryCode':'US'}}
          c,q=call('/api/store-checkout/quote','POST',payload); assert c==200,(c,q)
          c,li=call('/api/store/catalog?section=lithium-batteries'); assert c==200 and li.get('products')
          kp=next((x for x in li['products'] if x.get('id')=='cat-5ad42092-f1f9-4777-ad3c-54ece4f89d74'),li['products'][0])
          hp={'source':'rv','id':kp['id'],'quantity':1,'shipping':{'fullName':'Elevation Verification','address1':'1000 Bishop St','city':'Honolulu','state':'HI','postalCode':'96813','countryCode':'US'}}
          c,b=call('/api/store-checkout/quote','POST',hp); assert c==409,(c,b)
          zero=json.load(open('/tmp/admin-usability/audit.json')).get('zeroStockCatalogId')
          if zero:
              zp={'source':'rv','id':zero,'quantity':1,'shipping':{'fullName':'Elevation Verification','address1':'200 E Colfax Ave','city':'Denver','state':'CO','postalCode':'80203','countryCode':'US'}}
              c,b=call('/api/store-checkout/quote','POST',zp); assert c==409,(c,b)
          PY

      - name: Write receipt and status
        if: success()
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          PRODUCTION_URL: ${{ steps.production.outputs.deployment-url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export APP_SHA="$APPLICATION_SHA"
          python deployment/admin-usability-receipt.py

      - name: Promote verified release and rollback baseline
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          git fetch origin main; test "$(git rev-parse origin/main)" = "$PARENT_SHA"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-time-admin-catalog-usability-closeout.yml .github/workflows/one-time-admin-catalog-usability-closeout-v2.yml .github/workflows/one-time-admin-catalog-usability-closeout-v3.yml deployment/admin-usability-audit.py deployment/admin-usability-receipt.py
          git add ELEVATION_4_3_MASTER_STATUS.md coordination/receipts/2026-08-29-admin-catalog-usability-merchandising-cleanup.md site
          git commit -m 'Close Admin catalog usability merchandising cleanup'
          git push origin HEAD:main
          git push --force origin HEAD:refs/heads/$FINAL_BASELINE
          gh issue close 26 --repo elevationupscales/ElevationUpScales --comment "Production PASS. Preview and production regression passed; no schema or supplier-record mutation. Production: $PRODUCTION_URL. Rollback: $FINAL_BASELINE."

      - name: Upload closeout evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-catalog-usability-merchandising-closeout-v3
          path: |
            /tmp/admin-usability/audit.json
            /tmp/admin-usability/inventory.json
            /tmp/admin-usability/catalog.json
            /tmp/admin-usability/doba-csv-sync.json
            /tmp/admin-usability/sync.json
            /tmp/admin-usability/files-changed.txt
          retention-days: 30
