name: One-Time Elevation 4.4 RV Store CLS Final Verification
on:
  push:
    branches: [fix/4.4-rv-store-mobile-cls-final-2026-09-01]
permissions:
  contents: read
  deployments: write
jobs:
  verify-preview:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_MAIN_SHA: 310bafaeeef50fe2db09d53756e096b3c936611d
      APP_PATCH_SHA: e58c957bde871ce93d9971039fab851b4ca82a23
      CANONICAL_BASE: https://elevationupscales.com
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify lineage and exact repair scope
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$APP_PATCH_SHA" HEAD
          git diff --check "$EXPECTED_MAIN_SHA"..HEAD
          grep -q 'eus-labor-day-banner-slot" data-promo-slot' site/rv-store.html
          grep -q 'id="rv-category-rail" class="rv-category-rail"' site/rv-store.html
          grep -q 'min-height:36px' site/rv-store.css
      - name: Deploy exact repaired candidate to preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=rv-store-cls-final-preview-2026-09-01
      - name: Verify routes auth and production isolation
        env:
          PREVIEW_BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="$PREVIEW_BASE"
          test -n "$base"
          for route in / /rv-store /lithium-batteries /product /checkout /home-services /solar-services /marketplace /start-a-project /solar-project /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/x -w '%{http_code}' "$base$route")
            test "$code" = 200
          done
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping /api/admin/promotion; do
            code=$(curl -sS -o /tmp/a -w '%{http_code}' "$base$api" || true)
            test "$code" = 401
          done
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          curl -sS --fail "$CANONICAL_BASE/api/store-checkout/config" -o /tmp/cfg
          python - <<'PY'
          import json
          c=json.load(open('/tmp/cfg'))
          assert c.get('configured') is True
          assert c.get('credentialsConfigured') is True
          assert c.get('checkoutEnabled') is True
          assert c.get('liveCheckoutApproved') is True
          assert c.get('environment')=='live'
          PY
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Complete desktop mobile CWV regression
        env:
          PREVIEW_BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"; export CHROME
          cat > cwv.mjs <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          const base=process.env.PREVIEW_BASE.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const evidence=[];
          async function pageFor(viewport){
            const p=await browser.newPage({viewport});
            await p.addInitScript(()=>{
              window.__v={cls:0,lcp:0,shifts:[]};
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())if(!e.hadRecentInput){window.__v.cls+=e.value;window.__v.shifts.push({v:e.value,sources:(e.sources||[]).map(s=>s.node?.id||s.node?.className||s.node?.tagName||'')});}}).observe({type:'layout-shift',buffered:true});}catch{}
              try{new PerformanceObserver(list=>{for(const e of list.getEntries())window.__v.lcp=e.startTime;}).observe({type:'largest-contentful-paint',buffered:true});}catch{}
            });
            return p;
          }
          for(const [name,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){
            for(const route of ['/','/rv-store','/lithium-batteries','/home-services','/solar-services']){
              const p=await pageFor(viewport); const errors=[]; p.on('pageerror',e=>errors.push(String(e)));
              await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForTimeout(2600);
              assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),false,`${route} overflow`);
              assert.equal(errors.length,0,`${route} errors ${errors.join(';')}`);
              if(route==='/rv-store'){
                await p.waitForSelector('#rv-product-grid');
                await p.waitForSelector('#rv-category-rail');
                await p.waitForSelector('.eus-labor-day-banner');
                const slot=await p.locator('[data-promo-slot]').boundingBox();
                const banner=await p.locator('.eus-labor-day-banner').boundingBox();
                const rail=await p.locator('#rv-category-rail').boundingBox();
                assert.ok(slot&&banner&&rail);
                assert.ok(Math.abs(slot.height-banner.height)<8,`slot ${slot.height} banner ${banner.height}`);
                assert.ok(rail.height>=52,`rail ${rail.height}`);
              }
              const v=await p.evaluate(()=>window.__v);
              const limit=route==='/'?.10:.12;
              assert.ok(v.cls<=limit,`${route} ${name} CLS ${v.cls} ${JSON.stringify(v.shifts)}`);
              assert.ok(v.lcp>0,`${route} ${name} missing LCP`);
              evidence.push({route,name,cls:v.cls,lcp:v.lcp,shifts:v.shifts});
              await p.close();
            }
          }
          console.log(JSON.stringify(evidence,null,2));
          await browser.close();
          NODE
          node cwv.mjs
          rm -f cwv.mjs
      - name: Final isolation check
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          echo "RV STORE CLS REPAIR PREVIEW PASS preview=${{ steps.deploy.outputs.deployment-url }} app=$APP_PATCH_SHA"
