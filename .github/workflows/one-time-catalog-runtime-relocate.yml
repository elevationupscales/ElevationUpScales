name: One-Time Catalog Runtime Relocate

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  relocate-deploy-verify:
    if: ${{ contains(github.event.head_commit.message, '[catalog-runtime-relocate]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Relocate server-only Catalog module
        shell: bash
        run: |
          set -euo pipefail
          test -f site/catalog-admin-server.js
          git mv site/catalog-admin-server.js site/catalog-admin-runtime.js
          python - <<'PY'
          from pathlib import Path
          worker = Path('site/_worker.js')
          text = worker.read_text()
          text = text.replace('from "./catalog-admin-server.js";', 'from "./catalog-admin-runtime.js";')
          text = text.replace('"/catalog-admin-server.js"].includes', '"/catalog-admin-server.js", "/catalog-admin-runtime.js"].includes')
          worker.write_text(text)

          routes = Path('site/_routes.json')
          value = routes.read_text()
          if '"/catalog-admin-runtime.js"' not in value:
              value = value.replace('"/catalog-admin-server.js"', '"/catalog-admin-server.js",\n    "/catalog-admin-runtime.js"')
          routes.write_text(value)
          PY
          test ! -f site/catalog-admin-server.js
          test -f site/catalog-admin-runtime.js
          grep -q 'catalog-admin-runtime.js' site/_worker.js
          grep -q '"/catalog-admin-server.js"' site/_routes.json
          grep -q '"/catalog-admin-runtime.js"' site/_routes.json
          node --check site/catalog-admin-runtime.js
          node --check site/_worker.js

      - name: Commit permanent runtime relocation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/catalog-admin-runtime.js site/_worker.js site/_routes.json
          git add -u site/catalog-admin-server.js
          git commit -m 'Keep Catalog Manager server runtime off public asset path'
          git push origin HEAD:main

      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify server paths and commerce
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 3
          check_server_paths() {
            local base="$1"
            for path in /catalog-admin-server.js /catalog-admin-runtime.js; do
              code=$(curl -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/server.txt -w '%{http_code}' "${base%/}${path}" || true)
              echo "${base%/}${path}=${code}"
              test "$code" = "404"
            done
          }
          check_server_paths "${DEPLOYMENT_URL%/}"
          check_server_paths "$PRODUCTION_URL"

          auth_code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' "${PRODUCTION_URL}/api/admin/catalog" || true)
          echo "catalog unauthenticated=${auth_code}"
          test "$auth_code" = "401"
          grep -q 'Admin login required' /tmp/auth.json

          for route in / /store /rv-store /solar-project /lithium-batteries /hawaii-lithium-batteries /checkout /admin-catalog /admin-inventory.html /admin-store-orders.html; do
            code=$(curl -sS -L --connect-timeout 5 --max-time 20 -o /tmp/page.html -w '%{http_code}' "${PRODUCTION_URL}${route}" || true)
            echo "${route}=${code}"
            test "$code" = "200"
          done

          curl -sS --fail "${PRODUCTION_URL}/api/store-checkout/config" > /tmp/config.json
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true)throw new Error('PayPal regression')"

          rv_code=$(curl -sS -o /tmp/rv.json -w '%{http_code}' -X POST "${PRODUCTION_URL}/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/checkout/' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true)
          test "$rv_code" = "200"
          fallback_code=$(curl -sS -o /tmp/fallback.json -w '%{http_code}' -X POST "${PRODUCTION_URL}/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/checkout/' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631058246","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631058246","name":"Quick Set Brown Pop-Up Gazebo"}' || true)
          test "$fallback_code" = "409"

      - name: Receipt
        run: |
          echo '### Catalog Manager runtime protection' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Old Catalog server asset path: 404' >> "$GITHUB_STEP_SUMMARY"
          echo 'Current Catalog runtime asset path: 404' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog API auth: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'All commerce routes: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel PayPal + RV checkout/fallback: PASS' >> "$GITHUB_STEP_SUMMARY"
