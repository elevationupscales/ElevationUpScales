name: Elevation 4.5 Positioning Copy Preview

on:
  push:
    branches:
      - runner/4.5-positioning-copy-preview-2026-09-04

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0026087fed9f736698d4db3a5aad72990edf1472
          fetch-depth: 0

      - name: Verify protected baseline and exact patch scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0026087fed9f736698d4db3a5aad72990edf1472"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "23ac3ab83842ff9cd1df0eaf5e79ab8c60f518f6"
          git merge-base --is-ancestor 3c525a28df066a1394f0e5c07404fc4a0e820626 HEAD
          changed="$(git diff --name-only 3c525a28df066a1394f0e5c07404fc4a0e820626..HEAD)"
          expected=$(printf '%s\n' site/index.html site/what-we-do.html)
          test "$changed" = "$expected"
          git diff --check 3c525a28df066a1394f0e5c07404fc4a0e820626..HEAD
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site

      - name: Verify positioning copy before preview
        run: |
          set -euo pipefail
          grep -Fq 'OFF-GRID POWER • SUPPLY • LOGISTICS • MARKET ACCESS' site/index.html
          grep -Fq 'Power, supply and access for the places that are harder to serve.' site/index.html
          grep -Fq 'built from real-world off-grid living, RV systems, solar power, restoration work, and hands-on problem solving' site/index.html
          grep -Fq 'Practical experience behind the supply side.' site/index.html
          grep -Fq 'Hawaii Power &amp; Logistics' site/index.html
          ! grep -Fq 'Projects come first.' site/index.html
          ! grep -Fq 'HomeAndConstructionBusiness' site/index.html
          grep -Fq '"@type":"Organization"' site/index.html
          grep -Fq 'Bridge the gap between supply and demand.' site/what-we-do.html
          grep -Fq 'PRIMARY COMMERCIAL FOCUS' site/what-we-do.html
          grep -Fq 'SUPPORTING SERVICE' site/what-we-do.html || grep -Fq 'FIELD EXPERIENCE' site/what-we-do.html
          grep -Fq 'Technician Services' site/what-we-do.html
          ! grep -Fq 'Hands-on help for homes, RVs and off-grid systems.' site/what-we-do.html

      - id: deploy
        name: Deploy isolated positioning preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=position45preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview routes, copy, commerce and protected boundaries
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /what-we-do /store /rv-store /marketplace /lithium-batteries /hawaii-lithium-batteries /product?id=cat-e91de8a6-3e69-45b3-b749-605befbdb268 /checkout/ /start-a-project /solar-project /terms /privacy /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done

          curl -fsS "$base/" -o /tmp/home.html
          curl -fsS "$base/what-we-do" -o /tmp/what.html
          grep -Fq 'OFF-GRID POWER • SUPPLY • LOGISTICS • MARKET ACCESS' /tmp/home.html
          grep -Fq 'Power, supply and access for the places that are harder to serve.' /tmp/home.html
          grep -Fq 'Hawaii Power &amp; Logistics' /tmp/home.html
          ! grep -Fq 'Projects come first.' /tmp/home.html
          ! grep -Fq 'HomeAndConstructionBusiness' /tmp/home.html
          grep -Fq 'Bridge the gap between supply and demand.' /tmp/what.html
          grep -Fq 'Lithium Batteries' /tmp/what.html
          grep -Fq 'Hawaii Power &amp; Logistics' /tmp/what.html
          grep -Fq 'Technician Services' /tmp/what.html

          curl -fsS "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/lithium.json','utf8'));
          const products=Array.isArray(j)?j:(j.products||j.items||j.catalog||[]);
          if(products.length<31) throw new Error(`Lithium collection too small: ${products.length}`);
          const item=products.find(p=>p.id==='cat-e91de8a6-3e69-45b3-b749-605befbdb268'||p.sku==='D01027HH7BV-136');
          if(!item||Number(item.priceCents)!==17600) throw new Error('Representative price regression');
          const banned=['supplierStock','sourceType','sourceUrl','ebayItemId','fulfillmentMode','supplierIdentity','upstreamSupplier','authoritativeCostCents','recommendedRetailCents','protectedNormalFloorCents','protectedPromoFloorCents'];
          const raw=JSON.stringify(j);
          const leaked=banned.filter(k=>raw.includes(`"${k}"`));
          if(leaked.length) throw new Error(`Internal fields exposed: ${leaked.join(', ')}`);
          if(!('availabilityStatus' in item)||!('purchaseUrl' in item)) throw new Error('Protected public Catalog fields missing');
          NODE

          curl -fsS "$base/api/store/promotion" -o /tmp/promotion.json
          node -e 'const x=require("/tmp/promotion.json"); if(x.couponCode!=="LABORDAY25"||Number(x.couponPercent)!==25) process.exit(1)'
          curl -fsS "$base/api/shipping-rules" -o /tmp/shipping.json
          grep -q '2799' /tmp/shipping.json
          grep -q '9900' /tmp/shipping.json

          BASE_URL="$base" node - <<'NODE'
          const base=process.env.BASE_URL;
          async function call(path,options={}){const r=await fetch(base+path,options);let b;try{b=await r.json()}catch{b={}}return{status:r.status,body:b}}
          (async()=>{
            const headers={'Content-Type':'application/json','Origin':base};
            const id='cat-e91de8a6-3e69-45b3-b749-605befbdb268';
            const co=await call('/api/store-checkout/quote',{method:'POST',headers,body:JSON.stringify({source:'lithium',id,quantity:1,couponCode:'LABORDAY25',shipping:{state:'CO'}})});
            if(co.status!==200||Number(co.body.unitPriceCents)!==17600||Number(co.body.merchandiseCents)!==13200||Number(co.body.shippingCents)!==2799||co.body.promotion?.shippingDiscounted!==false)throw new Error('Lower 48 quote regression');
            const ak=await call('/api/store-checkout/quote',{method:'POST',headers,body:JSON.stringify({source:'lithium',id,quantity:1,couponCode:'LABORDAY25',shipping:{state:'AK'}})});
            if(ak.status!==409||ak.body.shippingReviewRequired!==true)throw new Error('Alaska gate regression');
            const hi=await call('/api/store-checkout/quote',{method:'POST',headers,body:JSON.stringify({source:'lithium',id,quantity:1,couponCode:'LABORDAY25',shipping:{state:'HI'}})});
            if(hi.status!==200||Number(hi.body.hawaii?.customerFreightPerBatteryCents)!==9900||hi.body.hawaii?.paymentAllowed!==false)throw new Error('Hawaii quote regression');
            const order=await call('/api/store-checkout/orders',{method:'POST',headers,body:JSON.stringify({source:'lithium',id,quantity:1,couponCode:'LABORDAY25',customer:{email:'positioning-preview@example.com'},shipping:{fullName:'Verification Only',address1:'1 Test Way',city:'Honolulu',state:'HI',postalCode:'96813',countryCode:'US'}})});
            if(order.status!==409||order.body.hawaiiFreight!==true)throw new Error('Hawaii pre-PayPal gate regression');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

          for internal in catalog-admin-runtime.js commerce-pricing-runtime.js doba-csv-sync-runtime.js; do
            code=$(curl -sS -o /tmp/internal -w '%{http_code}' "$base/$internal" || true)
            test "$code" = "404"
          done

      - name: Completion summary
        run: |
          echo '### Elevation 4.5 positioning/copy preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate: 0026087fed9f736698d4db3a5aad72990edf1472' >> "$GITHUB_STEP_SUMMARY"
          echo 'Changed application files: site/index.html, site/what-we-do.html' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production was not modified. Final production approval is still required.' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
