name: One-Time 4.5 Approved Commerce Control Production
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-approved-production-deploy.yml
permissions:
  contents: read
  deployments: write
jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact approved main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Exact source and rollback gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5ddb4e369f19017471bd8439044cd02ecee64806"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-45-*' -print -quit)"
          grep -q '.eus-checkout-page \[hidden\]{display:none!important}' site/store-checkout.css
          echo PRODUCTION_SOURCE_GATE=PASS
      - name: Deploy exact application to production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=main
      - name: Verify Pages deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"; echo DEPLOYMENT_URL=$base
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy; do code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 -o /tmp/r -w '%{http_code}' "$base$route" || true); echo "DEPLOY $route=$code"; test "$code" = 200; done
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/d-li.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store-catalog?section=rv-outdoor" -o /tmp/d-rv.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/featured" -o /tmp/d-f.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules" -o /tmp/d-rules.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/hawaii-lithium/statuses" -o /tmp/d-status.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/d-promo.json
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/d-l.html
          curl -fsSL --retry 8 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/d-h.html
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/d-li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/d-rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/d-f.json')),rules=JSON.parse(fs.readFileSync('/tmp/d-rules.json')).rules||[],st=JSON.parse(fs.readFileSync('/tmp/d-status.json')),p=JSON.parse(fs.readFileSync('/tmp/d-promo.json')),lh=fs.readFileSync('/tmp/d-l.html','utf8'),hh=fs.readFileSync('/tmp/d-h.html','utf8');if(li.length!==38||rv.length!==20||(f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('catalog');const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');if(l?.rateCents!==2799||h?.rateCents!==9900||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3||!d?.quoteRequired||d?.rateCents!==0||!a?.quoteRequired||a?.rateCents!==0)throw Error('rules');const prer={lithium:(lh.match(/class="lithium-card"/g)||[]).length,hawaii:(hh.match(/class="lithium-card"/g)||[]).length};if(prer.lithium!==38||prer.hawaii!==38||!hh.includes('data-prerendered="true"'))throw Error('prerender');const states={shipping_available:0,review_required:0,unavailable:0};for(const x of li){const s=st.statuses?.[x.id]||st.statuses?.[String(x.sku||'').toLowerCase()];if(s&&s.customerState in states)states[s.customerState]++}if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z'||p.windowState!=='active'||p.batteryShippingCents!==2799||!p.active||p.couponPercent!==25)throw Error('promotion');console.log('DEPLOYMENT_RUNTIME='+JSON.stringify({lithium:li.length,rv:rv.length,featured:'4+4',prerender:prer,hawaiiStates:states,promotion:{active:p.active,couponPercent:p.couponPercent}}));
          NODE
      - name: Verify canonical production
        env:
          CANONICAL: https://elevationupscales.com
        run: |
          set -euo pipefail
          base="$CANONICAL"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy; do code=$(curl -sS -L --retry 12 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 -o /tmp/r -w '%{http_code}' "$base$route" || true); echo "CANONICAL $route=$code"; test "$code" = 200; done
          curl -fsSL --retry 10 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/c-li.json
          curl -fsSL --retry 10 --retry-all-errors "$base/api/store-catalog?section=rv-outdoor" -o /tmp/c-rv.json
          curl -fsSL --retry 10 --retry-all-errors "$base/api/store/featured" -o /tmp/c-f.json
          curl -fsSL --retry 10 --retry-all-errors "$base/api/shipping-rules" -o /tmp/c-rules.json
          curl -fsSL --retry 10 --retry-all-errors "$base/api/hawaii-lithium/statuses" -o /tmp/c-status.json
          curl -fsSL --retry 10 --retry-all-errors "$base/api/store/promotion" -o /tmp/c-promo.json
          curl -fsSL --retry 10 --retry-all-errors "$base/lithium-batteries" -o /tmp/c-l.html
          curl -fsSL --retry 10 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/c-h.html
          curl -fsSL --retry 10 --retry-all-errors "$base/store-checkout.css" -o /tmp/c-css
          curl -fsSL --retry 10 --retry-all-errors "$base/site-shell.js" -o /tmp/c-shell
          curl -fsSL --retry 10 --retry-all-errors "$base/rv-store.js" -o /tmp/c-rvjs
          grep -q '.eus-checkout-page \[hidden\]{display:none!important}' /tmp/c-css
          grep -q 'Hawaii Lithium Shipping & Freight' /tmp/c-shell
          ! grep -q 'Hawaii Lithium Program' /tmp/c-shell
          ! grep -q '&ebay=' /tmp/c-rvjs
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/c-li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/c-rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/c-f.json')),rules=JSON.parse(fs.readFileSync('/tmp/c-rules.json')).rules||[],st=JSON.parse(fs.readFileSync('/tmp/c-status.json')),p=JSON.parse(fs.readFileSync('/tmp/c-promo.json')),lh=fs.readFileSync('/tmp/c-l.html','utf8'),hh=fs.readFileSync('/tmp/c-h.html','utf8');if(li.length!==38||rv.length!==20||(f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('canonical catalog');const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');if(l?.rateCents!==2799||h?.rateCents!==9900||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3||!d?.quoteRequired||!a?.quoteRequired)throw Error('canonical rules');if((lh.match(/class="lithium-card"/g)||[]).length!==38||(hh.match(/class="lithium-card"/g)||[]).length!==38)throw Error('canonical prerender');const states={shipping_available:0,review_required:0,unavailable:0};for(const x of li){const s=st.statuses?.[x.id]||st.statuses?.[String(x.sku||'').toLowerCase()];if(s&&s.customerState in states)states[s.customerState]++}if(!p.active||p.windowState!=='active'||p.couponPercent!==25||p.batteryShippingCents!==2799)throw Error('canonical promotion');console.log('CANONICAL_RUNTIME='+JSON.stringify({lithium:li.length,rv:rv.length,featured:'4+4',prerender:'38/38',hawaiiStates:states,promotion:{active:p.active,couponPercent:p.couponPercent}}));
          NODE
          node <<'NODE'
          (async()=>{const base='https://elevationupscales.com',id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';async function post(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}const co=await post('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'CO'}}),hi=await post('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'HI'}}),o=await post('/api/store-checkout/orders',{source:'lithium',id,quantity:1,customer:{email:'commerce45-production-proof@elevationupscales.com'},shipping:{fullName:'Production Proof',state:'HI',countryCode:'US'}});if(co.status!==200||co.body?.battery?.actualBattery!==true||co.body.shippingCents!==2799||hi.status!==200||hi.body.hawaii?.customerState!=='review_required'||hi.body.hawaii?.paymentAllowed!==false||o.status!==409||!o.body.hawaiiFreight)throw Error('canonical checkout');console.log('CANONICAL_CHECKOUT=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Canonical browser Hawaii proof
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw;cd /tmp/pw;npm init -y >/dev/null 2>&1;npm install --no-save playwright@latest >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat > verify.mjs <<'NODE'
          import{chromium}from'playwright';const base='https://elevationupscales.com',browser=await chromium.launch({headless:true}),ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage(),id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';await page.goto(`${base}/checkout/?source=lithium&id=${id}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForFunction(()=>document.querySelector('#checkout-hawaii-state')?.textContent?.includes('Checking Hawaii Shipping'),null,{timeout:3000});if(!(await page.locator('#checkout-hawaii-freight').isVisible())||await page.locator('#checkout-address1').isVisible()||await page.locator('#checkout-paypal').isVisible())throw Error('canonical HI immediate');await page.waitForFunction(()=>document.querySelector('#checkout-hawaii-state')?.textContent?.includes('Freight Review Required'),null,{timeout:15000});if(await page.locator('#checkout-address1').isVisible()||await page.locator('#checkout-paypal').isVisible()||!(await page.locator('#checkout-hawaii-reserve').isVisible()))throw Error('canonical HI final');console.log('CANONICAL_BROWSER=PASS');await ctx.close();await browser.close();
          NODE
          node verify.mjs
          echo PRODUCTION_VERIFY=PASS
          echo APPLICATION_SHA=5ddb4e369f19017471bd8439044cd02ecee64806
