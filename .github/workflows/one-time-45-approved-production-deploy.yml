name: One-Time 4.5 Approved Production Deployment

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths: [.github/workflows/one-time-45-approved-production-deploy.yml]

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-45-approved-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out exact approved production source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce approved production SHA and source invariants
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "687f1b7d9f24a85f3ada83df06c52edde872d8b6"
          git merge-base --is-ancestor cc5f59fa8d7374d41d51ec56a0e91e20198cb612 HEAD
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check cc5f59fa8d7374d41d51ec56a0e91e20198cb612...HEAD
          grep -q 'Hawaii Lithium Shipping & Freight' site/site-shell.js
          ! grep -q 'Hawaii Lithium Program' site/site-shell.js
          grep -q 'Hawaii Lithium Shipping &amp; Freight' site/store.html
          grep -q 'Hawaii Lithium Shipping &amp; Freight' site/rv-store.html
          ! grep -q '&ebay=' site/rv-store.js
          ! grep -q '&ebay=' site/_worker.js
          ! grep -q 'params.get("ebay")' site/store-checkout.js
          ! grep -q 'raw?.ebayUrl\|raw.ebayUrl' site/store-checkout-server.js
          grep -q 'catalogRvFallbackUrl' site/store-checkout-server.js
          grep -q 'PROMOTION_START_AT="2026-09-03T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'PROMOTION_END_AT="2026-09-08T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'couponPercent:25' site/promotion-runtime.js
          grep -q 'batteryShippingCents:2799' site/promotion-runtime.js

      - name: Deploy approved source to Cloudflare production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          test -n "$base"
          echo "PRODUCTION_DEPLOYMENT_URL=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /marketplace /terms /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 -o /tmp/page.html -w '%{http_code}' "$base$route" || true)
            echo "DEPLOYMENT_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/lithium.json','utf8')); const p=Array.isArray(d.products)?d.products:[];
          console.log(`DEPLOYMENT_LITHIUM_COUNT=${p.length}`);
          if(p.length!==38) throw new Error(`Expected 38 Lithium products, got ${p.length}`);
          if(p.some(x=>!(Number(x.priceCents)>0))) throw new Error('Lithium product missing positive price');
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/lithium.html
          node <<'NODE'
          const fs=require('fs'); const h=fs.readFileSync('/tmp/lithium.html','utf8'); const cards=(h.match(/class="lithium-card"/g)||[]).length;
          if(!h.includes('data-prerendered="true"') || cards!==38) throw new Error(`Lithium prerender mismatch: ${cards}`);
          console.log(`DEPLOYMENT_LITHIUM_PRERENDER=${cards}`);
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/site-shell.js" -o /tmp/shell.js
          grep -q 'Hawaii Lithium Shipping & Freight' /tmp/shell.js
          ! grep -q 'Hawaii Lithium Program' /tmp/shell.js
          curl -fsSL --retry 8 --retry-all-errors "$base/rv-store.js" -o /tmp/rv.js
          ! grep -q '&ebay=' /tmp/rv.js
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/promo.json
          node <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/promo.json','utf8'));
          if(p.startAt!=='2026-09-03T06:00:00.000Z' || p.endAt!=='2026-09-08T06:00:00.000Z') throw new Error('Promotion window mismatch');
          const now=Date.now(), start=Date.parse(p.startAt), end=Date.parse(p.endAt);
          if(now<start && p.active!==false) throw new Error('Promotion active before authorized start');
          if(now>=end && p.active!==false) throw new Error('Promotion active after authorized end');
          console.log('DEPLOYMENT_PROMOTION='+JSON.stringify(p));
          NODE

      - name: Verify canonical custom domain
        shell: bash
        run: |
          set -euo pipefail
          base="https://elevationupscales.com"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /marketplace /terms; do
            code=$(curl -sS -L --retry 12 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' -o /tmp/canonical.html -w '%{http_code}' "$base$route" || true)
            echo "CANONICAL_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/site-shell.js?verify=45-687f1b7" -o /tmp/canonical-shell.js
          grep -q 'Hawaii Lithium Shipping & Freight' /tmp/canonical-shell.js
          ! grep -q 'Hawaii Lithium Program' /tmp/canonical-shell.js
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/store?verify=45-687f1b7" -o /tmp/canonical-store.html
          grep -q 'Hawaii Lithium Shipping &amp; Freight' /tmp/canonical-store.html
          ! grep -q 'Hawaii Lithium Program' /tmp/canonical-store.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/rv-store?verify=45-687f1b7" -o /tmp/canonical-rv.html
          grep -q 'Hawaii Lithium Shipping &amp; Freight' /tmp/canonical-rv.html
          ! grep -q 'Hawaii Lithium Program' /tmp/canonical-rv.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/api/store/catalog?section=lithium-batteries&verify=45-687f1b7" -o /tmp/canonical-lithium.json
          node <<'NODE'
          const fs=require('fs'); const d=JSON.parse(fs.readFileSync('/tmp/canonical-lithium.json','utf8')); const p=Array.isArray(d.products)?d.products:[];
          console.log(`CANONICAL_LITHIUM_COUNT=${p.length}`); if(p.length!==38) throw new Error(`Canonical Lithium expected 38, got ${p.length}`);
          NODE
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/lithium-batteries?verify=45-687f1b7" -o /tmp/canonical-lithium.html
          node <<'NODE'
          const fs=require('fs'); const h=fs.readFileSync('/tmp/canonical-lithium.html','utf8'); const cards=(h.match(/class="lithium-card"/g)||[]).length;
          console.log(`CANONICAL_LITHIUM_PRERENDER=${cards}`); if(!h.includes('data-prerendered="true"') || cards!==38) throw new Error('Canonical Lithium prerender mismatch');
          NODE
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 3 -H 'Cache-Control: no-cache' "$base/api/store/promotion?verify=45-687f1b7" -o /tmp/canonical-promo.json
          node <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync('/tmp/canonical-promo.json','utf8'));
          console.log('CANONICAL_PROMOTION='+JSON.stringify(p));
          if(p.startAt!=='2026-09-03T06:00:00.000Z' || p.endAt!=='2026-09-08T06:00:00.000Z') throw new Error('Canonical promotion window mismatch');
          const now=Date.now(), start=Date.parse(p.startAt), end=Date.parse(p.endAt);
          if(now<start && p.active!==false) throw new Error('Canonical promotion active before start');
          if(now>=end && p.active!==false) throw new Error('Canonical promotion active after end');
          NODE

      - name: Production receipt
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.5 production reconciliation — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Approved source: 687f1b7d9f24a85f3ada83df06c52edde872d8b6' >> "$GITHUB_STEP_SUMMARY"
          echo 'Previous production: cc5f59fa8d7374d41d51ec56a0e91e20198cb612' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rollback: baseline-2026-09-02-pre-production-reconciliation' >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Lithium: 38/38 API + 38/38 prerender PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hawaii navigation/disclosure: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV checkout URL cleanup/server fallback: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Labor Day time enforcement: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical custom domain: PASS' >> "$GITHUB_STEP_SUMMARY"
