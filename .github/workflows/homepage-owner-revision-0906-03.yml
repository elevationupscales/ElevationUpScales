name: HOMEPAGE-OWNER-REVISION-0906-03

on:
  push:
    branches:
      - work/homepage-owner-revision-0906-03

permissions:
  contents: write
  deployments: write

concurrency:
  group: homepage-owner-revision-0906-03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply owner logistics-first copy correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('site/index.html')
          s = p.read_text()
          replacements = {
            '<p class="reference-storefront-hero__eyebrow">RV BATTERY SUPPLY <span aria-hidden="true">|</span> AUTHORIZED SOK ENERGY DEALER</p>':
              '<p class="reference-storefront-hero__eyebrow">LITHIUM BATTERY SUPPLY <span aria-hidden="true">|</span> HAWAII &amp; ALASKA SHIPPING LOGISTICS</p>',
            '<h1 id="reference-flagship-title">Lithium Energy<br><span>for RV Life.</span></h1>':
              '<h1 id="reference-flagship-title">Lithium Energy Supply<br><span>And Shipping Logistics</span></h1>',
            '<p class="reference-storefront-hero__lead"><strong>RV batteries are our primary product focus.</strong> Shop SOK lithium systems with clear purchase options, system support and destination logistics for RV, solar, backup power and harder-to-serve markets.</p>':
              '<p class="reference-storefront-hero__lead"><strong>Battery shipping to Hawaii and Alaska is a core Elevation focus.</strong> Lithium energy supply, SOK purchase options and destination logistics for RV, solar, backup power, commercial systems and harder-to-serve markets.</p>',
            '>Shop RV Batteries <span aria-hidden="true">→</span></a>':
              '>Explore Power Solutions <span aria-hidden="true">→</span></a>',
            '<span>RV<br>Batteries</span>':
              '<span>Lithium<br>Batteries</span>',
          }
          changed = False
          for old, new in replacements.items():
            if old in s:
              s = s.replace(old, new, 1)
              changed = True
            elif new not in s:
              raise SystemExit(f'expected copy state not found: {old[:80]}')
          if changed:
            p.write_text(s)
          PY
      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9b9f8c62378b2a085e9849dca8e7fd53c04bfa28 HEAD
          npm run qa
          grep -q 'LITHIUM BATTERY SUPPLY' site/index.html
          grep -q 'HAWAII &amp; ALASKA SHIPPING LOGISTICS' site/index.html
          grep -q 'Lithium Energy Supply<br><span>And Shipping Logistics</span>' site/index.html
          grep -q 'Battery shipping to Hawaii and Alaska is a core Elevation focus.' site/index.html
          grep -q 'Explore Power Solutions' site/index.html
          ! grep -q 'RV batteries are our primary product focus.' site/index.html
          ! grep -q 'Shop RV Batteries' site/index.html
          ! grep -q 'for RV Life.' site/index.html
          grep -q 'Power supply does not stop at the shoreline.' site/index.html
          grep -q 'Premium SOK Energy Products' site/index.html
          test -s site/assets/hero/hawaii-ocean-freight-v1.webp
          test "$(jq '[.slides[]|select(.active==true)]|length' site/home-hero-slides.json)" -ge 8
          ! grep -q 'Real Support\|Talk to a real person' site/index.html site/home-hero-slides.js
          git diff --check
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=homepage-owner-revision-0906-03-pre
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser homepage verification
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          async function verify(width,height){
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto(`${base}/`,{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('[data-reference-flagship]',{timeout:15000});
            await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();
            await page.waitForSelector('[data-home-products="lithium"] .home-product-card',{timeout:20000});
            const state=await page.evaluate(()=>({
              title:document.querySelector('#reference-flagship-title')?.innerText.trim(),
              eyebrow:document.querySelector('.reference-storefront-hero__eyebrow')?.innerText.trim(),
              lead:document.querySelector('.reference-storefront-hero__lead')?.innerText.trim(),
              primary:document.querySelector('.reference-storefront-hero__primary')?.innerText.trim(),
              partnership:document.querySelector('.reference-sok-partnership')?.innerText.trim(),
              solutions:document.querySelectorAll('.reference-solution-card').length,
              slides:document.querySelectorAll('.home-hero-slide').length,
              lithium:document.querySelectorAll('[data-home-products="lithium"] .home-product-card').length,
              rv:document.querySelectorAll('[data-home-products="rv"] .home-product-card').length,
              support:document.querySelector('[data-reference-trust]')?.innerText||'',
              footerLinks:document.querySelectorAll('.reference-footer a').length,
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if(state.title!=='Lithium Energy Supply\nAnd Shipping Logistics') throw new Error(`headline mismatch ${JSON.stringify(state)}`);
            if(!state.eyebrow.includes('LITHIUM BATTERY SUPPLY')||!state.eyebrow.includes('HAWAII & ALASKA SHIPPING LOGISTICS')) throw new Error(`eyebrow mismatch ${JSON.stringify(state)}`);
            if(!state.lead.startsWith('Battery shipping to Hawaii and Alaska is a core Elevation focus.')) throw new Error(`lead mismatch ${JSON.stringify(state)}`);
            if(!state.primary.startsWith('EXPLORE POWER SOLUTIONS')) throw new Error(`cta mismatch ${JSON.stringify(state)}`);
            if(!state.partnership.toLowerCase().includes('premium sok energy products')||state.solutions!==7||state.slides<8) throw new Error(`merchandising mismatch ${JSON.stringify(state)}`);
            if(/real support|real person/.test(state.support.toLowerCase())||!state.support.toLowerCase().includes('support')) throw new Error(`support wording mismatch ${JSON.stringify(state)}`);
            if(state.lithium<4||state.rv<4||state.footerLinks<12||state.overflow>1) throw new Error(`layout/catalog mismatch ${JSON.stringify(state)}`);
            await page.screenshot({path:`/tmp/home-${width}.png`,fullPage:true});
            await page.close();
          }
          await verify(1440,1000);
          await verify(390,844);
          await browser.close();
          NODE
      - name: Preview smoke
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -fsSL "$base/" -o /tmp/home.html
          grep -q 'Lithium Energy Supply' /tmp/home.html
          grep -q 'And Shipping Logistics' /tmp/home.html
          grep -q 'Hawaii and Alaska is a core Elevation focus' /tmp/home.html
          ! grep -q 'RV batteries are our primary product focus' /tmp/home.html
          curl -fsSL "$base/home-hero-slides.json?v=1.2.0" -o /tmp/slides.json
          test "$(jq '[.slides[]|select(.active==true)]|length' /tmp/slides.json)" -ge 8
          npm run qa:preview -- "$base"
      - name: Preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### HOMEPAGE OWNER REVISION — LOGISTICS-FIRST PREVIEW PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Hero: Lithium Energy Supply And Shipping Logistics' >> "$GITHUB_STEP_SUMMARY"
          echo 'Positioning: lithium battery supply + Hawaii/Alaska shipping logistics' >> "$GITHUB_STEP_SUMMARY"
          echo 'Desktop and mobile homepage checks passed. Production unchanged.' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist owner logistics-first copy correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html; then
            exit 0
          fi
          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add site/index.html
          git commit -m 'fix(home): restore logistics-first owner copy'
          git push origin HEAD:work/homepage-owner-revision-0906-03
