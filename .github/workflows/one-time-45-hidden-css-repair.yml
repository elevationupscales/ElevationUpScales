name: One-Time 4.5 Hidden CSS Repair
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-hidden-css-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          fetch-depth: 0
      - name: Respect hidden state in checkout
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/store-checkout.css')
          s=p.read_text()
          rule='\n.eus-checkout-page [hidden]{display:none!important}\n'
          if rule.strip() not in s:
              s += rule
          p.write_text(s)
          PY
          git diff --check
          grep -q '.eus-checkout-page \[hidden\]{display:none!important}' site/store-checkout.css
      - name: Commit clean repaired candidate
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/store-checkout.css
          git commit -m "Respect hidden checkout fields for Hawaii pickup"
          git push origin HEAD:refs/heads/release/4.5-commerce-control-clean-final-2026-09-03 --force
          echo "FINAL_APP_SHA=$(git rev-parse HEAD)"
