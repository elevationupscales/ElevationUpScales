name: WEB-VISUAL-0905-02 Cache Bust Preview Gate

on:
  push:
    branches:
      - control/web-visual-0905-02-cache-bust-preview-20260905

permissions:
  contents: read
  deployments: write

env:
  PARENT_SHA: 37e6f88a490af4ec62ebe7a0c5d88b7ae38df2c4
  HOTFIX_SHA: b8300a0060dba7a690d17bde7a995bcc591184fb

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b8300a0060dba7a690d17bde7a995bcc591184fb
          fetch-depth: 0

      - name: Re-resolve exact hotfix state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main hotfix/web-visual-0905-02-retail-css-cache-bust --no-tags --prune
          test "$(git rev-parse HEAD)" = "$HOTFIX_SHA"
          test "$(git rev-parse origin/main)" = "$PARENT_SHA"
          test "$(git rev-parse origin/hotfix/web-visual-0905-02-retail-css-cache-bust)" = "$HOTFIX_SHA"
          test "$(git rev-list --count "$PARENT_SHA".."$HOTFIX_SHA")" = 1
          git diff --name-only "$PARENT_SHA".."$HOTFIX_SHA" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          site/checkout/index.html
          site/collector.html
          site/hawaii-lithium-batteries.html
          site/lithium-batteries.html
          site/product.html
          site/rv-store.html
          site/site-shell.js
          site/sok-batteries.html
          site/sok-full-line-runtime.js
          site/sok-order.html
          site/store.html
          EOF
          diff -u /tmp/expected /tmp/actual
          echo exact_hotfix_state=PASS

      - name: Static and commerce regression
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          node deployment/qa/web-com-commerce-regression.mjs
          git diff --check
          echo static_regression=PASS

      - id: deploy
        name: Deploy isolated hotfix preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=web-visual-0905-02-cache-bust-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Canonical preview route/security/SOK regression
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          npm run qa:preview -- "${BASE%/}"
          echo preview_route_security=PASS

      - name: Install browser verifier
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Desktop/mobile storefront cache-bust visual gate
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p hotfix-preview-evidence
          cat > verify.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base=process.env.BASE.replace(/\/$/,'');
          const api=await fetch(base+'/api/store-products');
          if(!api.ok) throw new Error('store-products '+api.status);
          const raw=await api.json();
          const rows=Array.isArray(raw)?raw:(raw.products||raw.items||raw.results||raw.data?.products||[]);
          const live=rows.find(p=>p&&(p.id||p.sku)&&String(p.publishStatus||p.publish_status||'published').toLowerCase()==='published');
          if(!live) throw new Error('No current published product');
          const productId=String(live.id||live.sku);
          const section=String(live.storeSection||live.store_section||'').toLowerCase().includes('lithium')?'lithium':'rv';
          const routes=[
            ['home','/',true],
            ['sok-catalog','/sok-batteries',true],
            ['sok-12v','/sok/sk12v100pc/',true],
            ['sok-48v','/sok/sk48v100n/',true],
            ['sok-order','/sok-order.html?sku=SK12V100PC&intent=purchase_options',true],
            ['rv-store','/rv-store',true],
            ['lithium','/lithium-batteries',true],
            ['hawaii','/hawaii-lithium-batteries',true],
            ['product',`/product?id=${encodeURIComponent(productId)}&store=${section}`,true],
            ['checkout','/checkout/?source=apparel&id=black-and-gold-signature-t-shirt',true],
            ['collector','/collector',true],
            ['apparel','/store',false],
          ];
          const browser=await chromium.launch({headless:true});
          const checks=[];
          async function badVisibleImages(page){
            return await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>{
              const r=i.getBoundingClientRect(); const s=getComputedStyle(i);
              const visible=s.display!=='none'&&s.visibility!=='hidden'&&r.width>2&&r.height>2&&r.bottom>0&&r.top<innerHeight;
              return visible&&(!i.complete||i.naturalWidth===0);
            }).map(i=>i.currentSrc||i.src||i.alt));
          }
          for(const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const [name,path,expectsWordmark] of routes){
              const context=await browser.newContext({viewport});
              const page=await context.newPage();
              const res=await page.goto(base+path,{waitUntil:'domcontentloaded',timeout:45000});
              if(!res||res.status()!==200) throw new Error(`${mode} ${path} status ${res?.status()}`);
              await page.waitForTimeout(3500);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
              if(overflow>3) throw new Error(`${mode} ${path} horizontal overflow ${overflow}px`);
              let bad=await badVisibleImages(page);
              if(bad.length){await page.waitForTimeout(2500);bad=await badVisibleImages(page);}
              if(bad.length) throw new Error(`${mode} ${path} visible broken images: ${bad.join(' | ')}`);
              const brand=page.locator('.eus-brand>img').first();
              if(await brand.count()){
                const mark=await brand.evaluate(el=>({content:getComputedStyle(el).content,fit:getComputedStyle(el).objectFit,w:el.getBoundingClientRect().width,h:el.getBoundingClientRect().height}));
                const has=String(mark.content).includes('storefront-wordmark');
                if(expectsWordmark&&!has) throw new Error(`${mode} ${path} storefront wordmark missing`);
                if(!expectsWordmark&&has) throw new Error(`${mode} ${path} storefront wordmark leaked into Apparel`);
                if(expectsWordmark&&(mark.fit!=='contain'||mark.w<120||mark.h<35||mark.h>100)) throw new Error(`${mode} ${path} wordmark geometry ${JSON.stringify(mark)}`);
              }
              if(name!=='home'&&name!=='apparel'){
                const retailLinks=await page.locator('link[data-retail-shell]').evaluateAll(ls=>ls.map(l=>l.href));
                if(!retailLinks.some(x=>x.includes('retail-first.css?v=5.3.0'))) throw new Error(`${mode} ${path} fresh retail CSS key missing: ${retailLinks.join(',')}`);
              }
              if(name==='apparel'){
                if(!(await page.locator('.shop-intro').count())) throw new Error(`${mode} Apparel shop-intro missing`);
              }
              if(name==='sok-order'&&(await page.locator('form input').count())<3) throw new Error(`${mode} SOK order fields missing`);
              if(name==='product'){
                const status=await page.locator('[data-product-status]').textContent().catch(()=>'');
                if(/unavailable|unable|error/i.test(String(status))) throw new Error(`${mode} product status ${status}`);
              }
              if(name==='checkout'){
                const status=await page.locator('#checkout-status').textContent().catch(()=>'');
                if(/item is unavailable|checkout item is unavailable/i.test(String(status))) throw new Error(`${mode} checkout status ${status}`);
              }
              if(mode==='mobile'){
                const toggle=page.locator('.eus-menu-toggle').first();
                if(await toggle.count()&&await toggle.isVisible()){
                  await toggle.click(); await page.waitForTimeout(200);
                  if((await toggle.getAttribute('aria-expanded'))!=='true') throw new Error(`mobile ${path} menu failed`);
                }
              }
              await page.screenshot({path:`hotfix-preview-evidence/${name}-${mode}.png`,fullPage:true});
              checks.push({mode,path,expectsWordmark,overflow,badVisibleImages:bad.length});
              await context.close();
            }
          }
          await browser.close();
          fs.writeFileSync('hotfix-preview-evidence/report.json',JSON.stringify({base,hotfix:'b8300a0060dba7a690d17bde7a995bcc591184fb',productId,section,checks},null,2));
          console.log('desktop_mobile_cache_bust_visual=PASS');
          NODE
          node verify.mjs

      - name: Preview PayPal secret boundary
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl -sS -L --fail "${BASE%/}/api/store-checkout/config" > /tmp/config.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/config.json'))
          assert data.get('ok') is True
          if data.get('environment') == 'live':
              assert data.get('checkoutEnabled') is False
              assert not data.get('clientId')
          print('preview_paypal_boundary=PASS')
          print('paypal_order_created=NO')
          print('capture_called=NO')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: web-visual-0905-02-cache-bust-preview-evidence
          path: hotfix-preview-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Receipt
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo '### WEB-VISUAL-0905-02 cache-bust preview — PASS'
            echo "- Hotfix: $HOTFIX_SHA"
            echo "- Parent / production: $PARENT_SHA"
            echo "- Preview: $BASE"
            echo '- Static + commerce regression: PASS'
            echo '- Canonical route/security/SOK preview: PASS'
            echo '- Desktop/mobile storefront wordmark and CSS cache key: PASS'
            echo '- Apparel identity isolation: PASS'
            echo '- PayPal preview boundary: PASS; no order/capture'
          } >> "$GITHUB_STEP_SUMMARY"
