name: One-Time 4.5 Final Verification Resume

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths:
      - .github/workflows/one-time-45-final-verification-resume.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact final candidate
        uses: actions/checkout@v6
        with:
          ref: b16ea0e5f8587cc44f056557b144eb3d4b87be25
          fetch-depth: 0
      - name: Confirm exact preview lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b16ea0e5f8587cc44f056557b144eb3d4b87be25"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          echo EXACT_CANDIDATE=PASS
      - name: Runtime Catalog Shipping Rules prerender and protected routes
        shell: bash
        env:
          PREVIEW: https://bcdc5904.elevationupscales.pages.dev
        run: |
          set -euo pipefail
          base="$PREVIEW"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -o /tmp/r -w '%{http_code}' "$base$route" || true); echo "ROUTE $route=$code"; test "$code" = 200; done
          curl -fsSL "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL "$base/api/store/featured" -o /tmp/featured.json
          curl -fsSL "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL "$base/api/hawaii-lithium/statuses" -o /tmp/statuses.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=CO&quantity=2&batteryUnits=1" -o /tmp/co.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          test "$(curl -sS -o /tmp/admin-rules -w '%{http_code}' "$base/api/admin/shipping-rules")" = 401
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/featured.json')),rules=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[],st=JSON.parse(fs.readFileSync('/tmp/statuses.json')),co=JSON.parse(fs.readFileSync('/tmp/co.json')),hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json'));
          if(li.length!==38)throw Error('Lithium count '+li.length);if(rv.length<1)throw Error('RV empty');if((f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('Featured count');for(const p of [...f.lithium,...f.rv])if(!(Number(p.priceCents)>0)||!p.image||!p.buyUrl||!p.detailUrl)throw Error('Featured incomplete');
          const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');if(l?.rateCents!==2799||l?.calculation!=='per_battery'||!l?.enabled)throw Error('Lower48');if(h?.rateCents!==9900||h?.calculation!=='per_battery'||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3)throw Error('HI');if(!d?.quoteRequired||d?.rateCents!==0)throw Error('HI final mile');if(!a?.quoteRequired||a?.rateCents!==0)throw Error('AK');if(co.status!=='shipping_available'||co.shippingCents!==5598)throw Error('CO resolve');if(hi.status!=='shipping_available'||hi.shippingCents!==19800)throw Error('HI resolve');if(ak.status!=='review_required'||ak.shippingCents!==0)throw Error('AK resolve');
          const states={shipping_available:[],review_required:[],unavailable:[]};for(const p of li){const s=st.statuses?.[p.id]||st.statuses?.[String(p.sku||'').toLowerCase()];if(s&&states[s.customerState])states[s.customerState].push(p.id)};console.log(`COUNTS LITHIUM=${li.length} RV=${rv.length} FEATURED=4+4`);console.log('HAWAII_STATES='+JSON.stringify(Object.fromEntries(Object.entries(states).map(([k,v])=>[k,v.length]))));fs.writeFileSync('/tmp/states.json',JSON.stringify(states));fs.writeFileSync('/tmp/counts.json',JSON.stringify({lithium:li.length,rv:rv.length,featuredLithium:4,featuredRv:4}));
          NODE
          curl -fsSL "$base/lithium-batteries" -o /tmp/li.html;curl -fsSL "$base/hawaii-lithium-batteries" -o /tmp/hi.html;curl -fsSL "$base/rv-store" -o /tmp/rv.html
          node <<'NODE'
          const fs=require('fs'),li=fs.readFileSync('/tmp/li.html','utf8'),hi=fs.readFileSync('/tmp/hi.html','utf8'),rv=fs.readFileSync('/tmp/rv.html','utf8'),a=(li.match(/class="lithium-card"/g)||[]).length,b=(hi.match(/class="lithium-card"/g)||[]).length,c=(rv.match(/class="rv-product-card"/g)||[]).length;console.log(`PRERENDER LITHIUM=${a} HAWAII=${b} RV=${c}`);if(a!==38||b!==38||c<1||!li.includes('data-prerendered="true"')||!hi.includes('data-prerendered="true"')||!rv.includes('data-prerendered="true"'))throw Error('prerender');if(!hi.includes('Honolulu warehouse / freight-terminal')||!hi.includes('Additional charge · quote required'))throw Error('Hawaii customer wording');
          NODE
      - name: Checkout server policy boundaries
        shell: bash
        env:
          PREVIEW: https://bcdc5904.elevationupscales.pages.dev
        run: |
          BASE="$PREVIEW" node <<'NODE'
          (async()=>{const fs=require('fs'),base=process.env.BASE,products=(JSON.parse(fs.readFileSync('/tmp/li.json')).products||[]).filter(x=>Number(x.priceCents)>0),states=JSON.parse(fs.readFileSync('/tmp/states.json'));async function post(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}
          let actual,lower;for(const p of products){const q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'CO'}});if(q.status===200&&q.body?.battery?.actualBattery){actual=p;lower=q;break}}if(!actual)throw Error('no actual battery');const units=Number(lower.body.battery.batteryUnitsPerItem||1);if(lower.body.shippingCents!==2799*units||lower.body.shippingRule?.rateCents!==2799)throw Error('Lower48 checkout');console.log('LOWER48_CHECKOUT=PASS');
          if(states.review_required[0]){const p=products.find(x=>x.id===states.review_required[0]),q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'HI'}});if(q.status!==200||q.body.hawaii?.customerState!=='review_required'||q.body.hawaii?.paymentAllowed!==false)throw Error('review quote');const o=await post('/api/store-checkout/orders',{source:'lithium',id:p.id,name:p.title,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview Review',state:'HI',countryCode:'US'}});if(o.status!==409||!o.body.hawaiiFreight)throw Error('review payment block '+o.status);console.log('HAWAII_REVIEW_PAYMENT_BLOCK=PASS')}
          if(states.unavailable[0]){const p=products.find(x=>x.id===states.unavailable[0]),o=await post('/api/store-checkout/orders',{source:'lithium',id:p.id,name:p.title,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview',state:'HI',countryCode:'US'}});if(o.status!==409||!o.body.hawaiiFreight)throw Error('unavailable payment block')}
          if(states.shipping_available[0]){const p=products.find(x=>x.id===states.shipping_available[0]),q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'HI'}});if(q.status!==200||q.body.hawaii?.paymentAllowed!==true||q.body.hawaii?.requiresReservation!==false||q.body.hawaii?.pickupLocationLabel!=='Honolulu warehouse / freight-terminal pickup location'||!q.body.hawaii?.finalMileQuoteRequired)throw Error('available HI quote');console.log('HAWAII_AVAILABLE_QUOTE=PASS')}else console.log('HAWAII_AVAILABLE_QUOTE=NOT_TESTABLE_NO_CURRENT_ELIGIBLE_SKU');
          const ak=await post('/api/store-checkout/quote',{source:'lithium',id:actual.id,name:actual.title,quantity:1,shipping:{state:'AK'}});if(ak.status!==409||!String(ak.body.error||'').includes('Freight Review Required'))throw Error('AK');console.log('ALASKA_REVIEW=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Browser performance and Hawaii UX
        shell: bash
        env:
          PREVIEW: https://bcdc5904.elevationupscales.pages.dev
        run: |
          set -euo pipefail;mkdir -p /tmp/browser && cd /tmp/browser;npm init -y >/dev/null 2>&1;npm install --no-save playwright@latest >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat > verify.mjs <<'NODE'
          import fs from'fs';import{chromium}from'playwright';const base=process.env.PREVIEW,states=JSON.parse(fs.readFileSync('/tmp/states.json','utf8')),before={'/':{requests:28,apiRequests:1,dom:271},'/lithium-batteries':{requests:39,apiRequests:3,dom:765},'/hawaii-lithium-batteries':{requests:57,apiRequests:41,dom:1613},'/rv-store':{requests:42,apiRequests:3,dom:516}},browser=await chromium.launch({headless:true}),after={};for(const route of Object.keys(before)){const ctx=await browser.newContext({viewport:{width:1280,height:900}}),page=await ctx.newPage(),req=[],api=[];page.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();await page.waitForTimeout(1800);const n=req.length;await page.waitForTimeout(2500);const idle=req.length-n,snap=await page.evaluate(()=>({dom:document.getElementsByTagName('*').length,images:document.images.length,scripts:document.scripts.length}));after[route]={...snap,requests:req.length,apiRequests:api.length,idleRequests:idle,api:api.map(u=>new URL(u).pathname)};console.log('PERF_BEFORE '+route+' '+JSON.stringify(before[route]));console.log('PERF_AFTER '+route+' '+JSON.stringify(after[route]));if(idle!==0)throw Error(route+' idle');if(route==='/'){if(await page.locator("[data-home-products='lithium'] .home-product-card").count()!==4||await page.locator("[data-home-products='rv'] .home-product-card").count()!==4)throw Error('homepage cards');if(api.some(u=>u.includes('/api/store/catalog')||u.includes('/api/store-catalog')))throw Error('homepage catalog hydration')}if(route==='/lithium-batteries'&&api.some(u=>new URL(u).pathname==='/api/store/catalog'))throw Error('Lithium duplicate Catalog');if(route==='/rv-store'&&api.some(u=>new URL(u).pathname==='/api/store-catalog'))throw Error('RV duplicate Catalog');if(route==='/hawaii-lithium-batteries'){const singles=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/status').length,batches=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/statuses').length,catalogs=api.filter(u=>new URL(u).pathname==='/api/store/catalog').length;if(singles!==0||batches>1||catalogs!==0)throw Error(`Hawaii pattern ${singles}/${batches}/${catalogs}`);if(after[route].requests>=57||after[route].apiRequests>=41)throw Error('Hawaii performance');if(await page.locator('.lithium-card').count()!==38)throw Error('Hawaii cards');const labels=await page.locator('[data-hawaii-status]').allTextContents();if(labels.some(v=>!['Shipping Available','Freight Review Required','Currently Unavailable'].includes(v.trim())))throw Error('Hawaii labels')}await ctx.close()}
          const id=states.review_required[0]||states.shipping_available[0]||states.unavailable[0];if(id){const ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage();await page.goto(`${base}/checkout/?source=lithium&id=${encodeURIComponent(id)}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(2200);if(!(await page.locator('#checkout-hawaii-freight').isVisible()))throw Error('Hawaii checkout panel');const txt=await page.locator('#checkout-hawaii-freight').innerText();if(!txt.includes('Honolulu warehouse / freight-terminal pickup location')||!txt.includes('Additional delivery charges apply'))throw Error('Hawaii wording');if(!(await page.locator('#checkout-name').isVisible())||!(await page.locator('#checkout-email').isVisible()))throw Error('contact fields');if(await page.locator('#checkout-address1').isVisible())throw Error('street field visible');if(states.review_required.includes(id)&&await page.locator('#checkout-paypal').isVisible())throw Error('PayPal visible for review');await ctx.close()}await browser.close();fs.writeFileSync('/tmp/perf.json',JSON.stringify(after,null,2));
          NODE
          PREVIEW="$PREVIEW" node verify.mjs
      - name: Promotion control and final preview receipt
        shell: bash
        env:
          PREVIEW: https://bcdc5904.elevationupscales.pages.dev
        run: |
          curl -fsSL "$PREVIEW/api/store/promotion" -o /tmp/p.json
          node <<'NODE'
          const p=JSON.parse(require('fs').readFileSync('/tmp/p.json'));if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z')throw Error('promotion times');const expected=Boolean(p.manualActive)&&Date.now()>=Date.parse(p.startAt)&&Date.now()<Date.parse(p.endAt);if(Boolean(p.active)!==expected)throw Error('promotion state');console.log(`PROMOTION=${p.windowState} ACTIVE=${p.active}`)
          NODE
          echo FINAL45_PREVIEW=PASS
          echo CANDIDATE=b16ea0e5f8587cc44f056557b144eb3d4b87be25
          echo PREVIEW=$PREVIEW
          cat /tmp/counts.json;cat /tmp/perf.json
