name: One-time production deploy v3.11.31 eBay Inventory Sync

on:
  push:
    branches:
      - main
    paths:
      - site/_worker.js
      - site/_worker_core.js
      - site/ebay-inventory-sync.js
      - site/rv-store.html
      - site/rv-store.css
      - site/rv-store.js
      - .github/workflows/deploy-ebay-sync-v3.11.31-once.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - site/rv-store.html
      - .github/workflows/deploy-ebay-sync-v3.11.31-once.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  validate-deploy-and-sync:
    name: Validate, deploy, and verify inventory synchronization
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate v3.11.31 split Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/_worker.js
          test -f site/_worker_core.js
          test -f site/ebay-inventory-sync.js
          test -f site/_routes.json
          test -f site/_headers
          grep -q 'import core from "./_worker_core.js"' site/_worker.js
          grep -q 'handleStoreInventory' site/_worker.js
          grep -q 'url.pathname === "/api/store-inventory"' site/_worker.js
          grep -q 'return core.fetch(request, env, ctx)' site/_worker.js
          grep -q '3.11.31-ebay-inventory-sync' site/ebay-inventory-sync.js
          grep -q 'const SELLER = "elevationupscalesshop"' site/ebay-inventory-sync.js
          grep -q 'ebay-auto-sync-v1' site/ebay-inventory-sync.js
          grep -q 'eus_inventory_sync_state' site/ebay-inventory-sync.js
          grep -q 'async function syncEbay' site/ebay-inventory-sync.js
          grep -q 'sellers:{' site/ebay-inventory-sync.js
          grep -q 'EBAY_CLIENT_ID' site/ebay-inventory-sync.js
          grep -q 'EBAY_CLIENT_SECRET' site/ebay-inventory-sync.js
          grep -q 'fromPublic' site/ebay-inventory-sync.js
          grep -q 'protectedManual' site/ebay-inventory-sync.js
          grep -q 'export async function handleStoreInventory' site/ebay-inventory-sync.js
          test -f site/solar-visual-guide.css
          grep -q 'data-jump="panels"' site/solar-project.html
          grep -q 'data-jump="services"' site/solar-project.html
          grep -q 'Stage 1 of 7' site/solar-project.html
          cmp -s site/solar-project.html site/solar-project/index.html
          test -f site/store.html
          test -f site/rv-store.html
          test -f site/rv-store.css
          test -f site/rv-store.js
          grep -q 'Apparel Store' site/store.html
          grep -q 'RV & Outdoor Store' site/store.html
          grep -q 'href="/rv-store"' site/store.html
          test "$(grep -o 'class="market-product-card"' site/store.html | wc -l)" -ge 10
          grep -q 'hero-galaxy-rv.webp' site/rv-store.html
          grep -q 'Automatic eBay sync' site/rv-store.html
          grep -q 'item.imageUrl' site/rv-store.js
          grep -q 'shopping_list' site/rv-store.js
          test -f site/admin-inventory.html
          test -f site/admin-inventory.css
          test -f site/admin-inventory.js
          grep -q '/api/admin/inventory' site/_worker_core.js
          grep -q 'eus_inventory_items' site/_worker_core.js
          grep -q 'shopping_list' site/_worker_core.js
          grep -q 'admin-inventory.html' site/admin-listings.html
          test -f site/store-channel-analytics.js
          grep -q '3.11.28-native-rv-catalog' site/store-channel-analytics.js
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          file_count=$(find site -type f | wc -l)
          test "$file_count" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"
          blocked=$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)
          test -z "$blocked"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site; then echo 'Credential-like value detected in site source.'; exit 1; fi

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployed storefront and supplier synchronization
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store" > /tmp/rv-store.html
          grep -q 'hero-galaxy-rv.webp' /tmp/rv-store.html
          grep -q 'Automatic eBay sync' /tmp/rv-store.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 120 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-inventory?release=3.11.31" > /tmp/inventory.json
          python - <<'PY'
          import json, os
          with open('/tmp/inventory.json', encoding='utf-8') as f: data=json.load(f)
          sync=data.get('supplierSync') or {}
          count=int(data.get('count') or 0)
          status=str(sync.get('status') or '')
          source=str(sync.get('source') or '')
          print('inventory_count=', count)
          print('sync_status=', status)
          print('sync_source=', source)
          print('last_success=', sync.get('lastSuccessAt'))
          print('last_error=', sync.get('lastError'))
          if status == 'error': raise SystemExit('eBay supplier synchronization returned an error')
          if count < 1: raise SystemExit('RV storefront still has zero synchronized products')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"inventory_count={count}\n")
              out.write(f"sync_status={status}\n")
              out.write(f"sync_source={source}\n")
          PY

      - name: Persist successful deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/deployments
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          source_commit=$(git rev-parse HEAD)
          cat > .github/deployments/v3.11.31-ebay-inventory-sync.txt <<EOF
          build=3.11.31-ebay-inventory-sync
          source_commit=$source_commit
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$deployed_at
          inventory_count=${{ steps.smoke.outputs.inventory_count }}
          sync_status=${{ steps.smoke.outputs.sync_status }}
          sync_source=${{ steps.smoke.outputs.sync_source }}
          status=success
          EOF
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.31-ebay-inventory-sync.txt
          git commit -m 'Record v3.11.31 eBay inventory sync production deployment'
          git push origin HEAD:main

# observable-pr-trigger
