name: One-Time 4.5 Final Copy Production

on:
  push:
    branches:
      - runner/4.5-final-copy-production-2026-09-03

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: elevation-45-final-copy-production
  cancel-in-progress: false

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare corrected isolated verifier
        shell: bash
        run: |
          set -euo pipefail
          git show origin/runner/4.5-final-copy-preview-v2-2026-09-03:.github/scripts/verify_45_final_copy_commerce_v2.mjs > /tmp/verify.mjs
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/verify.mjs')
          s=p.read_text()
          old="const homeText=await home.locator('body').innerText();for(const s of ['Shop Current Products','Featured products from our Lithium and RV & Outdoor stores.','Hawaii Lithium Batteries'])if(!homeText.includes(s))throw new Error(`home rendered missing ${s}`);"
          new="const homeText=await home.locator('body').innerText();for(const s of ['Shop Current Products','Featured products from our Lithium and RV & Outdoor stores.'])if(!homeText.includes(s))throw new Error(`home rendered missing ${s}`);const homeHi=home.locator('a[href=\"/hawaii-lithium-batteries\"]').filter({hasText:'Hawaii Lithium Batteries'}).first();if(await homeHi.count()!==1)throw new Error('homepage Hawaii CTA missing');await homeHi.scrollIntoViewIfNeeded();if((await homeHi.innerText()).trim().toLowerCase()!=='hawaii lithium batteries')throw new Error(`homepage Hawaii CTA text ${(await homeHi.innerText()).trim()}`);"
          if old not in s: raise SystemExit('home verifier marker missing')
          s=s.replace(old,new,1)
          old_start=";if(!st.includes('pick the closest match'))throw new Error('clean start copy missing');out.startProject="
          if old_start not in s: raise SystemExit('start verifier marker missing')
          s=s.replace(old_start,';out.startProject=',1)
          p.write_text(s)
          PY
          node --check /tmp/verify.mjs

      - name: Download authoritative Lithium cost evidence
        uses: actions/download-artifact@v4
        with:
          name: lithium-pricing-audit-bound-preview
          path: /tmp/cost-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33784084029

      - name: Freeze exact approved final candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf main
          git checkout --detach 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf
          test "$(git rev-parse HEAD)" = "31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf"
          test "$(git rev-parse origin/main)" = "2cafb2274d1fbd7733068853554bef68fcf5c02d"
          test "$(git merge-base HEAD 2cafb2274d1fbd7733068853554bef68fcf5c02d)" = "2cafb2274d1fbd7733068853554bef68fcf5c02d"

      - name: Exact final production source gate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD
          changed=$(git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | sort)
          printf '%s\n' "$changed"
          test "$changed" = "$(printf '%s\n' site/index.html site/start-a-project.html site/start-a-project/index.html site/store.html | sort)"
          ! git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | grep -q '^\.github/'
          ! git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | grep -Eq '(migration|commerce-schema-migrations)'
          grep -q 'Shop Current Products' site/index.html
          grep -q 'Featured products from our Lithium and RV & Outdoor stores.' site/index.html
          grep -q 'Hawaii Lithium Batteries' site/index.html
          grep -q 'href="/terms"' site/index.html
          grep -q 'href="/terms"' site/store.html
          for f in site/start-a-project.html site/start-a-project/index.html; do
            ! grep -qi 'underlying Project families' "$f"
            ! grep -qi 'Intake Intent tells management' "$f"
            ! grep -qi 'management review' "$f"
            grep -qi 'pick the closest match' "$f"
          done
          test "$(git hash-object site/assets/homepage-option-2-lithium-solar.webp)" = "a46c581bb612b43b6e876b6cf3183710af198673"
          test "$(git hash-object site/assets/homepage-option-3-home-rv-lifestyle.webp)" = "04858f98e6eb344dc922e42916b4301ba8c29ddf"

      - id: deploy
        name: Deploy exact final candidate to Cloudflare Pages production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable production deployment
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /start-a-project /product /checkout /terms /privacy /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done
          curl -fsS -L "$base/" -o /tmp/home.html
          curl -fsS -L "$base/start-a-project" -o /tmp/start.html
          python - <<'PY'
          from html import unescape
          h=unescape(open('/tmp/home.html').read())
          s=unescape(open('/tmp/start.html').read()).lower()
          for x in ('Shop Current Products','Featured products from our Lithium and RV & Outdoor stores.','Hawaii Lithium Batteries'):
              assert x in h,x
          for x in ('underlying project families','intake intent tells management','management review'):
              assert x not in s,x
          assert 'pick the closest match' in s
          assert 'href="/terms"' in h
          PY

      - name: Wait for canonical custom domain to serve final candidate
        shell: bash
        run: |
          set -euo pipefail
          base='https://elevationupscales.com'
          passed=0
          for attempt in $(seq 1 30); do
            if curl -fsS -L --retry 2 --retry-all-errors --retry-delay 1 "$base/" -o /tmp/canonical-home.html \
              && curl -fsS -L "$base/start-a-project" -o /tmp/canonical-start.html; then
              if python - <<'PY'
          from html import unescape
          h=unescape(open('/tmp/canonical-home.html').read())
          s=unescape(open('/tmp/canonical-start.html').read()).lower()
          assert 'Shop Current Products' in h
          assert 'Featured products from our Lithium and RV & Outdoor stores.' in h
          assert 'Hawaii Lithium Batteries' in h
          assert 'href="/terms"' in h
          assert 'pick the closest match' in s
          for x in ('underlying project families','intake intent tells management','management review'):
              assert x not in s,x
          PY
              then passed=1; break; fi
            fi
            sleep 5
          done
          test "$passed" = "1"

      - name: Full canonical final commerce smoke
        env:
          BASE: https://elevationupscales.com
          COST_AUDIT: /tmp/cost-audit/lithium-pricing-audit-sanitized.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cp /tmp/verify.mjs /tmp/pw/test.mjs && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          node test.mjs | tee /tmp/canonical-final-verification.json

      - name: Final production acceptance summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          echo '### Elevation 4.5 Combined Hotfix Final Production — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application SHA: 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf' >> "$GITHUB_STEP_SUMMARY"
          echo "Pages deployment: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical: https://elevationupscales.com' >> "$GITHUB_STEP_SUMMARY"
          echo 'Prior production app: 2cafb2274d1fbd7733068853554bef68fcf5c02d' >> "$GITHUB_STEP_SUMMARY"
          echo 'Rollback: 071b69ceddecaa51516ad01d762360a468c00925' >> "$GITHUB_STEP_SUMMARY"
          echo 'Database migration: none' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/canonical-final-verification.json >> "$GITHUB_STEP_SUMMARY"
