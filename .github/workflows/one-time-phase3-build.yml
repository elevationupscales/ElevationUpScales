name: One-Time Phase 3 Admin Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble-phase3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-command-center-phase3
          fetch-depth: 0
      - name: Wire unified admin shell and seller sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def replace(path,old,new,count=1):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'marker missing in {path}: {old[:90]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          p=Path('site/_worker.js');s=p.read_text(encoding='utf-8')
          if 'ADMIN_COMMAND_CENTER_LOADER' not in s:
              s=s.replace('const CHECKOUT_CSP = [','const ADMIN_COMMAND_CENTER_LOADER = `\n<script src="/admin-command-center.js?v=4.3.4"></script>\n`;\n\nconst CHECKOUT_CSP = [',1)
          if 'async function appendHtmlLoader' not in s:
              helper='''\nasync function appendHtmlLoader(response, loader) {\n  if (!response || !response.ok) return response;\n  const type = String(response.headers.get("Content-Type") || "");\n  if (!/text\\/html/i.test(type)) return response;\n  const headers = new Headers(response.headers);\n  headers.delete("Content-Length"); headers.set("Cache-Control", "no-store");\n  return new Response(`${await response.text()}\\n${loader}`, { status: response.status, statusText: response.statusText, headers });\n}\n'''
              s=s.replace('function checkoutResponse(response) {',helper+'\nfunction checkoutResponse(response) {',1)
          old='''    const response = await coreWorker.fetch(request, env, ctx);\n    if (url.pathname === "/checkout" || url.pathname === "/checkout/") return checkoutResponse(response);\n    return response;'''
          new='''    const response = await coreWorker.fetch(request, env, ctx);\n    if (url.pathname === "/checkout" || url.pathname === "/checkout/") return checkoutResponse(response);\n    const adminHtml = url.pathname === "/admin" || url.pathname === "/admin/" || url.pathname.startsWith("/admin-") || url.pathname === "/admin.html";\n    if (adminHtml) return appendHtmlLoader(response, ADMIN_COMMAND_CENTER_LOADER);\n    return response;'''
          if old not in s: raise SystemExit('worker return marker missing')
          s=s.replace(old,new,1);p.write_text(s,encoding='utf-8')

          r=Path('site/_redirects');rs=r.read_text(encoding='utf-8')
          if '/admin.html /admin 301' not in rs:
              rs=rs.replace('/admin-listings/ /admin-listings 308\n','/admin/ /admin 308\n/admin.html /admin 301\n/admin-analytics.html /admin-analytics 301\n/admin-channels.html /admin-channels 301\n/admin-listings/ /admin-listings 308\n',1);r.write_text(rs,encoding='utf-8')

          replace('site/catalog-admin-runtime.js','const SOURCES = new Set(["doba", "ebay", "fourthwall", "other"]);','const SOURCES = new Set(["doba", "ebay", "tiktok", "fourthwall", "other"]);')
          replace('site/catalog-admin-runtime.js','sourceType === "ebay" ? ["ebay"] : ["website"]','sourceType === "ebay" ? ["ebay"] : sourceType === "tiktok" ? ["tiktok"] : ["website"]')
          p=Path('site/admin-catalog.html');hs=p.read_text(encoding='utf-8')
          hs=hs.replace('<button class="catalog-action" data-source-open="fourthwall" type="button"><strong>Fourthwall</strong>','<button class="catalog-action" data-source-open="tiktok" type="button"><strong>TikTok Shop</strong><span>Seller Center import / channel staging</span></button><button class="catalog-action" data-source-open="fourthwall" type="button"><strong>Fourthwall</strong>',1)
          hs=hs.replace('<option value="ebay">eBay</option><option value="fourthwall">Fourthwall</option>','<option value="ebay">eBay</option><option value="tiktok">TikTok Shop</option><option value="fourthwall">Fourthwall</option>')
          p.write_text(hs,encoding='utf-8')
          replace('site/admin-catalog.js','source==="ebay"?["ebay"]:source==="fourthwall"?["website","fourthwall"]:["website"]','source==="ebay"?["ebay"]:source==="tiktok"?["tiktok"]:source==="fourthwall"?["website","fourthwall"]:["website"]')
          p=Path('site/admin-channels.js');cs=p.read_text(encoding='utf-8');cs=cs.replace('if(p.sourceType==="doba"||p.supplier==="doba")set.add("doba");return set;','if(p.sourceType==="doba"||p.supplier==="doba")set.add("doba");if(p.sourceType==="tiktok")set.add("tiktok");return set;',1);p.write_text(cs,encoding='utf-8')
          PY
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/admin-analytics-v2.js
          node --check site/admin-channels.js
          node --check site/admin-catalog.js
          node --check site/catalog-admin-runtime.js
          node --check site/_worker.js
          grep -q 'TikTok Shop' site/admin-catalog.html
          grep -q 'ADMIN_COMMAND_CENTER_LOADER' site/_worker.js
          grep -q '/admin.html /admin 301' site/_redirects
          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add site
          git commit -m 'Build Phase 3 admin seller fulfillment analytics command center'
          git push origin HEAD:release/admin-command-center-phase3
      - name: Remove build bootstrap
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-phase3-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed Phase 3 build bootstrap'
          git push origin main
