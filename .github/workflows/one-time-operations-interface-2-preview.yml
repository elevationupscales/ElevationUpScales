name: One-Time Operations Interface 2.0 Management Preview
on:
  push:
    branches: [release/operations-interface-2-0-owner-dashboard-2026-09-02]
permissions:
  contents: read
  deployments: write
jobs:
  verify-preview:
    runs-on: ubuntu-24.04
    env:
      BASE_MAIN_SHA: 53157d29a65e0797e5f8d8656f5d9390e33d2c7f
      APP_SHA: c5d941dc25faa975f4a23b91d772a5b5806177b5
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v6
        with:
          ref: c5d941dc25faa975f4a23b91d772a5b5806177b5
          fetch-depth: 0

      - name: Verify lineage scope and syntax
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          mapfile -t files < <(git diff --name-only "$BASE_MAIN_SHA".."$APP_SHA")
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          printf '%s\n' site/admin-command-center.js site/admin-operations-2.css site/admin-overview.js site/admin.html | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          git diff --check "$BASE_MAIN_SHA".."$APP_SHA"
          grep -q 'Situation' site/admin.html
          grep -q 'Priority' site/admin.html
          grep -q 'Action' site/admin.html
          grep -q '/api/admin/promotion' site/admin-command-center.js
          ! git diff --name-only "$BASE_MAIN_SHA".."$APP_SHA" | grep -E 'site/(index|checkout|product|rv-store|store|lithium-batteries|promotion-runtime|store-checkout|catalog-admin-runtime|hawaii-lithium-runtime)'

      - name: Deploy exact candidate to management preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=operations-interface-2-preview-2026-09-02

      - name: Verify Admin routes and auth boundaries
        env:
          PREVIEW_BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${PREVIEW_BASE%/}"
          for route in /admin /admin-store-orders /admin-catalog /admin-inventory /admin-channels /admin-lithium-shipping /admin-listings /admin-promotion /admin-analytics /admin-system; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$route")
            test "$code" = "200"
          done
          for api in /api/admin/session /api/admin/store-orders /api/admin/catalog /api/admin/inventory /api/admin/opportunities /api/admin/operations /api/admin/lithium-shipping /api/admin/sync /api/admin/doba-csv-sync /api/admin/promotion; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$base$api")
            test "$code" = "401" -o "$code" = "403"
          done

      - name: Install browser verifier
        run: npm install --no-save playwright@1.55.0

      - name: Verify owner hierarchy and desktop layout
        env:
          PREVIEW_BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true)
          test -n "$CHROME"
          export CHROME
          cat > ops-preview-check.mjs <<'NODE'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          const base=process.env.PREVIEW_BASE.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto(base+'/admin',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1200);
          assert.equal(errors.length,0,errors.join('; '));
          assert.equal(await page.locator('#eus-admin-auth').isVisible(),true,'login boundary not visible');
          assert.equal(await page.locator('.eus-admin-rail').count(),1,'Admin navigation shell missing');
          const navText=await page.locator('.eus-admin-rail').innerText();
          for(const label of ['Situation & Priority','Orders & Fulfillment','Catalog & Products','Channels & Sync','Shipping & Hawaii','Marketplace','Solar','Portal Handoffs','Website / QA']) assert.ok(navText.includes(label),`nav missing ${label}`);
          await page.evaluate(()=>{document.querySelector('#eus-admin-auth').hidden=true;document.querySelector('#eus-admin-overview').hidden=false;});
          assert.equal(await page.getByText('01 · Situation',{exact:true}).count(),1);
          assert.equal(await page.getByText('02 · Priority',{exact:true}).count(),1);
          assert.equal(await page.getByText('03 · Action',{exact:true}).count(),1);
          assert.equal(await page.locator('#eus-situation-grid .eus-ops-situation-card').count(),9);
          assert.equal(await page.locator('.eus-ops-action-grid .eus-ops-action-link').count(),12);
          assert.equal(await page.locator('#eus-program-status article, #eus-program-status a').count(),4);
          assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2),false,'horizontal overflow');
          const firstStage=await page.locator('.eus-ops-stage').first().boundingBox();
          assert.ok(firstStage&&firstStage.width>800&&firstStage.height>150,'owner overview layout collapsed');
          console.log('OPERATIONS_INTERFACE_2_TARGETED_VERIFY_PASS');
          await browser.close();
          NODE
          node ops-preview-check.mjs
          rm -f ops-preview-check.mjs

      - name: Confirm production main unchanged
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$BASE_MAIN_SHA"
          echo "APP_SHA=$APP_SHA"
          echo "PREVIEW_URL=${{ steps.preview.outputs.deployment-url }}"
          echo "OPERATIONS INTERFACE 2.0 MANAGEMENT PREVIEW PASS — production unchanged"
