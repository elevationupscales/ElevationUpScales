name: Pull Request QA

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: elevation-pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Canonical QA and credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run canonical QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --check

      - name: Scan tracked repository for credentials
        shell: bash
        run: |
          set -euo pipefail
          npm run qa:secrets
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"
