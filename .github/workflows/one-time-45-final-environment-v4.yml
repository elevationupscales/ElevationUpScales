name: One-Time 4.5 Final Commerce Environment V4

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths: [.github/workflows/one-time-45-final-environment-v4.yml]

permissions:
  contents: read
  deployments: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact application candidate
        uses: actions/checkout@v6
        with:
          ref: 4e429ddbed40d9e200094520c6c694dec2afb938
          fetch-depth: 0
      - name: Source and lineage gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4e429ddbed40d9e200094520c6c694dec2afb938"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          grep -q 'const identity=\[product?.title,product?.name,product?.sku,product?.supplierSku\]' site/promotion-runtime.js
          grep -q '"/hawaii-lithium-batteries"' site/_routes.json
          grep -q '/api/hawaii-lithium/statuses' site/lithium-shop.js
          ! grep -q 'fetch(`/api/hawaii-lithium/status?sku=' site/lithium-shop.js
          grep -q 'hawaii-address-delivery' site/shipping-rules-runtime.js
          grep -q 'certaintyState' site/admin-shipping-rules.js
          grep -q 'WHAT HAPPENS NEXT' site/checkout/index.html
          grep -q 'UNDERSTAND ELEVATION' site/what-we-do.html
          python - <<'PY'
          from pathlib import Path
          s=Path('site/store-checkout-server.js').read_text(); start=s.index('async function createStoreOrder')
          assert s.index('if (quote.hawaii?.customerState === "review_required")',start) < s.index('if (!paypalConfigured(env))',start)
          PY
          echo SOURCE_GATE=PASS
      - name: Deploy exact candidate to isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=commerce45finalv4
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Routes catalogs Shipping Rules and prerender
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}";echo "PREVIEW=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -o /tmp/r -w '%{http_code}' "$base$route" || true);echo "ROUTE $route=$code";test "$code" = 200;done
          curl -fsSL "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL "$base/api/store/featured" -o /tmp/featured.json
          curl -fsSL "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL "$base/api/hawaii-lithium/statuses" -o /tmp/statuses.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=CO&quantity=2&batteryUnits=1" -o /tmp/co.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          test "$(curl -sS -o /tmp/admin-rules -w '%{http_code}' "$base/api/admin/shipping-rules")" = 401
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/featured.json')),rules=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[],st=JSON.parse(fs.readFileSync('/tmp/statuses.json')),co=JSON.parse(fs.readFileSync('/tmp/co.json')),hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json'));
          if(li.length!==38)throw Error('Lithium count '+li.length);if(rv.length<1)throw Error('RV empty');if((f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('Featured 4+4');for(const p of [...f.lithium,...f.rv])if(!(Number(p.priceCents)>0)||!p.image||!p.buyUrl||!p.detailUrl)throw Error('Featured incomplete');
          const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');if(l?.rateCents!==2799||l?.calculation!=='per_battery'||!l?.enabled)throw Error('Lower48 rule');if(h?.rateCents!==9900||h?.calculation!=='per_battery'||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3)throw Error('HI rule');if(!d?.quoteRequired||d?.rateCents!==0)throw Error('HI delivery rule');if(!a?.quoteRequired||a?.rateCents!==0)throw Error('AK rule');if(co.status!=='shipping_available'||co.shippingCents!==5598)throw Error('CO resolver');if(hi.status!=='shipping_available'||hi.shippingCents!==19800)throw Error('HI resolver');if(ak.status!=='review_required'||ak.shippingCents!==0)throw Error('AK resolver');
          const states={shipping_available:[],review_required:[],unavailable:[]};for(const p of li){const s=st.statuses?.[p.id]||st.statuses?.[String(p.sku||'').toLowerCase()];if(s&&states[s.customerState])states[s.customerState].push(p.id)};console.log(`COUNTS LITHIUM=${li.length} RV=${rv.length} FEATURED=4+4`);console.log('HAWAII_STATES='+JSON.stringify(Object.fromEntries(Object.entries(states).map(([k,v])=>[k,v.length]))));fs.writeFileSync('/tmp/states.json',JSON.stringify(states));fs.writeFileSync('/tmp/counts.json',JSON.stringify({lithium:li.length,rv:rv.length,featuredLithium:4,featuredRv:4}));
          NODE
          curl -fsSL "$base/lithium-batteries" -o /tmp/li.html;curl -fsSL "$base/hawaii-lithium-batteries" -o /tmp/hi.html;curl -fsSL "$base/rv-store" -o /tmp/rv.html
          node <<'NODE'
          const fs=require('fs'),li=fs.readFileSync('/tmp/li.html','utf8'),hi=fs.readFileSync('/tmp/hi.html','utf8'),rv=fs.readFileSync('/tmp/rv.html','utf8'),a=(li.match(/class="lithium-card"/g)||[]).length,b=(hi.match(/class="lithium-card"/g)||[]).length,c=(rv.match(/class="rv-product-card"/g)||[]).length;console.log(`PRERENDER LITHIUM=${a} HAWAII=${b} RV=${c}`);if(a!==38||b!==38||c<1||!li.includes('data-prerendered="true"')||!hi.includes('data-prerendered="true"')||!rv.includes('data-prerendered="true"'))throw Error('prerender');if(!hi.includes('Honolulu warehouse / freight-terminal')||!hi.includes('Additional charge · quote required'))throw Error('Hawaii wording');
          NODE
      - name: Checkout authority and known-battery regression
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          BASE="${DEPLOYMENT_URL%/}" node <<'NODE'
          (async()=>{const fs=require('fs'),base=process.env.BASE,products=(JSON.parse(fs.readFileSync('/tmp/li.json')).products||[]).filter(x=>Number(x.priceCents)>0),states=JSON.parse(fs.readFileSync('/tmp/states.json'));async function post(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}
          const knownId='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77',known=products.find(x=>x.id===knownId);if(!known)throw Error('Known 12V 100Ah product missing');const co=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'CO'}});if(co.status!==200||co.body?.battery?.actualBattery!==true||co.body.shippingCents!==2799||co.body.shippingRule?.rateCents!==2799)throw Error('Known battery Lower48 classification/shipping regression '+JSON.stringify(co));console.log('KNOWN_12V100AH_LOWER48=BATTERY|2799');
          const kh=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'HI'}});if(kh.status!==200||kh.body.hawaii?.customerState!=='review_required'||kh.body.hawaii?.paymentAllowed!==false||kh.body.shippingCents!==0)throw Error('Known battery Hawaii review quote '+JSON.stringify(kh));console.log('KNOWN_12V100AH_HAWAII=REVIEW_REQUIRED');
          const ko=await post('/api/store-checkout/orders',{source:'lithium',id:known.id,name:known.title,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview Review',state:'HI',countryCode:'US'}});if(ko.status!==409||!ko.body.hawaiiFreight)throw Error('Known battery review payment block '+ko.status);console.log('KNOWN_12V100AH_PAYMENT_BLOCK=PASS');
          let actualCount=0;for(const p of products){const q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'CO'}});if(q.status===200&&q.body?.battery?.actualBattery){actualCount++;if(q.body.shippingCents!==2799*Number(q.body.battery.batteryUnitsPerItem||1)||q.body.shippingRule?.rateCents!==2799)throw Error('Actual battery shipping mismatch '+p.id)}}if(actualCount<1)throw Error('No actual batteries classified');console.log('CLASSIFIED_ACTUAL_BATTERIES='+actualCount);
          if(states.review_required[0]){const p=products.find(x=>x.id===states.review_required[0]),q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'HI'}});if(q.status!==200||q.body.hawaii?.customerState!=='review_required'||q.body.hawaii?.paymentAllowed!==false)throw Error('Review quote boundary '+JSON.stringify(q));const o=await post('/api/store-checkout/orders',{source:'lithium',id:p.id,name:p.title,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview',state:'HI',countryCode:'US'}});if(o.status!==409||!o.body.hawaiiFreight)throw Error('Review payment block '+o.status)}
          if(states.shipping_available[0]){const p=products.find(x=>x.id===states.shipping_available[0]),q=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'HI'}});if(q.status!==200||q.body.hawaii?.paymentAllowed!==true||q.body.hawaii?.requiresReservation!==false||q.body.hawaii?.pickupLocationLabel!=='Honolulu warehouse / freight-terminal pickup location'||!q.body.hawaii?.finalMileQuoteRequired)throw Error('Available HI quote')}else console.log('HAWAII_AVAILABLE_PREPAYMENT=NOT_TESTABLE_NO_CURRENT_ELIGIBLE_SKU');
          const ak=await post('/api/store-checkout/quote',{source:'lithium',id:known.id,name:known.title,quantity:1,shipping:{state:'AK'}});if(ak.status!==409||!String(ak.body.error||'').includes('Freight Review Required'))throw Error('AK boundary');console.log('ALASKA_REVIEW=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Browser performance and Hawaii UX
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail;mkdir -p /tmp/browser&&cd /tmp/browser;npm init -y >/dev/null 2>&1;npm install --no-save playwright@latest >/dev/null 2>&1;npx playwright install chromium >/dev/null 2>&1
          cat > verify.mjs <<'NODE'
          import fs from'fs';import{chromium}from'playwright';const base=process.env.DEPLOYMENT_URL.replace(/\/$/,''),states=JSON.parse(fs.readFileSync('/tmp/states.json','utf8')),before={'/':{requests:28,apiRequests:1,dom:271},'/lithium-batteries':{requests:39,apiRequests:3,dom:765},'/hawaii-lithium-batteries':{requests:57,apiRequests:41,dom:1613},'/rv-store':{requests:42,apiRequests:3,dom:516}},browser=await chromium.launch({headless:true}),after={};for(const route of Object.keys(before)){const ctx=await browser.newContext({viewport:{width:1280,height:900}}),page=await ctx.newPage(),req=[],api=[];page.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();await page.waitForTimeout(1800);const n=req.length;await page.waitForTimeout(2500);const idle=req.length-n,snap=await page.evaluate(()=>({dom:document.getElementsByTagName('*').length,images:document.images.length,scripts:document.scripts.length}));after[route]={...snap,requests:req.length,apiRequests:api.length,idleRequests:idle,api:api.map(u=>new URL(u).pathname)};console.log('PERF_BEFORE '+route+' '+JSON.stringify(before[route]));console.log('PERF_AFTER '+route+' '+JSON.stringify(after[route]));if(idle!==0)throw Error(route+' idle');if(route==='/'){if(await page.locator("[data-home-products='lithium'] .home-product-card").count()!==4||await page.locator("[data-home-products='rv'] .home-product-card").count()!==4)throw Error('homepage cards');if(api.some(u=>u.includes('/api/store/catalog')||u.includes('/api/store-catalog')))throw Error('homepage full catalog')}if(route==='/lithium-batteries'&&api.some(u=>new URL(u).pathname==='/api/store/catalog'))throw Error('Lithium duplicate Catalog');if(route==='/rv-store'&&api.some(u=>new URL(u).pathname==='/api/store-catalog'))throw Error('RV duplicate Catalog');if(route==='/hawaii-lithium-batteries'){const singles=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/status').length,batches=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/statuses').length,catalogs=api.filter(u=>new URL(u).pathname==='/api/store/catalog').length;if(singles!==0||batches>1||catalogs!==0)throw Error(`Hawaii pattern ${singles}/${batches}/${catalogs}`);if(after[route].requests>=57||after[route].apiRequests>=41)throw Error('Hawaii load did not improve');if(await page.locator('.lithium-card').count()!==38)throw Error('Hawaii cards');const labels=await page.locator('[data-hawaii-status]').allTextContents();if(labels.some(v=>!['Shipping Available','Freight Review Required','Currently Unavailable'].includes(v.trim())))throw Error('Hawaii labels')}await ctx.close()}
          const id=states.review_required[0]||states.shipping_available[0]||states.unavailable[0];if(id){const ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage();await page.goto(`${base}/checkout/?source=lithium&id=${encodeURIComponent(id)}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(2200);if(!(await page.locator('#checkout-hawaii-freight').isVisible()))throw Error('Hawaii checkout panel');const txt=await page.locator('#checkout-hawaii-freight').innerText();if(!txt.includes('Honolulu warehouse / freight-terminal pickup location')||!txt.includes('Additional delivery charges apply'))throw Error('Hawaii checkout wording');if(!(await page.locator('#checkout-name').isVisible())||!(await page.locator('#checkout-email').isVisible()))throw Error('contact fields');if(await page.locator('#checkout-address1').isVisible())throw Error('street address visible');if(states.review_required.includes(id)&&await page.locator('#checkout-paypal').isVisible())throw Error('PayPal visible review-required');await ctx.close()}await browser.close();fs.writeFileSync('/tmp/perf.json',JSON.stringify(after,null,2));
          NODE
          DEPLOYMENT_URL="${DEPLOYMENT_URL}" node verify.mjs
      - name: Promotion regression and final preview receipt
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          base="${DEPLOYMENT_URL%/}";curl -fsSL "$base/api/store/promotion" -o /tmp/p.json
          node <<'NODE'
          const p=JSON.parse(require('fs').readFileSync('/tmp/p.json'));if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z')throw Error('promotion times');const expected=Boolean(p.manualActive)&&Date.now()>=Date.parse(p.startAt)&&Date.now()<Date.parse(p.endAt);if(Boolean(p.active)!==expected)throw Error('promotion state');console.log(`PROMOTION=${p.windowState} ACTIVE=${p.active}`)
          NODE
          echo FINAL45_PREVIEW=PASS
          echo CANDIDATE=4e429ddbed40d9e200094520c6c694dec2afb938
          echo PREVIEW=${DEPLOYMENT_URL}
          cat /tmp/counts.json;cat /tmp/perf.json
