name: STOREFRONT-STABILIZATION-0906 Diagnostic

on:
  push:
    branches:
      - work/storefront-stabilization-sweep-0906-01

permissions:
  contents: read
  deployments: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Canonical QA
        run: npm run qa
      - name: Stabilization static contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Hawaii lithium shipping is reviewed by exact product or SKU' site/terms.html
          ! grep -Fq 'current customer freight price is $99 per actual battery' site/terms.html
          ! grep -q '>Coming Soon<' site/what-we-do.html
          grep -q 'Product-supply logistics, freight review, Hawaii and Alaska destination support' site/what-we-do.html
          python - <<'PY'
          import pathlib,re,sys
          bad=[]; found=[]; dynamic=[]
          allowed='2088134998'
          for p in pathlib.Path('site').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.html','.js','.css','.json','.md','.txt'}: continue
              try: text=p.read_text(errors='ignore')
              except Exception: continue
              for m in re.finditer(r'sms:[^\s"\'<>`]+',text,re.I):
                  raw=m.group(0)
                  destination=raw[4:].split('?',1)[0]
                  digits=''.join(re.findall(r'\d',destination))
                  found.append((str(p),destination))
                  if digits and len(digits)>=10 and digits[-10:]!=allowed:
                      bad.append((str(p),destination))
              if 'sms:${' in text or 'sms:'+'${' in text:
                  dynamic.append(str(p))
          print('Static SMS destinations:',found)
          print('Dynamic SMS source files:',dynamic)
          if bad:
              print('BAD SMS DESTINATIONS:',bad,file=sys.stderr); sys.exit(1)
          # Dynamic builders are allowed only when the source also carries the approved destination or derives from listing/contact data rather than a hard-coded alternate owner number.
          for rel in dynamic:
              text=pathlib.Path(rel).read_text(errors='ignore')
              if rel.endswith('solar-builder.js') and '12088134998' not in text:
                  print('solar-builder dynamic SMS lacks approved destination',file=sys.stderr); sys.exit(1)
          PY
      - name: Deploy isolated diagnostic preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=storefront-stabilization-0906-diagnostic
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect catalog APIs
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -fsSL "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          curl -fsSL "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lithium=JSON.parse(fs.readFileSync('/tmp/lithium.json','utf8')).products||[];
          const rv=JSON.parse(fs.readFileSync('/tmp/rv.json','utf8')).products||[];
          if(!lithium.find(x=>x.id==='sok-sk12v100pc')) throw new Error('SOK public product id missing');
          if(!rv.find(x=>x.id==='EUS-CAT-B9BEAF9D')) throw new Error('RV public product id missing');
          console.log('catalog product ids verified', {lithium:lithium.length,rv:rv.length});
          NODE
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser product-detail validation
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          async function inspect(name,url,expectLithium){
            const errors=[]; page.removeAllListeners('console'); page.removeAllListeners('pageerror');
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            page.on('pageerror',e=>errors.push('pageerror:'+e.message));
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>{
              const detail=document.querySelector('[data-product-detail]');
              const unavailable=document.querySelector('[data-product-unavailable]');
              return (detail && detail.hidden===false) || (unavailable && unavailable.hidden===false);
            },null,{timeout:20000});
            const state=await page.evaluate(()=>({
              title:document.querySelector('[data-product-title]')?.textContent?.trim(),
              detailHidden:document.querySelector('[data-product-detail]')?.hidden,
              unavailableHidden:document.querySelector('[data-product-unavailable]')?.hidden,
              lithiumRetailerHidden:document.querySelector('[data-lithium-retailer]')?.hidden,
              lithiumFreightHidden:document.querySelector('[data-lithium-freight-link]')?.hidden
            }));
            console.log(name,state,'errors=',errors);
            if(state.detailHidden!==false || state.unavailableHidden!==true) throw new Error(`${name}: product detail did not resolve`);
            if(expectLithium){
              if(state.lithiumRetailerHidden!==false || state.lithiumFreightHidden!==false) throw new Error(`${name}: lithium disclosures missing`);
            } else {
              if(state.lithiumRetailerHidden!==true || state.lithiumFreightHidden!==true) throw new Error(`${name}: lithium-only UI leaked onto RV product`);
            }
            if(errors.length) console.log(`${name}: non-fatal console errors`,errors);
          }
          await inspect('SOK',`${base}/product?id=sok-sk12v100pc&store=lithium`,true);
          await inspect('RV',`${base}/product?id=EUS-CAT-B9BEAF9D&store=rv`,false);
          await browser.close();
          NODE
      - name: Preview smoke
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -fsSL "$base/terms" | grep -q 'Hawaii lithium shipping is reviewed by exact product or SKU'
          ! curl -fsSL "$base/terms" | grep -Fq 'current customer freight price is $99 per actual battery'
          curl -fsSL "$base/what-we-do" | grep -q 'Product-supply logistics, freight review, Hawaii and Alaska destination support'
          ! curl -fsSL "$base/what-we-do" | grep -q '>Coming Soon<'
          npm run qa:preview -- "$base"
      - name: Record diagnostic summary
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### STOREFRONT STABILIZATION PREVIEW PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'SOK and RV product details resolved in Chromium; RV lithium-only UI hidden.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Hawaii Terms and stale logistics copy reconciled; SMS target audit passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No production deployment performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
