          # No customer-facing SOK media hotlinks or speculative rack images were added.
          ! grep -R -E 'primaryImage:"https?://|images:\["https?://' site/sok-availability-runtime.js

      - name: Commit and publish release candidate branch
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add site coordination/decisions/DEC-008-sok-authorized-dealer-catalog-and-purchase-modes.md
          git commit -m 'Finalize SOK catalog purchase options and backorder flow'
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:refs/heads/release/sok-4-6-prepurchase-backorder-2026-09-04

      - name: Deploy isolated Release Candidate preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=sok-46-prepurchase-final
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify isolated preview
        shell: bash
        env:
          BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          echo "RC=$base"
          for route in / /lithium-batteries /hawaii-lithium-batteries /sok-order.html /checkout/ /rv-store /marketplace /start-a-project /solar-project /admin-sok; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/body -w '%{http_code}' "$base$route")
            test "$code" = 200 || { echo "$route returned $code"; cat /tmp/body; exit 1; }
          done

          curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 "$base/api/sok/catalog" -o /tmp/sok.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sok.json'))
          rows=d.get('products') or d.get('items') or []
          assert len(rows)==2, d
          by={r['sku']:r for r in rows}
          assert {'SK12V100PC','SK48V100N'} <= set(by), by
          assert by['SK12V100PC']['availabilityMode']=='available', by['SK12V100PC']
          assert by['SK48V100N']['availabilityMode']=='prepurchase', by['SK48V100N']
          for r in rows:
              assert r['publicPurchaseMode']=='PURCHASE_OPTIONS', r
              assert r['commerceCta']=='See Purchase Options', r
              assert r['paymentEligible'] is False, r
              assert r['purchaseUrl'].startswith('/sok-order.html'), r
              assert r['promotion']['eligible'] is False and r['promotion']['pricingMode']=='sok-map', r
              assert r['hawaiiStatus']=='freight_review_required', r
          raw=open('/tmp/sok.json').read().lower()
          for forbidden in ['suppliercost','supplierinventory','sourcewarehouse','dropshipcost','landedcost','margin']:
              assert forbidden not in raw, forbidden
          assert 'us.sokbattery.com' not in raw
          print('SOK public catalog PASS')
          PY

          curl -sS -L "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/lithium.json'))
          rows=d.get('products') or []
          skus={str(r.get('sku','')).upper() for r in rows}
          assert 'SK12V100PC' in skus and 'SK48V100N' in skus, skus
          print('Merged Lithium catalog PASS')
          PY

          curl -sS -L "$base/lithium-batteries" -o /tmp/lithium.html
          grep -Fq 'AUTHORIZED SOK ENERGY DEALER' /tmp/lithium.html
          grep -Fq 'SK12V100PC' /tmp/lithium.html
          grep -Fq 'SK48V100N' /tmp/lithium.html
          grep -Fq 'See Purchase Options' /tmp/lithium.html

          curl -sS -L "$base/hawaii-lithium-batteries" -o /tmp/hawaii.html
          grep -Fq 'Hawaii SOK Battery Catalog' /tmp/hawaii.html
          grep -Fq 'SK12V100PC' /tmp/hawaii.html
          grep -Fq 'SK48V100N' /tmp/hawaii.html
          grep -Fq 'Freight Review Required' /tmp/hawaii.html
          ! grep -qi 'KINGBOSS' /tmp/hawaii.html
          ! grep -q '\$1,298' /tmp/hawaii.html
          ! grep -q '\$418' /tmp/hawaii.html

          quote(){
            local payload="$1" out="$2"
            curl -sS -o "$out" -w '%{http_code}' -H "Origin: $base" -H 'Content-Type: application/json' -d "$payload" "$base/api/store-checkout/quote"
          }
          code=$(quote '{"source":"lithium","id":"sok-sk12v100pc","quantity":1,"shipping":{"state":"CO"}}' /tmp/q12.json)
          test "$code" = 200 || { cat /tmp/q12.json; exit 1; }
          code=$(quote '{"source":"lithium","id":"sok-sk48v100n","quantity":1,"shipping":{"state":"CO"}}' /tmp/q48.json)
          test "$code" = 200 || { cat /tmp/q48.json; exit 1; }
          python3 - <<'PY'
          import json
          for f in ['/tmp/q12.json','/tmp/q48.json']:
              q=json.load(open(f))
              assert q['availability']['purchaseMode']=='PURCHASE_OPTIONS', q
              assert q['availability']['paymentEligible'] is False, q
              assert q['availability']['cta']=='See Purchase Options', q
          assert json.load(open('/tmp/q12.json'))['unitPriceCents']==31900
          assert json.load(open('/tmp/q48.json'))['unitPriceCents']==119900
          print('Purchase-mode payment gate PASS')
          PY

          code=$(quote '{"source":"lithium","id":"sok-sk12v100pc","quantity":1,"couponCode":"LABORDAY25","shipping":{"state":"CO"}}' /tmp/promo.json)
          test "$code" = 409 || { echo "SOK promo expected 409 got $code"; cat /tmp/promo.json; exit 1; }

          code=$(quote '{"source":"lithium","id":"sok-sk48v100n","quantity":1,"shipping":{"state":"HI"}}' /tmp/hi1.json)
          test "$code" = 409 || { echo "HI qty1 expected 409 got $code"; cat /tmp/hi1.json; exit 1; }
          grep -qi 'Freight Review Required' /tmp/hi1.json
          code=$(quote '{"source":"lithium","id":"sok-sk48v100n","quantity":4,"shipping":{"state":"HI"}}' /tmp/hi4.json)
          test "$code" = 409 || { echo "HI qty4 expected 409 got $code"; cat /tmp/hi4.json; exit 1; }
          grep -qi 'Commercial Quantity' /tmp/hi4.json

          code=$(curl -sS -o /tmp/admin -w '%{http_code}' "$base/api/admin/sok-availability")
          test "$code" = 401
          for path in /sok-availability-runtime.js /sok-operations-runtime.js; do
            code=$(curl -sS -o /tmp/private -w '%{http_code}' "$base$path")
            test "$code" = 404 || { echo "$path expected 404 got $code"; exit 1; }
          done

      - name: Promote candidate to main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          git fetch origin main
          test "$(git rev-parse origin/main)" = 'b6e33ba2e5b9f1ce354907ea4f98534e61407f51'
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main

      - name: Deploy production
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify canonical production
        shell: bash
        env:
          IMMUTABLE: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          for base in "${IMMUTABLE%/}" 'https://elevationupscales.com'; do
            for route in / /lithium-batteries /hawaii-lithium-batteries /sok-order.html /checkout/ /rv-store /marketplace /start-a-project /solar-project /admin-sok; do
              code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 3 -o /tmp/body -w '%{http_code}' "$base$route")
              test "$code" = 200 || { echo "$base$route returned $code"; cat /tmp/body; exit 1; }
            done
            curl -sS -L --retry 10 --retry-all-errors --retry-delay 3 "$base/api/sok/catalog" -o /tmp/sok-prod.json
            python3 - <<'PY'
          import json
          d=json.load(open('/tmp/sok-prod.json'))
          rows=d.get('products') or d.get('items') or []
          assert len(rows)==2, d
          for r in rows:
              assert r['publicPurchaseMode']=='PURCHASE_OPTIONS', r
              assert r['paymentEligible'] is False, r
          PY
            code=$(curl -sS -o /tmp/private -w '%{http_code}' "$base/sok-operations-runtime.js")
            test "$code" = 404
            code=$(curl -sS -o /tmp/admin -w '%{http_code}' "$base/api/admin/sok-availability")
            test "$code" = 401
          done

      - name: Record production receipt and baseline
        shell: bash
        env:
          APP_SHA: ${{ steps.candidate.outputs.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
          PRODUCTION_URL: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p release-receipts
          cat > release-receipts/SOK_4.6_PREPURCHASE_BACKORDER_PRODUCTION_RECEIPT_2026-09-04.md <<EOF
          # SOK 4.6 Pre-Purchase / Backorder Production Receipt

          - Production parent: b6e33ba2e5b9f1ce354907ea4f98534e61407f51
          - Application SHA: ${APP_SHA}
          - RC preview: ${PREVIEW_URL}
          - Immutable production: ${PRODUCTION_URL}
          - Canonical production: https://elevationupscales.com
          - Acceptance: 15/15 static + JavaScript syntax + isolated live preview PASS
          - Public SOK products: SK12V100PC, SK48V100N
          - Public purchase mode at launch: PURCHASE_OPTIONS
          - Availability at launch: SK12V100PC Available; SK48V100N Pre-Purchase
          - Payment: blocked until a SKU is explicitly moved to DIRECT_CHECKOUT and all availability/destination gates also pass
          - Hawaii: 1–3 controlled freight review; 4+ commercial freight review
          - SOK MAP: LABORDAY25 excluded
          - Carrier acceptance: NOT PROVEN
          - Economics: NOT PROVEN
          - Public/internal supplier data boundary: PASS
          - SOK local media: no unverified image/logo assets introduced; approved media remains pending asset availability
          - Supplier refresh: none
          - Commerce Pricing 2.0 rerun: none
          EOF
          git add release-receipts/SOK_4.6_PREPURCHASE_BACKORDER_PRODUCTION_RECEIPT_2026-09-04.md
          git commit -m 'Record SOK 4.6 pre-purchase backorder production receipt [release-generated]'
          git push origin HEAD:main
          git push origin "${APP_SHA}:refs/heads/baseline-2026-09-04-sok-4-6-prepurchase-backorder-production"
          echo "RECEIPT_SHA=$(git rev-parse HEAD)"
