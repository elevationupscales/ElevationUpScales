name: Patch Live Commerce Gate

on:
  push:
    branches:
      - feature/apparel-onsite-checkout-v3.11.42

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[live-commerce-gated]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/apparel-onsite-checkout-v3.11.42
          fetch-depth: 0
      - name: Add explicit live checkout approval gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('site/store-checkout-server.js')
          s=p.read_text()
          if 'function liveCheckoutAllowed(env)' not in s:
              old='''function paypalConfigured(env) {\n  return Boolean(clean(env?.PAYPAL_CLIENT_ID, 300) && clean(env?.PAYPAL_CLIENT_SECRET, 300));\n}\n'''
              new=old+'''\nfunction envFlag(value) {\n  return ["1", "true", "yes", "on"].includes(clean(value, 20).toLowerCase());\n}\n\nfunction liveCheckoutAllowed(env) {\n  return paypalMode(env) !== "live" || envFlag(env?.STORE_LIVE_CHECKOUT_ENABLED);\n}\n'''
              assert old in s
              s=s.replace(old,new,1)

          old_create='''  if (!paypalConfigured(env)) return json({ error: "PayPal checkout is not configured" }, 503);\n\n  const raw = await request.json().catch(() => ({}));'''
          new_create='''  if (!paypalConfigured(env)) return json({ error: "PayPal checkout is not configured" }, 503);\n  if (!liveCheckoutAllowed(env)) return json({ error: "Live checkout is locked pending launch approval" }, 503);\n\n  const raw = await request.json().catch(() => ({}));'''
          if new_create not in s:
              assert old_create in s
              s=s.replace(old_create,new_create,1)

          old_capture='''  if (!paypalConfigured(env)) return json({ error: "PayPal checkout is not configured" }, 503);\n  const id = validOrderId(orderId);'''
          new_capture='''  if (!paypalConfigured(env)) return json({ error: "PayPal checkout is not configured" }, 503);\n  if (!liveCheckoutAllowed(env)) return json({ error: "Live checkout is locked pending launch approval" }, 503);\n  const id = validOrderId(orderId);'''
          if new_capture not in s:
              assert old_capture in s
              s=s.replace(old_capture,new_capture,1)

          old_config='''    const response = json({\n      ok: true,\n      configured: paypalConfigured(env),\n      environment: paypalMode(env),\n      clientId: paypalConfigured(env) ? clean(env.PAYPAL_CLIENT_ID, 300) : "",'''
          new_config='''    const credentialsConfigured = paypalConfigured(env);\n    const checkoutEnabled = credentialsConfigured && liveCheckoutAllowed(env);\n    const response = json({\n      ok: true,\n      configured: checkoutEnabled,\n      credentialsConfigured,\n      checkoutEnabled,\n      liveCheckoutApproved: paypalMode(env) === "live" ? envFlag(env?.STORE_LIVE_CHECKOUT_ENABLED) : false,\n      environment: paypalMode(env),\n      clientId: checkoutEnabled ? clean(env.PAYPAL_CLIENT_ID, 300) : "",'''
          if new_config not in s:
              assert old_config in s
              s=s.replace(old_config,new_config,1)
          p.write_text(s)

          doc=Path('STORE-CHECKOUT-v3.11.42-HANDOFF.md')
          if doc.exists():
              d=doc.read_text()
              marker='## Live commerce safety gate'
              if marker not in d:
                  d += '''\n\n## Live commerce safety gate\n\nReal-money checkout requires an explicit Cloudflare variable in addition to live PayPal credentials:\n\n- `STORE_LIVE_CHECKOUT_ENABLED=true`\n\nSandbox checkout does not require this flag. When `PAYPAL_ENV=live` and the flag is absent/false, Store checkout reports disabled and blocks order creation/capture. Set it only after all production release gates, including sales-tax handling, are approved.\n'''
                  doc.write_text(d)
          PY
          node --check site/store-checkout-server.js
          grep -q 'STORE_LIVE_CHECKOUT_ENABLED' site/store-checkout-server.js
          grep -q 'Live checkout is locked pending launch approval' site/store-checkout-server.js
          git diff --check
      - name: Commit gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/store-checkout-server.js STORE-CHECKOUT-v3.11.42-HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Require explicit approval for live Store checkout [live-commerce-gated]'
          git push origin HEAD:feature/apparel-onsite-checkout-v3.11.42
