name: SOK 4.6 Pre-Purchase Preview Diagnostic

on:
  push:
    branches:
      - runner/sok-4-6-prepurchase-diagnostic-2026-09-04

permissions:
  contents: read
  deployments: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: 943c5c1157c808e83dd9db0cbcfb318e40f987cd
          fetch-depth: 1

      - name: Instrument diagnostic preview only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "943c5c1157c808e83dd9db0cbcfb318e40f987cd"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/sok-availability-runtime.js')
          s=p.read_text()
          old='console.error(JSON.stringify({event:"sok_public_catalog_error",message:clean(error?.message,240)}));return[];'
          if old not in s: raise SystemExit('public catalog catch marker not found')
          s=s.replace(old,'throw error;',1)
          old2='return json({error:"SOK availability request failed"},500);'
          if old2 not in s: raise SystemExit('public handler catch marker not found')
          s=s.replace(old2,'return json({error:"SOK availability request failed",diagnostic:clean(error?.message,300)},500);',1)
          p.write_text(s)
          PY
          git diff --check
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)

      - name: Deploy diagnostic preview
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=sok-46-prepurchase-diagnostic-v2
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Probe SOK initialization
        shell: bash
        env:
          BASE: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -u
          base="${BASE%/}"
          echo "BASE=$base"
          for path in '/api/sok/catalog' '/api/store/catalog?section=lithium-batteries' '/api/hawaii-lithium/eligible-products'; do
            echo "===== $path ====="
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/body -w '%{http_code}' "$base$path" || true)
            echo "HTTP=$code"
            cat /tmp/body 2>/dev/null || true
            echo
          done
