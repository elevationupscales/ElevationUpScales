name: Temporary Doba public availability projection

on:
  push:
    branches:
      - work/doba-public-availability-projection-0911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/doba-public-availability-projection-0911
      - name: Apply bounded Doba availability projection patch
        run: |
          set -euo pipefail
          python .github/scripts/tmp_doba_public_availability_projection.py
          rm .github/scripts/tmp_doba_public_availability_projection.py
          rm .github/workflows/tmp-doba-public-availability-projection.yml
          git diff --check
          npm test
          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add site/catalog-admin-runtime.js site/universal-store.js tests/doba-public-availability.test.cjs .github/scripts/tmp_doba_public_availability_projection.py .github/workflows/tmp-doba-public-availability-projection.yml
          git commit -m 'Fix Doba public availability projection'
          git push origin HEAD:work/doba-public-availability-projection-0911
