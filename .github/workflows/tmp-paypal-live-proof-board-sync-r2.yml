name: Temporary PayPal live proof board sync r2

on:
  push:
    branches:
      - ops/paypal-live-proof-board-sync-0911-r2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ops/paypal-live-proof-board-sync-0911-r2
      - name: Reconcile current main control state
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          board = Path('operations/CURRENT_WORK_BOARD.md')
          text = board.read_text()
          original = text

          old_baseline = '**Last source-state reconciliation baseline:** `18b8d752278faf2d73e8d309a66d855b1a0ffe54`'
          new_baseline = '**Last source-state reconciliation baseline:** `da47c5096afc2e7f87f1273b9888ea8a601a5876`'
          if old_baseline not in text:
              raise SystemExit('Expected board reconciliation baseline not found')
          text = text.replace(old_baseline, new_baseline, 1)

          lines = text.splitlines()
          counts = {'p0':0, 'renogy_index':0, 'renogy_active':0, 'universal':0}
          out = []
          for line in lines:
              if line.startswith('**Last source-state reconciliation baseline:**'):
                  line = line.rstrip()
              if line.startswith('| Shopify first-sale acceleration + PayPal cart integration |'):
                  counts['p0'] += 1
                  line = '| Shopify first-sale acceleration + PayPal cart integration | **Operating System Project Manager / Company Operations**; MASTER DEVELOPER + Shopify/Ecommerce execution; vendor managers supply verified SKU facts | ACTIVE — NATIVE SHOPIFY CHECKOUT LIVE / CUSTOM PAYPAL LIVE / FIRST REAL PAYPAL ORDER OPEN | **P0 OWNER DIRECTED / #1 COMPANY PRIORITY** | Shopify password gate is CLOSED and native Shopify payment-entry checkout remains live. Custom Elevation PayPal production acceptance is proven at production source `3aed2c99ef751882c298362b4c2596bf38a2117f`: LIVE PayPal credentials are configured, live checkout is approved/enabled, canonical SOK quote returns HTTP 200, PayPal SDK/button render is confirmed, and malicious or missing-Origin POSTs remain denied with 403. No synthetic paid transaction will be manufactured; the remaining external trigger is the first real paid PayPal order and downstream fulfillment receipt. | Keep both working payment paths live. Move first-real-order proof to the back as an external event. Route vendor managers to return the first 5–10 low-friction, margin-safe, supplier-verified promotion candidates with fresh SKU/price/MAP/sellability/fulfillment checks; push free/owned traffic only to proven buy paths. On the first PayPal order, reverify exact SKU/source, confirm capture and durable order persistence, route fulfillment, and record the receipt. Keep PayPal SDK v6 as a later improvement unless the currently working v5 path develops a live defect. | Repeatable direct-site cart/checkout/order-routing path is proven **and** first verified Elevation website PayPal order is received and routed to fulfillment, closing the current startup-revenue phase | `PAYPAL_CART_INTEGRATION_REVENUE_DIRECTIVE_2026-09-11.md`; `STARTUP_REVENUE_PHASE_NONBLOCKING_ORDER_STANDARD_2026-09-11.md`; `PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md`; Shopify live QA 2026-09-11 |'
              elif line.startswith('| Renogy Dealer / Catalog / Commerce Integration |'):
                  counts['renogy_index'] += 1
                  line = line.replace('SALES-FIRST CATALOG ACTIVATION ACTIVE / zero live Renogy Shopify products at recon', 'SALES-FIRST CATALOG ACTIVATION ACTIVE / SHOPIFY STATE CONFLICT OPEN — accepted 5-DRAFT staging receipt vs later zero-result recon / live recheck required / do not recreate')
              elif line.startswith('| Renogy sales-first catalog / live commerce activation |'):
                  counts['renogy_active'] += 1
                  line = line.replace('ZERO LIVE RENOGY PRODUCTS AT RECON', 'SHOPIFY STATE CONFLICT OPEN — 5-DRAFT STAGING RECEIPT VS LATER ZERO-RESULT RECON')
                  old_next = 'Clear Tier A activation facts, build/stage customer-ready listings, activate each clean SKU, continue Tier B exact-SKU recon in parallel, feed live products into the universal catalog acceptance lane, then prove the first real order.'
                  new_next = 'First resolve the Shopify record-state conflict with a live authenticated recheck; do not recreate the five previously staged records while the conflict is unresolved. Continue Tier A MAP/dealer-sellability/media facts and Tier B exact-SKU recon in parallel, activate only independently clean SKUs after the state recheck, feed live products into universal-catalog acceptance, then prove the first real order.'
                  if old_next not in line:
                      raise SystemExit('Renogy next-action text not found')
                  line = line.replace(old_next, new_next, 1)
              elif line.startswith('| Universal catalog live vendor integration acceptance |'):
                  counts['universal'] += 1
                  line = line.replace('Renogy had zero Shopify products at sales-first recon', 'Renogy has conflicting Shopify evidence: an accepted five-DRAFT staging receipt and a later zero-result recon; live recheck is required and records must not be recreated meanwhile')
              out.append(line)

          if counts != {'p0':1, 'renogy_index':1, 'renogy_active':1, 'universal':1}:
              raise SystemExit(f'Unexpected board row counts: {counts}')

          text = '\n'.join(out) + ('\n' if original.endswith('\n') else '')
          closed_marker = '# CLOSED / PROTECTED FROM RECREATION'
          closed_note = '- Custom Elevation PayPal checkout origin/quote blocker — CLOSED by PR #128 and production run #39 at `3aed2c99ef751882c298362b4c2596bf38a2117f`; canonical quote, LIVE configuration, and PayPal button render are proven. Do not recreate this technical blocker. The remaining proof is the first real paid order through capture, durable order record, and fulfillment routing.'
          if closed_note not in text:
              if closed_marker not in text:
                  raise SystemExit('Closed section marker missing')
              text = text.replace(closed_marker, closed_marker + '\n\n' + closed_note, 1)
          board.write_text(text)

          Path('operations/PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md').write_text('''# Elevation UpScales — PayPal Direct Checkout Live Acceptance Receipt\n\n**Date:** 2026-09-11 MDT\n**Owner:** Casey Young\n**Lane:** Operating System / Company Operations / Commerce\n**Status:** TECHNICALLY LIVE / FIRST REAL PAID ORDER PROOF OPEN\n\n## Accepted production state\n\n- Production source accepted for this repair: `3aed2c99ef751882c298362b4c2596bf38a2117f`.\n- PR #128 repaired the canonical Elevation checkout Origin validation without opening cross-origin POST access.\n- Production deploy workflow run `34660573945` / run #39 completed successfully: canonical QA, repository credential scan, Cloudflare deployment, deployed-application smoke, canonical-domain smoke, and receipt all passed.\n- Public checkout configuration reports PayPal environment `live`, credentials configured, checkout enabled, live checkout approved, and a browser client ID available.\n- Canonical SOK test quote `sok-sk12v100pc` returns HTTP 200 with product `SOK SK12V100PC 12.8V 100Ah 1280Wh LiFePO4 Battery`, quantity 1, unit price 31900 cents, shipping 0 cents, total 31900 cents.\n- Canonical Elevation Origin POST is accepted. An arbitrary external Origin and a missing Origin both remain rejected with HTTP 403.\n- GitHub-hosted headless Chrome reached the live checkout, rendered the exact SOK product, reached `Secure PayPal checkout ready.`, and found PayPal button/frame render evidence.\n- Native Shopify checkout remains a separate working payment path and was not disabled or replaced by this repair.\n\n## Remaining external acceptance event\n\nNo synthetic live payment will be created merely to manufacture an order receipt. The remaining acceptance event is the first real paid Elevation website PayPal transaction.\n\nOn that first real order, execute:\n\n**PAYMENT CAPTURE → DURABLE ELEVATION ORDER RECORD → EXACT SKU/SOURCE REVERIFY → SUPPLIER PURCHASE/ACCEPTANCE → TRACKING → DELIVERY → RECEIPT**\n\nAbsence of the first order is an external-event gate only. It does not block promotion-candidate verification, catalog work, traffic preparation, or the working Shopify payment path.\n\n## Next executable P0 work\n\nRoute vendor managers to return the first 5–10 low-friction, margin-safe, supplier-verified products for promotion. Each candidate must be freshly checked for exact SKU, current customer price/MAP, sellability, fulfillment path, and channel readiness before traffic is pushed.\n\nThe current PayPal browser SDK path is working in production. Do not perform an SDK migration merely to create work; treat a v6 migration as a later improvement unless the live v5 path develops a defect or a new capability requires it.\n''')

          Path('operations/P0_FIRST_SALE_PROMOTION_CANDIDATE_ROUTING_2026-09-11.md').write_text('''# Elevation UpScales — P0 First-Sale Promotion Candidate Routing\n\n**Date:** 2026-09-11 MDT\n**Owner:** Casey Young\n**Priority:** P0 / #1 COMPANY PRIORITY\n**State:** ROUTED / VENDOR FACT RETURN REQUIRED\n\n## Purpose\n\nThe PayPal technical checkout path is live and first-real-paid-order proof is an external-event gate. Do not wait on that event before continuing finishable revenue work.\n\nReturn a combined first-sale promotion shortlist of **5–10 products total** using current dedicated vendor lanes. Do not create a new vendor manager and do not reopen completed onboarding.\n\n## Required vendor inputs\n\n### VEVOR Project Operations Manager\nReturn the strongest low-friction candidates from the already-live VEVOR Direct catalog. Reverify each selected exact SKU before recommending promotion.\n\n### SOK Project Operations Manager\nReturn the strongest Lower-48 direct-sale candidates from the controlled SOK catalog. Preserve SOK MAP, source, availability/backorder, and fulfillment rules.\n\n### Renogy Branch Operations Manager\nA source-state conflict is open: `RENOGY_CATALOG_LAUNCH_BATCH_01_2026-09-10.md` records five staged Shopify DRAFT products, while `RENOGY_LOWER48_CATALOG_HAZMAT_SHOPIFY_RECON_2026-09-11.md` later reports zero Renogy products. Perform a live authenticated Shopify recheck before any recreate/import action. **Do not recreate the five prior records while the conflict is unresolved.** Only return a Renogy promotion candidate after the live state is reconciled and its per-SKU activation set is clear.\n\n### Kingboss Project Operations Manager\nDo not create placeholder promotion candidates until a verified catalog/source product set exists.\n\n## Per-candidate acceptance fields\n\nEach returned candidate must include vendor; exact SKU/model; customer title; current customer price; current MAP/price-control status; supplier sellability/availability; fulfillment path and destination limitations; current checkout path; verified economic/margin confidence; media/listing readiness; likely conversion rationale; exact blocker if any; and PROMOTE/HOLD recommendation.\n\n## Ranking standard\n\nPrefer products that are currently sellable and fulfillment-clean, lower-friction in price, useful across Elevation customer use cases, margin-safe under verified pricing, already listing/media ready, normal Lower-48 shippable without manual freight review, and ready for a real order now.\n\nDo not prioritize a product merely because it is expensive, popular on a supplier site, or already listed.\n\n## Return path\n\nVendor managers return only verified product facts and recommendations into their own project worktree/source. Operating System / Company Operations reconciles the combined 5–10 product promotion set and routes traffic only after the candidate set is clean.\n\n**BLOCKED GOES TO THE BACK — FINISHABLE WORK MOVES FORWARD — NOTHING DISAPPEARS.**\n''')
          PY
          rm .github/workflows/tmp-paypal-live-proof-board-sync-r2.yml
          git diff --check
          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add operations/CURRENT_WORK_BOARD.md operations/PAYPAL_DIRECT_CHECKOUT_LIVE_ACCEPTANCE_RECEIPT_2026-09-11.md operations/P0_FIRST_SALE_PROMOTION_CANDIDATE_ROUTING_2026-09-11.md .github/workflows/tmp-paypal-live-proof-board-sync-r2.yml
          git commit -m 'Ops: reconcile PayPal proof and Renogy Shopify state'
          git push origin HEAD:ops/paypal-live-proof-board-sync-0911-r2
