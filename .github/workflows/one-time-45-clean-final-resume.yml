name: One-Time 4.5 Clean Final Resume
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-clean-final-resume.yml
permissions:
  contents: read
  deployments: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          fetch-depth: 0
      - name: Exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ed2eaee5a01e3a5f23e1322eb63fa03c058220a6"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-45-*' -print -quit)"
          if test -d .github/scripts; then test -z "$(find .github/scripts -maxdepth 1 -type f \( -name 'apply_45_*' -o -name 'repair_45_*' \) -print -quit)"; fi
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          grep -q 'Checking Hawaii Shipping' site/store-checkout.js
          grep -q 'Checking this exact battery' site/store-checkout.js
          grep -q '"/hawaii-lithium-batteries"' site/_routes.json
          grep -q '/api/hawaii-lithium/statuses' site/lithium-shop.js
          echo SOURCE=PASS
      - name: Deploy exact isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=commerce45cleanresume
      - name: Runtime proof
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"; echo PREVIEW=$base
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 -o /tmp/r -w '%{http_code}' "$base$route" || true); echo "$route=$code"; test "$code" = 200; done
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/featured" -o /tmp/f.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/hawaii-lithium/statuses" -o /tmp/status.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=CO&quantity=2&batteryUnits=1" -o /tmp/co.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/f.json')),r=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[],s=JSON.parse(fs.readFileSync('/tmp/status.json')),co=JSON.parse(fs.readFileSync('/tmp/co.json')),hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json'));if(li.length!==38||rv.length<1||(f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('Catalog/featured');const l=r.find(x=>x.region==='LOWER48'),h=r.find(x=>x.region==='HI'),d=r.find(x=>x.region==='HI_DELIVERY'),a=r.find(x=>x.region==='AK');if(l?.rateCents!==2799||h?.rateCents!==9900||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3||!d?.quoteRequired||d?.rateCents!==0||!a?.quoteRequired||a?.rateCents!==0||co.shippingCents!==5598||hi.shippingCents!==19800||ak.status!=='review_required')throw Error('shipping rules');const c={shipping_available:0,review_required:0,unavailable:0};for(const p of li){const x=s.statuses?.[p.id]||s.statuses?.[String(p.sku||'').toLowerCase()];if(x&&x.customerState in c)c[x.customerState]++}console.log(JSON.stringify({lithium:li.length,rv:rv.length,featured:'4+4',hawaii:c}));
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/l.html; curl -fsSL --retry 8 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/h.html; curl -fsSL --retry 8 --retry-all-errors "$base/rv-store" -o /tmp/r.html
          node <<'NODE'
          const fs=require('fs'),l=fs.readFileSync('/tmp/l.html','utf8'),h=fs.readFileSync('/tmp/h.html','utf8'),r=fs.readFileSync('/tmp/r.html','utf8'),a=(l.match(/class="lithium-card"/g)||[]).length,b=(h.match(/class="lithium-card"/g)||[]).length,c=(r.match(/class="rv-product-card"/g)||[]).length;console.log(`PRERENDER=${a}/${b}/${c}`);if(a!==38||b!==38||c<1||!h.includes('data-prerendered="true"'))throw Error('prerender');
          NODE
      - name: Checkout and browser proof
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{const base=process.env.BASE.replace(/\/$/,''),id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';async function p(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}const co=await p('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'CO'}}),hi=await p('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'HI'}}),o=await p('/api/store-checkout/orders',{source:'lithium',id,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview',state:'HI',countryCode:'US'}});if(co.status!==200||co.body?.battery?.actualBattery!==true||co.body.shippingCents!==2799||hi.status!==200||hi.body.hawaii?.customerState!=='review_required'||hi.body.hawaii?.paymentAllowed!==false||o.status!==409||!o.body.hawaiiFreight)throw Error('checkout boundary');console.log('CHECKOUT=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          mkdir -p /tmp/pw; cd /tmp/pw; npm init -y >/dev/null 2>&1; npm install --no-save playwright@latest >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          cat > v.mjs <<'NODE'
          import{chromium}from'playwright';const base=process.env.BASE.replace(/\/$/,''),browser=await chromium.launch({headless:true});const metrics={};for(const route of ['/','/lithium-batteries','/hawaii-lithium-batteries','/rv-store']){const ctx=await browser.newContext({viewport:{width:1280,height:900}}),page=await ctx.newPage(),req=[],api=[];page.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();await page.waitForTimeout(4300);metrics[route]={requests:req.length,apiRequests:api.length,dom:await page.evaluate(()=>document.getElementsByTagName('*').length)};if(route==='/hawaii-lithium-batteries'){const singles=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/status').length,batches=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/statuses').length,catalogs=api.filter(u=>new URL(u).pathname==='/api/store/catalog').length;if(singles!==0||batches>1||catalogs!==0||req.length>=57||api.length>=41||await page.locator('.lithium-card').count()!==38)throw Error('HI performance')}await ctx.close()}console.log('PERF='+JSON.stringify(metrics));const id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77',ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage();await page.goto(`${base}/checkout/?source=lithium&id=${id}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(800);if(!(await page.locator('#checkout-hawaii-freight').isVisible())||await page.locator('#checkout-address1').isVisible()||await page.locator('#checkout-paypal').isVisible())throw Error('immediate HI UI');const early=await page.locator('#checkout-hawaii-state').innerText();if(!early.includes('Checking Hawaii Shipping'))throw Error(early);await page.waitForFunction(()=>document.querySelector('#checkout-hawaii-state')?.textContent?.includes('Freight Review Required'),null,{timeout:15000});const t=await page.locator('#checkout-hawaii-freight').innerText();if(!t.includes('Honolulu warehouse / freight-terminal pickup location')||!t.includes('Additional delivery charges apply')||await page.locator('#checkout-address1').isVisible()||await page.locator('#checkout-paypal').isVisible()||!(await page.locator('#checkout-hawaii-reserve').isVisible()))throw Error('final HI UI');await ctx.close();await browser.close();console.log('BROWSER=PASS');
          NODE
          BASE="$BASE" node v.mjs
      - name: Promotion and final proof
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"; curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/p.json
          node <<'NODE'
          const p=require('/tmp/p.json');if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z'||p.windowState!=='active'||p.batteryShippingCents!==2799)throw Error('promotion');if(p.active&&p.couponPercent!==25)throw Error('coupon');console.log(JSON.stringify({active:p.active,manualActive:p.manualActive,windowState:p.windowState,couponPercent:p.couponPercent,batteryShippingCents:p.batteryShippingCents}));
          NODE
          echo FINAL_CLEAN_PREVIEW=PASS
          echo APPLICATION_SHA=ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          echo PREVIEW_URL=$base
