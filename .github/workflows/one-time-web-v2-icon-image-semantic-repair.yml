name: One-time Web V2 icon image semantic repair

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-icon-image-semantic-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Apply semantic visual repair
        shell: bash
        run: |
          set -euo pipefail
          python deployment/v2/one_time_web_v2_semantic_visual_repair.py
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
      - name: Commit repair and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-icon-image-semantic-repair.yml
          git rm deployment/v2/one_time_web_v2_semantic_visual_repair.py
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/semantic-icons.js \
                  apps/web-v2/src/shell.js \
                  apps/web-v2/src/catalog-pages.js \
                  apps/web-v2/src/final-visual-styles.js \
                  apps/web-v2/test/shell.test.mjs
          git commit -m 'Web V2: repair icon and image destination semantics'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
