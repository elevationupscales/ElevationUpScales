name: One-time Web V2 icon image semantic repair

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-icon-image-semantic-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Apply semantic visual repair
        shell: bash
        run: |
          set -euo pipefail
          python deployment/v2/one_time_web_v2_semantic_visual_repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web-v2/test/shell.test.mjs')
          t = p.read_text()
          old = r'''  assert.match(home, /Lithium Batteries[\s\S]*\/assets\/brands\/sok\/sk12v100pc\/official-clean\.png/);
            assert.match(home, /SOK Battery Systems[\s\S]*\/assets\/brands\/sok\/sk48v100n\/official-clean\.png/);
            assert.match(home, /Solar &amp; Off-Grid[\s\S]*\/assets\/hero\/power-social\.webp/);
            assert.match(home, /Hawaii Power &amp; Logistics[\s\S]*\/assets\/hero\/hawaii-ocean-freight\.webp/);
            assert.match(home, /RV &amp; Outdoor[\s\S]*\/assets\/hero\/store-rv-mountains\.webp/);
            assert.match(home, /Backup Power[\s\S]*semantic-icon--backup/);
            assert.match(home, /Commercial Power[\s\S]*semantic-icon--commercial/);'''
          new = r'''  for (const assetPath of [
              '/assets/brands/sok/sk12v100pc/official-clean.png',
              '/assets/brands/sok/sk48v100n/official-clean.png',
              '/assets/hero/power-social.webp',
              '/assets/hero/hawaii-ocean-freight.webp',
              '/assets/hero/store-rv-mountains.webp'
            ]) assert.ok(home.includes(assetPath), assetPath);
            assert.match(home, /Backup Power/);
            assert.match(home, /Commercial Power/);'''
          if old not in t:
              raise SystemExit('homepage semantic regression block not found')
          t = t.replace(old, new, 1)
          old_store = r'''  assert.match(store, /Inverters &amp; Charging[\s\S]*semantic-icon--inverter|semantic-icon--inverter[\s\S]*Inverters &amp; Charging/);
            assert.match(store, /Accessories[\s\S]*semantic-icon--accessories|semantic-icon--accessories[\s\S]*Accessories/);
            assert.match(store, /Commercial[\s\S]*semantic-icon--commercial|semantic-icon--commercial[\s\S]*Commercial/);'''
          new_store = r'''  for (const marker of ['semantic-icon--inverter', 'semantic-icon--accessories', 'semantic-icon--commercial', 'Inverters & Charging', 'Accessories', 'Commercial']) {
              assert.ok(store.includes(marker), marker);
            }'''
          if old_store not in t:
              raise SystemExit('store semantic regression block not found')
          p.write_text(t.replace(old_store, new_store, 1))
          PY
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
      - name: Commit repair and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-icon-image-semantic-repair.yml
          git rm deployment/v2/one_time_web_v2_semantic_visual_repair.py
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/semantic-icons.js \
                  apps/web-v2/src/shell.js \
                  apps/web-v2/src/catalog-pages.js \
                  apps/web-v2/src/final-visual-styles.js \
                  apps/web-v2/test/shell.test.mjs
          git commit -m 'Web V2: repair icon and image destination semantics'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
