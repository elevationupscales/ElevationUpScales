name: One-time Web V2 final functional visual finish

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-final-functional-visual-finish.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Apply final visual implementation
        shell: bash
        run: |
          set -euo pipefail
          python deployment/v2/one_time_final_functional_visual_finish.py
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
      - name: Commit implementation and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-final-functional-visual-finish.yml
          git rm deployment/v2/one_time_final_functional_visual_finish.py
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Web V2: implement final functional visual system'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
