name: One-Time 4.5 Commerce Control Exact Preview V2

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths:
      - .github/workflows/one-time-45-commerce-control-preview-v2.yml

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out exact corrected candidate
        uses: actions/checkout@v6
        with:
          ref: 5996cd771aaf979fd8e484e8c9ad724bca4e9e04
          fetch-depth: 0

      - name: Exact source gate
        shell: bash
        run: |
          set -euo pipefail
          pass(){ echo "PASS $1"; }
          test "$(git rev-parse HEAD)" = "5996cd771aaf979fd8e484e8c9ad724bca4e9e04"; pass exact-sha
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"; pass main-parent
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD; pass lineage
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0); pass js-syntax
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD; pass diff-check
          grep -q '2799' site/shipping-rules-runtime.js && grep -q '9900' site/shipping-rules-runtime.js && grep -q 'alaska-lithium' site/shipping-rules-runtime.js; pass shipping-seeds
          grep -q '/api/hawaii-lithium/statuses' site/lithium-shop.js && ! grep -q 'fetch(`/api/hawaii-lithium/status?sku=' site/lithium-shop.js; pass hawaii-batching-source
          grep -q '/api/store/featured' site/home-commerce.js && ! grep -q '/api/store/catalog' site/home-commerce.js && ! grep -q '/api/store-catalog' site/home-commerce.js; pass homepage-limited-source
          grep -q 'data-home-commerce' site/index.html && grep -q 'UNDERSTAND ELEVATION' site/what-we-do.html; pass homepage-what-we-do
          grep -q 'data-shipping-rules-admin' site/admin-lithium-shipping.html; pass admin-shipping-ui
          grep -q 'shippingRule:quote.shippingRule' site/store-checkout-server.js; pass order-rule-snapshot
          ! grep -q 'fallbackCatalog' site/rv-store.js; pass no-compat-marker

      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=commerce45preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Route, Catalog and Shipping Rules verification
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          echo "PREVIEW_URL=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /marketplace /terms /admin /admin-catalog /admin-store-orders /admin-lithium-shipping /what-we-do; do
            code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 -o /tmp/r -w '%{http_code}' "$base$route" || true)
            echo "ROUTE ${route}=${code}"; test "$code" = 200
          done
          curl -fsSL "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL "$base/api/store/featured" -o /tmp/f.json
          curl -fsSL "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          curl -fsSL "$base/api/hawaii-lithium/statuses" -o /tmp/hs.json
          ac=$(curl -sS -o /tmp/a -w '%{http_code}' "$base/api/admin/shipping-rules"); echo "ADMIN_UNAUTH=$ac"; test "$ac" = 401
          BASE="$base" node <<'NODE'
          const fs=require('fs');
          const li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[], rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[];
          const f=JSON.parse(fs.readFileSync('/tmp/f.json')), rules=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[];
          const hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json')),hs=JSON.parse(fs.readFileSync('/tmp/hs.json'));
          console.log(`LITHIUM=${li.length} RV=${rv.length}`); if(li.length!==38||rv.length<1)throw Error('Catalog count failure');
          if((f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('Featured 4+4 failure');
          for(const x of [...f.lithium,...f.rv])if(!(x.priceCents>0)||!x.image||!x.buyUrl||!x.detailUrl)throw Error('Incomplete featured product');
          const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),a=rules.find(x=>x.region==='AK');
          if(!l?.enabled||l.rateCents!==2799||l.calculation!=='per_battery')throw Error('Lower48 rule');
          if(!h?.enabled||h.rateCents!==9900||!h.pickupOnly||h.residentialAllowed||h.preferredConsolidationQuantity!==3)throw Error('HI rule');
          if(!a?.quoteRequired||a.rateCents!==0)throw Error('AK rule');
          if(hi.status!=='shipping_available'||hi.shippingCents!==19800)throw Error('HI resolve');
          if(ak.status!=='review_required'||ak.shippingCents!==0)throw Error('AK resolve');
          if(hs.customerFreightPerBatteryCents!==9900||!hs.pickupOnly||Object.keys(hs.statuses||{}).length<1)throw Error('HI status batch');
          fs.writeFileSync('/tmp/counts',JSON.stringify({lithium:li.length,rv:rv.length}));
          NODE
          curl -fsSL "$base/lithium-batteries" -o /tmp/li.html
          curl -fsSL "$base/hawaii-lithium-batteries" -o /tmp/hi.html
          curl -fsSL "$base/rv-store" -o /tmp/rv.html
          node <<'NODE'
          const fs=require('fs');
          for(const [n,p] of [['LI','/tmp/li.html'],['HI','/tmp/hi.html']]){const h=fs.readFileSync(p,'utf8'),c=(h.match(/class="lithium-card"/g)||[]).length;console.log(`${n}_PRERENDER=${c}`);if(!h.includes('data-prerendered="true"')||c!==38)throw Error(`${n} prerender`);}
          const r=fs.readFileSync('/tmp/rv.html','utf8'),c=(r.match(/class="rv-product-card"/g)||[]).length;console.log(`RV_PRERENDER=${c}`);if(!r.includes('data-prerendered="true"')||c<1)throw Error('RV prerender');
          NODE

      - name: Authoritative checkout verification
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),base=process.env.DEPLOYMENT_URL.replace(/\/$/,'');
          const ps=(JSON.parse(fs.readFileSync('/tmp/li.json')).products||[]).filter(x=>x.priceCents>0);
          async function post(path,body){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json',Origin:base},body:JSON.stringify(body)});return{status:r.status,body:await r.json().catch(()=>({}))};}
          let p,co;for(const x of ps){const q=await post('/api/store-checkout/quote',{source:'lithium',id:x.id,name:x.title,quantity:1,shipping:{state:'CO'}});if(q.status===200&&q.body?.battery?.actualBattery){p=x;co=q;break}}
          if(!p)throw Error('No authoritative battery quote'); const units=co.body.battery.batteryUnitsPerItem||1;
          if(co.body.shippingCents!==2799*units||co.body.shippingRule?.rateCents!==2799)throw Error('Lower48 shipping authority');
          const co2=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:2,shipping:{state:'CO'}});if(co2.status!==200||co2.body.shippingCents!==2799*units*2)throw Error('Lower48 quantity');
          const hi=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'HI'}});if(hi.status!==200||!hi.body.hawaii||hi.body.hawaii.customerFreightPerBatteryCents!==9900)throw Error('HI quote');
          if(!['shipping_available','review_required','unavailable'].includes(hi.body.hawaii.customerState))throw Error('HI state');
          const order=await post('/api/store-checkout/orders',{source:'lithium',id:p.id,name:p.title,quantity:1,customer:{email:'preview-check@example.com',name:'Preview Check'},shipping:{state:'HI'}});if(order.status!==409||!order.body.hawaiiFreight)throw Error(`HI payment boundary ${order.status}`);
          const ak=await post('/api/store-checkout/quote',{source:'lithium',id:p.id,name:p.title,quantity:1,shipping:{state:'AK'}});if(ak.status!==409||!String(ak.body.error||'').includes('Freight Review Required'))throw Error('AK boundary');
          console.log(`QUOTE_SAMPLE=${p.id} LOWER48=${co.body.shippingCents} HI=${hi.body.hawaii.customerState} AK=REVIEW`);
          NODE

      - name: Browser performance and interaction verification
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1 && npm i --no-save playwright@latest >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          cat > check.mjs <<'NODE'
          import {chromium} from 'playwright'; const base=process.env.DEPLOYMENT_URL.replace(/\/$/,''); const b=await chromium.launch({headless:true});
          for(const route of ['/','/lithium-batteries','/hawaii-lithium-batteries','/rv-store']){const c=await b.newContext({viewport:{width:1280,height:900}}),p=await c.newPage(),req=[],api=[];p.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});await p.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await p.locator('[data-home-commerce]').scrollIntoViewIfNeeded();await p.waitForTimeout(1800);const before=req.length;await p.waitForTimeout(2500);const m=await p.evaluate(()=>({dom:document.getElementsByTagName('*').length,images:document.images.length,scripts:document.scripts.length}));const idle=req.length-before;console.log('PERF_AFTER '+route+' '+JSON.stringify({...m,requests:req.length,apiRequests:api.length,idleRequests:idle,api:api.map(u=>new URL(u).pathname)}));if(idle!==0)throw Error(`${route} idle requests`);if(route==='/'){const li=await p.locator("[data-home-products='lithium'] .home-product-card").count(),rv=await p.locator("[data-home-products='rv'] .home-product-card").count();if(li!==4||rv!==4)throw Error(`home ${li}/${rv}`);if(api.some(u=>u.includes('/api/store/catalog')||u.includes('/api/store-catalog')))throw Error('home full catalog');}
          if(route==='/lithium-batteries'&&api.some(u=>u.includes('/api/store/catalog')))throw Error('Lithium duplicate Catalog');if(route==='/rv-store'&&api.some(u=>u.includes('/api/store-catalog')))throw Error('RV duplicate Catalog');if(route==='/hawaii-lithium-batteries'){const paths=api.map(u=>new URL(u).pathname),single=paths.filter(x=>x==='/api/hawaii-lithium/status').length,batch=paths.filter(x=>x==='/api/hawaii-lithium/statuses').length,cat=paths.filter(x=>x==='/api/store/catalog').length;if(single||batch>1||cat||api.length>=10||m.dom>=1613)throw Error(`HI perf single=${single} batch=${batch} cat=${cat} api=${api.length} dom=${m.dom}`);}await c.close();}
          {const c=await b.newContext(),p=await c.newPage();let cat=0;p.on('request',r=>{if(r.url().includes('/api/store/catalog'))cat++});await p.goto(base+'/lithium-batteries',{waitUntil:'domcontentloaded'});await p.locator('[data-lithium-search]').fill('12V');await p.waitForTimeout(1000);if(cat<1)throw Error('Lithium deferred hydration did not activate');await c.close();}
          {const c=await b.newContext(),p=await c.newPage();let cat=0;p.on('request',r=>{if(r.url().includes('/api/store-catalog'))cat++});await p.goto(base+'/rv-store',{waitUntil:'domcontentloaded'});const q=p.locator('#rv-search');if(await q.count()){await q.fill('RV');await p.waitForTimeout(1000);if(cat<1)throw Error('RV deferred hydration did not activate');}await c.close();}
          await b.close();
          NODE
          node check.mjs

      - name: Preview PASS receipt
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.5 Commerce Control exact preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate: 5996cd771aaf979fd8e484e8c9ad724bca4e9e04' >> "$GITHUB_STEP_SUMMARY"
          echo 'Parent: 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Homepage 4+4, Shipping Rules, Hawaii batching, checkout boundaries, performance, protected routes: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production: NOT CHANGED by preview' >> "$GITHUB_STEP_SUMMARY"
