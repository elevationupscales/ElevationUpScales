name: Diagnose Preview Store Images

on:
  push:
    branches:
      - launch/paypal-sandbox-preview-20260828

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect preview catalog image URLs
        shell: bash
        run: |
          set -euo pipefail
          base='https://paypal-sandbox-launch.elevationupscales.pages.dev'
          curl --silent --show-error --location --retry 5 --retry-all-errors \
            -H 'Accept: application/json' \
            "${base}/api/store-products?catalog=full&ts=$(date +%s)" > /tmp/catalog.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/catalog.json'))
          rows = data if isinstance(data,list) else next((data.get(k) for k in ('products','results','items') if isinstance(data.get(k),list)), [])
          print('rows=', len(rows))
          def image_url(v):
              if isinstance(v,str): return v.strip()
              if isinstance(v,dict):
                  for k in ('url','src','imageUrl','transformedUrl'):
                      if v.get(k): return str(v[k]).strip()
              return ''
          urls=[]
          for i,p in enumerate(rows[:12]):
              candidates=[]
              for k in ('images','media'):
                  if isinstance(p.get(k),list): candidates += p[k]
              candidates += [p.get('image'),p.get('featuredImage'),p.get('primaryImage'),p.get('thumbnailImage')]
              variants=p.get('variants') if isinstance(p.get('variants'),list) else []
              for v in variants:
                  for k in ('images','media'):
                      if isinstance(v.get(k),list): candidates += v[k]
                  candidates.append(v.get('thumbnailImage'))
              u=next((image_url(x) for x in candidates if image_url(x)), '')
              print(f'product[{i}] name={p.get("name") or p.get("title")} image={u}')
              if u: urls.append(u)
          open('/tmp/image_urls.txt','w').write('\n'.join(urls))
          PY
          echo '--- image HTTP checks ---'
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            case "$url" in
              //*) url="https:${url}" ;;
              /*) url="https://elevationupscales-shop.fourthwall.com${url}" ;;
            esac
            code=$(curl --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url" || true)
            echo "$code $url"
          done < /tmp/image_urls.txt

      - name: Browser-render Store images
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet selenium
          python - <<'PY'
          import json, time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          opts=Options()
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,2400')
          driver=webdriver.Chrome(options=opts)
          try:
              url='https://paypal-sandbox-launch.elevationupscales.pages.dev/store'
              driver.get(url)
              for _ in range(30):
                  count=driver.execute_script("return document.querySelectorAll('.market-product-image-primary').length")
                  if count >= 10:
                      break
                  time.sleep(1)
              rows=driver.execute_script("""
                return Array.from(document.querySelectorAll('.market-product-image-primary')).slice(0,15).map(img => ({
                  src: img.currentSrc || img.src,
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  alt: img.alt
                }));
              """)
              print('browser_image_count=',len(rows))
              print(json.dumps(rows,indent=2))
              failed=[r for r in rows if not r['complete'] or r['naturalWidth'] == 0]
              print('browser_image_failures=',len(failed))
              print('csp=',driver.execute_script("return document.querySelector('meta[http-equiv=\"Content-Security-Policy\"]')?.content || ''"))
              print('body_catalog=',driver.execute_script("return document.body.dataset.fullFourthwallCatalog || ''"))
          finally:
              driver.quit()
          PY
