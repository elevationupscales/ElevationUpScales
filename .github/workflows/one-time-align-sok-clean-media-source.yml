name: One-time align SOK clean media source

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-align-sok-clean-media-source.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Replace retired SK48 promo path with exact clean product asset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('site/sok-full-line-data.js')
          text = path.read_text()
          old = '/assets/brands/sok/sk48v100n/hero.jpg'
          new = '/assets/brands/sok/sk48v100n/official-clean.png'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 SK48 retired-media references in canonical full-line data, found {count}')
          path.write_text(text.replace(old, new))
          PY
          test -f site/assets/brands/sok/sk48v100n/official-clean.png
          test ! -f site/assets/brands/sok/sk48v100n/hero.jpg
          test ! -f site/assets/brands/sok/sk48v100n/home-crop.webp
          node deployment/qa/sok-commercialization-static.mjs
          node deployment/qa/sok-full-line-static.mjs
          git diff --check
      - name: Commit alignment and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-align-sok-clean-media-source.yml
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/sok-full-line-data.js site/assets/brands/sok/sk48v100n/official-clean.png
          git commit -m 'SOK: point canonical SK48 media to clean official product image'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
