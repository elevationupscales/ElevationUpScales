name: One-Time Homepage Apparel Internal Checkout

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[home-rail-checkout]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 20

      - name: Patch homepage featured apparel links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('site/home-featured.js')
          text = path.read_text()
          old = "const href = product.slug ? `${STORE_ORIGIN}/products/${encodeURIComponent(product.slug)}` : STORE_ORIGIN;"
          new = "const href = product.slug ? `/checkout/?source=apparel&id=${encodeURIComponent(product.slug)}` : '/store';"
          if old not in text and new not in text:
              raise SystemExit('Homepage featured product href anchor not found')
          text = text.replace(old, new, 1)
          text = text.replace("    media.target = '_blank';\n    media.rel = 'noopener';\n", "", 1)
          text = text.replace("    titleLink.target = '_blank';\n    titleLink.rel = 'noopener';\n", "", 1)
          text = text.replace("    cta.target = '_blank';\n    cta.rel = 'noopener';\n", "", 1)
          path.write_text(text)

          index = Path('site/index.html')
          html = index.read_text()
          old_ver = 'home-featured.js?v=performance-pass-1'
          new_ver = 'home-featured.js?v=3.11.45'
          if old_ver in html:
              html = html.replace(old_ver, new_ver, 1)
          elif new_ver not in html:
              raise SystemExit('Homepage featured script version anchor not found')
          index.write_text(html)
          PY

      - name: Validate internal checkout routing
        shell: bash
        run: |
          set -euo pipefail
          node --check site/home-featured.js
          grep -Fq '/checkout/?source=apparel&id=' site/home-featured.js
          grep -q 'home-featured.js?v=3.11.45' site/index.html
          ! grep -Fq 'const href = product.slug ? `${STORE_ORIGIN}/products/' site/home-featured.js
          grep -q 'liveCheckoutApproved' site/store-checkout-server.js

      - name: Commit permanent homepage fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/home-featured.js site/index.html
          git commit -m 'Keep homepage apparel rail on Elevation checkout'
          git push origin HEAD:main

      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 3
          curl -sS -L --fail "$PRODUCTION_URL/" > /tmp/home.html
          grep -q 'home-featured.js?v=3.11.45' /tmp/home.html
          curl -sS -L --fail "$PRODUCTION_URL/home-featured.js?v=3.11.45" > /tmp/home-featured.js
          grep -Fq '/checkout/?source=apparel&id=' /tmp/home-featured.js
          ! grep -Fq 'const href = product.slug ? `${STORE_ORIGIN}/products/' /tmp/home-featured.js
          curl -sS -L --fail "$PRODUCTION_URL/checkout" > /tmp/checkout.html
          grep -q 'Secure checkout' /tmp/checkout.html
          ! grep -q 'Sandbox checkout' /tmp/checkout.html
          curl -sS --fail "$PRODUCTION_URL/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true) throw new Error('PayPal live config regression');
          console.log('homepage_internal_checkout=PASS');
          NODE

      - name: Receipt
        run: |
          echo '### Homepage apparel rail internal checkout — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Featured apparel destination: Elevation checkout' >> "$GITHUB_STEP_SUMMARY"
          echo 'Fourthwall featured handoff: removed' >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal live checkout: PASS' >> "$GITHUB_STEP_SUMMARY"
