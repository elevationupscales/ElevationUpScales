name: One-Time Admin Pass 2 Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-pass2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-portal-pass2-shipping-simplification
          fetch-depth: 0
      - name: Build simplified Shipping and Logistics owner layer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'marker missing in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          replace('site/admin-command-center.js','["Overview","/admin","overview"],\n      ["Leads","/admin-listings#leads","leads"],\n      ["Orders & Fulfillment","/admin-store-orders","orders"]','["Overview","/admin","overview"],\n      ["Orders & Fulfillment","/admin-store-orders","orders"],\n      ["Leads","/admin-listings#leads","leads"]')
          replace('site/admin-command-center.js','["Lithium / Hawaii Logistics","/admin-lithium-shipping","shipping"]','["Shipping & Logistics","/admin-lithium-shipping","shipping"]')

          p=Path('site/admin-lithium-shipping.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Lithium Shipping Matrix | Elevation UpScales, Inc.</title>','<title>Shipping & Logistics | Elevation UpScales, Inc.</title>',1)
          s=s.replace('<link rel="stylesheet" href="/admin-lithium-shipping.css?v=4.3.3">','<link rel="stylesheet" href="/admin-lithium-shipping.css?v=4.3.3">\n<link rel="stylesheet" href="/admin-shipping-pass2.css?v=4.3.6">',1)
          s=s.replace('<script defer src="/admin-lithium-shipping.js?v=4.3.3"></script>','<script defer src="/admin-lithium-shipping.js?v=4.3.3"></script>\n<script defer src="/admin-shipping-pass2.js?v=4.3.6"></script>',1)
          s=s.replace('<h1>Lithium Shipping Matrix</h1><p class="admin-subhead">Exact-SKU qualification, supplier truth, route evidence, customer reservations, batch compatibility, and direct freight economics.</p>','<h1>Shipping & Logistics</h1><p class="admin-subhead">Manage Hawaii reservations, shipping readiness, freight quotes, shipment batches, and blockers.</p>',1)
          s=s.replace('aria-label="Lithium Shipping Matrix sections"','aria-label="Advanced Shipping Details sections"',1)
          p.write_text(s,encoding='utf-8')

          p=Path('site/admin-overview.js'); s=p.read_text(encoding='utf-8')
          old='''    const reservations=Array.isArray(lithium.reservations)?lithium.reservations.length:(Number.isFinite(Number(lithium.summary?.reservations))?Number(lithium.summary.reservations):null);\n    const batches=Array.isArray(lithium.batches)?lithium.batches.filter(b=>!["COMPLETE","CANCELLED"].includes(String(b.status||"").toUpperCase())).length:(Number.isFinite(Number(lithium.summary?.openBatches))?Number(lithium.summary.openBatches):null);'''
          new='''    const hawaiiRequests=Array.isArray(lithium.requests)?lithium.requests:[];\n    const hawaiiRecords=Array.isArray(lithium.records)?lithium.records:[];\n    const hawaiiBatches=Array.isArray(lithium.batches)?lithium.batches:[];\n    const hawaiiBatchMetrics=Array.isArray(lithium.metrics?.batchMetrics)?lithium.metrics.batchMetrics:[];\n    const reservations=snapshot.lithium.ok?hawaiiRequests.filter(r=>!["CLOSED","CANCELLED"].includes(String(r.state||"").toUpperCase())).length:null;\n    const supplierRechecks=snapshot.lithium.ok?hawaiiRecords.filter(r=>r.inventoryRecheckRequired||["UNKNOWN","RECHECK REQUIRED","SUPPLIER ERROR"].includes(String(r.supplierStockState||"").toUpperCase())).length:null;\n    const shippingBlocked=snapshot.lithium.ok?hawaiiRecords.filter(r=>r.hold||!["INTERNAL REQUIREMENTS SATISFIED"].includes(String(r.reviewState||"").toUpperCase())).length+hazienda(hawaiiBatchMetrics):null;\n    const confirmations=snapshot.lithium.ok?hawaiiBatchMetrics.reduce((n,m)=>n+(Number(m.pendingCustomerConfirmations)||0),0):null;\n    function hazienda(rows){return rows.reduce((n,m)=>n+(Number(m.blockedOrders)||0),0);}\n    const batches=snapshot.lithium.ok?hawaiiBatches.filter(b=>!["COMPLETE","CANCELLED"].includes(String(b.status||"").toUpperCase())).length:null;'''
          if old not in s: raise SystemExit('overview lithium marker missing')
          s=s.replace(old,new,1)
          old2='''      action("Products needing review",snapshot.catalog.ok?catalogState.review:"N/A","Shipping, hold or review-state product exceptions.","/admin-catalog",""),\n      action("Hawaii reservations / batches",reservations===null&&batches===null?"N/A":`${reservations??0} / ${batches??0}`,"Reservations / active freight batches requiring operating awareness.","/admin-lithium-shipping","")'''
          new2='''      action("Products needing review",snapshot.catalog.ok?catalogState.review:"N/A","Catalog hold, shipping, or review-state product exceptions.","/admin-catalog",""),\n      action("Hawaii reservations",reservations===null?"N/A":reservations,"Open reservation records needing operating awareness.","/admin-lithium-shipping",reservations?"is-warning":""),\n      action("Supplier rechecks",supplierRechecks===null?"N/A":supplierRechecks,"Lithium products whose supplier availability needs a fresh check.","/admin-lithium-shipping",supplierRechecks?"is-warning":""),\n      action("Shipping blockers",shippingBlocked===null?"N/A":shippingBlocked,"Product or batch shipping controls that are not ready.","/admin-lithium-shipping",shippingBlocked?"is-urgent":""),\n      action("Customer confirmations",confirmations===null?"N/A":confirmations,"Hawaii batch lines waiting on current customer approval.","/admin-lithium-shipping",confirmations?"is-warning":""),\n      action("Open Hawaii batches",batches===null?"N/A":batches,"Active planning, quote, review, booking, or transit batches.","/admin-lithium-shipping","")'''
          if old2 not in s: raise SystemExit('overview action marker missing')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY

          cat > site/admin-shipping-pass2.css <<'CSS'
          .shipping-pass2-home{margin:18px 0 26px}.shipping-pass2-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:0 0 15px;padding:16px 18px;border:1px solid #2d2d2d;border-radius:14px;background:#0d0d0d}.shipping-pass2-head h2{margin:.15rem 0 .3rem}.shipping-pass2-head p{margin:0;color:#aaa}.shipping-pass2-actions{display:flex;gap:8px;flex-wrap:wrap}.shipping-pass2-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px;margin:12px 0 18px}.shipping-pass2-metric{border:1px solid #303030;border-radius:10px;background:#111;padding:12px;text-decoration:none;color:#fff;min-height:88px}.shipping-pass2-metric span{display:block;color:#999;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}.shipping-pass2-metric strong{display:block;font-size:1.5rem;margin-top:5px}.shipping-pass2-metric.is-alert{border-color:#6f3f3f;background:#1a1111}.shipping-pass2-metric.is-warn{border-color:#66562d;background:#19170f}.shipping-pass2-section{border:1px solid #2e2e2e;border-radius:13px;background:#0c0c0c;padding:16px;margin:13px 0}.shipping-pass2-section__head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.shipping-pass2-section__head h3{margin:.1rem 0}.shipping-pass2-section__head p{color:#999;margin:.25rem 0}.shipping-pass2-table-wrap{overflow:auto;border:1px solid #292929;border-radius:9px}.shipping-pass2-table{width:100%;border-collapse:collapse;min-width:760px}.shipping-pass2-table th,.shipping-pass2-table td{padding:10px 11px;border-bottom:1px solid #272727;text-align:left;font-size:.79rem;vertical-align:top}.shipping-pass2-table th{background:#111;color:#999;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}.shipping-pass2-table tr:last-child td{border-bottom:0}.shipping-pass2-pill{display:inline-block;padding:3px 7px;border:1px solid #454545;border-radius:999px;font-size:.68rem;color:#ddd}.shipping-pass2-pill.is-alert{border-color:#744242;color:#ffb3b3}.shipping-pass2-pill.is-warn{border-color:#6a572d;color:#efd276}.shipping-pass2-pill.is-good{border-color:#396344;color:#9fdfae}.shipping-pass2-source-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.shipping-pass2-source-map a{display:block;border:1px solid #303030;border-radius:9px;padding:11px;color:#fff;text-decoration:none;background:#101010}.shipping-pass2-source-map strong{display:block}.shipping-pass2-source-map span{display:block;color:#999;font-size:.76rem;margin-top:3px}.shipping-pass2-empty{padding:18px;color:#888;text-align:center}.shipping-pass2-dialog{width:min(900px,calc(100vw - 30px));max-height:88vh;overflow:auto;background:#0c0c0c;color:#fff;border:1px solid #3a3a3a;border-radius:14px;padding:0}.shipping-pass2-dialog::backdrop{background:#000c}.shipping-pass2-dialog__inner{padding:18px}.shipping-pass2-dialog__head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #292929;padding-bottom:12px;margin-bottom:12px}.shipping-pass2-dialog__head h3{margin:.15rem 0}.shipping-pass2-detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.shipping-pass2-detail{border:1px solid #2b2b2b;border-radius:9px;padding:12px;background:#101010}.shipping-pass2-detail h4{margin:.1rem 0 8px;color:#e4c56e}.shipping-pass2-kv{display:grid;grid-template-columns:minmax(110px,.7fr) 1fr;gap:6px 10px;font-size:.78rem}.shipping-pass2-kv dt{color:#888}.shipping-pass2-kv dd{margin:0;overflow-wrap:anywhere}.shipping-pass2-dialog__actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #292929}.shipping-pass2-simplified:not(.shipping-pass2-advanced) .lithium-admin-alert,.shipping-pass2-simplified:not(.shipping-pass2-advanced) .lithium-admin-tabs,.shipping-pass2-simplified:not(.shipping-pass2-advanced) .lithium-admin-panel{display:none!important}.shipping-pass2-simplified.shipping-pass2-advanced .shipping-pass2-home{display:none}.shipping-pass2-simplified .catalog-summary{display:none}.shipping-pass2-simplified .admin-shell__header .admin-subhead{max-width:760px}@media(max-width:1100px){.shipping-pass2-grid{grid-template-columns:repeat(4,1fr)}.shipping-pass2-source-map{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shipping-pass2-head,.shipping-pass2-section__head{display:block}.shipping-pass2-actions{margin-top:10px}.shipping-pass2-grid{grid-template-columns:repeat(2,1fr)}.shipping-pass2-source-map,.shipping-pass2-detail-grid{grid-template-columns:1fr}}@media(max-width:450px){.shipping-pass2-grid{grid-template-columns:1fr}}
          CSS

          cat > site/admin-shipping-pass2.js <<'JS'
          (()=>{
          "use strict";
          const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],txt=v=>String(v??"").trim(),esc=v=>txt(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),money=c=>c===null||c===undefined?"—":new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format((Number(c)||0)/100),date=v=>v?new Date(v).toLocaleDateString():"—";
          let snap=null,root=null,dialog=null;
          const closed=r=>["CLOSED","CANCELLED"].includes(txt(r.state).toUpperCase()),openBatch=b=>!["COMPLETE","CANCELLED"].includes(txt(b.status).toUpperCase());
          const ownerLabel=v=>({"FULL REVIEW REQUIRED":"Shipping Review Needed","DOCS NEEDED":"Documents Needed","DOCUMENTS NEEDED":"Documents Needed","CARRIER REVIEW":"Provider Review Needed","RECHECK REQUIRED":"Supplier Recheck Needed","READY TO COMMIT":"Ready to Book Shipment","CARRIER QUOTE NEEDED":"Freight Quote Needed","QUOTE REQUIRED":"Freight Quote Needed","NOT CHECKED":"Review Needed"})[txt(v).toUpperCase()]||txt(v)||"Needs Review";
          const pill=(v,kind="")=>`<span class="shipping-pass2-pill ${kind}">${esc(ownerLabel(v))}</span>`;
          async function api(){const r=await fetch('/api/admin/lithium-shipping',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok){const e=new Error(`Shipping data unavailable (${r.status})`);e.status=r.status;throw e;}return r.json();}
          function ensure(){
            document.body.classList.add('shipping-pass2-simplified');
            const dash=document.getElementById('lithium-admin-dashboard');if(!dash)return;
            if(!root){root=document.createElement('section');root.id='shipping-pass2-home';root.className='shipping-pass2-home';dash.insertBefore(root,dash.firstChild);}
            if(!dialog){dialog=document.createElement('dialog');dialog.className='shipping-pass2-dialog';dialog.innerHTML='<div class="shipping-pass2-dialog__inner" id="shipping-pass2-dialog-inner"></div>';document.body.append(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});}
          }
          function metrics(){const records=snap?.records||[],routes=snap?.destinations||[],requests=(snap?.requests||[]).filter(r=>!closed(r)),batches=(snap?.batches||[]).filter(openBatch),bm=snap?.metrics?.batchMetrics||[];const review=records.filter(r=>r.hold||txt(r.reviewState).toUpperCase()!=="INTERNAL REQUIREMENTS SATISFIED").length;const recheck=records.filter(r=>r.inventoryRecheckRequired||["UNKNOWN","RECHECK REQUIRED","SUPPLIER ERROR"].includes(txt(r.supplierStockState).toUpperCase())).length;const quote=routes.filter(r=>["NOT CHECKED","RESEARCHING","CARRIER QUOTE NEEDED","QUOTE REQUIRED"].includes(txt(r.eligibilityState).toUpperCase())||!Number(r.quoteAmountCents||0)).length;const ready=batches.filter(b=>txt(b.status).toUpperCase()==="READY TO COMMIT").length;const blocked=records.filter(r=>r.hold).length+bm.reduce((n,m)=>n+(Number(m.blockedOrders)||0),0);return{reservations:requests.length,review,recheck,quote,batches:batches.length,ready,blocked};}
          function attention(){const out=[],records=snap?.records||[],routes=snap?.destinations||[],requests=(snap?.requests||[]).filter(r=>!closed(r)),batches=(snap?.batches||[]).filter(openBatch),bm=snap?.metrics?.batchMetrics||[];
            records.forEach(r=>{if(r.inventoryRecheckRequired||["UNKNOWN","RECHECK REQUIRED","SUPPLIER ERROR"].includes(txt(r.supplierStockState).toUpperCase()))out.push({kind:'record',id:r.id,label:r.productTitle||r.sku,dest:'Supplier',state:'Supplier Recheck Needed',blocker:txt(r.supplierStockState)||'Current supply not confirmed',next:r.nextAction||'Open Inventory and confirm current supplier availability'});else if(r.hold||txt(r.reviewState).toUpperCase()!=="INTERNAL REQUIREMENTS SATISFIED")out.push({kind:'record',id:r.id,label:r.productTitle||r.sku,dest:'Hawaii',state:'Shipping Review Needed',blocker:r.hold?'Product is on HOLD':ownerLabel(r.reviewState),next:r.nextAction||'Review product shipping readiness'});});
            routes.forEach(r=>{if(["NOT CHECKED","RESEARCHING","CARRIER QUOTE NEEDED","QUOTE REQUIRED"].includes(txt(r.eligibilityState).toUpperCase())||!Number(r.quoteAmountCents||0))out.push({kind:'route',id:r.id,label:(snap.records||[]).find(x=>x.id===r.shippingRecordId)?.sku||'Lithium SKU',dest:r.destination,state:'Freight / Route Needed',blocker:!Number(r.quoteAmountCents||0)?'Freight quote not recorded':ownerLabel(r.eligibilityState),next:'Review provider, route and current freight quote'});});
            requests.forEach(r=>{if(["NEW","REVIEWING"].includes(txt(r.state).toUpperCase())||["PENDING","NOT REQUESTED"].includes(txt(r.customerApprovalState).toUpperCase()))out.push({kind:'request',id:r.id,label:r.name||'Hawaii customer',dest:[r.island,r.hawaiiZip].filter(Boolean).join(' · '),state:'Customer Follow-Up',blocker:r.waitingReason||ownerLabel(r.agingFlag||r.state),next:r.nextCustomerContact?`Contact ${date(r.nextCustomerContact)}`:(r.latestExpectation||'Review reservation and set next action')});});
            batches.forEach(b=>{const m=bm.find(x=>x.batchId===b.batchId)||{};if((Number(m.blockedOrders)||0)>0||(Number(m.pendingCustomerConfirmations)||0)>0||["QUOTE NEEDED","DOCS REVIEW","HOLD"].includes(txt(b.status).toUpperCase()))out.push({kind:'batch',id:b.batchId,label:b.batchId,dest:b.destinationIsland,state:(Number(m.blockedOrders)||0)>0?'Batch Blocked':ownerLabel(b.status),blocker:(Number(m.blockedOrders)||0)>0?`${m.blockedOrders} blocked line(s)`:(Number(m.pendingCustomerConfirmations)||0)>0?`${m.pendingCustomerConfirmations} customer confirmation(s) needed`:ownerLabel(b.status),next:b.nextAction||'Open batch and resolve blockers'});});return out.slice(0,40);}
          function render(){ensure();if(!snap||!root)return;const m=metrics(),requests=(snap.requests||[]).filter(r=>!closed(r)),batches=(snap.batches||[]).filter(openBatch),batchMetrics=snap.metrics?.batchMetrics||[],att=attention();root.innerHTML=`<div class="shipping-pass2-head"><div><p class="eyebrow">Owner shipping workspace</p><h2>What needs attention?</h2><p>Catalog tells us what it is. Inventory tells us whether we can source it. Orders tells us what the customer bought. Shipping & Logistics tells us how it moves.</p></div><div class="shipping-pass2-actions"><button class="button button-outline" type="button" data-pass2-refresh>Refresh</button><button class="button button-outline" type="button" data-pass2-advanced>Advanced Shipping Details</button></div></div>
          <div class="shipping-pass2-grid"><a class="shipping-pass2-metric ${m.reservations?'is-warn':''}" href="#pass2-reservations"><span>Reservations Waiting</span><strong>${m.reservations}</strong></a><a class="shipping-pass2-metric ${m.review?'is-warn':''}" href="#pass2-attention"><span>Products Needing Review</span><strong>${m.review}</strong></a><a class="shipping-pass2-metric ${m.recheck?'is-warn':''}" href="#pass2-attention"><span>Supplier Rechecks</span><strong>${m.recheck}</strong></a><a class="shipping-pass2-metric ${m.quote?'is-warn':''}" href="#pass2-attention"><span>Quote / Route Needed</span><strong>${m.quote}</strong></a><a class="shipping-pass2-metric" href="#pass2-batches"><span>Open Shipment Batches</span><strong>${m.batches}</strong></a><a class="shipping-pass2-metric ${m.ready?'is-good':''}" href="#pass2-batches"><span>Ready to Book</span><strong>${m.ready}</strong></a><a class="shipping-pass2-metric ${m.blocked?'is-alert':''}" href="#pass2-attention"><span>Blocked</span><strong>${m.blocked}</strong></a></div>
          <section class="shipping-pass2-section"><div class="shipping-pass2-section__head"><div><h3>Source of Truth</h3><p>Edit each kind of information where it naturally belongs.</p></div></div><div class="shipping-pass2-source-map"><a href="/admin-catalog"><strong>Catalog Manager</strong><span>Product identity, SKU, model, chemistry and product documents.</span></a><a href="/admin-inventory"><strong>Inventory</strong><span>Supplier cost, stock, origin, lead time and recheck status.</span></a><a href="/admin-store-orders"><strong>Store Orders</strong><span>Paid orders, supplier purchase, fulfillment and tracking.</span></a><a href="/admin-lithium-shipping"><strong>Shipping & Logistics</strong><span>Reservations, routes, freight quotes, batches and blockers.</span></a></div></section>
          <section class="shipping-pass2-section" id="pass2-attention"><div class="shipping-pass2-section__head"><div><h3>Needs Attention</h3><p>Action queue across supply, shipping review, routes, customers and batches.</p></div></div>${table(att.map(x=>`<tr><td><strong>${esc(x.label)}</strong></td><td>${esc(x.dest||'—')}</td><td>${pill(x.state,x.state.includes('Blocked')?'is-alert':'is-warn')}</td><td>${esc(x.blocker||'—')}</td><td>${esc(x.next||'—')}</td><td><button class="button button-outline compact" type="button" data-pass2-open="${esc(x.kind)}" data-id="${esc(x.id)}">Open</button></td></tr>`).join(''),'<tr><th>Customer / Product</th><th>Destination</th><th>Current State</th><th>Blocker</th><th>Next Action</th><th></th></tr>',6)}</section>
          <section class="shipping-pass2-section" id="pass2-reservations"><div class="shipping-pass2-section__head"><div><h3>Hawaii Reservations</h3><p>Simple customer queue. Payment and fulfillment remain owned by Store Orders when a real paid order exists.</p></div></div>${table(requests.map(r=>`<tr><td><strong>${esc(r.name||'—')}</strong><br><small>${esc(r.email||r.phone||'')}</small></td><td>${esc(r.island||'—')}<br><small>${esc(r.hawaiiZip||'')}</small></td><td>${esc(r.productInterest||'Open request')}</td><td>${Number(r.quantity||0)}</td><td><code>${esc(r.assignedSku||'UNMATCHED')}</code></td><td>${pill(r.state||r.lifecycle,["HOLD","CANCELLED"].includes(txt(r.state).toUpperCase())?'is-alert':'')}</td><td>${esc(r.assignedBatchId||'—')}</td><td>${esc(r.lastCustomerContact?date(r.lastCustomerContact):'—')}</td><td>${esc(r.nextCustomerContact?date(r.nextCustomerContact):(r.waitingReason||'Review'))}</td><td><button class="button button-outline compact" type="button" data-pass2-open="request" data-id="${esc(r.id)}">Open</button></td></tr>`).join(''),'<tr><th>Customer</th><th>Island / ZIP</th><th>Battery / Interest</th><th>Qty</th><th>Exact SKU</th><th>Status</th><th>Batch</th><th>Last Contact</th><th>Next Action</th><th></th></tr>',10)}</section>
          <section class="shipping-pass2-section" id="pass2-batches"><div class="shipping-pass2-section__head"><div><h3>Shipment Batches</h3><p>Internal fill targets are planning/economic targets only, never legal or carrier capacity.</p></div></div>${table(batches.map(b=>{const q=batchMetrics.find(x=>x.batchId===b.batchId)||{};return`<tr><td><strong>${esc(b.batchId)}</strong></td><td>${esc(b.destinationIsland||'—')}</td><td>${pill(b.status,txt(b.status).toUpperCase()==='HOLD'?'is-alert':txt(b.status).toUpperCase()==='READY TO COMMIT'?'is-good':'')}</td><td>${Number(q.reservations||0)}</td><td>${Number(q.units||0)}</td><td>${money(q.currentFreightQuoteCents??b.quoteAmountCents)}</td><td>${money(q.estimatedGrossContributionCents)}</td><td>${Number(q.blockedOrders||0)?pill(`${q.blockedOrders} blocked`,'is-alert'):pill('Review ready','is-good')}</td><td>${esc(b.nextAction||'—')}</td><td><button class="button button-outline compact" type="button" data-pass2-open="batch" data-id="${esc(b.batchId)}">Open</button></td></tr>`}).join(''),'<tr><th>Batch</th><th>Destination</th><th>Status</th><th>Reservations</th><th>Units</th><th>Quote</th><th>Gross Contribution</th><th>Readiness</th><th>Blocker / Next</th><th></th></tr>',10)}</section>`;}
          function table(rows,head,cols){return `<div class="shipping-pass2-table-wrap"><table class="shipping-pass2-table"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${cols}" class="shipping-pass2-empty">Nothing needs attention in this section.</td></tr>`}</tbody></table></div>`;}
          function detail(title,sections,actions=''){ensure();$('#shipping-pass2-dialog-inner').innerHTML=`<div class="shipping-pass2-dialog__head"><div><p class="eyebrow">Shipping & Logistics</p><h3>${esc(title)}</h3></div><button class="button button-outline compact" type="button" data-pass2-close>Close</button></div><div class="shipping-pass2-detail-grid">${sections.join('')}</div>${actions?`<div class="shipping-pass2-dialog__actions">${actions}</div>`:''}`;dialog.showModal();}
          const kv=(title,rows)=>`<section class="shipping-pass2-detail"><h4>${esc(title)}</h4><dl class="shipping-pass2-kv">${rows.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${typeof v==='string'&&v.startsWith('<')?v:esc(v??'—')}</dd>`).join('')}</dl></section>`;
