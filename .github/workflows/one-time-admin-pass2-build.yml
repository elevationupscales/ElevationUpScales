name: One-Time Admin Pass 2 Build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-pass2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-portal-pass2-shipping-simplification
          fetch-depth: 0
      - name: Patch owner-facing Admin navigation and shipping shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def rep(path,old,new,count=1):
              p=Path(path);s=p.read_text(encoding='utf-8')
              if old not in s: raise SystemExit(f'marker missing: {path}: {old[:90]}')
              p.write_text(s.replace(old,new,count),encoding='utf-8')

          rep('site/admin-command-center.js','["Overview","/admin","overview"],\n      ["Leads","/admin-listings#leads","leads"],\n      ["Orders & Fulfillment","/admin-store-orders","orders"]','["Overview","/admin","overview"],\n      ["Orders & Fulfillment","/admin-store-orders","orders"],\n      ["Leads","/admin-listings#leads","leads"]')
          rep('site/admin-command-center.js','["Lithium / Hawaii Logistics","/admin-lithium-shipping","shipping"]','["Shipping & Logistics","/admin-lithium-shipping","shipping"]')

          p=Path('site/admin-lithium-shipping.html');s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Lithium Shipping Matrix | Elevation UpScales, Inc.</title>','<title>Shipping & Logistics | Elevation UpScales, Inc.</title>',1)
          s=s.replace('<link rel="stylesheet" href="/admin-lithium-shipping.css?v=4.3.3">','<link rel="stylesheet" href="/admin-lithium-shipping.css?v=4.3.3">\n<link rel="stylesheet" href="/admin-shipping-pass2.css?v=4.3.6">',1)
          s=s.replace('<script defer src="/admin-lithium-shipping.js?v=4.3.3"></script>','<script defer src="/admin-lithium-shipping.js?v=4.3.3"></script>\n<script defer src="/admin-shipping-pass2.js?v=4.3.6"></script>',1)
          s=s.replace('<h1>Lithium Shipping Matrix</h1><p class="admin-subhead">Exact-SKU qualification, supplier truth, route evidence, customer reservations, batch compatibility, and direct freight economics.</p>','<h1>Shipping & Logistics</h1><p class="admin-subhead">Manage Hawaii reservations, shipping readiness, freight quotes, shipment batches, and blockers.</p>',1)
          s=s.replace('aria-label="Lithium Shipping Matrix sections"','aria-label="Advanced Shipping Details sections"',1)
          p.write_text(s,encoding='utf-8')

          p=Path('site/admin-overview.js');s=p.read_text(encoding='utf-8')
          old='''    const reservations=Array.isArray(lithium.reservations)?lithium.reservations.length:(Number.isFinite(Number(lithium.summary?.reservations))?Number(lithium.summary.reservations):null);\n    const batches=Array.isArray(lithium.batches)?lithium.batches.filter(b=>!["COMPLETE","CANCELLED"].includes(String(b.status||"").toUpperCase())).length:(Number.isFinite(Number(lithium.summary?.openBatches))?Number(lithium.summary.openBatches):null);'''
          new='''    const hawaiiRequests=Array.isArray(lithium.requests)?lithium.requests:[];\n    const hawaiiRecords=Array.isArray(lithium.records)?lithium.records:[];\n    const hawaiiBatches=Array.isArray(lithium.batches)?lithium.batches:[];\n    const hawaiiBatchMetrics=Array.isArray(lithium.metrics?.batchMetrics)?lithium.metrics.batchMetrics:[];\n    const reservations=snapshot.lithium.ok?hawaiiRequests.filter(r=>!["CLOSED","CANCELLED"].includes(String(r.state||"").toUpperCase())).length:null;\n    const supplierRechecks=snapshot.lithium.ok?hawaiiRecords.filter(r=>r.inventoryRecheckRequired||["UNKNOWN","RECHECK REQUIRED","SUPPLIER ERROR"].includes(String(r.supplierStockState||"").toUpperCase())).length:null;\n    const blockedBatchLines=hawaiiBatchMetrics.reduce((n,m)=>n+(Number(m.blockedOrders)||0),0);\n    const shippingBlocked=snapshot.lithium.ok?hawaiiRecords.filter(r=>r.hold||String(r.reviewState||"").toUpperCase()!=="INTERNAL REQUIREMENTS SATISFIED").length+blockedBatchLines:null;\n    const confirmations=snapshot.lithium.ok?hawaiiBatchMetrics.reduce((n,m)=>n+(Number(m.pendingCustomerConfirmations)||0),0):null;\n    const batches=snapshot.lithium.ok?hawaiiBatches.filter(b=>!["COMPLETE","CANCELLED"].includes(String(b.status||"").toUpperCase())).length:null;'''
          if old not in s: raise SystemExit('overview lithium metrics marker missing')
          s=s.replace(old,new,1)
          old2='''      action("Products needing review",snapshot.catalog.ok?catalogState.review:"N/A","Shipping, hold or review-state product exceptions.","/admin-catalog",""),\n      action("Hawaii reservations / batches",reservations===null&&batches===null?"N/A":`${reservations??0} / ${batches??0}`,"Reservations / active freight batches requiring operating awareness.","/admin-lithium-shipping","")'''
          new2='''      action("Products needing review",snapshot.catalog.ok?catalogState.review:"N/A","Catalog hold, shipping, or review-state product exceptions.","/admin-catalog",""),\n      action("Hawaii reservations",reservations===null?"N/A":reservations,"Open reservation records needing operating awareness.","/admin-lithium-shipping",reservations?"is-warning":""),\n      action("Supplier rechecks",supplierRechecks===null?"N/A":supplierRechecks,"Lithium products whose supplier availability needs a fresh check.","/admin-lithium-shipping",supplierRechecks?"is-warning":""),\n      action("Shipping blockers",shippingBlocked===null?"N/A":shippingBlocked,"Product or batch shipping controls that are not ready.","/admin-lithium-shipping",shippingBlocked?"is-urgent":""),\n      action("Customer confirmations",confirmations===null?"N/A":confirmations,"Hawaii batch lines waiting on current customer approval.","/admin-lithium-shipping",confirmations?"is-warning":""),\n      action("Open Hawaii batches",batches===null?"N/A":batches,"Active planning, quote, review, booking, or transit batches.","/admin-lithium-shipping","")'''
          if old2 not in s: raise SystemExit('overview action marker missing')
          p.write_text(s.replace(old2,new2,1),encoding='utf-8')
          PY

          node --check site/admin-shipping-pass2.js
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/admin-lithium-shipping.js
          grep -q 'Shipping & Logistics' site/admin-command-center.js
          grep -q '<h1>Shipping & Logistics</h1>' site/admin-lithium-shipping.html
          grep -q 'admin-shipping-pass2.css?v=4.3.6' site/admin-lithium-shipping.html
          grep -q 'admin-shipping-pass2.js?v=4.3.6' site/admin-lithium-shipping.html
          grep -q 'Supplier rechecks' site/admin-overview.js
          ! grep -q '<h1>Lithium Shipping Matrix</h1>' site/admin-lithium-shipping.html

          git config user.name 'elevationupscales'
          git config user.email 'caseymyoung@gmail.com'
          git add site/admin-command-center.js site/admin-overview.js site/admin-lithium-shipping.html
          git commit -m 'Complete Admin Pass 2 shipping simplification'
          git push origin HEAD:release/admin-portal-pass2-shipping-simplification
      - name: Remove build bootstrap
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-admin-pass2-build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed Admin Pass 2 build bootstrap'
          git push origin main
