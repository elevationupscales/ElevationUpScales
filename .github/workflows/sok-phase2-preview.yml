name: SOK Media Phase 2 Preview

on:
  push:
    paths:
      - ".github/workflows/sok-phase2-preview.yml"

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Verify candidate lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor origin/main HEAD

      - name: Run committed-source QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          npm run qa:secrets
          git diff --check

      - name: Deploy isolated Cloudflare preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=sok-media-phase2-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke preview
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          npm run qa:preview -- "${BASE%/}"

      - name: Preview receipt
        run: |
          echo '### SOK Media Phase 2 preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
