name: Checkout Repair QA

on:
  push:
    branches:
      - repair/direct-checkout-paypal-20260912

permissions:
  contents: read

concurrency:
  group: checkout-repair-qa
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Focused non-charging checkout tests
        run: node --test tests/store-checkout-capture-repair.test.mjs
      - name: Canonical QA
        run: npm run qa
      - name: Diff integrity
        run: git diff --check production-deploy...HEAD
