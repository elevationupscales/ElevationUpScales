name: One-Time Commerce Pricing 2 Reconciliation Preview
on:
  push:
    branches:
      - runner/commerce-pricing-2-reconciliation-preview-2026-09-03
permissions:
  contents: read
  deployments: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 5c16949b8722d2eda64bf1918de66cd32a65be88
          fetch-depth: 0
      - name: Exact candidate and read-only source gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5c16949b8722d2eda64bf1918de66cd32a65be88"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b73b166e5887e86abb6044ccbdeb4e9c293cbe65"
          git merge-base --is-ancestor 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf HEAD
          changed=$(git diff --name-only 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf..HEAD | sort)
          printf '%s\n' "$changed"
          node --check site/_worker.js
          node --check site/commerce-pricing-runtime.js
          node --check site/admin-commerce-pricing.js
          grep -q 'Method not allowed — Pricing & Supplier Catalog 2.0 is read-only in this build' site/commerce-pricing-runtime.js
          ! grep -q '\.run(' site/commerce-pricing-runtime.js
          grep -q 'HUMAN REVIEW GATE' site/admin-commerce-pricing.html
          grep -q 'Reconciliation Action / Reason' site/admin-commerce-pricing.html
          grep -q 'upstreamSupplier' site/doba-csv-sync.js
      - name: Deploy exact candidate preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=cp2-reconciliation-review
      - name: Static and auth smoke
        env:
          BASE: https://cp2-reconciliation-review.elevationupscales.pages.dev
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /admin-commerce-pricing.html /admin-catalog.html /lithium-batteries /hawaii-lithium-batteries /checkout /terms /privacy; do
            code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done
          curl -fsSL "$base/admin-commerce-pricing.html" | grep -q 'HUMAN REVIEW GATE'
          curl -fsSL "$base/admin-commerce-pricing.html" | grep -q 'Reconciliation Action / Reason'
          code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$base/api/admin/commerce-pricing")
          test "$code" = "401"
      - name: Inject temporary token-protected bound-data verifier
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "QA_TOKEN=$token" >> "$GITHUB_ENV"
          QA_TOKEN="$token" python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('site/commerce-pricing-runtime.js')
          s=p.read_text()
          if 'export async function buildCommercePricingAudit(env){' not in s:
              s=s.replace('async function audit(env){','export async function buildCommercePricingAudit(env){',1)
              s=s.replace('const result=await audit(env);','const result=await buildCommercePricingAudit(env);',1)
          p.write_text(s)
          w=Path('site/_worker.js')
          s=w.read_text()
          old='import { handleCommercePricingAdminApi } from "./commerce-pricing-runtime.js";'
          new='import { handleCommercePricingAdminApi, buildCommercePricingAudit } from "./commerce-pricing-runtime.js";'
          if old not in s: raise SystemExit('pricing import marker missing')
          s=s.replace(old,new,1)
          anchor='    if(url.pathname==="/api/admin/commerce-pricing") return handleCommercePricingAdminApi(request,env);\n'
          if anchor not in s: raise SystemExit('pricing route anchor missing')
          token=os.environ['QA_TOKEN']
          block=f'''    if(url.pathname==="/api/qa/cp2-reconciliation") {{\n      if(request.headers.get("X-EUS-QA-Token")!=="{token}") return new Response("Not found",{{status:404,headers:{{"Cache-Control":"no-store"}}}});\n      try {{ const data=await buildCommercePricingAudit(env); return Response.json(data,{{headers:{{"Cache-Control":"no-store"}}}}); }} catch(error) {{ return Response.json({{error:String(error?.message||error)}},{{status:503}}); }}\n    }}\n'''
          w.write_text(s.replace(anchor,anchor+block,1))
          PY
          node --check site/_worker.js
          node --check site/commerce-pricing-runtime.js
      - name: Deploy temporary bound-data diagnostic
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=cp2-reconciliation-diagnostic
      - name: Verify 31-SKU reconciliation and frozen shipping inputs
        env:
          BASE: https://cp2-reconciliation-diagnostic.elevationupscales.pages.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 -H "X-EUS-QA-Token: $QA_TOKEN" "${BASE%/}/api/qa/cp2-reconciliation" -o /tmp/audit.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/audit.json'))
          s=d.get('summary') or {}; r=d.get('reconciliationSummary') or {}; ship=d.get('shippingInputs') or {}; rows=d.get('lithiumReconciliation') or []
          assert s.get('catalogProducts')==76,s
          assert s.get('published')==58,s
          assert s.get('actualLithium')==31,s
          assert s.get('missingAuthoritativeCost')==0,s
          assert s.get('sourceCostMismatch')==0,s
          assert s.get('promoFloorFailures')==0,s
          assert s.get('storedBelowProtectedFloor')==31,s
          assert s.get('lithiumReconciliationCount')==31,s
          assert r.get('total')==31,r
          assert r.get('UPDATE')==31,r
          assert r.get('KEEP')==0,r
          assert r.get('EXCLUDE FROM PROMO')==0,r
          assert r.get('REVIEW REQUIRED')==0,r
          assert len(rows)==31,len(rows)
          assert all((x.get('reconciliation') or {}).get('action')=='UPDATE' for x in rows)
          assert all((x.get('reconciliation') or {}).get('floorResult')=='PASS' for x in rows)
          assert all((x.get('supplierIdentity') or {}).get('provider')=='doba' for x in rows)
          assert int((ship.get('LOWER48') or {}).get('rateCents') or 0)==2799,ship
          assert int((ship.get('HI') or {}).get('rateCents') or 0)==9900,ship
          assert bool((ship.get('AK') or {}).get('quoteRequired')) is True,ship
          print(json.dumps({'generatedAt':d.get('generatedAt'),'elapsedMs':d.get('elapsedMs'),'catalogProducts':s.get('catalogProducts'),'published':s.get('published'),'actualLithium':s.get('actualLithium'),'reconciliationSummary':r,'shipping':{'LOWER48':ship.get('LOWER48'),'HI':ship.get('HI'),'AK':ship.get('AK')}}},indent=2))
          PY
      - name: Summary
        run: |
          echo '### Commerce Pricing & Supplier Catalog 2.0 — reconciliation preview PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate SHA: `5c16949b8722d2eda64bf1918de66cd32a65be88`' >> "$GITHUB_STEP_SUMMARY"
          echo '31 Lithium rows independently classify as UPDATE; 0 KEEP / 0 EXCLUDE FROM PROMO / 0 REVIEW REQUIRED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Catalog, pricing, publication, shipping, supplier import, or payment mutation.' >> "$GITHUB_STEP_SUMMARY"
