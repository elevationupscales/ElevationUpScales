name: WEB-COM-0905-01 Retired Hawaii Constant Cleanup

on:
  push:
    branches:
      - work/web-com-0905-01-storefront

permissions:
  contents: write

concurrency:
  group: web-com-0905-01-retired-hawaii-cleanup
  cancel-in-progress: false

jobs:
  cleanup-once:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact storefront branch
        uses: actions/checkout@v6
        with:
          ref: work/web-com-0905-01-storefront
          fetch-depth: 0

      - name: Remove only retired unused constants and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("site/store-checkout-server.js")
          source = path.read_text()
          lines = [
              'const HAWAII_CUSTOMER_FREIGHT_CENTS_PER_BATTERY = 9900;\n',
              'const HAWAII_PREFERRED_CONSOLIDATION_UNITS = 3;\n',
          ]
          for line in lines:
              if source.count(line) != 1:
                  raise SystemExit(f"expected exactly one retired constant line: {line.strip()}")
              source = source.replace(line, "", 1)
          path.write_text(source)
          PY
          rm .github/workflows/web-com-0905-01-retired-hawaii-cleanup.yml
          node --check site/store-checkout-server.js
          node deployment/qa/web-com-commerce-regression.mjs
          git diff --check
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          expected = {
              "site/store-checkout-server.js",
              ".github/workflows/web-com-0905-01-retired-hawaii-cleanup.yml",
          }
          if set(changed) != expected:
              raise SystemExit(f"unexpected files changed: {changed}")
          PY
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/store-checkout-server.js .github/workflows/web-com-0905-01-retired-hawaii-cleanup.yml
          git commit -m "WEB-COM-0905-01 remove retired unused Hawaii checkout constants"
          git push origin HEAD:work/web-com-0905-01-storefront
