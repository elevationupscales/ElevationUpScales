name: One-time SOK Full-Line Final RC Sweep

on:
  push:
    branches:
      - runner/sok-full-line-rc-2026-09-04

permissions:
  contents: read
  deployments: write

concurrency:
  group: sok-full-line-final-rc
  cancel-in-progress: false

jobs:
  validate-preview:
    name: Validate exact SOK full-line candidate and preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: fb8d8bc9e394d0b4ba478ba5c475e7a344ad2233
          fetch-depth: 0

      - name: Enforce lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fb8d8bc9e394d0b4ba478ba5c475e7a344ad2233"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "11af67c46b19979a08a836d384c051c0b04a15d4"
          git merge-base --is-ancestor origin/main HEAD

      - name: Re-run SOK and regression gates
        shell: bash
        run: |
          set -euo pipefail
          node deployment/qa/sok-commercialization-static.mjs
          node deployment/qa/sok-full-line-static.mjs
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          test -z "$(find site -type f -size +25M -print -quit)"
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site
          test -f site/index.html
          test -f site/store.html
          test -f site/rv-store.html
          test -f site/lithium-batteries.html
          test -f site/hawaii-lithium-batteries.html
          test -f site/checkout/index.html
          test -f site/start-a-project.html
          test -f site/marketplace.html
          test -f site/solar-project.html
          grep -q '/api/store-catalog?section=rv-outdoor' site/rv-store.js
          grep -q 'Hawaii Lithium Batteries' site/store.html
          grep -q 'Stage 1 of 7' site/solar-project.html
          grep -q 'sok-solar-builder.js' site/solar-project.html
          grep -q '208-813-4998' site/index.html

      - name: Deploy isolated RC preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=sok-full-line-final-rc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke SOK commercialization preview
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          bash deployment/qa/sok-commercialization-preview.sh "$BASE"

      - name: Smoke full-line preview
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          bash deployment/qa/sok-full-line-preview.sh "$BASE"

      - name: Smoke protected customer routes
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /sok-batteries /checkout/ /start-a-project /solar-project /marketplace; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/rc-route -w '%{http_code}' "$base$route" || true)
            echo "$route=$code"
            test "$code" = "200"
          done

      - name: Final RC receipt
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### SOK FULL-LINE FINAL RC — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: fb8d8bc9e394d0b4ba478ba5c475e7a344ad2233" >> "$GITHUB_STEP_SUMMARY"
          echo "Required production parent: 11af67c46b19979a08a836d384c051c0b04a15d4" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "SOK commercialization gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "SOK full-line gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "MAP / unpriced Purchase Options: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Hawaii / supplier-data / regression smoke: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion: AUTHORIZED IF THIS RUN PASSES" >> "$GITHUB_STEP_SUMMARY"
