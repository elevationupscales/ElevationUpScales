name: One-time exact PR206 revert

on:
  push:
    branches:
      - work/revert-pr206-and-minimal-media-repair-2026-09-15
    paths:
      - .github/workflows/one-time-revert-pr206.yml

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/revert-pr206-and-minimal-media-repair-2026-09-15
          fetch-depth: 0
      - name: Restore exact pre-PR206 files
        shell: bash
        run: |
          set -euo pipefail
          git checkout af6263363b2094640ee9d392d419b0e926cba24f -- \
            apps/web-v2/src/shell.js \
            apps/web-v2/src/catalog-pages.js \
            apps/web-v2/test/image-closeout.test.mjs
          git diff --check
      - name: Commit exact revert and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-revert-pr206.yml
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/shell.js apps/web-v2/src/catalog-pages.js apps/web-v2/test/image-closeout.test.mjs
          git commit -m 'Revert PR #206 scope drift'
          git push origin HEAD:work/revert-pr206-and-minimal-media-repair-2026-09-15
