name: One-Time Final Admin OS Preview

on:
  push:
    branches:
      - release/admin-operating-system-sync-final

permissions:
  contents: write
  deployments: write

concurrency:
  group: final-admin-os-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ contains(github.event.head_commit.message, '[admin-os-preview]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-operating-system-sync-final
          fetch-depth: 2
      - name: Apply final operating-system integration
        run: |
          set -euo pipefail
          python scripts/apply_final_admin_operating_system.py
          python scripts/final_admin_gate_followup.py
      - name: Validate source and architecture
        run: |
          set -euxo pipefail
          node --check site/sync-admin-runtime.js
          node --check site/admin-channels.js
          node --check site/admin-system.js
          node --check site/admin-products-final.js
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/_worker.js
          grep -q 'Products & Listings' site/admin-catalog.html
          grep -q 'Channels & Sync' site/admin-channels.html
          grep -q 'System / QA' site/admin-system.html
          grep -q 'Shipping & Logistics' site/admin-lithium-shipping.html
          grep -q '/api/admin/sync' site/_worker.js
          grep -q '/api/sync/run' site/_worker.js
          grep -q '/sync-admin-runtime.js' site/_routes.json
          grep -q '/api/store-catalog?section=rv-outdoor' site/rv-store.js
          grep -q 'fallbackCatalog' site/rv-store.js
          grep -q 'RV & OUTDOOR GEAR' site/rv-store.html
          grep -q 'Hawaii Lithium Program' site/hawaii-lithium-batteries.html
          grep -q 'Secure checkout' site/checkout/index.html
          git diff --check
      - name: Commit permanent site integration
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate final Admin operating system and sync foundation [admin-os-patched]'
            git push origin HEAD:release/admin-operating-system-sync-final
          fi
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=admin-os-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke preview
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /marketplace /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /admin-analytics /admin-system; do
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done
          curl -sS -L --fail "$base/admin-catalog" | grep -q 'Products & Listings'
          curl -sS -L --fail "$base/admin-channels" | grep -q 'Channels & Sync'
          curl -sS -L --fail "$base/admin-system" | grep -q 'System / QA'
          curl -sS -L --fail "$base/rv-store" | grep -q 'RV & OUTDOOR GEAR'
          curl -sS -L --fail "$base/rv-store.js" | grep -q '/api/store-catalog?section=rv-outdoor'
          curl -sS -L --fail "$base/checkout" | grep -q 'Secure checkout'
          sync_code=$(curl -sS -o /tmp/sync.json -w '%{http_code}' "$base/api/admin/sync" || true)
          echo "admin_sync_unauthenticated=$sync_code"
          test "$sync_code" = "401"
          scheduler_code=$(curl -sS -o /tmp/scheduled.json -w '%{http_code}' -X POST "$base/api/sync/run" -H 'Content-Type: application/json' --data '{"target":"all","runId":"preview-unauthorized"}' || true)
          echo "scheduled_sync_unauthorized=$scheduler_code"
          test "$scheduler_code" = "401"
          runtime_code=$(curl -sS -o /tmp/runtime.txt -w '%{http_code}' "$base/sync-admin-runtime.js" || true)
          echo "sync_runtime_public=$runtime_code"
          test "$runtime_code" = "404"
      - name: Receipt
        run: |
          echo '### Final Admin Operating System Preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin shell + Products & Listings + Channels & Sync + System/QA: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sync auth boundaries: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Catalog-backed RV Store + existing commerce routes: PASS' >> "$GITHUB_STEP_SUMMARY"
