name: One-Time 4.5 Commerce Control Build Core

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths:
      - .github/workflows/one-time-45-commerce-control-build-core.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Apply 4.5 commerce-control patch
        run: python .github/scripts/apply_45_commerce_core.py
      - name: Validate and commit application patch
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site
          git commit -m "Build 4.5 server commerce control foundation"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
