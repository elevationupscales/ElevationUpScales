name: One-Time Assemble Kingboss Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-assemble-kingboss-source.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bounded source transfer branch
        uses: actions/checkout@v6
        with:
          ref: staging/kingboss-source-v2
          fetch-depth: 0
      - name: Verify chunks and assemble exact binary source
        shell: bash
        run: |
          set -euo pipefail
          root=.deployment-input/kingboss-20260829-5188361/xz-b64
          echo '848b2d6b43e93be39f26ac928a171ea91bff01b6e8b6189fa6bf83744bc24c07  '"$root"'/00.part' | sha256sum -c -
          echo '7ed3931efb0da888ea04ad1a71d8f49fc8c35a73bed2a57d34a8cdde12aa05d6  '"$root"'/01.part' | sha256sum -c -
          echo 'af8a60498f7c8560cc497fd3dfeda48a63507f6bf2f53f5b786fb6cb777678f9  '"$root"'/02.part' | sha256sum -c -
          echo '47d7e6d6e2272995afab50821650bcfe692608bcd23d2af27ccd8fab7b5a95f3  '"$root"'/03.part' | sha256sum -c -
          echo '29031662d446b5445d205580605b8e07df458fb0af9c136cacf5ab6dfe281452  '"$root"'/04.part' | sha256sum -c -
          cat "$root"/*.part > /tmp/source.xz.b64
          test "$(wc -c < /tmp/source.xz.b64 | tr -d ' ')" = '21752'
          base64 --decode /tmp/source.xz.b64 > /tmp/source.csv.xz
          test "$(wc -c < /tmp/source.csv.xz | tr -d ' ')" = '16312'
          test "$(sha256sum /tmp/source.csv.xz | awk '{print $1}')" = '9a9711c09acc80cad9a93b5807edb82f70993aa558650251fb173cf0c9f1962a'
          xz -t /tmp/source.csv.xz
          xz -dc /tmp/source.csv.xz > /tmp/source.csv
          test "$(wc -c < /tmp/source.csv | tr -d ' ')" = '226980'
          test "$(sha256sum /tmp/source.csv | awk '{print $1}')" = '4c1c424c314ccf384f0db854617bb5a97b3481bda869597c43bbc7853c3e3f66'
          python - <<'PY'
          import csv
          with open('/tmp/source.csv',newline='',encoding='utf-8-sig') as f:
              r=csv.reader(f); h=next(r); rows=list(r)
          assert len(h)==163, len(h)
          assert len(rows)==43, len(rows)
          print('verified authoritative source: 43 rows / 163 columns')
          PY
          mkdir -p .deployment-input/kingboss-20260829-5188361
          cp /tmp/source.csv.xz .deployment-input/kingboss-20260829-5188361/source.csv.xz
      - name: Publish verified binary source to expected staging ref
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deployment-input/kingboss-20260829-5188361/source.csv.xz
          git commit -m 'Publish verified Kingboss 5188361 authoritative source binary'
          git push --force origin HEAD:staging/kingboss-5188361-authoritative-source
