name: One-Time Hawaii Lithium Phase 1.2

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[hawaii-phase12]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 30

      - name: Confirm accepted parent baseline is in history
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor bb8d2cd71d8f69da6adf1f5cb0046fe3ff36a67a HEAD

      - name: Integrate Hawaii runtime, navigation and homepage promotion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          worker = Path('site/_worker.js')
          text = worker.read_text()
          import_anchor = 'import { handleCatalogAdminApi, handleCatalogPublicApi } from "./catalog-admin-runtime.js";'
          new_import = 'import { handleHawaiiLithiumAdminApi, handleHawaiiLithiumPublicApi } from "./hawaii-lithium-runtime.js";'
          if new_import not in text:
              if import_anchor not in text: raise SystemExit('worker import anchor missing')
              text = text.replace(import_anchor, import_anchor + '\n' + new_import, 1)
          old_guard = '["/worker-core.js", "/store-checkout-server.js", "/store-orders-admin-server.js", "/catalog-admin-server.js", "/catalog-admin-runtime.js"]'
          new_guard = '["/worker-core.js", "/store-checkout-server.js", "/store-orders-admin-server.js", "/catalog-admin-server.js", "/catalog-admin-runtime.js", "/hawaii-lithium-runtime.js"]'
          if old_guard in text: text = text.replace(old_guard, new_guard, 1)
          public_anchor = '    if (url.pathname === "/api/store-catalog") {\n      return handleCatalogPublicApi(request, env, url.pathname);\n    }\n'
          public_block = public_anchor + '\n    if (url.pathname.startsWith("/api/hawaii-lithium/")) {\n      return handleHawaiiLithiumPublicApi(request, env, url.pathname);\n    }\n'
          if 'handleHawaiiLithiumPublicApi(request, env, url.pathname)' not in text:
              if public_anchor not in text: raise SystemExit('public route anchor missing')
              text = text.replace(public_anchor, public_block, 1)
          admin_anchor = '    if (url.pathname === "/api/admin/catalog" || url.pathname.startsWith("/api/admin/catalog/")) {\n      return handleCatalogAdminApi(request, env, url.pathname);\n    }\n'
          admin_block = admin_anchor + '\n    if (url.pathname === "/api/admin/lithium-shipping" || url.pathname.startsWith("/api/admin/lithium-shipping/")) {\n      return handleHawaiiLithiumAdminApi(request, env, url.pathname);\n    }\n'
          if 'handleHawaiiLithiumAdminApi(request, env, url.pathname)' not in text:
              if admin_anchor not in text: raise SystemExit('admin route anchor missing')
              text = text.replace(admin_anchor, admin_block, 1)
          worker.write_text(text)

          routes = Path('site/_routes.json')
          data = json.loads(routes.read_text())
          if '/hawaii-lithium-runtime.js' not in data['include']:
              data['include'].append('/hawaii-lithium-runtime.js')
          routes.write_text(json.dumps(data, indent=2) + '\n')

          shell = Path('site/site-shell.js')
          s = shell.read_text()
          s = s.replace('["/hawaii-lithium-batteries", "Hawaii Lithium Shipping", "Hawaii eligibility, rates, and island shipping information"]', '["/hawaii-lithium-batteries", "Hawaii Lithium Program", "Coming soon · reservations and Hawaii shipping availability"]')
          shell.write_text(s)

          admin = Path('site/admin-catalog.html')
          a = admin.read_text()
          anchor = '<a class="button button-outline" href="/admin-store-orders.html">Store Orders</a>'
          add = anchor + '<a class="button button-outline" href="/admin-lithium-shipping.html">Lithium Shipping Matrix</a>'
          if 'href="/admin-lithium-shipping.html"' not in a:
              if anchor not in a: raise SystemExit('admin catalog nav anchor missing')
              a = a.replace(anchor, add, 1)
          admin.write_text(a)

          home = Path('site/index.html')
          h = home.read_text()
          h = h.replace('<a href="/hawaii-lithium-batteries"><span><strong>Hawaii Lithium Shipping</strong><small>Hawaii eligibility, rates, and island shipping information</small></span></a>', '<a href="/hawaii-lithium-batteries"><span><strong>Hawaii Lithium Program</strong><small>Coming soon · reserve for upcoming Hawaii shipments</small></span></a>')
          h = h.replace('<a class="text-link-inline" href="/hawaii-lithium-batteries">Hawaii Lithium Shipping →</a>', '<a class="text-link-inline" href="/hawaii-lithium-batteries"><strong>COMING SOON</strong> · Hawaii Lithium Program →</a>')
          home.write_text(h)
          PY

      - name: Validate Phase 1.2 scope and public copy
        shell: bash
        run: |
          set -euo pipefail
          node --check site/hawaii-lithium-runtime.js
          node --check site/admin-lithium-shipping.js
          node --check site/hawaii-lithium-program.js
          node --check site/lithium-shop.js
          node --check site/rv-store.js
          node --check site/_worker.js
          node --check site/site-shell.js
          python - <<'PY'
          from pathlib import Path
          public_html = '\n'.join(Path(p).read_text().lower() for p in ['site/hawaii-lithium-batteries.html','site/lithium-batteries.html','site/rv-store.html'])
          banned = ['phase 1','phase 2','safeguard','fallback','product rule','verified record','supplier record','source snapshot','catalog management','routing','seller hub','api','hold state','internal target','approved path','safe path','deployment','doba mapping','ebay mapping','unfiltered supplier dump']
          found = [term for term in banned if term in public_html]
          if found: raise SystemExit('Public copy contains internal terminology: ' + ', '.join(found))
          required = {
            'site/hawaii-lithium-batteries.html':['COMING SOON · HAWAII LITHIUM PROGRAM','Request Hawaii Availability','Reserve for Next Hawaii Shipment','does not charge you'],
            'site/lithium-batteries.html':['Lithium power for RV, solar and off-grid systems.','Hawaii Lithium Program'],
            'site/rv-store.html':['RV & Outdoor gear selected by Elevation.','Curated Gear','Secure Checkout','Shipping Options','Newest'],
            'site/index.html':['COMING SOON</strong> · Hawaii Lithium Program'],
            'site/admin-lithium-shipping.html':['Lithium Shipping Matrix','Hawaii Shipping Batches','Waitlist & Demand Metrics'],
          }
          for path, terms in required.items():
              value=Path(path).read_text()
              for term in terms:
                  if term not in value: raise SystemExit(f'{path} missing {term}')
          PY
          grep -Fq 'handleHawaiiLithiumPublicApi' site/_worker.js
          grep -Fq 'handleHawaiiLithiumAdminApi' site/_worker.js
          grep -Fq '/hawaii-lithium-runtime.js' site/_routes.json
          grep -Fq 'entry.shippingVerified !== true' site/store-checkout-server.js
          grep -Fq 'Secure checkout' site/checkout.html
          ! grep -Fq 'Sandbox checkout' site/checkout.html

      - name: Commit permanent integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/_worker.js site/_routes.json site/site-shell.js site/admin-catalog.html site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate Hawaii Lithium Phase 1.2 into production application'
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production routes and protected boundaries
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          sleep 5
          for route in / /store /rv-store /marketplace /start-a-project /solar-project /lithium-batteries /hawaii-lithium-batteries /checkout /admin-catalog /admin-lithium-shipping; do
            code=$(curl -sS -L --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 -o /tmp/page.html -w '%{http_code}' "${PRODUCTION_URL}${route}" || true)
            echo "${route}=${code}"
            test "$code" = "200"
          done

          curl -sS -L --fail "$PRODUCTION_URL/hawaii-lithium-batteries" > /tmp/hawaii.html
          grep -Fq 'COMING SOON · HAWAII LITHIUM PROGRAM' /tmp/hawaii.html
          grep -Fq 'Reserve for Next Hawaii Shipment' /tmp/hawaii.html
          ! grep -Fiq 'Phase 1 shipping safeguards' /tmp/hawaii.html

          curl -sS -L --fail "$PRODUCTION_URL/lithium-batteries" > /tmp/lithium.html
          grep -Fq 'Hawaii Lithium Program' /tmp/lithium.html
          ! grep -Fiq 'supplier/listing snapshot' /tmp/lithium.html

          curl -sS -L --fail "$PRODUCTION_URL/rv-store" > /tmp/rv.html
          grep -Fq 'RV & Outdoor gear selected by Elevation.' /tmp/rv.html
          ! grep -Fiq 'Seller Hub Order' /tmp/rv.html
          ! grep -Fiq 'protected checkout routing' /tmp/rv.html

          admin_code=$(curl -sS -o /tmp/adminapi.json -w '%{http_code}' "$PRODUCTION_URL/api/admin/lithium-shipping" || true)
          echo "admin_lithium_without_session=${admin_code}"
          test "$admin_code" = "401"

          status_code=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$PRODUCTION_URL/api/hawaii-lithium/status?sku=DOES-NOT-EXIST" || true)
          echo "public_status=${status_code}"
          test "$status_code" = "200"
          node - <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/status.json','utf8'));
          if(s.eligible!==false||s.status!=='QUALIFICATION IN PROGRESS') throw new Error('Unqualified SKU was exposed as eligible');
          NODE

          runtime_code=$(curl -sS -o /tmp/runtime.txt -w '%{http_code}' "$PRODUCTION_URL/hawaii-lithium-runtime.js" || true)
          echo "server_runtime_public=${runtime_code}"
          test "$runtime_code" = "404"

          curl -sS --fail "$PRODUCTION_URL/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true) throw new Error('PayPal live checkout regression');
          console.log('paypal_live=PASS');
          NODE

          rv_code=$(curl -sS -o /tmp/rvquote.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true)
          test "$rv_code" = "200"
          held_code=$(curl -sS -o /tmp/held.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631058246","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631058246","name":"Quick Set Brown Pop-Up Gazebo"}' || true)
          test "$held_code" = "409"

          curl -sS --fail "$PRODUCTION_URL/api/marketplace/listings" > /tmp/market.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/market.json','utf8'));
          if(Number(d.count ?? d.listings?.length ?? 0)<1) throw new Error('Marketplace regression');
          NODE

      - name: Receipt
        run: |
          echo '### Hawaii Lithium Program Phase 1.2 — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Public Coming Soon + reservation experience: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lithium Shipping Matrix auth boundary: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unqualified Hawaii status cannot show eligible: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public copy cleanup: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal / RV checkout / Marketplace regression gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'No automatic carrier booking, hazmat generation, or payment collection introduced.' >> "$GITHUB_STEP_SUMMARY"
