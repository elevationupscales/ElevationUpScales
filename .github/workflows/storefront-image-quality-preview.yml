name: Storefront Image Quality Preview

on:
  push:
    branches:
      - release/storefront-image-quality-v3.11.41

permissions:
  contents: read
  deployments: write

concurrency:
  group: storefront-image-quality-preview
  cancel-in-progress: false

jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v6

      - name: Validate protected storefront lineage
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/_worker.js
          test -f site/store.html
          test -f site/store-config.js
          test -f site/store-catalog-resilience.js
          test -f site/store-image-quality.js
          test -f site/rv-store.html
          test -f site/solar-project.html
          grep -q '3.11.30-store-navigation-repair' site/_worker.js
          grep -q 'store-catalog-resilience.js?v=3.11.38&quality=original-r4' site/store-config.js
          grep -q 'store-image-quality.js?v=3.11.41' site/store-config.js
          grep -q 'TARGET_WIDTH = 1920' site/store-image-quality.js
          grep -q 'MIN_FULL_COUNT = 13' site/store-catalog-resilience.js
          grep -q 'link.textContent = "Buy Now"' site/store-catalog-resilience.js
          grep -q 'VERIFIED EBAY CATALOG' site/rv-store.html
          cmp -s site/solar-project.html site/solar-project/index.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

      - name: Block accidental secrets and release archives
        shell: bash
        run: |
          set -euo pipefail
          blocked=$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)
          test -z "$blocked"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site; then
            echo "Credential-like value found in website source."
            exit 1
          fi

      - name: Deploy isolated Cloudflare preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=image-quality-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke preview
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          test -n "$base"
          for route in / /store /rv-store /start-a-project /marketplace /solar-project; do
            code=$(curl --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 2 --output /tmp/eus-smoke.html --write-out '%{http_code}' "${base}${route}")
            test "$code" = "200"
          done
          curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/store-config.js" | grep -q 'store-image-quality.js?v=3.11.41'
          curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/store-image-quality.js" | grep -q 'TARGET_WIDTH = 1920'
          curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/store" | grep -q 'Apparel Store'
          curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/rv-store" | grep -q 'VERIFIED EBAY CATALOG'

      - name: Record candidate receipt
        shell: bash
        run: |
          echo "### Storefront image-quality preview" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview validation: PASS" >> "$GITHUB_STEP_SUMMARY"
