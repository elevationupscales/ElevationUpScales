name: Quick homepage production deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quick-homepage-production-once.yml'

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

# Retry after synchronizing the stale homepage wording assertion in analytics QA.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate quick homepage edit scope
        shell: bash
        run: |
          set -euo pipefail
          test -f site/homepage-owner-annotations.css
          test -f site/home-hero-slides.json
          grep -q 'content:"Lithium Power "' site/homepage-owner-annotations.css
          grep -q 'content:"Tracking Info"' site/homepage-owner-annotations.css
          grep -q 'storefront-wordmark.webp' site/homepage-owner-annotations.css
          grep -q 'sk48v100n-2026-09-05' site/home-hero-slides.json
          grep -q '/assets/brands/sok/48v-battery-cabinet/hero.webp' site/home-hero-slides.json
          node -e "JSON.parse(require('fs').readFileSync('site/home-hero-slides.json','utf8'))"
          npm run qa:fast
          npm run qa
          git diff --check
      - name: Block credentials and oversized deploy artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"
          test -z "$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)"
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke deployment and verify quick edits
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project; do
            code=$(curl -sS -L --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done
          curl -sS -L --fail "$base/homepage-owner-annotations.css?verify=${GITHUB_SHA}" -o /tmp/homepage.css
          grep -q 'content:"Lithium Power "' /tmp/homepage.css
          grep -q 'content:"Tracking Info"' /tmp/homepage.css
          grep -q 'storefront-wordmark.webp' /tmp/homepage.css
          curl -sS -L --fail "$base/home-hero-slides.json?verify=${GITHUB_SHA}" -o /tmp/slides.json
          grep -q '/assets/brands/sok/48v-battery-cabinet/hero.webp' /tmp/slides.json
          for attempt in $(seq 1 18); do
            code=$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/prod.html -w '%{http_code}' "https://elevationupscales.com/?quick_edit_verify=${GITHUB_SHA}-${attempt}" || true)
            css_code=$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/prod.css -w '%{http_code}' "https://elevationupscales.com/homepage-owner-annotations.css?quick_edit_verify=${GITHUB_SHA}-${attempt}" || true)
            json_code=$(curl -sS -L -H 'Cache-Control: no-cache' -o /tmp/prod.json -w '%{http_code}' "https://elevationupscales.com/home-hero-slides.json?quick_edit_verify=${GITHUB_SHA}-${attempt}" || true)
            if [ "$code" = "200" ] && [ "$css_code" = "200" ] && [ "$json_code" = "200" ] && grep -q 'content:"Lithium Power "' /tmp/prod.css && grep -q 'content:"Tracking Info"' /tmp/prod.css && grep -q '/assets/brands/sok/48v-battery-cabinet/hero.webp' /tmp/prod.json; then
              echo 'Production custom domain serves the approved quick homepage edits.'
              exit 0
            fi
            sleep 5
          done
          echo 'Production custom domain did not show quick homepage edits in verification window.'
          exit 1
      - name: Receipt
        run: |
          echo '### Quick homepage production deployment — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
