name: Checkout Client Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkout-client-inspect.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax and startup excerpt
        run: |
          set -euo pipefail
          node --check site/store-checkout.js
          echo '--- relevant calls ---'
          grep -nE 'loadPayPal|renderPayPal|requestQuote|refreshQuote|Promise\.all|catch\(' site/store-checkout.js || true
          echo '--- tail ---'
          tail -n 180 site/store-checkout.js
