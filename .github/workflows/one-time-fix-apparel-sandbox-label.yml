name: One-Time Fix Apparel Sandbox Label

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  release:
    if: ${{ contains(github.event.head_commit.message, '[checkout-label-fix]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Validate checkout label
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Secure checkout' site/checkout/index.html
          ! grep -q 'Sandbox checkout' site/checkout/index.html
          grep -q 'liveCheckoutApproved' site/store-checkout-server.js
      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify production checkout
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 3
          code=$(curl -sS -L --connect-timeout 5 --max-time 20 -o /tmp/checkout.html -w '%{http_code}' "$PRODUCTION_URL/checkout" || true)
          echo "checkout=${code}"
          test "$code" = "200"
          grep -q 'Secure checkout' /tmp/checkout.html
          ! grep -q 'Sandbox checkout' /tmp/checkout.html
          curl -sS --fail "$PRODUCTION_URL/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true) throw new Error('PayPal live config regression');
          console.log('paypal_live_config=PASS');
          NODE
      - name: Receipt
        run: |
          echo '### Apparel checkout label fix — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Checkout badge: Secure checkout' >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal environment: live' >> "$GITHUB_STEP_SUMMARY"
