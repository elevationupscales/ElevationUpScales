name: One-Time Homepage DOM Gap Diagnostic
on:
  push:
    branches: [diagnostic/4.4-homepage-vertical-layout-2026-08-31]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install --no-save playwright@1.55.0
      - name: List body elements before main
        env:
          PREVIEW_BASE: https://a8438475.elevationupscales.pages.dev
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || true); test -n "$CHROME"; export CHROME
          cat > dom.mjs <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox']});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          await page.goto(process.env.PREVIEW_BASE+'/',{waitUntil:'domcontentloaded'});
          await page.locator('#home-route-title').waitFor();
          await page.waitForTimeout(1200);
          const out=await page.evaluate(()=>{
            const main=document.querySelector('main');
            const bodyKids=[...document.body.children].map((e,i)=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{i,tag:e.tagName,id:e.id,cls:e.className,top:r.top,bottom:r.bottom,h:r.height,display:s.display,position:s.position,text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,180)}});
            const beforeMain=[...document.querySelectorAll('body *')].filter(e=>{if(e===main||main.contains(e))return false;const r=e.getBoundingClientRect();return r.height>0&&r.top>=150&&r.bottom<=main.getBoundingClientRect().top+1;}).map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return{tag:e.tagName,id:e.id,cls:e.className,top:r.top,bottom:r.bottom,h:r.height,display:s.display,position:s.position,text:(e.innerText||'').replace(/\s+/g,' ').trim().slice(0,180)}}).sort((a,b)=>a.top-b.top||b.h-a.h);
            return{mainTop:main.getBoundingClientRect().top,bodyKids,beforeMain};
          });
          console.log(JSON.stringify(out,null,2));
          await browser.close();
          NODE
          node dom.mjs
