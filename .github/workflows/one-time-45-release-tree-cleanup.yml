name: One-Time 4.5 Release Tree Cleanup
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-release-tree-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Confirm application parent
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 447677cd9e07e9c39f0497dbb4e9df66fd9b9b82 HEAD
      - name: Remove temporary 4.5 build and verification scaffolding
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-45-*.yml
          rm -f .github/scripts/apply_45_*.py
          rm -f .github/scripts/repair_45_*.py
          git status --short
      - name: Validate permanent release tree
        run: |
          set -euo pipefail
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-45-*' -print -quit)"
          test -z "$(find .github/scripts -maxdepth 1 -type f \( -name 'apply_45_*' -o -name 'repair_45_*' \) -print -quit)"
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
      - name: Commit clean release tree
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add -A
          git commit -m "Clean temporary 4.5 verification scaffolding from release tree"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
          echo "CLEAN_RELEASE_SHA=$(git rev-parse HEAD)"
