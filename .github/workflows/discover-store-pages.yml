name: Discover Store Pages Project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-store-pages.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Install pinned Wrangler
        working-directory: apps/web-v2
        run: npm ci --ignore-scripts
      - name: List Cloudflare Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --prefix apps/web-v2 --no-install wrangler pages project list --json > /tmp/pages-projects.json
          cat /tmp/pages-projects.json
          echo '### Cloudflare Pages projects' >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- `\(.name)` — `\(.subdomain // "no-subdomain")` — production branch: `\(.production_branch // "unknown")`"' /tmp/pages-projects.json >> "$GITHUB_STEP_SUMMARY"
