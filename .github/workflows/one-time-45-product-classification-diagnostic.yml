name: One-Time 4.5 Lithium Classification Diagnostic
on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths: [.github/workflows/one-time-45-product-classification-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect review SKU classification
        shell: bash
        env:
          PREVIEW: https://bcdc5904.elevationupscales.pages.dev
        run: |
          PREVIEW="$PREVIEW" node <<'NODE'
          (async()=>{
            const base=process.env.PREVIEW;
            const catalog=await (await fetch(base+'/api/store/catalog?section=lithium-batteries')).json();
            const id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';
            const p=(catalog.products||[]).find(x=>x.id===id);
            console.log('PRODUCT='+JSON.stringify(p));
            async function quote(state){const r=await fetch(base+'/api/store-checkout/quote',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Origin':base},body:JSON.stringify({source:'lithium',id,name:p?.title,quantity:1,shipping:{state}})});console.log('QUOTE_'+state+'_HTTP='+r.status);console.log('QUOTE_'+state+'_BODY='+await r.text());}
            await quote('CO'); await quote('HI');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
