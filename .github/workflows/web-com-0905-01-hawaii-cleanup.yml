name: WEB-COM-0905-01 Hawaii Freight Cleanup

on:
  push:
    branches:
      - repair/web-com-0905-01-hawaii-freight

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/web-com-0905-01-hawaii-freight
          fetch-depth: 0

      - name: Protect production and candidate lineage
        shell: bash
        env:
          EXPECTED_MAIN: 0f343f281e72ddf102c5174b02e8c4a0a8dbf1d7
          ACCEPTED_PREVIEW_CANDIDATE: 8ed3a7fdde4394d5a444bd88eb0d49308ab335fc
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$ACCEPTED_PREVIEW_CANDIDATE" HEAD

      - name: Remove retired Hawaii freight fallback and claim
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server = Path('site/store-checkout-server.js')
          src = server.read_text()
          old = 'customerFreightPerBatteryCents:Number(rule?.rateCents||9900)'
          new = 'customerFreightPerBatteryCents:Number.isInteger(Number(rule?.rateCents))?Number(rule.rateCents):null'
          if old in src:
              src = src.replace(old, new, 1)
          elif new not in src:
              raise SystemExit('Expected retired Hawaii freight fallback not found')
          server.write_text(src)

          client = Path('site/store-checkout.js')
          src = client.read_text()
          old = 'shippingLabelEl.textContent = isHawaii ? "Included Honolulu freight" : "Shipping";'
          new = 'shippingLabelEl.textContent = isHawaii ? "Freight to Honolulu pickup" : "Shipping";'
          if old in src:
              src = src.replace(old, new, 1)
          elif new not in src:
              raise SystemExit('Expected Hawaii freight label not found')
          client.write_text(src)

          qa = Path('deployment/qa/web-com-commerce-regression.mjs')
          src = qa.read_text()
          anchor = 'assert.equal(checkoutSource.includes("HAWAII_PREFERRED_CONSOLIDATION_UNITS"), false, "unused checkout-local Hawaii consolidation constant must not return");\n'
          guard = anchor + 'assert.equal(checkoutSource.includes("9900"), false, "retired $99 Hawaii freight fallback must not return to checkout source");\n'
          if 'retired $99 Hawaii freight fallback must not return to checkout source' not in src:
              if anchor not in src:
                  raise SystemExit('Commerce QA anchor missing')
              src = src.replace(anchor, guard, 1)
          old_list = '  "site/store-checkout-server.js",\n  "site/sok-order.js",'
          new_list = '  "site/store-checkout-server.js",\n  "site/store-checkout.js",\n  "site/sok-order.js",'
          if old_list in src:
              src = src.replace(old_list, new_list, 1)
          elif new_list not in src:
              raise SystemExit('Customer-safe file list anchor missing')
          old_retired = 'for (const retired of ["$99/battery", "$99 per battery", "Included Freight"]) {'
          new_retired = 'for (const retired of ["$99/battery", "$99 per battery", "Included Freight", "Included Honolulu freight"]) {'
          if old_retired in src:
              src = src.replace(old_retired, new_retired, 1)
          elif new_retired not in src:
              raise SystemExit('Retired freight claim list anchor missing')
          qa.write_text(src)
          PY

          git rm .github/workflows/web-com-0905-01-hawaii-cleanup.yml

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "deployment/qa/web-com-commerce-regression.mjs site/store-checkout-server.js site/store-checkout.js "
          ! grep -Fq 'customerFreightPerBatteryCents:Number(rule?.rateCents||9900)' site/store-checkout-server.js
          ! grep -Fq 'Included Honolulu freight' site/store-checkout.js
          ! grep -Fq '9900' site/store-checkout-server.js

      - name: Commit repair and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Elevation UpScales Automation"
          git config user.email "casey@elevationupscales.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "Remove retired Hawaii freight fallback"
          git push origin HEAD:repair/web-com-0905-01-hawaii-freight
