name: SEO Sweep Audit

on:
  push:
    paths:
      - ".github/workflows/seo-sweep-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            site
          sparse-checkout-cone-mode: true

      - name: Audit public HTML metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          root=Path("site")
          sitemap=(root/"sitemap.xml").read_text(errors="ignore")
          files=sorted(root.rglob("*.html"))
          skip_parts={"admin","mission-control","command-center","technician","checkout","api"}
          rows=[]
          for p in files:
              rel=p.as_posix()
              if any(part in skip_parts for part in p.parts):
                  continue
              html=p.read_text(errors="ignore")
              title=bool(re.search(r"<title>[^<]{4,}</title>",html,re.I))
              desc=bool(re.search(r'<meta[^>]+name=["\']description["\']',html,re.I))
              canon=bool(re.search(r'<link[^>]+rel=["\']canonical["\']',html,re.I) or re.search(r'<link[^>]+href=["\'][^"\']+["\'][^>]+rel=["\']canonical["\']',html,re.I))
              h1=bool(re.search(r"<h1\b",html,re.I))
              og=bool(re.search(r'property=["\']og:title["\']',html,re.I))
              schema="application/ld+json" in html
              if rel=="site/index.html": route="/"
              elif p.name=="index.html": route="/"+str(p.parent.relative_to(root)).replace("\\","/")
              else: route="/"+str(p.relative_to(root).with_suffix("")).replace("\\","/")
              inmap=f"<loc>https://elevationupscales.com{route}</loc>" in sitemap
              missing=[k for k,v in [("title",title),("desc",desc),("canonical",canon),("h1",h1),("og",og),("schema",schema)] if not v]
              if missing:
                  rows.append((rel,route,",".join(missing),inmap))
          print(f"SEO_AUDIT_FILES={len(files)}")
          print(f"SEO_AUDIT_GAPS={len(rows)}")
          for rel,route,missing,inmap in rows[:180]:
              print(f"GAP|{rel}|{route}|missing={missing}|sitemap={inmap}")
          PY
