name: One-Time Store Production Launch

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: one-time-store-production-launch
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[store-launch]') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Store launch candidate
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/_worker.js
          test -f site/worker-core.js
          test -f site/store.html
          test -f site/rv-store.html
          test -f site/checkout/index.html
          test -f site/store-checkout-server.js
          test -f site/store-checkout-routing.js
          test -f site/rv-checkout-routing.js
          test -f site/admin-store-orders.html
          grep -q '3.11.30-store-navigation-repair' site/_worker.js
          grep -q 'STORE_LIVE_CHECKOUT_ENABLED' site/store-checkout-server.js
          grep -q 'config?.environment === "live"' site/store-checkout-routing.js
          grep -q 'config?.liveCheckoutApproved === true' site/store-checkout-routing.js
          grep -q 'elevationupscales\\.com' site/rv-checkout-routing.js
          grep -q 'link.textContent = "Buy Now"' site/store-catalog-resilience.js
          grep -q 'window.EUS_VERIFIED_EBAY_CATALOG' site/rv-ebay-catalog.js
          ! test -f .github/workflows/patch-fourthwall-cent-price.yml
          ! test -f .github/workflows/patch-live-commerce-gate.yml
          ! test -f tmp-placeholder
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site; then
            echo 'Credential-like value found in source.'
            exit 1
          fi

      - name: Deploy Store release to Cloudflare Pages production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke production routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          smoke_routes() {
            local base="${1%/}"
            local route code
            for route in / /store /rv-store /start-a-project /marketplace /solar-project /admin-listings; do
              code=$(curl --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-smoke.html --write-out '%{http_code}' "${base}${route}" || true)
              if [[ "$code" != "200" ]]; then
                echo "Smoke failed: ${base}${route} -> ${code:-curl-error}"
                return 1
              fi
            done
            curl --silent --show-error --location --retry 8 --retry-all-errors "${base}/store" | grep -q 'Apparel Store'
            curl --silent --show-error --location --retry 8 --retry-all-errors "${base}/rv-store" | grep -q 'VERIFIED EBAY CATALOG'
          }
          deployment_base="${DEPLOYMENT_URL%/}"
          if ! smoke_routes "$deployment_base"; then
            sleep 8
            smoke_routes "$PRODUCTION_URL"
          fi
          # Public release guard: sandbox PayPal must not rewrite production Apparel links.
          curl --silent --show-error --location --retry 8 --retry-all-errors "${PRODUCTION_URL}/store-checkout-routing.js" | grep -q 'config?.environment === "live"'
          curl --silent --show-error --location --retry 8 --retry-all-errors "${PRODUCTION_URL}/rv-checkout-routing.js" | grep -q 'preserve the existing exact eBay Buy Now links'

      - name: Record launch receipt
        run: |
          echo '### Store production launch' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production route smoke: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel live-payment routing: environment-gated' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV direct checkout: held; exact eBay links preserved on production' >> "$GITHUB_STEP_SUMMARY"
