          newret='''  const lithiumReconciliation=products.filter(product=>product?.reconciliation?.inScope);const reconciliationSummary={total:lithiumReconciliation.length,KEEP:0,UPDATE:0,"EXCLUDE FROM PROMO":0,"REVIEW REQUIRED":0};for(const product of lithiumReconciliation){const action=clean(product?.reconciliation?.action,40)||"REVIEW REQUIRED";if(Object.prototype.hasOwnProperty.call(reconciliationSummary,action))reconciliationSummary[action]+=1;}\n  return{ok:true,mode:"READ ONLY",application:"Commerce Pricing & Supplier Catalog 2.0",generatedAt:new Date().toISOString(),elapsedMs:Date.now()-started,summary:{catalogProducts:products.length,published,actualLithium,dobaSourceRecords:dobaSource.count,dobaSourceMatched,missingAuthoritativeCost:missingCost,sourceCostMismatch,storedBelowProtectedFloor,promoFloorFailures,blockedProducts,reviewProducts,informationalProducts,cleanProducts,actionRequired:blockedProducts+reviewProducts,publishHold,draftProducts,shippingHold,shippingUnverified,missingSourceSnapshot,annotatedProducts,lithiumReconciliationCount:lithiumReconciliation.length,supplierCounts},reconciliationSummary,promotion:{active:Boolean(promotion.active),couponCode:promotion.couponCode,couponPercent:promotion.couponPercent,everydayMarkupPercent:promotion.everydayMarkupPercent,promoMarkupPercent:promotion.promoMarkupPercent},shippingInputs,lithiumReconciliation,products};'''
