ean(source?.upstreamSupplier,180),brand:clean(source?.brand,180),upstreamSupplierEvidence:source?.upstreamSupplier?"current_source_snapshot":"source_refresh_required",brandEvidence:source?.brand?"current_source_snapshot":"not_present_in_current_source"};\n    products.push({...product,actualLithiumBattery:actualBattery,batteryUnitsPerCatalogUnit:batteryUnitsPerCatalogUnit({...product,title:product.title}),authoritativeCostCents,costEvidence,sourceSnapshot:source,supplierIdentity,reconciliation,effectiveListPriceCents:Number(pricing.priceCents||product.catalogPriceCents),promotion:{active:Boolean(pricing?.promotion?.active),couponEligible:Boolean(pricing?.promotion?.couponEligible),couponCode:clean(pricing?.promotion?.couponCode,40),couponPercent:int(pricing?.promotion?.couponPercent,0),couponPriceCents,pricingMode:clean(pricing?.promotion?.pricingMode,80),protectedNormalFloorCents,protectedPromoFloorCents,shippingDiscounted:Boolean(pricing?.promotion?.shippingDiscounted)},merchandiseMargin:{listGrossCents:Math.max(0,Number(pricing.priceCents||0)-authoritativeCostCents),listGrossPercent:marginPercent(Number(pricing.priceCents||0),authoritativeCostCents),promoGrossCents:Math.max(0,couponPriceCents-authoritativeCostCents),promoGrossPercent:marginPercent(couponPriceCents,authoritativeCostCents)},reviewNoteClass:reviewNote.kind,severity,blockers,reviews,advisories,flags:[...blockers,...reviews,...advisories]});'''
          s=replace_once(s,old,new,'runtime row')
