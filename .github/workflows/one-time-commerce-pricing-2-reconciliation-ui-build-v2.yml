name: One-Time Commerce Pricing 2 Reconciliation UI Build V2
on:
  push:
    branches:
      - runner/commerce-pricing-2-reconciliation-ui-build-v2-2026-09-03
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/commerce-pricing-supplier-catalog-2-0-2026-09-03
          fetch-depth: 0
      - name: Exact source gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c846737c90f57b5ebc3c920b815880bd11100490"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "b73b166e5887e86abb6044ccbdeb4e9c293cbe65"
          git merge-base --is-ancestor 31d2bb33d5dabd94ac007ff8ebcdc3b98a3dbfcf HEAD
      - name: Patch permanent read-only reconciliation UI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} marker missing')
              return text.replace(old,new,1)

          runtime=Path('site/commerce-pricing-runtime.js')
          s=runtime.read_text()
          old='''    const supplierLabel=product.supplier||product.sourceType||"other";supplierCounts[supplierLabel]=(supplierCounts[supplierLabel]||0)+1;\n    products.push({...product,actualLithiumBattery:actualBattery,batteryUnitsPerCatalogUnit:batteryUnitsPerCatalogUnit({...product,title:product.title}),authoritativeCostCents,costEvidence,sourceSnapshot:source,effectiveListPriceCents:Number(pricing.priceCents||product.catalogPriceCents),promotion:{active:Boolean(pricing?.promotion?.active),couponEligible:Boolean(pricing?.promotion?.couponEligible),couponCode:clean(pricing?.promotion?.couponCode,40),couponPercent:int(pricing?.promotion?.couponPercent,0),couponPriceCents,pricingMode:clean(pricing?.promotion?.pricingMode,80),protectedNormalFloorCents,protectedPromoFloorCents,shippingDiscounted:Boolean(pricing?.promotion?.shippingDiscounted)},merchandiseMargin:{listGrossCents:Math.max(0,Number(pricing.priceCents||0)-authoritativeCostCents),listGrossPercent:marginPercent(Number(pricing.priceCents||0),authoritativeCostCents),promoGrossCents:Math.max(0,couponPriceCents-authoritativeCostCents),promoGrossPercent:marginPercent(couponPriceCents,authoritativeCostCents)},reviewNoteClass:reviewNote.kind,severity,blockers,reviews,advisories,flags:[...blockers,...reviews,...advisories]});'''
