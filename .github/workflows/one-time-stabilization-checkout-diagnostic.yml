name: One-Time Stabilization Checkout Diagnostic

on:
  push:
    branches:
      - stabilization/elevation-4-3-2026-08-29

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose stabilization checkout preview'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect checkout preview matrix
        shell: bash
        run: |
          set -euo pipefail
          base="https://stabilization-preview.elevationupscales.pages.dev"
          origin="$base"
          rv='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"CO"}}'
          hi='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"shipping":{"state":"HI"}}'
          zero='{"source":"rv","id":"cat-b99c2b06-2dfe-4241-9bff-62825d874d07","quantity":1,"shipping":{"state":"CO"}}'
          apparel='{"source":"apparel","id":"elevation-upscales-true-grit-trucker-hat","quantity":1}'
          check_post() {
            name="$1"; payload="$2"; origin_value="$3"
            if [ "$origin_value" = "NONE" ]; then
              code=$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' -H 'Content-Type: application/json' --data "$payload" "${base}/api/store-checkout/quote" || true)
            else
              code=$(curl -sS -o "/tmp/${name}.json" -w '%{http_code}' -H "Origin: $origin_value" -H 'Content-Type: application/json' --data "$payload" "${base}/api/store-checkout/quote" || true)
            fi
            echo "${name} -> ${code}"
            cat "/tmp/${name}.json"; echo
          }
          check_post rv "$rv" "$origin"
          check_post hi "$hi" "$origin"
          check_post zero "$zero" "$origin"
          check_post apparel "$apparel" "$origin"
          check_post invalid_source '{"source":"bogus","id":"x","quantity":1}' "$origin"
          check_post invalid_qty '{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":99,"shipping":{"state":"CO"}}' "$origin"
          check_post missing_origin "$rv" NONE
          check_post foreign_origin "$rv" 'https://example.com'
          bad_email='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"customer":{"email":"bad"},"shipping":{"fullName":"Test User","address1":"1 Main St","city":"Denver","state":"CO","postalCode":"80202","countryCode":"US"}}'
          bad_address='{"source":"rv","id":"cat-8449060f-d3fc-4dd0-ac94-141092454544","quantity":1,"customer":{"email":"test@example.com"},"shipping":{"fullName":"Test User","address1":"1 Main St","city":"Denver","state":"COLORADO","postalCode":"x","countryCode":"US"}}'
          for item in bad_email bad_address; do
            payload="${!item}"
            code=$(curl -sS -o "/tmp/${item}.json" -w '%{http_code}' -H "Origin: $origin" -H 'Content-Type: application/json' --data "$payload" "${base}/api/store-checkout/orders" || true)
            echo "${item} -> ${code}"; cat "/tmp/${item}.json"; echo
          done
          code=$(curl -sS -o /tmp/config.json -w '%{http_code}' "${base}/api/store-checkout/config" || true)
          echo "config -> $code"; cat /tmp/config.json; echo
