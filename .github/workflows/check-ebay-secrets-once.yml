name: One-time eBay credential presence check

on:
  push:
    branches: [main]
    paths:
      - .github/ebay-secret-check-trigger.txt

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${EBAY_CLIENT_ID:-}" ]; then echo "EBAY_CLIENT_ID_PRESENT=true"; else echo "EBAY_CLIENT_ID_PRESENT=false"; fi
          if [ -n "${EBAY_CLIENT_SECRET:-}" ]; then echo "EBAY_CLIENT_SECRET_PRESENT=true"; else echo "EBAY_CLIENT_SECRET_PRESENT=false"; fi
          if [ -n "${EBAY_CLIENT_ID:-}" ] && [ -n "${EBAY_CLIENT_SECRET:-}" ]; then
            echo "EBAY_API_CREDENTIAL_PAIR_PRESENT=true"
          else
            echo "EBAY_API_CREDENTIAL_PAIR_PRESENT=false"
          fi
