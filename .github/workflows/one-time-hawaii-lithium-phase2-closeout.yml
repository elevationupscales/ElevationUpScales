name: One-Time Hawaii Lithium Phase 2 Closeout

on:
  push:
    branches:
      - release/hawaii-lithium-phase2-controls

permissions:
  contents: write

jobs:
  apply-closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/hawaii-lithium-phase2-controls
          fetch-depth: 0
      - name: Apply Phase 2 closeout bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase2.b64 <<'B64EOF'
...