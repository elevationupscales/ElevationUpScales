name: STOREFRONT-CONSISTENCY-0906-02

on:
  push:
    branches:
      - work/storefront-consistency-cleanup-0906-02
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: storefront-consistency-0906-02-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/work/storefront-consistency-cleanup-0906-02'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9b9f8c62378b2a085e9849dca8e7fd53c04bfa28 HEAD
          npm run qa
          ! grep -Rqi 'Licensed Lithium Battery Retailer' site --include='*.html'
          ! grep -q 'data-lithium-retailer\|data-lithium-freight-link' site/product.html
          grep -q 'Authorized SOK Energy Dealer' site/terms.html
          grep -q 'Marketplace listings are independent from Elevation-owned catalog inventory' site/marketplace.html
          grep -q 'reference-global-shell' site/site-shell.js
          git diff --check
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=storefront-consistency-0906-02-pre
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser storefront verification
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE.replace(/\/$/,'');
          const browser=await chromium.launch({headless:true});
          async function shell(route,width=1280,height=900){
            const page=await browser.newPage({viewport:{width,height}});
            await page.goto(`${base}${route}`,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('.reference-header-wordmark',{timeout:15000});
            const state=await page.evaluate(()=>({
              groups:[...document.querySelectorAll('.eus-nav>details>summary')].map(x=>x.textContent.trim().split(/\s+/)[0]),
              legacy:/Apparel Store|Collector Series|Honolulu pickup pricing/.test(document.querySelector('.eus-header')?.textContent||''),
              terms:Boolean(document.querySelector('.site-footer a[href="/terms"]')),
              overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
            }));
            if(state.groups.join(',')!=='Power,Shop,Projects,Services,Company') throw new Error(`${route}: inconsistent groups ${state.groups}`);
            if(state.legacy||!state.terms||state.overflow>1) throw new Error(`${route}: shell regression ${JSON.stringify(state)}`);
            await page.close();
          }
          for(const route of ['/rv-store','/marketplace','/terms','/solar-services']) await shell(route);
          for(const route of ['/rv-store','/marketplace','/product?id=EUS-CAT-B9BEAF9D&store=rv']) await shell(route,390,844);
          const page=await browser.newPage({viewport:{width:1280,height:900}});
          async function product(url,lithium){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForFunction(()=>document.querySelector('[data-product-detail]')?.hidden===false,null,{timeout:20000});
            const state=await page.evaluate(()=>({trust:Boolean(document.querySelector('[data-lithium-retailer]:not([hidden])')),freight:Boolean(document.querySelector('[data-lithium-freight-link]:not([hidden])')),unavailable:document.querySelector('[data-product-unavailable]')?.hidden}));
            if(state.unavailable!==true||state.trust!==lithium||state.freight!==lithium) throw new Error(`product category leak ${JSON.stringify(state)}`);
          }
          await product(`${base}/product?id=sok-sk12v100pc&store=lithium`,true);
          await product(`${base}/product?id=EUS-CAT-B9BEAF9D&store=rv`,false);
          await browser.close();
          NODE
      - name: Preview smoke
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          curl -fsSL "$base/terms" -o /tmp/terms.html
          ! grep -q 'Licensed Lithium Battery Retailer' /tmp/terms.html
          grep -q 'Authorized SOK Energy Dealer' /tmp/terms.html
          curl -fsSL "$base/product?id=EUS-CAT-B9BEAF9D&store=rv" -o /tmp/product.html
          ! grep -q 'data-lithium-retailer\|data-lithium-freight-link' /tmp/product.html
          npm run qa:preview -- "$base"
      - name: Preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### STOREFRONT CONSISTENCY PREVIEW — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production unchanged.' >> "$GITHUB_STEP_SUMMARY"

  production:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'deploy(storefront-cleanup-0906-02)')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Revalidate production source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          npm run qa
          ! grep -Rqi 'Licensed Lithium Battery Retailer' site --include='*.html'
          ! grep -q 'data-lithium-retailer\|data-lithium-freight-link' site/product.html
          grep -q 'Marketplace listings are independent from Elevation-owned catalog inventory' site/marketplace.html
          git diff --check
      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployment and public domain
        shell: bash
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          for base in "${DEPLOYMENT%/}" https://elevationupscales.com; do
            for route in / /terms /rv-store /marketplace /product?id=EUS-CAT-B9BEAF9D\&store=rv /lithium-batteries /sok-batteries /hawaii-lithium-batteries /shipping-logistics-services /start-a-project /solar-project; do
              code=$(curl -sS -L --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
              echo "$base$route=$code"
              test "$code" = "200"
            done
            curl -fsSL "$base/terms" -o /tmp/terms.html
            ! grep -q 'Licensed Lithium Battery Retailer' /tmp/terms.html
          done
          admin_code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' "${DEPLOYMENT%/}/api/admin/overview" || true)
          runtime_code=$(curl -sS -o /tmp/runtime.txt -w '%{http_code}' "${DEPLOYMENT%/}/sync-admin-runtime.js" || true)
          test "$admin_code" = "401"
          test "$runtime_code" = "404"
      - name: Production receipt
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### STOREFRONT CONSISTENCY PRODUCTION — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: $DEPLOYMENT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Public domain verified.' >> "$GITHUB_STEP_SUMMARY"
