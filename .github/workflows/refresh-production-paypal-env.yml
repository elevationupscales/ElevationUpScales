name: Refresh Production PayPal Environment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[refresh-paypal-env]') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Deploy unchanged site with refreshed Cloudflare production bindings
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify refreshed PayPal environment safely
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl --silent --show-error --fail --location --retry 8 --retry-all-errors --retry-delay 2 \
            https://elevationupscales.com/api/store-checkout/config > /tmp/store-config.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('/tmp/store-config.json', 'utf8'));
          const safe = {
            environment: c.environment,
            credentialsConfigured: c.credentialsConfigured === true,
            checkoutEnabled: c.checkoutEnabled === true,
            liveCheckoutApproved: c.liveCheckoutApproved === true,
          };
          console.log(JSON.stringify(safe));
          if (safe.environment !== 'live') throw new Error('PAYPAL_ENV is not live after redeploy');
          if (!safe.credentialsConfigured) throw new Error('Live PayPal credentials are not configured after redeploy');
          if (safe.checkoutEnabled) throw new Error('Checkout unexpectedly enabled before final approval flag');
          if (safe.liveCheckoutApproved) throw new Error('Approval flag unexpectedly enabled');
          NODE
      - name: Record refresh receipt
        run: |
          echo '### PayPal production environment refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Live credentials: detected' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live checkout approval: still locked' >> "$GITHUB_STEP_SUMMARY"
