name: Deploy Elevation UpScales

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose preview first; use production only after preview approval
        required: true
        default: preview
        type: choice
        options: [preview, production]
      production_confirmation:
        description: For production only, type DEPLOY
        required: false
        default: ""
        type: string
  push:
    branches:
      - production-deploy

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-pages-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.target.outputs.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Resolve deployment target
        id: target
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "production-deploy"
            echo 'target=production' >> "$GITHUB_OUTPUT"
          else
            case "$REQUESTED_TARGET" in
              preview|production) echo "target=$REQUESTED_TARGET" >> "$GITHUB_OUTPUT" ;;
              *) echo "Unsupported deployment target: $REQUESTED_TARGET" >&2; exit 1 ;;
            esac
          fi
      - name: Require production authorization
        if: ${{ steps.target.outputs.target == 'production' }}
        env:
          CONFIRM: ${{ inputs.production_confirmation }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_NAME" = "production-deploy"
            test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          else
            test "$(printf '%s' "$CONFIRM" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')" = "DEPLOY"
          fi
      - name: Run canonical production QA
        run: |
          set -euo pipefail
          npm run qa
          git diff --check
      - name: Block secrets and oversized artifacts
        run: |
          set -euo pipefail
          npm run qa:secrets
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ needs.validate.outputs.target == 'production' && 'main' || 'github-preview' }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke deployed application
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          npm run qa:preview -- "${BASE%/}"
      - name: Smoke canonical production domain
        if: ${{ needs.validate.outputs.target == 'production' }}
        run: |
          set -euo pipefail
          sleep 10
          npm run qa:preview -- https://elevationupscales.com
      - name: Receipt
        run: |
          echo '### Elevation Pages deployment — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Target: ${{ needs.validate.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.validate.outputs.target }}" = "production" ]; then
            echo 'Canonical: https://elevationupscales.com — PASS' >> "$GITHUB_STEP_SUMMARY"
          fi
