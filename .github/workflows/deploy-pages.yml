name: Deploy Elevation UpScales

on:
  workflow_dispatch:
    inputs:
      target:
        description: Choose preview first; use production only after approval
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-pages-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate deployment source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required production files
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/_worker.js
          test -f site/_worker_core.js
          test -f site/ebay-inventory-sync.js
          test -f site/_routes.json
          test -f site/_headers

          # Split Worker: storefront sync wrapper delegates protected systems to core.
          grep -q 'import core from "./_worker_core.js"' site/_worker.js
          grep -q 'handleStoreInventory' site/_worker.js
          grep -q 'url.pathname === "/api/store-inventory"' site/_worker.js
          grep -q 'return core.fetch(request, env, ctx)' site/_worker.js
          grep -q '3.11.31-ebay-inventory-sync' site/ebay-inventory-sync.js
          grep -q 'const SELLER = "elevationupscalesshop"' site/ebay-inventory-sync.js
          grep -q 'ebay-auto-sync-v1' site/ebay-inventory-sync.js
          grep -q 'eus_inventory_sync_state' site/ebay-inventory-sync.js
          grep -q 'EBAY_CLIENT_ID' site/ebay-inventory-sync.js
          grep -q 'EBAY_CLIENT_SECRET' site/ebay-inventory-sync.js
          grep -q 'fromPublic' site/ebay-inventory-sync.js
          grep -q 'protectedManual' site/ebay-inventory-sync.js

          # Preserve accepted Solar lineage.
          test -f site/solar-visual-guide.css
          grep -q 'data-jump="panels"' site/solar-project.html
          grep -q 'data-jump="services"' site/solar-project.html
          grep -q 'Stage 1 of 7' site/solar-project.html
          cmp -s site/solar-project.html site/solar-project/index.html

          # Split-store navigation + v3.11.31 automatic inventory synchronization.
          test -f site/store.html
          test -f site/rv-store.html
          test -f site/rv-store.css
          test -f site/rv-store.js
          grep -q 'Apparel Store' site/store.html
          grep -q 'RV & Outdoor Store' site/store.html
          grep -q 'href="/rv-store"' site/store.html
          grep -q 'href="/rv-store"' site/rv-store.html
          grep -q '/rv-store' site/site-shell.js
          grep -q 'imageUrl' site/rv-store.js
          grep -q 'hero-galaxy-rv.webp' site/rv-store.html
          grep -q 'Automatic eBay sync' site/rv-store.html
          grep -q 'shopping_list' site/rv-store.js
          test -f .github/workflows/sync-ebay-inventory.yml
          test "$(grep -o 'class="market-product-card"' site/store.html | wc -l)" -ge 10

          # Preserve Store analytics + Inventory foundation in delegated core.
          test -f site/store-channel.css
          test -f site/store-channel-analytics.js
          grep -q '3.11.28-native-rv-catalog' site/store-channel-analytics.js
          test -f site/admin-inventory.html
          test -f site/admin-inventory.css
          test -f site/admin-inventory.js
          grep -q '/api/admin/inventory' site/_worker_core.js
          grep -q 'eus_inventory_items' site/_worker_core.js
          grep -q 'shopping_list' site/_worker_core.js
          grep -q 'admin-inventory.html' site/admin-listings.html

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

      - name: Enforce Cloudflare Pages file limits
        shell: bash
        run: |
          set -euo pipefail
          file_count=$(find site -type f | wc -l)
          test "$file_count" -le 20000
          oversized=$(find site -type f -size +25M -print -quit)
          test -z "$oversized"

      - name: Block local secrets and release archives
        shell: bash
        run: |
          set -euo pipefail
          blocked=$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)
          test -z "$blocked"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site; then
            echo "A credential-like value was found in the website source."
            exit 1
          fi

  deploy-preview:
    name: Deploy preview
    needs: validate
    if: ${{ inputs.target == 'preview' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=github-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record preview URL
        run: |
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: validate
    if: ${{ inputs.target == 'production' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Deploy approved production source
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record production deployment URL
        run: |
          echo "### Cloudflare production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
