name: One-Time RV Map Image Refresh

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, '[rv-map-image-refresh]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Refresh verified Doba map with checkout images
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          cat > /tmp/doba-map.json <<'JSON'
          {
            "168646573395":{"name":"Inflatable Movie Screen 20FT Inflatable Projector Screen for outside with 350W","priceCents":13500,"shippingCents":0,"shippingVerified":true,"itemNo":"D0102HQ4KJV","skuId":"D0102HQ4KJV-861319","imageUrl":"https://image.doba.com/dg7-aBOYSNRpqCJH/dspic.jpg","ebayUrl":"https://www.ebay.com/itm/168646573395"},
            "168631043193":{"name":"VEVOR Super Bright Rechargeable 200,000 Lumens LED Spotlight for Outdoor Use","priceCents":3498,"shippingCents":0,"shippingVerified":true,"itemNo":"D010277TCB2","skuId":"D010277TCB2-470279","imageUrl":"https://img.vevorstatic.com/us/DGYWSJGDXDTKA7G1TV9/goods_img_big-v1/rechargeable-spotlight-m100-1.2.jpg?format=webp&timestamp=1731314531000","ebayUrl":"https://www.ebay.com/itm/168631043193"},
            "168631039073":{"name":"8L Hot Water Heater Tankless Instant Boiler Outdoor","priceCents":19433,"shippingCents":0,"shippingVerified":true,"itemNo":"D01027HXHHA","skuId":"D01027HXHHA-472564","imageUrl":"https://utedusjer.no/cdn/shop/products/8liter-min.jpg?v=1654023433&width=1024","ebayUrl":"https://www.ebay.com/itm/168631039073"},
            "168631036536":{"name":"VEVOR Portable Walk-In Greenhouse 20' x 10' Hot House with Steel Hoops & Windows","priceCents":13455,"shippingCents":0,"shippingVerified":true,"itemNo":"D0102HRMZW6","skuId":"D0102HRMZW6-224407","imageUrl":"https://image.vevor.com/us/YDSDWS20107FTYBYXV0/original_img-v3/tunnel-greenhouse-m100-1.1.jpg?timestamp=1670940797747","ebayUrl":"https://www.ebay.com/itm/168631036536"},
            "168631025949":{"name":"12V Electric Scissor Car Jack & Impact Wrench for Easy Tire Changes","priceCents":5712,"shippingCents":0,"shippingVerified":true,"itemNo":"D0102HGWKXG","skuId":"D0102HGWKXG-682100","imageUrl":"https://s.alicdn.com/@sc04/kf/H90a98af76a91418698eb173453b5254e8/Factory-Price-Tool-Car-12-Volt-2T-35CM-Scissor-Jack-Electric-Wrench-Suit-with-Hydraulic-Repair-Kit-for-Suv.jpg","ebayUrl":"https://www.ebay.com/itm/168631025949"},
            "168631017090":{"name":"VEVOR High-Performance 12V Water Diaphragm Pump - 5.5 GPM & 70 PSI Adjustable","priceCents":7999,"shippingCents":0,"shippingVerified":true,"itemNo":"D0102H2V6BY","skuId":"D0102H2V6BY-183069","imageUrl":"https://i5.walmartimages.com/seo/12V-DC-Water-Diaphragm-Pump-5-5-GPM-Flow-70-PSI-Adjustable-Pressure-1-2-Inch-MNPT-Self-Priming-Sprayer-Pump-Pressure-Switch-RV-Camper-Marine-Boat-Law_40f43dd1-549d-4fdc-8f7d-09eb9ce7335e.284e7e762ebd053ff57d3a6a81651e3b.jpeg","ebayUrl":"https://www.ebay.com/itm/168631017090"},
            "168631006501":{"name":"VEVOR Heavy-Duty 5.3 Gallon Metal Fuel Can with Spout & Comfort Handle","priceCents":3676,"shippingCents":0,"shippingVerified":true,"itemNo":"D01027HX25W","skuId":"D01027HX25W-351940","imageUrl":"https://mobileimages.lowes.com/productimages/a4c0c39c-7115-4e98-9513-904d908abebf/63612904.jpg","ebayUrl":"https://www.ebay.com/itm/168631006501"},
            "168631001484":{"name":"Vevor Portable 5 Gallon Fuel Container with Spout for Cars and Motorcycles, Red","priceCents":6500,"shippingCents":0,"shippingVerified":true,"itemNo":"D01027HHGCG","skuId":"D01027HHGCG-645458","imageUrl":"https://img.vevorstatic.com/fr%2FSLBXSYXJYK1JNR1TZ001V0%2Fgoods_img-v1%2Ffuel-container-m100-11.jpg?format=webp&timestamp=1761184923000","ebayUrl":"https://www.ebay.com/itm/168631001484"}
          }
          JSON
          cat /tmp/doba-map.json | npx wrangler pages secret put DOBA_PRODUCT_MAP_JSON --project-name="$CLOUDFLARE_PAGES_PROJECT"

      - name: Deploy refreshed production environment
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify complete mapped quote
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 2
          code=$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/q.json -w '%{http_code}' -X POST "${PRODUCTION_URL}/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/checkout/' -H 'Accept: application/json' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true)
          cat /tmp/q.json
          test "$code" = "200"
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/q.json','utf8'));
          if(q.ok!==true||q.totalCents!==6500||q.shippingCents!==0||!/^https:\/\//.test(q.productImage||'')) throw new Error(`Incomplete mapped quote: ${JSON.stringify(q)}`);
          console.log('mapped_quote_with_image=PASS');
          NODE

          curl -sS -L --connect-timeout 5 --max-time 15 --fail "${PRODUCTION_URL}/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true) throw new Error('Apparel live checkout regressed');
          console.log('apparel_checkout=PASS');
          NODE

      - name: Receipt
        run: |
          echo '### RV map image completion' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Mapped RV quote image: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel live checkout: PASS' >> "$GITHUB_STEP_SUMMARY"
