name: One-time Web V2 SOK product cleanup finisher

on:
  push:
    branches:
      - work/web-v2-sok-product-image-cleanup-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-sok-product-asset-import.yml

permissions:
  contents: write

jobs:
  finish-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-sok-product-image-cleanup-2026-09-13
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Apply bounded cleanup and verify tests
        run: |
          set -euo pipefail
          python deployment/v2/one_time_sok_product_image_cleanup.py
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check

      - name: Commit bounded cleanup and remove one-time helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-sok-product-asset-import.yml
          git rm deployment/v2/one_time_sok_product_image_cleanup.py
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/client.js \
                  apps/web-v2/src/index.js \
                  apps/web-v2/src/shell.js \
                  apps/web-v2/src/sok-product-assets.js \
                  apps/web-v2/src/sok-product-merchandising-styles.js \
                  apps/web-v2/test/shell.test.mjs \
                  operations/vendor-project-sources/SOK_PRODUCT_IMAGE_PROVENANCE_2026-09-13.md
          git commit -m 'Web V2: clean SOK product showcase imagery'
          git push origin HEAD:work/web-v2-sok-product-image-cleanup-2026-09-13
