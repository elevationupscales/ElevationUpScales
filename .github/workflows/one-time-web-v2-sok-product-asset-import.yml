name: One-time Web V2 SOK product cleanup finisher

on:
  push:
    branches:
      - work/web-v2-sok-product-image-cleanup-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-sok-product-asset-import.yml

permissions:
  contents: write

jobs:
  finish-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-sok-product-image-cleanup-2026-09-13
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Apply bounded SOK merchandising cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -f site/assets/brands/sok/sk12v100pc/official-clean.png
          test -f site/assets/brands/sok/sk48v100n/official-clean.png
          test -f apps/web-v2/src/sok-product-assets.js
          python - <<'PY'
          from pathlib import Path

          def must_replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # Remove the temporary legacy-production promotional-image override.
          must_replace(
              'apps/web-v2/src/client.js',
              "\n  const hero48 = document.querySelector('.hero-product-48 img');\n  if (hero48) hero48.src = 'https://elevationupscales.com/assets/brands/sok/sk48v100n/48v-battery-cabinet/hero.webp?v=20260910-1';\n",
              "\n"
          )

          # Point every Web V2 homepage/storefront SOK presentation slot at the localized official clean assets.
          shell = Path('apps/web-v2/src/shell.js')
          text = shell.read_text()
          replacements = {
              "asset('/assets/brands/sok/sk12v100pc/hero.png')": "'/assets/brands/sok/sk12v100pc/official-clean.png'",
              "asset('/assets/brands/sok/sk48v100n/hero.jpg')": "'/assets/brands/sok/sk48v100n/official-clean.png'",
              "asset('/assets/brands/sok/sk12v100pc/home-hero.webp?v=20260910-1')": "'/assets/brands/sok/sk12v100pc/official-clean.png'",
              "asset('/assets/brands/sok/sk48v100n/home-crop.webp?v=20260910-1')": "'/assets/brands/sok/sk48v100n/official-clean.png'",
          }
          expected = {
              "asset('/assets/brands/sok/sk12v100pc/hero.png')": 1,
              "asset('/assets/brands/sok/sk48v100n/hero.jpg')": 1,
              "asset('/assets/brands/sok/sk12v100pc/home-hero.webp?v=20260910-1')": 2,
              "asset('/assets/brands/sok/sk48v100n/home-crop.webp?v=20260910-1')": 2,
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != expected[old]:
                  raise SystemExit(f'shell.js: expected {expected[old]} occurrences, found {count}: {old}')
              text = text.replace(old, new)
          shell.write_text(text)

          # Record exact localized-byte provenance in the bundled source module comment.
          must_replace(
              'apps/web-v2/src/sok-product-assets.js',
              'operations/vendor-project-sources/SOK_PROJECT_SOURCE.md',
              'operations/vendor-project-sources/SOK_PRODUCT_IMAGE_PROVENANCE_2026-09-13.md'
          )

          # Add a narrow merchandising layer after the existing production-fidelity CSS.
          Path('apps/web-v2/src/sok-product-merchandising-styles.js').write_text(r'''export const sokProductMerchandisingStyles = `
/* Issue #185 — clean official SOK product photography only. No commerce authority lives here. */
.reference-storefront-home .hero-product-12 img,
.reference-storefront-home .hero-product-48 img{
  width:calc(100% - 12px);
  height:220px;
  max-height:none;
  margin:0 0 50px;
  padding:14px;
  box-sizing:border-box;
  object-fit:contain;
  object-position:center;
  border:1px solid rgba(33,204,239,.22);
  border-radius:8px;
  background:#f3f5f5;
  filter:drop-shadow(0 18px 24px rgba(0,0,0,.38));
}
.reference-storefront-home .product-card-horizontal .product-image{
  background:#f3f5f5;
}
.reference-storefront-home .product-card-horizontal .product-image img,
.reference-storefront-home .product-card-horizontal:nth-child(2) .product-image img{
  width:100%;
  height:220px;
  max-height:none;
  padding:18px;
  box-sizing:border-box;
  object-fit:contain;
  object-position:center;
}
.reference-storefront-home .home-product-card__image img[src*="/assets/brands/sok/"]{
  padding:14px;
  box-sizing:border-box;
  object-fit:contain;
  object-position:center;
}
@media(max-width:920px){
  .reference-storefront-home .hero-product-12 img,
  .reference-storefront-home .hero-product-48 img{
    height:150px;
    margin-bottom:34px;
    padding:10px;
  }
}
@media(max-width:680px){
  .reference-storefront-home .hero-product-12 img,
  .reference-storefront-home .hero-product-48 img{
    height:140px;
    margin-bottom:42px;
    padding:9px;
  }
  .reference-storefront-home .product-card-horizontal .product-image img,
  .reference-storefront-home .product-card-horizontal:nth-child(2) .product-image img{
    height:205px;
    padding:16px;
  }
}
`;
''')

          # Bundle the exact localized PNG bytes behind stable same-origin Web V2 asset paths.
          index = Path('apps/web-v2/src/index.js')
          text = index.read_text()
          anchor = "import { homeFidelityStyles } from './home-fidelity-styles.js';\n"
          addition = anchor + "import { sokProductMerchandisingStyles } from './sok-product-merchandising-styles.js';\nimport { SOK_SK12V100PC_PNG_BASE64, SOK_SK48V100N_PNG_BASE64 } from './sok-product-assets.js';\n"
          if text.count(anchor) != 1:
              raise SystemExit('index.js: home fidelity import anchor mismatch')
          text = text.replace(anchor, addition)

          response_anchor = "};\n\nfunction response(body, init = {}) {"
          asset_helper = """};

const SOK_PRODUCT_IMAGE_ASSETS = new Map([
  ['/assets/brands/sok/sk12v100pc/official-clean.png', SOK_SK12V100PC_PNG_BASE64],
  ['/assets/brands/sok/sk48v100n/official-clean.png', SOK_SK48V100N_PNG_BASE64]
]);

function decodeBase64(encoded) {
  const raw = atob(encoded);
  const bytes = new Uint8Array(raw.length);
  for (let index = 0; index < raw.length; index += 1) bytes[index] = raw.charCodeAt(index);
  return bytes;
}

function response(body, init = {}) {"""
          if text.count(response_anchor) != 1:
              raise SystemExit('index.js: response anchor mismatch')
          text = text.replace(response_anchor, asset_helper)

          css_old = "return response(`${styles}\\n${navStyles}\\n${catalogStyles}\\n${cartStyles}\\n${checkoutStyles}\\n${homeFidelityStyles}`, { headers: { 'Content-Type': 'text/css; charset=utf-8', 'Cache-Control': 'public, max-age=300' } });"
          css_new = "return response(`${styles}\\n${navStyles}\\n${catalogStyles}\\n${cartStyles}\\n${checkoutStyles}\\n${homeFidelityStyles}\\n${sokProductMerchandisingStyles}`, { headers: { 'Content-Type': 'text/css; charset=utf-8', 'Cache-Control': 'public, max-age=300' } });"
          if text.count(css_old) != 1:
              raise SystemExit('index.js: CSS response anchor mismatch')
          text = text.replace(css_old, css_new)

          route_anchor = "    if (url.pathname === '/assets/app.css') {\n"
          route_block = """    const sokProductImage = SOK_PRODUCT_IMAGE_ASSETS.get(url.pathname);
    if (sokProductImage) {
      return response(decodeBase64(sokProductImage), {
        headers: { 'Content-Type': 'image/png', 'Cache-Control': 'public, max-age=31536000, immutable' }
      });
    }

""" + route_anchor
          if text.count(route_anchor) != 1:
              raise SystemExit('index.js: asset route anchor mismatch')
          text = text.replace(route_anchor, route_block)
          index.write_text(text)

          # Update regression assertions from legacy/promo media to clean localized product photography.
          tests = Path('apps/web-v2/test/shell.test.mjs')
          text = tests.read_text()
          old = "  assert.match(body, /sk12v100pc\\/home-hero\\.webp/);\n  assert.match(body, /sk48v100n\\/home-crop\\.webp/);"
          new = "  assert.match(body, /sk12v100pc\\/official-clean\\.png/);\n  assert.match(body, /sk48v100n\\/official-clean\\.png/);\n  assert.doesNotMatch(body, /sk48v100n\\/(?:hero\\.jpg|home-crop\\.webp)|48v-battery-cabinet\\/hero\\.webp|Buy More,? Save More/i);"
          if text.count(old) != 1:
              raise SystemExit('shell.test.mjs: legacy SOK image assertions anchor mismatch')
          text = text.replace(old, new)
          insertion_anchor = "test('canonical catalog routes remain customer-safe', async () => {"
          regression = r'''test('SOK product showcase serves only the localized official clean photography', async () => {
  const expected = [
    ['/assets/brands/sok/sk12v100pc/official-clean.png', 'SK12V100PC'],
    ['/assets/brands/sok/sk48v100n/official-clean.png', 'SK48V100N']
  ];
  for (const [path] of expected) {
    const res = await request(path);
    assert.equal(res.status, 200, path);
    assert.match(res.headers.get('content-type') || '', /^image\/png/i, path);
    assert.match(res.headers.get('cache-control') || '', /immutable/, path);
    assert.ok((await res.arrayBuffer()).byteLength > 250000, `${path} should contain the localized official PNG bytes`);
  }

  const home = await (await request('/')).text();
  for (const [path, sku] of expected) {
    assert.match(home, new RegExp(path.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
    assert.match(home, new RegExp(`alt="[^"]*${sku}[^"]*"`, 'i'));
  }
  assert.doesNotMatch(home, /sk48v100n\/(?:hero\.jpg|home-crop\.webp)|48v-battery-cabinet\/hero\.webp|Buy More,? Save More/i);

  const js = await (await request('/assets/app.js')).text();
  assert.doesNotMatch(js, /48v-battery-cabinet|home-crop\.webp|Buy More,? Save More/i);

  const css = await (await request('/assets/app.css')).text();
  assert.match(css, /hero-product-12 img/);
  assert.match(css, /hero-product-48 img/);
  assert.match(css, /background:#f3f5f5/);
});

'''
          if text.count(insertion_anchor) != 1:
              raise SystemExit('shell.test.mjs: regression insertion anchor mismatch')
          text = text.replace(insertion_anchor, regression + insertion_anchor)
          tests.write_text(text)

          Path('operations/vendor-project-sources/SOK_PRODUCT_IMAGE_PROVENANCE_2026-09-13.md').write_text('''# SOK Product Image Provenance — 2026-09-13

**Tracking:** Issue #185 — NEXT RELEASE: replace SOK promo art with clean product showcase  
**Scope:** Web V2 product merchandising imagery only. No pricing, MAP, inventory, shipping, orderability, payment, supplier-authority, catalog-truth, or checkout changes.

## SK12V100PC — clear-case battery

- Official source supplied/approved by owner: `https://static.wixstatic.com/media/0fa809_0c4fccf4c42a4aa284c892d758ac3de7~mv2.png/v1/fit/w_960,h_960,q_90,enc_avif,quality_auto/0fa809_0c4fccf4c42a4aa284c892d758ac3de7~mv2.png`
- Localized repository asset: `site/assets/brands/sok/sk12v100pc/official-clean.png`
- Web V2 same-origin path: `/assets/brands/sok/sk12v100pc/official-clean.png`
- Retrieved: 2026-09-13
- Format/dimensions: PNG RGBA, 960 × 960
- SHA-256: `116bdccae768a163e90a9a1e6ffee45ae2a4efca77caeb47b14f68b4f73b0646`

## SK48V100N — 48V 100Ah server-rack LiFePO4 battery

- Official source supplied/approved by owner: `https://static.wixstatic.com/media/0fa809_a15f5f76c4b94fb1bf5e0c01daee4086~mv2.png/v1/fit/w_960,h_960,q_90,enc_avif,quality_auto/0fa809_a15f5f76c4b94fb1bf5e0c01daee4086~mv2.png`
- Localized repository asset: `site/assets/brands/sok/sk48v100n/official-clean.png`
- Web V2 same-origin path: `/assets/brands/sok/sk48v100n/official-clean.png`
- Retrieved: 2026-09-13
- Format/dimensions: PNG RGBA, 960 × 960
- SHA-256: `74c9e5dc78a949821ee4d674f2713da5310baa16b558b52fc4d265896007cc0a`

## Merchandising control

These are exact localized bytes from the owner-approved official SOK product-material URLs. No AI redraw, generated battery render, SKU substitution, embedded promotional pricing, or supplier sale-banner artwork is authorized. Web V2 presents the two SKUs as one clean product family using consistent neutral image containers, contain-fit, whitespace, padding, and card proportions.

The prior SK48V100N supplier promotional artwork (house/night scene and volume-pricing message) is not used by the Web V2 homepage/storefront presentation after this change. Existing commerce and supplier authority remain unchanged.
''')
          PY

          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
          git rm .github/workflows/one-time-web-v2-sok-product-asset-import.yml
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/client.js \
                  apps/web-v2/src/index.js \
                  apps/web-v2/src/shell.js \
                  apps/web-v2/src/sok-product-assets.js \
                  apps/web-v2/src/sok-product-merchandising-styles.js \
                  apps/web-v2/test/shell.test.mjs \
                  operations/vendor-project-sources/SOK_PRODUCT_IMAGE_PROVENANCE_2026-09-13.md
          git commit -m 'Web V2: clean SOK product showcase imagery'
          git push origin HEAD:work/web-v2-sok-product-image-cleanup-2026-09-13
