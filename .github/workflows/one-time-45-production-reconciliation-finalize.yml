name: One-Time 4.5 Production Reconciliation Finalize

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths:
      - .github/workflows/one-time-45-production-reconciliation-finalize.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/4.5-production-reconciliation-2026-09-02
          fetch-depth: 0

      - name: Apply production reconciliation patch
        run: |
          set -euo pipefail
          git merge-base --is-ancestor cc5f59fa8d7374d41d51ec56a0e91e20198cb612 HEAD
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(path, pattern, repl, label, flags=0):
              p=Path(path); s=p.read_text()
              out,n=re.subn(pattern,repl,s,count=1,flags=flags)
              if n != 1: raise SystemExit(f'{label}: replacement count={n}')
              p.write_text(out)

          # P1: authoritative shared Shop navigation wording.
          sub_once(
              'site/site-shell.js',
              re.escape('["/hawaii-lithium-batteries", "Hawaii Lithium Program", "Coming soon · reservations and Hawaii shipping availability"],'),
              '["/hawaii-lithium-batteries", "Hawaii Lithium Shipping & Freight", "Hawaii consolidated freight · Alaska quote options"],',
              'shared Hawaii navigation'
          )

          # P2: time-bound Labor Day reliability guard. Existing pricing values and manual control remain unchanged.
          p=Path('site/promotion-runtime.js'); s=p.read_text()
          marker='const PROMOTION_ID="labor-day-2026";'
          if s.count(marker)!=1: raise SystemExit('promotion id marker mismatch')
          s=s.replace(marker, marker+'\nconst PROMOTION_START_AT="2026-09-03T06:00:00.000Z"; // 2026-09-03 00:00 America/Denver\nconst PROMOTION_END_AT="2026-09-08T06:00:00.000Z"; // 2026-09-08 00:00 America/Denver',1)
          marker='const uid=(p)=>`${p}-${crypto.randomUUID()}`;'
          if s.count(marker)!=1: raise SystemExit('promotion uid marker mismatch')
          s=s.replace(marker,marker+'\nfunction promotionWindow(now=Date.now()){const start=Date.parse(PROMOTION_START_AT),end=Date.parse(PROMOTION_END_AT);return{active:Number.isFinite(start)&&Number.isFinite(end)&&now>=start&&now<end,state:now<start?"scheduled":now>=end?"expired":"active"};}',1)
          old='active:available&&Number(row?.active)===1,'
          new='manualActive:available&&Number(row?.active)===1,active:available&&Number(row?.active)===1&&promotionWindow().active,startAt:PROMOTION_START_AT,endAt:PROMOTION_END_AT,windowState:promotionWindow().state,'
          if s.count(old)!=1: raise SystemExit('promotion active field mismatch')
          s=s.replace(old,new,1)
          old='return{active:Boolean(config?.active),headline:'
          new='return{active:Boolean(config?.active),manualActive:Boolean(config?.manualActive),startAt:config?.startAt||PROMOTION_START_AT,endAt:config?.endAt||PROMOTION_END_AT,windowState:config?.windowState||promotionWindow().state,headline:'
          if s.count(old)!=1: raise SystemExit('public promotion return mismatch')
          s=s.replace(old,new,1)
          p.write_text(s)

          # Admin reflects manual flag separately from effective campaign window.
          p=Path('site/admin-promotion.js'); s=p.read_text()
          old='function render(p){$("promo-auth").hidden=true;$("promo-dashboard").hidden=false;$("promo-status").textContent=p.active?"Labor Day promotion is ACTIVE.":"Labor Day promotion is DISABLED; eligible products use the 35% everyday pricing basis.";$("promo-enable").disabled=Boolean(p.active);$("promo-disable").disabled=!p.active;$("promo-metrics").innerHTML=[[\'State\',p.active?\'ACTIVE\':\'DISABLED\'],[\'Coupon\',`${p.couponCode} · ${p.couponPercent}% off`],[\'Promotion list basis\',`${p.promoMarkupPercent}% markup`],[\'Everyday basis\',`${p.everydayMarkupPercent}% markup`],[\'Battery shipping\',`${money(p.batteryShippingCents)} per actual battery`]].map(([a,b])=>`<article class="eus-metric"><span>${esc(a)}</span><strong>${esc(b)}</strong></article>`).join("");'
          new='function render(p){$("promo-auth").hidden=true;$("promo-dashboard").hidden=false;const manual=Boolean(p.manualActive??p.active),windowState=String(p.windowState||"");const state=p.active?"ACTIVE":manual&&windowState==="scheduled"?"SCHEDULED":manual&&windowState==="expired"?"EXPIRED · AUTO-OFF":"DISABLED";$("promo-status").textContent=p.active?"Labor Day promotion is ACTIVE.":state==="SCHEDULED"?`Labor Day promotion is enabled and scheduled to start automatically at ${new Date(p.startAt).toLocaleString()}.`:state.startsWith("EXPIRED")?"Labor Day promotion window has ended; promotional pricing and coupon use are automatically off.":"Labor Day promotion is DISABLED; eligible products use the 35% everyday pricing basis.";$("promo-enable").disabled=manual;$("promo-disable").disabled=!manual;$("promo-metrics").innerHTML=[[\'State\',state],[\'Campaign window\',`${new Date(p.startAt).toLocaleString()} → ${new Date(p.endAt).toLocaleString()}`],[\'Coupon\',`${p.couponCode} · ${p.couponPercent}% off`],[\'Promotion list basis\',`${p.promoMarkupPercent}% markup`],[\'Everyday basis\',`${p.everydayMarkupPercent}% markup`],[\'Battery shipping\',`${money(p.batteryShippingCents)} per actual battery`]].map(([a,b])=>`<article class="eus-metric"><span>${esc(a)}</span><strong>${esc(b)}</strong></article>`).join("");'
          if s.count(old)!=1: raise SystemExit('admin promotion render mismatch')
          p.write_text(s.replace(old,new,1))

          # P3: RV direct checkout no longer exposes eBay fallback in customer URL.
          p=Path('site/rv-store.js'); s=p.read_text()
          token='${ebayItemId?`&ebay=${encodeURIComponent(`https://www.ebay.com/itm/${ebayItemId}`)}`:""}'
          if s.count(token)!=1: raise SystemExit(f'rv-store ebay query token count={s.count(token)}')
          p.write_text(s.replace(token,'',1))

          p=Path('site/rv-checkout-routing.js'); s=p.read_text()
          old='''        const original = external.href;\n        link.href = `/checkout/?source=rv&id=${encodeURIComponent(match[1])}&ebay=${encodeURIComponent(original)}&name=${encodeURIComponent(name)}`;'''
          new='''        link.href = `/checkout/?source=rv&id=${encodeURIComponent(match[1])}&name=${encodeURIComponent(name)}`;'''
          if s.count(old)!=1: raise SystemExit('rv-checkout-routing fallback mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('site/_worker.js'); s=p.read_text()
          token='${/^\\d{12}$/.test(ebay)?`&ebay=${encodeURIComponent(`https://www.ebay.com/itm/${ebay}`)}`:""}'
          if s.count(token)!=1: raise SystemExit(f'worker ebay query token count={s.count(token)}')
          p.write_text(s.replace(token,'',1))

          p=Path('site/store-checkout.js'); s=p.read_text()
          replacements=[
              ('  const ebayUrl = String(params.get("ebay") || "").trim();\n',''),
              ('    ebayUrl,\n',''),
              ('    const fallback = String(body.ebayUrl || ebayUrl || "").trim();','    const fallback = String(body.ebayUrl || "").trim();'),
          ]
          for old,new in replacements:
              if s.count(old)!=1: raise SystemExit(f'store-checkout marker mismatch: {old[:35]!r}')
              s=s.replace(old,new,1)
          p.write_text(s)

          # Server-side authoritative fallback lookup from Catalog/Doba mapping only.
          p=Path('site/store-checkout-server.js'); s=p.read_text()
          marker='''function rvMapEntry(env, id) {\n  const map = readDobaMap(env);\n  const entry = map[clean(id, 120)];\n  return entry && typeof entry === "object" && !Array.isArray(entry) ? entry : null;\n}\n'''
          if s.count(marker)!=1: raise SystemExit('rvMapEntry marker mismatch')
          helper='''\nfunction trustedEbayUrl(value) {\n  const raw = clean(value, 300);\n  return /^https:\\/\\/www\\.ebay\\.com\\/itm\\/\\d{12}$/i.test(raw) ? raw : "";\n}\nfunction ebayUrlFromItemId(value) {\n  const itemId = clean(value, 30);\n  return /^\\d{12}$/.test(itemId) ? `https://www.ebay.com/itm/${itemId}` : "";\n}\nasync function catalogRvFallbackUrl(env, id) {\n  const db = env?.MARKETPLACE_DB;\n  const wanted = clean(id, 140);\n  if (!db || typeof db.prepare !== "function" || !wanted) return "";\n  try {\n    const row = await db.prepare(`SELECT m.ebay_item_id FROM eus_inventory_items i JOIN eus_catalog_meta m ON m.inventory_item_id=i.id WHERE (i.id=? OR lower(i.supplier_product_id)=lower(?) OR m.ebay_item_id=?) AND i.supplier='doba' LIMIT 1`).bind(wanted,wanted,wanted).first();\n    return ebayUrlFromItemId(row?.ebay_item_id);\n  } catch (error) {\n    console.error(JSON.stringify({event:"rv_checkout_fallback_lookup_error",message:clean(error?.message,240)}));\n    return "";\n  }\n}\n'''
          s=s.replace(marker,marker+helper,1)
          old='''  const catalogEntry = await catalogRvEntry(env, id);\n  const entry = source === "lithium" ? catalogEntry : (catalogEntry || rvMapEntry(env, id));\n  if (!entry) return {ok:false,status:409,...(source==="rv"?{fallback:"ebay",ebayUrl:/^https:\\/\\/www\\.ebay\\.com\\/itm\\/\\d{12}$/i.test(clean(raw?.ebayUrl,300))?clean(raw.ebayUrl,300):""}:{}),error:source==="lithium"?"Lithium Catalog identity or verified shipping is unavailable":"Doba shipping is not mapped for this item"};\n  if (entry.shippingVerified !== true) return {ok:false,status:409,...(source==="rv"?{fallback:"ebay",ebayUrl:clean(entry.ebayUrl||raw?.ebayUrl,300)}:{}),error:"Doba shipping is not verified for this item"};'''
          new='''  const catalogEntry = await catalogRvEntry(env, id);\n  const mappedEntry = source === "rv" ? rvMapEntry(env, id) : null;\n  const entry = source === "lithium" ? catalogEntry : (catalogEntry || mappedEntry);\n  const serverFallbackUrl = source === "rv" ? (trustedEbayUrl(mappedEntry?.ebayUrl) || ebayUrlFromItemId(mappedEntry?.ebayItemId) || await catalogRvFallbackUrl(env, id)) : "";\n  const fallback = serverFallbackUrl ? {fallback:"ebay",ebayUrl:serverFallbackUrl} : {};\n  if (!entry) return {ok:false,status:409,...fallback,error:source==="lithium"?"Lithium Catalog identity or verified shipping is unavailable":"Doba shipping is not mapped for this item"};\n  if (entry.shippingVerified !== true) return {ok:false,status:409,...fallback,error:"Doba shipping is not verified for this item"};'''
          if s.count(old)!=1: raise SystemExit('server quote fallback block mismatch')
          s=s.replace(old,new,1)
          old='''  if (destinationState && blockedStates.includes(destinationState) && !(actualBattery && destinationState==="HI")) return {ok:false,status:409,...(source==="rv"?{fallback:"ebay",ebayUrl:clean(entry.ebayUrl||raw?.ebayUrl,300)}:{}),error:"This Doba item is not available for the selected shipping state"};'''
          new='''  if (destinationState && blockedStates.includes(destinationState) && !(actualBattery && destinationState==="HI")) return {ok:false,status:409,...fallback,error:"This Doba item is not available for the selected shipping state"};'''
          if s.count(old)!=1: raise SystemExit('server state fallback block mismatch')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Test candidate and protected boundaries
        run: |
          set -euo pipefail
          for file in site/site-shell.js site/promotion-runtime.js site/admin-promotion.js site/rv-store.js site/rv-checkout-routing.js site/_worker.js site/store-checkout.js site/store-checkout-server.js; do node --check "$file"; done
          git diff --check

          grep -q 'Hawaii Lithium Shipping & Freight' site/site-shell.js
          ! grep -q 'Hawaii Lithium Program' site/site-shell.js
          ! grep -q 'Coming soon · reservations and Hawaii shipping availability' site/site-shell.js

          grep -q 'PROMOTION_START_AT="2026-09-03T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'PROMOTION_END_AT="2026-09-08T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'couponPercent:25' site/promotion-runtime.js
          grep -q 'everydayMarkupPercent:35' site/promotion-runtime.js
          grep -q 'promoMarkupPercent:60' site/promotion-runtime.js
          grep -q 'batteryShippingCents:2799' site/promotion-runtime.js

          ! grep -q '&ebay=' site/rv-store.js
          ! grep -q '&ebay=' site/rv-checkout-routing.js
          ! grep -q '&ebay=' site/_worker.js
          ! grep -q 'params.get("ebay")' site/store-checkout.js
          ! grep -q 'raw?.ebayUrl\|raw.ebayUrl' site/store-checkout-server.js
          grep -q 'catalogRvFallbackUrl' site/store-checkout-server.js

          for protected in site/start-a-project.html site/solar-project.html site/hawaii-lithium-runtime.js site/hawaii-lithium-batteries.html site/lithium-shop.js site/lithium-batteries.html site/catalog-admin-runtime.js site/marketplace.html; do
            git diff --quiet cc5f59fa8d7374d41d51ec56a0e91e20198cb612 -- "$protected"
          done

      - name: Commit candidate and retire temporary repair workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-45-production-reconciliation-candidate.yml
          rm -f .github/workflows/one-time-45-production-reconciliation-resume.yml
          rm -f .github/workflows/one-time-45-production-reconciliation-finalize.yml
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add -A
          git commit -m 'Repair production navigation promotion timing and RV fallback'
          git push origin HEAD:repair/4.5-production-reconciliation-2026-09-02
