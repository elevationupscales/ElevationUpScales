name: QA RV Shop integration

on:
  push:
    branches:
      - store-rv-ebay-analytics-v3.11.27

permissions:
  contents: write

jobs:
  qa:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)
      - name: Verify RV Shop integration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://www.ebay.com/usr/elevationupscalesshop' site/store.html
          grep -q 'id="rv-shop"' site/store.html
          grep -q 'store-channel-analytics.js?v=3.11.27-rv-shop' site/store.html
          grep -q 'admin-store-analytics.js?v=3.11.27-rv-shop' site/admin-listings.html
          grep -q '"store_open"' site/_worker.js
          grep -q '"store_destination_click"' site/_worker.js
          grep -q 'store: storeAnalytics' site/_worker.js
          test ! -e tools/apply-rv-shop-integration.py
          test ! -e .github/workflows/apply-rv-shop-integration.yml
      - name: Remove one-shot QA workflow
        shell: bash
        run: |
          rm -f .github/workflows/qa-rv-shop-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'QA v3.11.27 RV Shop integration'
          git push origin HEAD:store-rv-ebay-analytics-v3.11.27
