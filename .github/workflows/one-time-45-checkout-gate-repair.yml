name: One-Time 4.5 Checkout Gate Repair

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths:
      - .github/workflows/one-time-45-checkout-gate-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Apply payment-boundary repair
        run: python .github/scripts/repair_45_checkout_gate_order.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check site/store-checkout-server.js
          git diff --check
          python - <<'PY'
          from pathlib import Path
          s=Path('site/store-checkout-server.js').read_text()
          start=s.index('async function createStoreOrder')
          review=s.index('if (quote.hawaii?.customerState === "review_required")',start)
          paypal=s.index('if (!paypalConfigured(env))',start)
          assert review < paypal, 'Hawaii eligibility must gate PayPal readiness'
          PY
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/store-checkout-server.js
          git commit -m "Gate Hawaii eligibility before payment provider readiness"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
