name: One-Time Admin Pass 2 Preview

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  preview-pass2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/admin-portal-pass2-shipping-simplification
          fetch-depth: 0
      - name: Validate Pass 2 release source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 33e153a5a0bdde95639a651f535cd539026e5370 HEAD
          changed="$(git diff --name-only 33e153a5a0bdde95639a651f535cd539026e5370...HEAD)"
          echo "$changed"
          for path in $changed; do
            case "$path" in
              site/admin-command-center.js|site/admin-overview.js|site/admin-lithium-shipping.html|site/admin-shipping-pass2.css|site/admin-shipping-pass2.js) ;;
              *) echo "Unexpected Pass 2 file: $path"; exit 1;;
            esac
          done
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/admin-lithium-shipping.js
          node --check site/admin-shipping-pass2.js
          grep -q 'Shipping & Logistics' site/admin-command-center.js
          grep -q '<h1>Shipping & Logistics</h1>' site/admin-lithium-shipping.html
          grep -q 'Reservations Waiting' site/admin-shipping-pass2.js
          grep -q 'Products Needing Review' site/admin-shipping-pass2.js
          grep -q 'Supplier Rechecks' site/admin-shipping-pass2.js
          grep -q 'Quote / Route Needed' site/admin-shipping-pass2.js
          grep -q 'Open Shipment Batches' site/admin-shipping-pass2.js
          grep -q 'Ready to Book' site/admin-shipping-pass2.js
          grep -q 'Advanced Shipping Details' site/admin-shipping-pass2.js
          grep -q 'Source of Truth' site/admin-shipping-pass2.js
          ! grep -q '<h1>Lithium Shipping Matrix</h1>' site/admin-lithium-shipping.html
          test -f site/admin-catalog.html
          test -f site/admin-inventory.html
          test -f site/admin-store-orders.html
          test -f site/admin-listings.html
          test -f site/hawaii-lithium-runtime.js
          test -f site/_worker.js
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=admin-pass2-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify preview routes and compatibility
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          for route in /admin /admin-catalog /admin-inventory /admin-store-orders /admin-lithium-shipping /admin-analytics /admin-channels /store /marketplace /checkout /start-a-project /solar-project /hawaii-lithium-batteries /admin-shipping-pass2.js /admin-shipping-pass2.css; do
            code=$(curl --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-pass2 --write-out '%{http_code}' "${base}${route}" || true)
            echo "${route} -> ${code:-curl-error}"
            test "$code" = "200"
          done
          shipping="$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/admin-lithium-shipping")"
          nav="$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/admin-command-center.js")"
          home="$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/admin-shipping-pass2.js")"
          hawaii="$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/hawaii-lithium-batteries")"
          printf '%s' "$shipping" | grep -q '<h1>Shipping & Logistics</h1>'
          ! printf '%s' "$shipping" | grep -q '<h1>Lithium Shipping Matrix</h1>'
          printf '%s' "$nav" | grep -q 'Shipping & Logistics'
          printf '%s' "$home" | grep -q 'Advanced Shipping Details'
          printf '%s' "$home" | grep -q 'Catalog tells us what it is'
          if printf '%s' "$hawaii" | grep -Eqi 'Lithium Batteries Shipped to Hawaii|free Hawaii shipping|carrier approved|hazmat approved'; then exit 1; fi
          session=$(curl --silent --output /tmp/session --write-out '%{http_code}' "${base}/api/admin/session" || true)
          test "$session" = "200"
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping; do
            code=$(curl --silent --output /tmp/protected --write-out '%{http_code}' "${base}${api}" || true)
            test "$code" = "401"
          done
      - name: Record preview receipt
        run: |
          echo '### Admin Portal Pass 2 Preview' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent: 33e153a5a0bdde95639a651f535cd539026e5370" >> "$GITHUB_STEP_SUMMARY"
          echo "Application: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'No schema migration or backend data-table changes.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Preview verification: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove preview workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-admin-pass2-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed Admin Pass 2 preview workflow'
          git push origin main
