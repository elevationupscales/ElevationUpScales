name: One-Time 4.5 Clean Final Preview V2
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-clean-final-preview-v2.yml
permissions:
  contents: read
  deployments: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          fetch-depth: 0
      - name: Exact source gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ed2eaee5a01e3a5f23e1322eb63fa03c058220a6"
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "9ed1a64479f6c1949cfef7b6c40494c6ab9c934a"
          git merge-base --is-ancestor 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a HEAD
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'one-time-45-*' -print -quit)"
          if test -d .github/scripts; then test -z "$(find .github/scripts -maxdepth 1 -type f \( -name 'apply_45_*' -o -name 'repair_45_*' \) -print -quit)"; fi
          while IFS= read -r -d '' f; do node --check "$f"; done < <(find site -type f -name '*.js' -print0)
          git diff --check 9ed1a64479f6c1949cfef7b6c40494c6ab9c934a...HEAD
          grep -q '"/hawaii-lithium-batteries"' site/_routes.json
          grep -q '/api/hawaii-lithium/statuses' site/lithium-shop.js
          ! grep -q 'fetch(`/api/hawaii-lithium/status?sku=' site/lithium-shop.js
          grep -q 'hawaii-address-delivery' site/shipping-rules-runtime.js
          grep -q 'const identity=\[product?.title,product?.name,product?.sku,product?.supplierSku\]' site/promotion-runtime.js
          grep -q 'Checking exact-SKU Hawaii eligibility' site/store-checkout.js
          echo SOURCE_GATE=PASS
      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=elevationupscales --branch=commerce45cleanfinalv2
      - name: Runtime and prerender gate
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"; echo "PREVIEW=$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /what-we-do /start-a-project /solar-project /marketplace /terms /privacy /admin /admin-catalog /admin-store-orders /admin-lithium-shipping; do code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 90 -o /tmp/r -w '%{http_code}' "$base$route" || true); echo "ROUTE $route=$code"; test "$code" = 200; done
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/li.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store-catalog?section=rv-outdoor" -o /tmp/rv.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/featured" -o /tmp/featured.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules" -o /tmp/rules.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/hawaii-lithium/statuses" -o /tmp/statuses.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=CO&quantity=2&batteryUnits=1" -o /tmp/co.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=HI&quantity=2&batteryUnits=1" -o /tmp/hi.json
          curl -fsSL --retry 8 --retry-all-errors "$base/api/shipping-rules/resolve?state=AK&quantity=1&batteryUnits=1" -o /tmp/ak.json
          node <<'NODE'
          const fs=require('fs'),li=JSON.parse(fs.readFileSync('/tmp/li.json')).products||[],rv=JSON.parse(fs.readFileSync('/tmp/rv.json')).products||[],f=JSON.parse(fs.readFileSync('/tmp/featured.json')),rules=JSON.parse(fs.readFileSync('/tmp/rules.json')).rules||[],st=JSON.parse(fs.readFileSync('/tmp/statuses.json')),co=JSON.parse(fs.readFileSync('/tmp/co.json')),hi=JSON.parse(fs.readFileSync('/tmp/hi.json')),ak=JSON.parse(fs.readFileSync('/tmp/ak.json'));
          if(li.length!==38)throw Error('Lithium '+li.length);if(rv.length<1)throw Error('RV empty');if((f.lithium||[]).length!==4||(f.rv||[]).length!==4)throw Error('featured');
          const l=rules.find(x=>x.region==='LOWER48'),h=rules.find(x=>x.region==='HI'),d=rules.find(x=>x.region==='HI_DELIVERY'),a=rules.find(x=>x.region==='AK');if(l?.rateCents!==2799||l?.calculation!=='per_battery')throw Error('L48');if(h?.rateCents!==9900||!h?.pickupOnly||h?.residentialAllowed||h?.preferredConsolidationQuantity!==3)throw Error('HI');if(!d?.quoteRequired||d?.rateCents!==0)throw Error('HI delivery');if(!a?.quoteRequired||a?.rateCents!==0)throw Error('AK');if(co.shippingCents!==5598||hi.shippingCents!==19800||ak.status!=='review_required')throw Error('resolver');
          const counts={shipping_available:0,review_required:0,unavailable:0};for(const p of li){const s=st.statuses?.[p.id]||st.statuses?.[String(p.sku||'').toLowerCase()];if(s&&s.customerState in counts)counts[s.customerState]++}console.log('COUNTS='+JSON.stringify({lithium:li.length,rv:rv.length,featured:'4+4',hawaii:counts}));
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/li.html
          curl -fsSL --retry 8 --retry-all-errors "$base/hawaii-lithium-batteries" -o /tmp/hi.html
          curl -fsSL --retry 8 --retry-all-errors "$base/rv-store" -o /tmp/rv.html
          node <<'NODE'
          const fs=require('fs'),li=fs.readFileSync('/tmp/li.html','utf8'),hi=fs.readFileSync('/tmp/hi.html','utf8'),rv=fs.readFileSync('/tmp/rv.html','utf8'),a=(li.match(/class="lithium-card"/g)||[]).length,b=(hi.match(/class="lithium-card"/g)||[]).length,c=(rv.match(/class="rv-product-card"/g)||[]).length;console.log(`PRERENDER=${a}/${b}/${c}`);if(a!==38||b!==38||c<1)throw Error('prerender');if(!hi.includes('data-prerendered="true"')||!hi.includes('Honolulu warehouse / freight-terminal'))throw Error('HI prerender');
          NODE
      - name: Checkout and browser UX gate
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          (async()=>{const base=process.env.BASE.replace(/\/$/,''),id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';async function post(path,b){const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Origin':base},body:JSON.stringify(b)});return{status:r.status,body:await r.json().catch(()=>({}))}}const co=await post('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'CO'}});if(co.status!==200||co.body?.battery?.actualBattery!==true||co.body.shippingCents!==2799||co.body.shippingRule?.rateCents!==2799)throw Error('known CO');const hi=await post('/api/store-checkout/quote',{source:'lithium',id,quantity:1,shipping:{state:'HI'}});if(hi.status!==200||hi.body.hawaii?.customerState!=='review_required'||hi.body.hawaii?.paymentAllowed!==false||hi.body.shippingCents!==0)throw Error('known HI');const order=await post('/api/store-checkout/orders',{source:'lithium',id,quantity:1,customer:{email:'commerce45-preview@elevationupscales.com'},shipping:{fullName:'Preview',state:'HI',countryCode:'US'}});if(order.status!==409||!order.body.hawaiiFreight)throw Error('payment block');console.log('CHECKOUT_SERVER=PASS')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          mkdir -p /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1; npm install --no-save playwright@latest >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          cat > verify.mjs <<'NODE'
          import{chromium}from'playwright';const base=process.env.BASE.replace(/\/$/,''),browser=await chromium.launch({headless:true});
          const metrics={};for(const route of ['/','/lithium-batteries','/hawaii-lithium-batteries','/rv-store']){const ctx=await browser.newContext({viewport:{width:1280,height:900}}),page=await ctx.newPage(),req=[],api=[];page.on('request',r=>{req.push(r.url());if(r.url().includes('/api/'))api.push(r.url())});await page.goto(base+route,{waitUntil:'domcontentloaded',timeout:60000});if(route==='/')await page.locator('[data-home-commerce]').scrollIntoViewIfNeeded();await page.waitForTimeout(4300);metrics[route]={requests:req.length,apiRequests:api.length,dom:await page.evaluate(()=>document.getElementsByTagName('*').length)};if(route==='/'){if(await page.locator("[data-home-products='lithium'] .home-product-card").count()!==4||await page.locator("[data-home-products='rv'] .home-product-card").count()!==4)throw Error('home cards')}if(route==='/hawaii-lithium-batteries'){const singles=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/status').length,batches=api.filter(u=>new URL(u).pathname==='/api/hawaii-lithium/statuses').length,catalogs=api.filter(u=>new URL(u).pathname==='/api/store/catalog').length;if(singles!==0||batches>1||catalogs!==0||req.length>=57||api.length>=41)throw Error('HI perf');if(await page.locator('.lithium-card').count()!==38)throw Error('HI cards')}await ctx.close()}
          console.log('PERF='+JSON.stringify(metrics));
          const id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77',ctx=await browser.newContext({viewport:{width:1100,height:900}}),page=await ctx.newPage();await page.goto(`${base}/checkout/?source=lithium&id=${id}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(800);if(!(await page.locator('#checkout-hawaii-freight').isVisible()))throw Error('immediate HI panel');if(await page.locator('#checkout-address1').isVisible())throw Error('HI address early');if(await page.locator('#checkout-paypal').isVisible())throw Error('HI paypal early');const early=await page.locator('#checkout-hawaii-state').innerText();if(!early.includes('Checking'))throw Error('HI checking '+early);await page.waitForFunction(()=>document.querySelector('#checkout-hawaii-state')?.textContent?.includes('Freight Review Required'),null,{timeout:15000});const txt=await page.locator('#checkout-hawaii-freight').innerText();if(!txt.includes('Honolulu warehouse / freight-terminal pickup location')||!txt.includes('Additional delivery charges apply'))throw Error('HI wording');if(await page.locator('#checkout-address1').isVisible()||await page.locator('#checkout-paypal').isVisible()||!(await page.locator('#checkout-hawaii-reserve').isVisible()))throw Error('HI final UI');await ctx.close();await browser.close();console.log('BROWSER_UX=PASS');
          NODE
          BASE="$BASE" node verify.mjs
      - name: Promotion and final preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"; curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/promo.json
          node <<'NODE'
          const p=require('/tmp/promo.json');if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z'||p.windowState!=='active'||p.batteryShippingCents!==2799)throw Error('promo');if(p.active&&p.couponPercent!==25)throw Error('coupon');console.log('PROMOTION='+JSON.stringify({active:p.active,manualActive:p.manualActive,windowState:p.windowState,couponPercent:p.couponPercent,batteryShippingCents:p.batteryShippingCents}));
          NODE
          echo FINAL_CLEAN_PREVIEW=PASS
          echo APPLICATION_SHA=ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
          echo PREVIEW_URL=$base
