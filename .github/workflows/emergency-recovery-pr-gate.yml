name: Emergency storefront recovery PR gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/triggers/emergency-recovery-pr.txt

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate accepted v3.11.30 baseline
        shell: bash
        run: |
          set -euo pipefail
          node --check site/_worker.js
          node --check site/rv-store.js
          node --check site/store-patch-8.js
          grep -q '3.11.30-store-navigation-repair' site/_worker.js
          grep -q 'const PUBLIC_INVENTORY_PATH = "/api/store-inventory"' site/_worker.js
          grep -q 'Stage 1 of 7' site/solar-project.html
          grep -q 'Apparel Store' site/store.html
          grep -q 'RV & Outdoor Store' site/store.html
          grep -q '/rv-store' site/site-shell.js
          test "$(grep -o 'class="market-product-card"' site/store.html | wc -l)" -ge 10
      - name: Deploy restored production baseline
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke customer funnel
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/" > /tmp/home.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/start-a-project" > /tmp/start.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/store" > /tmp/store.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store" > /tmp/rv.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/marketplace" > /tmp/marketplace.html
          grep -q 'Start a Project' /tmp/home.html
          grep -q 'Apparel Store' /tmp/store.html
          grep -q 'RV & Outdoor Store' /tmp/rv.html
          grep -q 'Marketplace' /tmp/marketplace.html
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-products?recovery=v3.11.30" > /tmp/products.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/products.json',encoding='utf-8'))
          products=data.get('products') or data.get('items') or []
          count=len(products)
          print('apparel_catalog_count=',count)
          assert count >= 1, 'Apparel API returned no products'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'apparel_count={count}\n')
          PY
      - name: Persist recovery receipt
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p .github/deployments
          cat > .github/deployments/v3.11.30-emergency-recovery.txt <<EOF
          build=3.11.30-emergency-recovery
          baseline=e75862f28428a3e1a660b2f95f0c07e5e6dc9c82
          source_commit=$(git rev-parse HEAD)
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          apparel_catalog_count=${{ steps.smoke.outputs.apparel_count }}
          status=success
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.30-emergency-recovery.txt
          git commit -m 'Record v3.11.30 emergency recovery deployment'
          git push origin HEAD:main
