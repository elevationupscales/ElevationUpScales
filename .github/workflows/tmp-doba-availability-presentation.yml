name: Temporary Doba availability presentation repair

on:
  push:
    branches:
      - work/doba-availability-presentation-0911

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/doba-availability-presentation-0911
      - name: Patch and test Doba availability presentation
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/tmp_patch_doba_availability.py
          git diff --check
          npm test
          rm .github/scripts/tmp_patch_doba_availability.py
          rm .github/workflows/tmp-doba-availability-presentation.yml
          git config user.name "elevationupscales"
          git config user.email "caseymyoung@gmail.com"
          git add site/_worker.js site/catalog-admin-runtime.js tests/doba-availability-presentation.test.cjs .github/scripts/tmp_patch_doba_availability.py .github/workflows/tmp-doba-availability-presentation.yml
          git commit -m "Fix Doba unknown-stock storefront gating"
          git push origin HEAD:work/doba-availability-presentation-0911
