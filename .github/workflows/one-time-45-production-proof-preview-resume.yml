name: One-Time 4.5 Production Proof and Preview Resume

on:
  push:
    branches: [repair/4.5-production-reconciliation-2026-09-02]
    paths: [.github/workflows/one-time-45-production-proof-preview-resume.yml]

permissions:
  contents: read
  deployments: write

jobs:
  prove-and-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: repair/4.5-production-reconciliation-2026-09-02
          fetch-depth: 0

      - name: Confirm candidate lineage and source invariants
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "cc5f59fa8d7374d41d51ec56a0e91e20198cb612"
          git merge-base --is-ancestor "$current_main" HEAD
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          grep -q 'Hawaii Lithium Shipping & Freight' site/site-shell.js
          ! grep -q 'Hawaii Lithium Program' site/site-shell.js
          ! grep -q '&ebay=' site/rv-store.js
          ! grep -q '&ebay=' site/_worker.js
          ! grep -q 'params.get("ebay")' site/store-checkout.js
          ! grep -q 'raw?.ebayUrl\|raw.ebayUrl' site/store-checkout-server.js
          ! grep -q 'fallbackCatalog' site/rv-store.js
          grep -q 'PROMOTION_START_AT="2026-09-03T06:00:00.000Z"' site/promotion-runtime.js
          grep -q 'PROMOTION_END_AT="2026-09-08T06:00:00.000Z"' site/promotion-runtime.js

      - name: Verify canonical production Lithium directly
        run: |
          set -euo pipefail
          base="https://elevationupscales.com"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$base/api/store/catalog?section=lithium-batteries" -o /tmp/lithium.json
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('/tmp/lithium.json','utf8'));
          const p=Array.isArray(d.products)?d.products:[];
          console.log(`PRODUCTION_LITHIUM_COUNT=${p.length}`);
          if(p.length!==38) throw new Error(`Expected 38 products, got ${p.length}`);
          if(p.some(x=>!(Number(x.priceCents)>0))) throw new Error('Live Lithium product missing positive price');
          if(p.some(x=>String(x.publishStatus||'published').toLowerCase()!=='published')) throw new Error('Non-published product returned publicly');
          const first=p[0];
          if(!first?.id) throw new Error('Missing sample id');
          fs.writeFileSync('/tmp/product-id',String(first.id));
          console.log(`PRODUCTION_SAMPLE_ID=${first.id}`);
          console.log(`PRODUCTION_SAMPLE_PRICE_CENTS=${first.priceCents}`);
          console.log(`PRODUCTION_SAMPLE_SHIPPING=${first.shippingStatus||''}`);
          NODE
          id="$(cat /tmp/product-id)"
          for route in / /lithium-batteries /hawaii-lithium-batteries /checkout/ "/product?id=${id}&store=lithium"; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/route.html -w '%{http_code}' "$base$route")
            echo "PRODUCTION_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/lithium.html
          node <<'NODE'
          const fs=require('fs'); const h=fs.readFileSync('/tmp/lithium.html','utf8');
          const cards=(h.match(/class="lithium-card"/g)||[]).length;
          const prerender=h.includes('data-prerendered="true"');
          const countMarker=(h.match(/data-lithium-count[^>]*>([^<]*)</)||[])[1]||'';
          console.log(`PRODUCTION_LITHIUM_PRERENDER=${prerender}`);
          console.log(`PRODUCTION_LITHIUM_CARD_COUNT=${cards}`);
          console.log(`PRODUCTION_LITHIUM_COUNT_MARKER=${countMarker.trim()}`);
          if(!prerender) throw new Error('Lithium page is not server prerendered');
          if(cards!==38) throw new Error(`Expected 38 prerendered cards, got ${cards}`);
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/" -o /tmp/home.html
          grep -q 'Hawaii Lithium Shipping &amp; Freight' /tmp/home.html
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/prod-promo.json
          echo "PRODUCTION_PROMOTION=$(cat /tmp/prod-promo.json)"
          if curl -fsSL --retry 8 --retry-all-errors "$base/site-shell.js" | grep -q 'Hawaii Lithium Program'; then
            echo 'PRODUCTION_SHARED_SHELL=STALE_CONFIRMED'
          else
            echo 'PRODUCTION_SHARED_SHELL=CORRECT'
          fi

      - name: Deploy isolated candidate preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=production-reconciliation-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke repaired candidate preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          echo "PREVIEW_URL=$base"
          test -n "$base"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /start-a-project /solar-project /marketplace; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/preview-route.html -w '%{http_code}' "$base$route")
            echo "PREVIEW_ROUTE ${route}=${code}"
            test "$code" = "200"
          done
          curl -fsSL --retry 8 --retry-all-errors "$base/site-shell.js" -o /tmp/shell.js
          grep -q 'Hawaii Lithium Shipping & Freight' /tmp/shell.js
          ! grep -q 'Hawaii Lithium Program' /tmp/shell.js
          curl -fsSL --retry 8 --retry-all-errors "$base/rv-store.js" -o /tmp/rv-store.js
          grep -q '/api/store-catalog?section=rv-outdoor' /tmp/rv-store.js
          ! grep -q '&ebay=' /tmp/rv-store.js
          ! grep -q 'fallbackCatalog' /tmp/rv-store.js
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/catalog?section=lithium-batteries" -o /tmp/preview-lithium.json
          node <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/preview-lithium.json','utf8'));const p=Array.isArray(d.products)?d.products:[];console.log(`PREVIEW_LITHIUM_COUNT=${p.length}`);if(p.length!==38)throw new Error(`Expected 38 preview Lithium products, got ${p.length}`);
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/lithium-batteries" -o /tmp/preview-lithium.html
          node <<'NODE'
          const fs=require('fs');const h=fs.readFileSync('/tmp/preview-lithium.html','utf8');const cards=(h.match(/class="lithium-card"/g)||[]).length;console.log(`PREVIEW_LITHIUM_PRERENDER=${h.includes('data-prerendered="true"')}`);console.log(`PREVIEW_LITHIUM_CARD_COUNT=${cards}`);if(!h.includes('data-prerendered="true"')||cards!==38)throw new Error('Preview Lithium prerender mismatch');
          NODE
          curl -fsSL --retry 8 --retry-all-errors "$base/api/store/promotion" -o /tmp/preview-promo.json
          node <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/preview-promo.json','utf8'));console.log('PREVIEW_PROMOTION='+JSON.stringify(p));if(p.startAt!=='2026-09-03T06:00:00.000Z'||p.endAt!=='2026-09-08T06:00:00.000Z')throw new Error('Promotion window mismatch');if(Date.now()<Date.parse(p.startAt)&&p.active!==false)throw new Error('Promotion active before start');if(Date.now()>=Date.parse(p.endAt)&&p.active!==false)throw new Error('Promotion active after end');
          NODE

      - name: Record proof summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo '### Elevation 4.5 production reconciliation proof' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production parent: cc5f59fa8d7374d41d51ec56a0e91e20198cb612' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate tested: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Canonical production Lithium: 38/38 PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production promotion: NOT PERFORMED' >> "$GITHUB_STEP_SUMMARY"
