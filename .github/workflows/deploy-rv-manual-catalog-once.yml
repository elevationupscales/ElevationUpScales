name: One-time deploy RV manual catalog

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/rv-manual-catalog.txt

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate manual catalog
        shell: bash
        run: |
          set -euo pipefail
          test -f site/rv-manual-catalog.js
          test -f site/_worker.js
          test -f site/rv-store.js
          node --check site/rv-manual-catalog.js
          node --check site/_worker.js
          node --check site/rv-store.js
          python - <<'PY'
          from pathlib import Path
          manual=Path('site/rv-manual-catalog.js').read_text()
          worker=Path('site/_worker.js').read_text()
          assert manual.count('["manual-') >= 10
          assert 'manualRvCatalog' in worker
          assert 'manual-fallback' in worker
          assert 'Stage 1 of 7' in Path('site/solar-project.html').read_text()
          PY
      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke RV catalog
        id: smoke
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 -H 'Accept: application/json' "$DEPLOYMENT_URL/api/store-inventory?release=manual" > /tmp/inventory.json
          python - <<'PY'
          import json, os
          data=json.load(open('/tmp/inventory.json', encoding='utf-8'))
          count=int(data.get('count') or 0)
          print('rv_inventory_count=', count)
          print('catalog_mode=', data.get('catalogMode'))
          assert count >= 10, f'Expected >=10 RV catalog items, got {count}'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'count={count}\n')
              f.write(f"mode={data.get('catalogMode') or 'live'}\n")
          PY
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --max-time 90 "$DEPLOYMENT_URL/rv-store" > /tmp/rv.html
          grep -q 'RV & Outdoor Store' /tmp/rv.html
      - name: Record receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/deployments
          cat > .github/deployments/v3.11.33-rv-manual-catalog.txt <<EOF
          build=3.11.33-rv-manual-catalog
          source_commit=$(git rev-parse HEAD)
          deployment_url=${{ steps.deploy.outputs.deployment-url }}
          workflow_run=${{ github.run_id }}
          deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          rv_inventory_count=${{ steps.smoke.outputs.count }}
          catalog_mode=${{ steps.smoke.outputs.mode }}
          status=success
          EOF
          git pull --rebase origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/deployments/v3.11.33-rv-manual-catalog.txt
          git commit -m 'Record v3.11.33 RV manual catalog deployment'
          git push origin HEAD:main
