name: Store Pages Production Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA containing the approved store release
        required: true
        type: string
      confirmation:
        description: Type DEPLOY STORE to authorize this production Pages release (case-insensitive)
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-store-pages-production
  cancel-in-progress: false

env:
  PROJECT_NAME: elevationupscales
  LIVE_ORIGIN: https://elevationupscales.com
  LOCKED_HOME_BLOB: 9957fd1f8c9a3892193466dffbdb75e871db80a2

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate explicit release request
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          CONFIRMATION_NORMALIZED="$(printf '%s' "$CONFIRMATION" | tr '[:lower:]' '[:upper:]' | xargs)"
          test "$CONFIRMATION_NORMALIZED" = "DEPLOY STORE"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Require exact current main
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"

      - name: HARD GATE — homepage source remains exactly locked
        run: |
          set -euo pipefail
          ACTUAL="$(git hash-object site/index.html)"
          echo "Homepage blob: $ACTUAL"
          test "$ACTUAL" = "$LOCKED_HOME_BLOB"

      - name: Snapshot currently-live homepage semantics
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 "$LIVE_ORIGIN/" -o /tmp/home-before.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('/tmp/home-before.html').read_text()
          src = re.sub(r'(/cdn-cgi/l/email-protection#)[0-9a-fA-F]+', r'\1CFEMAIL', src)
          src = re.sub(r'(data-cfemail=")[0-9a-fA-F]+(")', r'\1CFEMAIL\2', src)
          Path('/tmp/home-before.normalized.html').write_text(src)
          PY
          sha256sum /tmp/home-before.normalized.html | tee /tmp/home-before.sha
          grep -q 'AUTHORIZED SOK ENERGY DEALER' /tmp/home-before.html

      - name: Validate only the commerce release surface
        run: |
          set -euo pipefail
          node --check site/store-checkout.js
          node --check site/store-checkout-server.js
          node --check site/_worker.js
          node --check site/sok-availability-runtime.js
          node --check site/shipping-rules-runtime.js
          node --check site/universal-store.js
          test -f site/checkout/index.html
          test -f site/store.html
          grep -q '/store-checkout.js' site/checkout/index.html
          grep -q '"/checkout"' site/_routes.json
          grep -q '"/api/\*"' site/_routes.json
          git diff --check

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Install pinned Cloudflare deployment tool
        working-directory: apps/web-v2
        run: npm ci --ignore-scripts

      - name: Deploy the approved site tree to the existing Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --prefix apps/web-v2 --no-install wrangler pages deploy site \
            --project-name "$PROJECT_NAME" \
            --branch main \
            --commit-hash "$EXPECTED_SHA" \
            2>&1 | tee /tmp/pages-deploy.txt

      - name: Capture Cloudflare Pages deployment receipt
        id: pages_receipt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments" \
            -o /tmp/pages-deployments.json
          jq -e '.success == true' /tmp/pages-deployments.json >/dev/null
          DEPLOYMENT="$(jq -c --arg sha "$EXPECTED_SHA" '[.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)] | sort_by(.created_on) | reverse | .[0]' /tmp/pages-deployments.json)"
          test "$DEPLOYMENT" != "null"
          DEPLOYMENT_ID="$(jq -r '.id' <<<"$DEPLOYMENT")"
          DEPLOYMENT_URL="$(jq -r '.url' <<<"$DEPLOYMENT")"
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages deployment ID: $DEPLOYMENT_ID"
          echo "Cloudflare Pages deployment URL: $DEPLOYMENT_URL"

      - name: HARD GATE — homepage semantics remain unchanged after deployment
        run: |
          set -euo pipefail
          BEFORE="$(cut -d' ' -f1 /tmp/home-before.sha)"
          AFTER=""
          for attempt in 1 2 3 4 5 6; do
            curl -fsSL --retry 2 "$LIVE_ORIGIN/" -o /tmp/home-after.html
            python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('/tmp/home-after.html').read_text()
          src = re.sub(r'(/cdn-cgi/l/email-protection#)[0-9a-fA-F]+', r'\1CFEMAIL', src)
          src = re.sub(r'(data-cfemail=")[0-9a-fA-F]+(")', r'\1CFEMAIL\2', src)
          Path('/tmp/home-after.normalized.html').write_text(src)
          PY
            AFTER="$(sha256sum /tmp/home-after.normalized.html | cut -d' ' -f1)"
            [ "$AFTER" = "$BEFORE" ] && break
            sleep 5
          done
          echo "Homepage normalized before: $BEFORE"
          echo "Homepage normalized after:  $AFTER"
          test "$AFTER" = "$BEFORE"

      - name: Catalog-wide live purchaseability smoke
        env:
          LIVE_ORIGIN: https://elevationupscales.com
        run: |
          set -euo pipefail
          node <<'NODE'
          const origin = process.env.LIVE_ORIGIN;
          const address = {fullName:"Store Release Proof",address1:"100 Congress Ave",address2:"",city:"Austin",state:"TX",postalCode:"78701",countryCode:"US"};
          const feeds = [
            ["lithium", "/api/store/catalog?section=lithium-batteries"],
            ["rv", "/api/store-catalog?section=rv-outdoor"],
            ["sok", "/api/sok/catalog"],
          ];
          const groups = [];
          for (const [name, path] of feeds) {
            const response = await fetch(origin + path, {headers:{Accept:"application/json"}});
            if (!response.ok) throw new Error(`${name} catalog HTTP ${response.status}`);
            const data = await response.json();
            if (!Array.isArray(data.products) || data.products.length === 0) throw new Error(`${name} catalog empty`);
            console.log(`${name} catalog: ${data.products.length}`);
            groups.push(data.products);
          }
          const clean = (v) => String(v ?? "").trim();
          const key = (p) => clean(p.id || p.sku || p.title || p.name).toLowerCase();
          const map = new Map();
          for (const rows of groups) for (const p of rows) {
            const k = key(p); if (!k) continue;
            map.set(k, map.has(k) ? {...map.get(k), ...p} : p);
          }
          const products = [...map.values()];
          if (products.length < 70) throw new Error(`catalog unexpectedly small: ${products.length}`);

          const sokExpected = new Map([
            ["SK12V100PC",31900],["SK12V100H",36900],["SK12V206H",74900],
            ["SK12V206PH",75000],["SK24V100",75100],["SK12V280H",99900],
            ["SK12V314PH",109900],["SK24V150PH",114900],["SK48V100N",119900],
          ]);
          for (const [sku, price] of sokExpected) {
            const p = products.find((row) => clean(row.sku).toUpperCase() === sku);
            if (!p) throw new Error(`missing approved SOK battery ${sku}`);
            if (Number(p.priceCents || p.price_cents) !== price) throw new Error(`${sku} price mismatch`);
            if (p.paymentEligible !== true) throw new Error(`${sku} is not paymentEligible`);
          }

          function sale(p) {
            const publish = clean(p.publishStatus || p.publish_status).toLowerCase();
            const mode = clean(p.availabilityMode || p.availabilityStatus || p.status || "available").toLowerCase();
            const source = clean(p.sourceState || p.source_state || p.reviewState || "").toLowerCase();
            const shipping = clean(p.shippingStatus || p.shipping_status || "").toLowerCase();
            const ident = [p.brand,p.manufacturer,p.supplier,p.vendor,p.title,p.name,p.sku].map(clean).join(" ").toLowerCase();
            const rawStock = p.supplierStock ?? p.inventoryQty ?? p.inventory_qty ?? p.quantityOnHand;
            const hasStock = rawStock !== null && rawStock !== undefined && String(rawStock) !== "";
            const stock = hasStock ? Number(rawStock) : null;
            const price = Number(p.priceCents || p.price_cents || 0);
            const eligible = p.paymentEligible !== false;
            if (publish && publish !== "published") return false;
            if (/stale|source missing|unknown|hold|review/.test(source)) return false;
            if (!p.sokProduct && (/unavailable|out of stock|zero stock/.test(mode) || (hasStock && Number.isFinite(stock) && stock <= 0))) return false;
            if (/prepurchase|preorder|backorder/.test(mode) && !p.sokProduct) return eligible && price > 0;
            if (!price && !p.sokProduct) return false;
            if (/doba/.test(ident)) {
              if (!hasStock || !Number.isFinite(stock)) return false;
              if (shipping && shipping !== "verified") return false;
              return price > 0;
            }
            if (p.sokProduct) return eligible && price > 0;
            if (shipping && shipping !== "verified") return false;
            return price > 0;
          }

          const advertisedBuyNow = products.filter(sale);
          if (advertisedBuyNow.length < 9) throw new Error(`too few buyable products: ${advertisedBuyNow.length}`);
          const failures = [];
          for (const p of advertisedBuyNow) {
            const id = clean(p.id || p.sku);
            const name = clean(p.title || p.name);
            const section = clean(p.storeSection || p.store_section).toLowerCase();
            const source = p.sokProduct || section === "lithium-batteries" ? "lithium" : "rv";
            const payload = {source,id,name,quantity:1,variantId:"",couponCode:"",availabilityTimingAcknowledged:true,shipping:address};
            const response = await fetch(origin + "/api/store-checkout/quote", {
              method:"POST",
              headers:{"Content-Type":"application/json",Accept:"application/json",Origin:origin},
              body:JSON.stringify(payload),
            });
            const body = await response.json().catch(()=>({}));
            if (!response.ok) failures.push(`${id}: HTTP ${response.status} ${body.error || body.message || "quote failed"}`);
            else if (p.sokProduct && body?.availability?.paymentEligible !== true) failures.push(`${id}: quote not payment eligible`);
          }
          console.log(`unique products: ${products.length}`);
          console.log(`advertised Buy Now products checked: ${advertisedBuyNow.length}`);
          if (failures.length) throw new Error(`Buy Now failures:\n${failures.join("\n")}`);
          console.log("Catalog-wide purchaseability: PASS");
          NODE

      - name: Release summary
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEPLOYMENT_ID: ${{ steps.pages_receipt.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.pages_receipt.outputs.deployment_url }}
        run: |
          {
            echo '### STORE PAGES PRODUCTION RELEASE'
            echo "Project: $PROJECT_NAME"
            echo "Git SHA: $EXPECTED_SHA"
            echo "Cloudflare Pages deployment ID: $DEPLOYMENT_ID"
            echo "Cloudflare Pages deployment URL: $DEPLOYMENT_URL"
            echo "Homepage source blob: $LOCKED_HOME_BLOB"
            echo 'Homepage normalized before/after: IDENTICAL'
            echo 'Catalog-wide purchaseability: PASS'
            echo 'Nine verified SOK batteries: DIRECT CHECKOUT PASS'
            echo 'PayPal live config: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
