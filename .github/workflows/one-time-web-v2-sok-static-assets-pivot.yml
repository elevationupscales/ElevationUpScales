name: One-time Web V2 SOK static-assets pivot

on:
  push:
    branches:
      - work/web-v2-sok-product-image-cleanup-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-sok-static-assets-pivot.yml

permissions:
  contents: write

jobs:
  pivot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-sok-product-image-cleanup-2026-09-13
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Move localized SOK images into Worker static assets and remove base64 bundling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web-v2/public/assets/brands/sok/sk12v100pc
          mkdir -p apps/web-v2/public/assets/brands/sok/sk48v100n
          mv site/assets/brands/sok/sk12v100pc/official-clean.png apps/web-v2/public/assets/brands/sok/sk12v100pc/official-clean.png
          mv site/assets/brands/sok/sk48v100n/official-clean.png apps/web-v2/public/assets/brands/sok/sk48v100n/official-clean.png
          python - <<'PY'
          from pathlib import Path

          index_path = Path('apps/web-v2/src/index.js')
          text = index_path.read_text()
          import_line = "import { SOK_SK12V100PC_PNG_BASE64, SOK_SK48V100N_PNG_BASE64 } from './sok-product-assets.js';\n"
          if import_line not in text:
              raise SystemExit('index.js: localized base64 import missing')
          text = text.replace(import_line, '', 1)

          helper_start = text.find('const SOK_PRODUCT_IMAGE_ASSETS = new Map([')
          helper_end = text.find('function response(body, init = {}) {', helper_start)
          if helper_start < 0 or helper_end < 0:
              raise SystemExit('index.js: embedded product-image helper bounds missing')
          text = text[:helper_start] + text[helper_end:]

          route_start = text.find("    const sokProductImage = SOK_PRODUCT_IMAGE_ASSETS.get(url.pathname);")
          route_end = text.find("    if (url.pathname === '/assets/app.css') {", route_start)
          if route_start < 0 or route_end < 0:
              raise SystemExit('index.js: embedded product-image route bounds missing')
          text = text[:route_start] + text[route_end:]
          index_path.write_text(text)

          Path('apps/web-v2/wrangler.jsonc').write_text('''{
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "elevation-web-v2",
            "main": "src/index.js",
            "compatibility_date": "2026-09-12",
            "workers_dev": true,
            "preview_urls": true,
            "version_metadata": { "binding": "CF_VERSION_METADATA" },
            "assets": { "directory": "./public" }
          }
          ''')

          tests_path = Path('apps/web-v2/test/shell.test.mjs')
          tests = tests_path.read_text()
          start = tests.find("test('SOK product showcase serves only the localized official clean photography'")
          end = tests.find("test('canonical catalog routes remain customer-safe'", start)
          if start < 0 or end < 0:
              raise SystemExit('shell.test.mjs: SOK regression block bounds missing')
          replacement = r'''test('SOK product showcase references repository-localized official clean photography', async () => {
            const expected = [
              ['/assets/brands/sok/sk12v100pc/official-clean.png', '../public/assets/brands/sok/sk12v100pc/official-clean.png', 'SK12V100PC'],
              ['/assets/brands/sok/sk48v100n/official-clean.png', '../public/assets/brands/sok/sk48v100n/official-clean.png', 'SK48V100N']
            ];
            const { readFile } = await import('node:fs/promises');
            for (const [, localPath] of expected) {
              const bytes = await readFile(new URL(localPath, import.meta.url));
              assert.ok(bytes.byteLength > 250000, `${localPath} should contain the localized official PNG bytes`);
              assert.equal(bytes.subarray(1, 4).toString('ascii'), 'PNG', localPath);
            }

            const home = await (await request('/')).text();
            for (const [publicPath, , sku] of expected) {
              assert.match(home, new RegExp(publicPath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')));
              assert.match(home, new RegExp(`alt="[^"]*${sku}[^"]*"`, 'i'));
            }
            assert.doesNotMatch(home, /sk48v100n\/(?:hero\.jpg|home-crop\.webp)|48v-battery-cabinet\/hero\.webp|Buy More,? Save More|static\.wixstatic\.com/i);

            const js = await (await request('/assets/app.js')).text();
            assert.doesNotMatch(js, /48v-battery-cabinet|home-crop\.webp|Buy More,? Save More|static\.wixstatic\.com/i);

            const css = await (await request('/assets/app.css')).text();
            assert.match(css, /hero-product-12 img/);
            assert.match(css, /hero-product-48 img/);
            assert.match(css, /background:#f3f5f5/);
          });

          '''
          tests_path.write_text(tests[:start] + replacement + tests[end:])

          provenance_path = Path('operations/vendor-project-sources/SOK_PRODUCT_IMAGE_PROVENANCE_2026-09-13.md')
          provenance = provenance_path.read_text()
          provenance = provenance.replace('site/assets/brands/sok/sk12v100pc/official-clean.png', 'apps/web-v2/public/assets/brands/sok/sk12v100pc/official-clean.png')
          provenance = provenance.replace('site/assets/brands/sok/sk48v100n/official-clean.png', 'apps/web-v2/public/assets/brands/sok/sk48v100n/official-clean.png')
          provenance_path.write_text(provenance)
          PY
          rm apps/web-v2/src/sok-product-assets.js
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check

      - name: Commit static-assets pivot and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-sok-static-assets-pivot.yml
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Web V2: serve localized SOK product images as static assets'
          git push origin HEAD:work/web-v2-sok-product-image-cleanup-2026-09-13
