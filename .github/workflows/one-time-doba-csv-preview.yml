name: One-Time Doba CSV Sync Preview

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  preview-doba-csv-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out Doba CSV release
        uses: actions/checkout@v6
        with:
          ref: release/doba-csv-sync
          fetch-depth: 0

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d5a90267b59f372ed7dcfc2f9ae7d2e3bbc73927"
          for f in site/doba-csv-sync-runtime.js site/doba-csv-sync.js site/admin-channels.html site/admin-channels.js site/sync-admin-runtime.js site/_worker.js; do test -f "$f"; done
          node --check site/doba-csv-sync-runtime.js
          node --check site/doba-csv-sync.js
          node --check site/admin-channels.js
          node --check site/sync-admin-runtime.js
          node --check site/admin-command-center.js
          node --check site/admin-overview.js
          node --check site/_worker.js
          grep -q 'Doba — CSV Sync' site/admin-channels.html
          grep -q 'Partial Snapshot — default' site/admin-channels.html
          grep -q 'Preview Diff' site/admin-channels.html
          grep -q 'Dropshipping Price ÷ 1.25' site/admin-channels.html
          grep -q 'DEFAULT_PROFILE_NAME = "Doba Download Center — 25% Markup"' site/doba-csv-sync-runtime.js
          grep -q 'snapshot_scope' site/doba-csv-sync-runtime.js
          grep -q 'REVIEW — SUPPLIER SKU CHANGED' site/doba-csv-sync-runtime.js
          grep -q 'NEW / DRAFT' site/doba-csv-sync-runtime.js
          grep -q 'file_fingerprint' site/doba-csv-sync-runtime.js
          grep -q 'alreadyApplied' site/doba-csv-sync-runtime.js
          grep -q 'doba:{configured:true,mode:"csv",label:"Doba — CSV Sync"}' site/sync-admin-runtime.js
          ! grep -q 'DOBA_FEED_URL' site/sync-admin-runtime.js
          ! grep -q 'DOBA_APP_KEY' site/sync-admin-runtime.js
          grep -q 'handleDobaCsvSyncAdminApi' site/_worker.js
          test ! -d .staging/doba

      - name: Deploy isolated Doba preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=doba-csv-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL%/}"
          for route in /admin /admin-channels /admin-catalog /admin-inventory /admin-store-orders /admin-lithium-shipping /store /marketplace /checkout /start-a-project /solar-project /hawaii-lithium-batteries /doba-csv-sync.js; do
            code=$(curl --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-doba --write-out '%{http_code}' "${base}${route}" || true)
            echo "${route} -> ${code:-curl-error}"
            test "$code" = "200"
          done
          channels=$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/admin-channels")
          ui=$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/doba-csv-sync.js")
          syncjs=$(curl --silent --show-error --location --retry 6 --retry-all-errors "${base}/sync-admin-runtime.js" || true)
          printf '%s' "$channels" | grep -q 'Doba — CSV Sync'
          printf '%s' "$channels" | grep -q 'Partial Snapshot — default'
          printf '%s' "$channels" | grep -q 'Preview Diff'
          printf '%s' "$ui" | grep -q '32-row audit baseline'
          printf '%s' "$ui" | grep -q 'No Catalog or Inventory product fields have been mutated yet'
          api_code=$(curl --silent --output /tmp/doba-api --write-out '%{http_code}' "${base}/api/admin/doba-csv-sync" || true)
          echo "unauth Doba API -> $api_code"
          test "$api_code" = "401"
          runtime_code=$(curl --silent --output /tmp/doba-runtime --write-out '%{http_code}' "${base}/doba-csv-sync-runtime.js" || true)
          echo "protected runtime -> $runtime_code"
          test "$runtime_code" = "404"
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping /api/admin/sync; do
            code=$(curl --silent --output /tmp/protected --write-out '%{http_code}' "${base}${api}" || true)
            echo "protected ${api} -> ${code}"
            test "$code" = "401"
          done

      - name: Record preview receipt
        shell: bash
        run: |
          {
            echo '### Doba CSV Sync Preview'
            echo "Application SHA: $(git rev-parse HEAD)"
            echo "Preview: ${{ steps.deploy.outputs.deployment-url }}"
            echo 'Doba mode: CSV Sync / no API-feed prerequisite'
            echo 'Preview-first mutation boundary: PASS'
            echo 'Unauthenticated Admin boundary: PASS'
            echo 'Exact 32-row raw-file ingestion: pending owner CSV upload; workbook audit baseline is encoded in acceptance UI.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove preview workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-doba-csv-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed Doba CSV preview workflow'
          git push origin main
