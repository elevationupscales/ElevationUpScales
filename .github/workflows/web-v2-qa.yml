name: Web V2 Release Foundation QA

on:
  push:
    branches:
      - 'work/web-v2-*'
    paths:
      - 'apps/web-v2/**'
      - 'deployment/v2/**'
      - '.github/workflows/web-v2-qa.yml'
      - '.github/workflows/web-v2-release.yml'
  pull_request:
    paths:
      - 'apps/web-v2/**'
      - 'deployment/v2/**'
      - '.github/workflows/web-v2-qa.yml'
      - '.github/workflows/web-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json

      - name: Require committed lockfile
        run: test -f apps/web-v2/package-lock.json

      - name: Install exact locked Wrangler toolchain
        working-directory: apps/web-v2
        run: npm ci --ignore-scripts

      - name: Verify exact Wrangler pin
        working-directory: apps/web-v2
        run: |
          set -euo pipefail
          VERSION="$(npx --no-install wrangler --version)"
          echo "$VERSION"
          [[ "$VERSION" == *"4.129.0"* ]]

      - name: Validate release foundation contract
        run: |
          set -euo pipefail
          node deployment/v2/validate-foundation.mjs
          node --test deployment/v2/release-policy.test.mjs
          npm run qa:secrets
          git diff --check
          test -z "$(git status --porcelain)"
