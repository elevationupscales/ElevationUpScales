name: Web V2 Release Foundation QA

on:
  push:
    branches:
      - 'work/web-v2-*'
    paths:
      - 'apps/web-v2/**'
      - 'deployment/v2/**'
      - '.github/workflows/web-v2-qa.yml'
      - '.github/workflows/web-v2-release.yml'
  pull_request:
    paths:
      - 'apps/web-v2/**'
      - 'deployment/v2/**'
      - '.github/workflows/web-v2-qa.yml'
      - '.github/workflows/web-v2-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate missing lockfile for first foundation pass
        id: lock
        working-directory: apps/web-v2
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            npm install --package-lock-only --ignore-scripts
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated lockfile to this work branch
        if: steps.lock.outputs.generated == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-v2/package-lock.json
          git commit -m "Phase 1 Step 3: lock Web V2 Wrangler dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install exact locked Wrangler when lock is committed
        if: steps.lock.outputs.generated == 'false'
        working-directory: apps/web-v2
        run: npm ci --ignore-scripts

      - name: Verify exact Wrangler pin when lock is committed
        if: steps.lock.outputs.generated == 'false'
        working-directory: apps/web-v2
        run: |
          set -euo pipefail
          VERSION="$(npx --no-install wrangler --version)"
          echo "$VERSION"
          [[ "$VERSION" == *"4.129.0"* ]]

      - name: Validate release foundation contract
        run: |
          set -euo pipefail
          node deployment/v2/validate-foundation.mjs
          node --test deployment/v2/release-policy.test.mjs
          npm run qa:secrets
          git diff --check

      - name: Require a clean tree once lockfile is committed
        if: steps.lock.outputs.generated == 'false'
        run: test -z "$(git status --porcelain)"

      - name: Lockfile bootstrap notice
        if: steps.lock.outputs.generated == 'true'
        run: echo "LOCKFILE_COMMITTED_TO_WORK_BRANCH"
