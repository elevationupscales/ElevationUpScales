name: One-Time Elevation 4.4 Homepage Concepts Preview v2

on:
  push:
    branches: [preview/4.4-homepage-concepts-2026-08-31]
    paths:
      - .github/workflows/one-time-44-homepage-concepts-preview-v2.yml

permissions:
  contents: read
  deployments: write

env:
  EXPECTED_MAIN_SHA: 1809f257c7af31ef51f34673226d5adfcdf9b929
  PREVIEW_BRANCH: preview/4.4-homepage-concepts-2026-08-31

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out concepts
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PREVIEW_BRANCH }}
          fetch-depth: 0

      - name: Verify preview-only scope and production homepage preservation
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git diff --quiet "$EXPECTED_MAIN_SHA"...HEAD -- site/index.html
          changed="$(git diff --name-only "$EXPECTED_MAIN_SHA"...HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/one-time-44-homepage-concepts-preview.yml|.github/workflows/one-time-44-homepage-concepts-preview-v2.yml|site/home-concepts.css|site/home-concept-minimal.html|site/home-concept-funnel.html|site/home-concept-built-off-grid.html|site/home-concept-commerce.html)$' | grep -q .; then
            echo 'Unexpected file outside homepage preview scope'; exit 1
          fi
          git diff --check

      - name: Verify all concept requirements
        run: |
          set -euo pipefail
          pages=(site/home-concept-minimal.html site/home-concept-funnel.html site/home-concept-built-off-grid.html site/home-concept-commerce.html)
          routes=(/start-a-project /home-services /rv-services /solar-services /solar-project /lithium-batteries /rv-store /store /marketplace /hawaii-lithium-batteries /work-with-us /privacy)
          for page in "${pages[@]}"; do
            echo "checking $page"
            grep -q 'name="robots" content="noindex,nofollow"' "$page" || { echo "$page missing noindex"; exit 1; }
            grep -q 'PRODUCTION HOME UNCHANGED' "$page" || { echo "$page missing preview banner"; exit 1; }
            grep -q 'tel:+12088134998' "$page" || { echo "$page missing phone href"; exit 1; }
            grep -q '208-813-4998' "$page" || { echo "$page missing phone display"; exit 1; }
            grep -q '/assets/logo-mark.webp' "$page" || { echo "$page missing logo mark"; exit 1; }
            grep -q '/assets/logo.webp' "$page" || { echo "$page missing footer logo"; exit 1; }
            for route in "${routes[@]}"; do grep -q "$route" "$page" || { echo "$page missing $route"; exit 1; }; done
          done
          grep -q 'Built for the way you live, travel and power it.' site/home-concept-minimal.html
          grep -q 'What are you here to do?' site/home-concept-funnel.html
          grep -q 'Elevation was built on the same kind of power systems' site/home-concept-built-off-grid.html
          grep -q 'Power. Gear. Projects. One Elevation.' site/home-concept-commerce.html
          grep -q 'hero-tile-project.webp' site/home-concepts.css
          grep -q 'home-services-hero-bathroom.webp' site/home-concepts.css
          grep -q 'hero-galaxy-rv.webp' site/home-concept-funnel.html
          grep -q 'hero-galaxy-rv.webp' site/home-concept-built-off-grid.html
          grep -q 'elevation-lithium-social-card.webp' site/home-concept-commerce.html
          test -z "$(find site -type f -size +25M -print -quit)"
          ! grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site

      - name: Deploy one isolated preview containing all four concepts
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=homepage-concepts-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify preview routes, links and production-root preservation
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          declare -A phrases
          phrases[/home-concept-minimal]='Built for the way you live, travel and power it.'
          phrases[/home-concept-funnel]='What are you here to do?'
          phrases[/home-concept-built-off-grid]='Elevation was built on the same kind of power systems'
          phrases[/home-concept-commerce]='Power. Gear. Projects. One Elevation.'
          for route in /home-concept-minimal /home-concept-funnel /home-concept-built-off-grid /home-concept-commerce; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/concept.html -w '%{http_code}' "$base$route")
            echo "$route=$code"; test "$code" = "200"
            grep -q 'PRODUCTION HOME UNCHANGED' /tmp/concept.html
            grep -q 'noindex,nofollow' /tmp/concept.html
            grep -q "${phrases[$route]}" /tmp/concept.html
          done
          curl -sS -L --fail "$base/" -o /tmp/root.html
          grep -q 'Elevate' /tmp/root.html
          grep -q 'Beyond' /tmp/root.html
          ! grep -q 'HOMEPAGE CONCEPT PREVIEW' /tmp/root.html
          for route in /start-a-project /home-services /rv-services /solar-services /solar-project /lithium-batteries /rv-store /store /marketplace /hawaii-lithium-batteries /work-with-us /privacy; do
            code=$(curl -sS -L --retry 5 --retry-all-errors --retry-delay 1 -o /dev/null -w '%{http_code}' "$base$route")
            echo "linked:$route=$code"; test "$code" = "200"
          done

      - name: Record preview receipt
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          base="${BASE%/}"
          echo '### Elevation 4.4 Homepage Concepts — PREVIEW READY' >> "$GITHUB_STEP_SUMMARY"
          echo "Parent/current main: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Concept branch SHA: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Minimal: $base/home-concept-minimal" >> "$GITHUB_STEP_SUMMARY"
          echo "Funnel: $base/home-concept-funnel" >> "$GITHUB_STEP_SUMMARY"
          echo "Built Off-Grid: $base/home-concept-built-off-grid" >> "$GITHUB_STEP_SUMMARY"
          echo "Commerce Hub: $base/home-concept-commerce" >> "$GITHUB_STEP_SUMMARY"
          echo 'Production homepage source unchanged: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Required routes/contact/real assets: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Status: PREVIEW READY — MANAGEMENT SELECTION REQUIRED' >> "$GITHUB_STEP_SUMMARY"
