name: One-Time Storefront First-Pass Production

on:
  push:
    branches: [release/storefront-first-pass-2026-08-31]
    paths:
      - .github/workflows/one-time-storefront-first-pass-production.yml

permissions:
  contents: read
  deployments: write
  actions: read

env:
  EXPECTED_MAIN_SHA: ea26349c836fe8389a7170ca618fa3ccbb4b75e7
  VERIFIED_SITE_SHA: 03c83ef6e4b9deae5610c0d4bd29ac606060dff4
  PREVIEW_RUN_ID: '33428246549'
  RELEASE_BRANCH: release/storefront-first-pass-2026-08-31
  CANONICAL_BASE: https://elevationupscales.com

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out verified candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_BRANCH }}
          fetch-depth: 0

      - name: Reconfirm preview, lineage and exact site tree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git merge-base --is-ancestor "$EXPECTED_MAIN_SHA" HEAD
          git diff --quiet "$VERIFIED_SITE_SHA" HEAD -- site
          preview_json=$(curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIEW_RUN_ID}")
          PREVIEW_JSON="$preview_json" python - <<'PY'
          import json,os
          r=json.loads(os.environ['PREVIEW_JSON'])
          assert r.get('conclusion')=='success', r.get('conclusion')
          assert r.get('head_sha')==os.environ['VERIFIED_SITE_SHA'], (r.get('head_sha'),os.environ['VERIFIED_SITE_SHA'])
          print('Verified preview run:',r.get('id'),r.get('conclusion'),r.get('head_sha'))
          PY
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check "$EXPECTED_MAIN_SHA"..."$VERIFIED_SITE_SHA"
          git worktree add --detach /tmp/storefront-rollback "$EXPECTED_MAIN_SHA"

      - name: Deploy verified candidate to production
        id: production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production deployment
        env:
          BASE: ${{ steps.production.outputs.deployment-url }}
        run: |
          set -euo pipefail
          python scripts/verify_storefront.py 2>/dev/null && exit 0 || true
          verify_base() {
            local base="${1%/}" label="$2"
            for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project /admin; do
              code=$(curl -sS -L --retry 10 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
              echo "$label$route=$code"; test "$code" = "200"
            done
            for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping; do
              code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' "$base$api" || true); test "$code" = "401"
            done
            curl -sS -L --fail "$base/store" -o /tmp/apparel.html
            grep -q 'True Grit Trucker Hat' /tmp/apparel.html
            curl -sS -L --fail "$base/api/store-checkout/config" -o /tmp/checkout-config.json
            python - <<'PY'
          import json
          d=json.load(open('/tmp/checkout-config.json'))
          assert d.get('configured') is True
          assert d.get('checkoutEnabled') is True
          assert d.get('liveCheckoutApproved') is True
          assert d.get('environment')=='live'
          PY
            curl -sS -L --fail -D /tmp/lithium.headers "$base/lithium-batteries" -o /tmp/lithium.html
            curl -sS -L --fail -D /tmp/rv.headers "$base/rv-store" -o /tmp/rv.html
            curl -sS -L --fail "$base/api/store/catalog?section=lithium-batteries" -H 'Accept: application/json' -o /tmp/lithium.json
            curl -sS -L --fail "$base/api/store-catalog?section=rv-outdoor" -H 'Accept: application/json' -o /tmp/rv.json
            LABEL="$label" python - <<'PY'
          import json,re,html,os
          def rows(path, section):
              data=json.load(open(path,encoding='utf-8')); out=[]
              for p in data.get('products',[]):
                  if not p: continue
                  status=str(p.get('publishStatus') or '').strip().lower()
                  if status and status!='published': continue
                  try: price=float(p.get('priceCents') or 0)
                  except: price=0
                  if price<=0: continue
                  stock=p.get('supplierStock')
                  try:
                      if stock is not None and float(stock)<=0: continue
                  except: pass
                  if section=='rv' and str(p.get('shippingStatus') or '').strip().lower()=='unverified': continue
                  out.append(p)
              return out
          lithium_rows=rows('/tmp/lithium.json','lithium'); rv_rows=rows('/tmp/rv.json','rv')
          lh=open('/tmp/lithium.html',encoding='utf-8').read(); rh=open('/tmp/rv.html',encoding='utf-8').read()
          if not lithium_rows or not rv_rows: raise SystemExit('Published storefront set unexpectedly empty')
          lm=re.search(r'<strong data-lithium-count>(\d+)</strong>',lh); rm=re.search(r'<span id="rv-count">(\d+)</span>',rh)
          assert lm and int(lm.group(1))==len(lithium_rows),(lm.group(1) if lm else None,len(lithium_rows))
          assert rm and int(rm.group(1))==len(rv_rows),(rm.group(1) if rm else None,len(rv_rows))
          assert '0 current products' not in lh and 'Loading products' not in lh
          assert '0 current products' not in rh and 'Loading products' not in rh
          assert 'data-prerendered="true"' in lh and 'data-prerendered="true"' in rh
          lnames=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="lithium-card"[\s\S]*?<h3>(.*?)</h3>',lh)][:5]
          rnames=[html.unescape(re.sub('<[^>]+>','',x)).strip() for x in re.findall(r'<article class="rv-product-card"[\s\S]*?<h3>(.*?)</h3>',rh)][:5]
          assert len(lnames)>=3 and len(rnames)>=3
          cards=re.findall(r'<article class="lithium-card"[^>]*data-shipping-status="([^"]*)"[\s\S]*?<div class="lithium-card__shipping [^"]*" data-hawaii-status>(.*?)</div>',lh)
          for raw_status,raw_label in cards:
              status=html.unescape(raw_status).strip().lower(); label=html.unescape(re.sub('<[^>]+>','',raw_label)).strip()
              expected='Ships to the Lower 48' if status=='verified' else ('Shipping quote required' if status=='quote_required' else 'Check shipping availability')
              assert label==expected,(status,label,expected)
          evidence={'surface':os.environ['LABEL'],'lithium':{'count':len(lithium_rows),'names':lnames},'rv':{'count':len(rv_rows),'names':rnames}}
          json.dump(evidence,open(f"/tmp/storefront-{os.environ['LABEL']}.json",'w'),indent=2)
          print(json.dumps(evidence,indent=2))
          PY
            grep -qi 'x-eus-storefront-prerender: lithium:' /tmp/lithium.headers
            grep -qi 'x-eus-storefront-prerender: rv:' /tmp/rv.headers
          }
          verify_base "$BASE" deployment
          verify_base "$CANONICAL_BASE" canonical

      - name: Record production evidence
        if: success()
        env:
          BASE: ${{ steps.production.outputs.deployment-url }}
        run: |
          echo '### Storefront first-pass production gate — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Verified site SHA: $VERIFIED_SITE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview run: $PREVIEW_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deployment: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical: $CANONICAL_BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Non-JS Catalog acceptance: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checkout config: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel regression: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Admin auth boundary: PASS' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/storefront-deployment.json >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/storefront-canonical.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-first-pass-production-evidence
          path: |
            /tmp/storefront-deployment.json
            /tmp/storefront-canonical.json
            /tmp/checkout-config.json
            /tmp/lithium.headers
            /tmp/rv.headers
          retention-days: 30

      - name: Roll back Pages production if verification fails
        if: failure() && steps.production.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/storefront-rollback/site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
