name: One-Time 4.5 Lithium Classifier Repair
on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths: [.github/workflows/one-time-45-lithium-classifier-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Apply classifier repair
        run: python .github/scripts/repair_45_lithium_classifier.py
      - name: Validate and commit application repair
        shell: bash
        run: |
          set -euo pipefail
          node --check site/promotion-runtime.js
          node --check site/store-checkout-server.js
          git diff --check
          grep -q 'const identity=\[product?.title,product?.name,product?.sku,product?.supplierSku\]' site/promotion-runtime.js
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/promotion-runtime.js
          git commit -m "Fix Lithium battery identity classification"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
