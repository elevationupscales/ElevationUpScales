name: Release Candidate Gate

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch or commit to validate against the current main baseline
        required: true
        type: string
      expected_parent_sha:
        description: Current main SHA the candidate was intentionally built from
        required: true
        type: string
      release_label:
        description: Human-readable candidate label for the deployment receipt
        required: false
        default: controlled-candidate
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-release-candidate-preview
  cancel-in-progress: false

jobs:
  validate-and-preview:
    name: Validate exact candidate and deploy isolated preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Enforce current-main ancestry
        id: lineage
        shell: bash
        env:
          EXPECTED_PARENT: ${{ inputs.expected_parent_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          current_main="$(git rev-parse origin/main)"
          candidate_sha="$(git rev-parse HEAD)"
          expected_parent="$(printf '%s' "$EXPECTED_PARENT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"

          if [[ -z "$expected_parent" || "$expected_parent" != "$current_main" ]]; then
            echo "BLOCKED: expected parent $expected_parent does not match current main $current_main."
            echo "Rebase/rebuild the candidate from current main before previewing it."
            exit 1
          fi

          if [[ "$candidate_sha" == "$current_main" ]]; then
            echo "BLOCKED: candidate_ref points to main itself. Use the standard deploy workflow for a main preview."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$current_main" "$candidate_sha"; then
            echo "BLOCKED: current main is not an ancestor of candidate $candidate_sha."
            exit 1
          fi

          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Current main: $current_main"
          echo "Candidate: $candidate_sha"

      - name: Report delta and protect release controls
        shell: bash
        env:
          CURRENT_MAIN: ${{ steps.lineage.outputs.current_main }}
        run: |
          set -euo pipefail
          git diff --name-status "$CURRENT_MAIN"...HEAD
          changed="$(git diff --name-only "$CURRENT_MAIN"...HEAD)"
          test -n "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/deploy-pages\.yml|BASELINE-2026-08-23\.md|SOURCE-LINEAGE\.md)$'; then
            echo "BLOCKED: candidate changes protected production deployment/baseline controls."
            exit 1
          fi

      - name: Canonical clean-baseline QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --check

      - name: Enforce Pages limits and block credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"
          test -z "$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site src; then
            echo "BLOCKED: credential-like value found in deployable source."
            exit 1
          fi

      - name: Deploy isolated candidate preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=candidate-gate-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Canonical clean-baseline preview regression
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          bash deployment/qa/clean-baseline-preview.sh "$DEPLOYMENT_URL"

      - name: Record release-candidate receipt
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          CURRENT_MAIN: ${{ steps.lineage.outputs.current_main }}
          CANDIDATE_SHA: ${{ steps.lineage.outputs.candidate_sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Elevation UpScales controlled candidate — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $RELEASE_LABEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Required parent: $CURRENT_MAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical static QA: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical preview regression: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion: NOT PERFORMED" >> "$GITHUB_STEP_SUMMARY"
