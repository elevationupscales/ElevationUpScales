name: Release Candidate Preview

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch or commit to preview
        required: true
        type: string
      release_label:
        description: Optional label for the preview receipt
        required: false
        default: annotated-edit
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: elevation-release-candidate-preview
  cancel-in-progress: true

jobs:
  validate-and-preview:
    name: Validate branch and deploy preview
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Verify candidate is based on current main
        id: lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          current_main="$(git rev-parse origin/main)"
          candidate_sha="$(git rev-parse HEAD)"

          if [[ "$candidate_sha" == "$current_main" ]]; then
            echo "Use the standard deploy workflow when previewing main itself."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$current_main" "$candidate_sha"; then
            echo "Candidate is stale. Rebase or recreate it from current main, then retry."
            exit 1
          fi

          echo "current_main=$current_main" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

      - name: Review changed files and protect recovery controls
        shell: bash
        env:
          CURRENT_MAIN: ${{ steps.lineage.outputs.current_main }}
        run: |
          set -euo pipefail
          git diff --name-status "$CURRENT_MAIN"...HEAD
          changed="$(git diff --name-only "$CURRENT_MAIN"...HEAD)"
          test -n "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(\.github/workflows/deploy-pages\.yml|coordination/baselines/HARD-BASELINE-2026-09-06\.md)$'; then
            echo "Protected recovery/deployment control changed. Review that change separately."
            exit 1
          fi

      - name: Run committed-source QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --check
          git diff --exit-code

      - name: Block credentials and oversized deploy artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm run qa:secrets
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"

      - name: Deploy isolated preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=candidate-gate-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run preview regression checks
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          npm run qa:preview -- "$DEPLOYMENT_URL"

      - name: Record preview receipt
        shell: bash
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          CURRENT_MAIN: ${{ steps.lineage.outputs.current_main }}
          CANDIDATE_SHA: ${{ steps.lineage.outputs.candidate_sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Elevation UpScales preview — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Change: $RELEASE_LABEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Main: $CURRENT_MAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion: NOT PERFORMED" >> "$GITHUB_STEP_SUMMARY"
