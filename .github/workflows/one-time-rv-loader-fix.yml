name: One-Time RV Loader Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ contains(github.event.head_commit.message, '[rv-loader-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Add direct-checkout routing loader and bust catalog cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('site/rv-store.html')
          s = p.read_text()
          old = '<script defer src="rv-ebay-catalog.js?v=3.11.35"></script><script defer src="rv-store.js?v=3.11.37"></script>'
          new = '<script defer src="rv-ebay-catalog.js?v=3.11.43"></script><script defer src="rv-store.js?v=3.11.37"></script><script defer src="rv-checkout-routing.js?v=3.11.43"></script>'
          if old not in s and 'rv-checkout-routing.js?v=3.11.43' not in s:
              raise SystemExit('Expected RV script loader sequence not found')
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('Each Buy Now button opens that exact product listing on eBay.', 'Verified products can use secure Elevation checkout; anything not approved continues to the exact eBay listing.')
          s = s.replace('<strong>Direct eBay checkout path</strong><span>Buy Now opens the exact product listing on eBay.</span>', '<strong>Safe checkout routing</strong><span>Verified items can check out with Elevation; all other items keep the exact eBay fallback.</span>')
          p.write_text(s)
          PY
          grep -q 'rv-checkout-routing.js?v=3.11.43' site/rv-store.html
          grep -q 'rv-ebay-catalog.js?v=3.11.43' site/rv-store.html
          grep -q 'Safe checkout routing' site/rv-store.html
          node --check site/rv-checkout-routing.js
          node --check site/rv-ebay-catalog.js

      - name: Commit loader fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/rv-store.html
          git commit -m 'Load RV direct checkout routing and bust catalog cache'
          git push origin HEAD:main
