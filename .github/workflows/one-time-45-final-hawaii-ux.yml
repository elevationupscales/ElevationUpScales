name: One-Time 4.5 Final Hawaii UX Repair

on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths:
      - .github/workflows/one-time-45-final-hawaii-ux.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Apply final Hawaii customer experience and prerender repair
        run: python .github/scripts/apply_45_final_hawaii_ux.py
      - name: Validate repaired application
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find site -type f -name '*.js' -print0)
          git diff --check
          grep -q '"/hawaii-lithium-batteries"' site/_routes.json
          grep -q 'hawaii-address-delivery' site/shipping-rules-runtime.js
          grep -q 'certaintyState' site/admin-shipping-rules.js
          grep -q 'Honolulu warehouse / freight-terminal pickup location' site/hawaii-lithium-batteries.html
          grep -q 'WHAT HAPPENS NEXT' site/checkout/index.html
          grep -q 'paymentAllowed:(hawaiiStatus?.customerState||"review_required")==="shipping_available"' site/store-checkout-server.js
          grep -q 'quote.hawaii && quote.hawaii.customerState !== "shipping_available"' site/store-checkout.js
          grep -q 'Address Delivery</strong><span>Additional charge · quote required' site/_worker.js
          ! grep -q 'Reserve the order for freight coordination before payment' site/store-checkout.js
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site
          git commit -m "Finalize 4.5 Hawaii pickup checkout and prerender"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
