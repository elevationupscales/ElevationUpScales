name: Worker Exact-SHA Release
run-name: Worker ${{ inputs.target }} — ${{ inputs.expected_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Approved current main SHA (full 40 characters)
        required: true
        type: string
      target:
        description: Preview first, then production for the same SHA
        required: true
        default: preview
        type: choice
        options: [preview, production]
      production_confirmation:
        description: Production requires exact DEPLOY
        required: false
        type: string

permissions:
  contents: read
  actions: read
  statuses: write
  deployments: write

# Serialize with the existing production workflow, including preview evidence changes.
concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  EXPECTED_SHA: ${{ inputs.expected_sha }}
  TARGET: ${{ inputs.target }}
  CONFIRMATION: ${{ inputs.production_confirmation }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Reuse existing credentials/approvals. Cloudflare branch determines deployment target.
    environment: production
    steps:
      - name: Validate dispatch inputs
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$TARGET" == preview || "$TARGET" == production ]]
          if [[ "$TARGET" == production ]]; then
            [[ "$CONFIRMATION" == DEPLOY ]] || { echo 'Production requires exact DEPLOY'; exit 1; }
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Verify approved current main
        id: preflight
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)" HEAD_SHA="$(git rev-parse HEAD)" node - <<'JS'
          require('./deployment/release/worker-release.cjs').validate({
            sha: process.env.EXPECTED_SHA, main: process.env.MAIN_SHA, head: process.env.HEAD_SHA,
            ref: process.env.GITHUB_REF, target: process.env.TARGET, confirmation: process.env.CONFIRMATION
          });
          JS
      - name: Require successful same-SHA preview
        if: inputs.target == 'production'
        uses: actions/github-script@v8
        with:
          script: |
            const { requirePreview } = require('./deployment/release/worker-release.cjs');
            await requirePreview(github, context.repo, process.env.EXPECTED_SHA, process.env.GITHUB_SERVER_URL);
      - name: Mark preview pending
        if: inputs.target == 'preview'
        uses: actions/github-script@v8
        with:
          script: |
            const { CONTEXT } = require('./deployment/release/worker-release.cjs');
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.EXPECTED_SHA,
              context: CONTEXT, state: 'pending', description: 'Worker preview running',
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - name: Canonical QA and release policy tests
        run: |
          set -euo pipefail
          node --test tests/worker-release.test.cjs
          npm run qa
          git diff --check
          git diff --exit-code
      - name: Credentials and artifact limits
        run: |
          set -euo pipefail
          npm run qa:secrets
          test "$(find site -type f | wc -l)" -le 20000
          test -z "$(find site -type f -size +25M -print -quit)"
      - name: Recheck main immediately before deploy
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          if [[ "$(git rev-parse origin/main)" != "$EXPECTED_SHA" || "$(git rev-parse HEAD)" != "$EXPECTED_SHA" ]]; then
            echo 'Main changed. Refresh/review the new main SHA before retrying.'
            exit 1
          fi
          git diff --exit-code
      - name: Deploy exact checked-out SHA
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ inputs.target == 'production' && 'main' || 'worker-exact-preview' }} --commit-hash=${{ inputs.expected_sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke exact deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          npm run qa:preview -- "$DEPLOYMENT_URL"
      - name: Smoke canonical production
        if: inputs.target == 'production'
        run: |
          set -euo pipefail
          sleep 10
          npm run qa:preview -- https://elevationupscales.com
      - name: Record preview result
        if: always() && inputs.target == 'preview' && steps.preflight.outcome == 'success'
        uses: actions/github-script@v8
        env:
          RESULT: ${{ job.status }}
        with:
          script: |
            const { CONTEXT } = require('./deployment/release/worker-release.cjs');
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.EXPECTED_SHA,
              context: CONTEXT, state: process.env.RESULT === 'success' ? 'success' : 'failure',
              description: `Worker preview ${process.env.RESULT}`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
      - name: One release receipt
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Worker release — $RESULT"
            echo "Target: $TARGET"
            echo "SHA: $EXPECTED_SHA"
            echo "Deployment: ${DEPLOYMENT_URL:-not deployed}"
            if [[ "$TARGET" == production && "$RESULT" == success ]]; then
              echo 'Canonical: https://elevationupscales.com — PASS'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
