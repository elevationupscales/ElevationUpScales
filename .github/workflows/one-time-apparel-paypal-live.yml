name: One-Time Apparel PayPal Live Activation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: apparel-paypal-live-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ contains(github.event.head_commit.message, '[apparel-paypal-live]') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Validate live checkout guards
        shell: bash
        run: |
          set -euo pipefail
          node --check site/store-checkout-server.js
          node --check site/store-checkout-routing.js
          node --check site/rv-checkout-routing.js
          grep -q 'STORE_LIVE_CHECKOUT_ENABLED' site/store-checkout-server.js
          grep -q 'liveCheckoutApproved' site/store-checkout-server.js
          grep -q 'config?.environment === "live"' site/store-checkout-routing.js
          grep -q 'RV direct checkout is intentionally held' site/rv-checkout-routing.js

      - name: Install Wrangler
        shell: bash
        run: npm install --no-save wrangler@4

      - name: Enable production live checkout flag
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set -euo pipefail
          printf '%s' 'true' | npx wrangler pages secret put STORE_LIVE_CHECKOUT_ENABLED --project-name="$CLOUDFLARE_PAGES_PROJECT"

      - name: Deploy live checkout configuration to production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify real PayPal Apparel checkout is live
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          for route in / /store /checkout /rv-store; do
            code=$(curl --silent --show-error --location --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 45 --output /tmp/eus-page.html --write-out '%{http_code}' "${PRODUCTION_URL}${route}" || true)
            test "$code" = "200"
          done
          curl --silent --show-error --fail --location --retry 10 --retry-all-errors --retry-delay 2 "${PRODUCTION_URL}/api/store-checkout/config" > /tmp/paypal-config.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('/tmp/paypal-config.json','utf8'));
          const safe = {
            environment: c.environment,
            credentialsConfigured: c.credentialsConfigured === true,
            checkoutEnabled: c.checkoutEnabled === true,
            liveCheckoutApproved: c.liveCheckoutApproved === true,
            clientIdPresent: Boolean(c.clientId),
          };
          console.log(JSON.stringify(safe));
          if (safe.environment !== 'live') throw new Error('PayPal environment is not live');
          if (!safe.credentialsConfigured) throw new Error('Live PayPal credentials are not configured');
          if (!safe.checkoutEnabled) throw new Error('Checkout did not enable');
          if (!safe.liveCheckoutApproved) throw new Error('Live checkout approval flag did not activate');
          if (!safe.clientIdPresent) throw new Error('Live client ID was not exposed to checkout after activation');
          NODE
          curl --silent --show-error --fail --location --retry 10 --retry-all-errors "${PRODUCTION_URL}/store-checkout-routing.js" > /tmp/store-routing.js
          grep -q 'config?.environment === "live"' /tmp/store-routing.js
          grep -q 'config?.liveCheckoutApproved === true' /tmp/store-routing.js
          curl --silent --show-error --fail --location --retry 10 --retry-all-errors "${PRODUCTION_URL}/rv-checkout-routing.js" > /tmp/rv-routing.js
          grep -q 'RV direct checkout is intentionally held' /tmp/rv-routing.js

      - name: Record activation receipt
        run: |
          echo '### Apparel PayPal live activation' >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal environment: live' >> "$GITHUB_STEP_SUMMARY"
          echo 'Live credentials: configured' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel real-money checkout: ENABLED' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV direct checkout: still held on eBay' >> "$GITHUB_STEP_SUMMARY"
