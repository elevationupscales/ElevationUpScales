name: One-time Web V2 solar semantic fallback

on:
  push:
    branches:
      - work/web-v2-final-functional-visual-finish-2026-09-13
    paths:
      - .github/workflows/one-time-web-v2-solar-semantic-fallback.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/web-v2-final-functional-visual-finish-2026-09-13
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-v2/package-lock.json
      - name: Replace broken solar card imagery with semantic solar icon
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          shell_path = Path('apps/web-v2/src/shell.js')
          shell = shell_path.read_text()
          old = "  { title: 'Solar & Off-Grid', copy: 'Build your energy independence with solar and storage.', href: '/solar-project', label: 'Shop Solar', image: '/assets/hero/power-social.webp' },"
          new = "  { title: 'Solar & Off-Grid', copy: 'Build your energy independence with solar and storage.', href: '/solar-project', label: 'Shop Solar', icon: 'solar' },"
          if old not in shell:
              raise SystemExit('homepage solar solution card anchor missing')
          shell_path.write_text(shell.replace(old, new, 1))

          catalog_path = Path('apps/web-v2/src/catalog-pages.js')
          catalog = catalog_path.read_text()
          old = "    { title: 'Solar Panels', href: '/shop/renogy', image: '/assets/hero/power-social.webp' },"
          new = "    { title: 'Solar Panels', href: '/shop/renogy', icon: 'solar' },"
          if old not in catalog:
              raise SystemExit('store solar category anchor missing')
          catalog_path.write_text(catalog.replace(old, new, 1))

          tests_path = Path('apps/web-v2/test/shell.test.mjs')
          tests = tests_path.read_text()
          tests = tests.replace("    '/assets/hero/power-social.webp',\n", '', 1)
          anchor = "  assert.match(shellSource, /title: 'Backup Power'[\\s\\S]{0,220}icon: 'backup'/);"
          addition = "  assert.match(shellSource, /title: 'Solar & Off-Grid'[\\s\\S]{0,220}icon: 'solar'/);\n  assert.match(catalogSource, /title: 'Solar Panels'[\\s\\S]{0,160}icon: 'solar'/);\n"
          if anchor not in tests:
              raise SystemExit('semantic test insertion anchor missing')
          tests_path.write_text(tests.replace(anchor, addition + anchor, 1))
          PY
          npm ci --ignore-scripts --prefix apps/web-v2
          npm --prefix apps/web-v2 test
          git diff --check
      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-web-v2-solar-semantic-fallback.yml
          git config user.name 'elevationupscales-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/web-v2/src/shell.js apps/web-v2/src/catalog-pages.js apps/web-v2/test/shell.test.mjs
          git commit -m 'Web V2: use semantic solar icon where photo is broken'
          git push origin HEAD:work/web-v2-final-functional-visual-finish-2026-09-13
