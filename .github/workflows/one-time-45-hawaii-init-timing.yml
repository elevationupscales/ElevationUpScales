name: One-Time 4.5 Hawaii Init Timing
on:
  push:
    branches:
      - build/4.5-commerce-control-2026-09-02
    paths:
      - .github/workflows/one-time-45-hawaii-init-timing.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ed2eaee5a01e3a5f23e1322eb63fa03c058220a6
      - name: Time Hawaii checkout initialization
        env:
          BASE: https://7c0411ea.elevationupscales.pages.dev
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > timing.mjs <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE.replace(/\/$/,'');
          const id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1100,height:900}});
          const page=await ctx.newPage();
          const started=Date.now();
          page.on('response',async r=>{const u=r.url();if(u.includes('/store-checkout.js')||u.includes('/api/store-checkout/quote'))console.log(`RESPONSE t=${Date.now()-started} status=${r.status()} url=${u}`)});
          page.on('pageerror',e=>console.log(`PAGEERROR t=${Date.now()-started} ${e.message}`));
          const nav=await page.goto(`${base}/checkout/?source=lithium&id=${id}&state=HI`,{waitUntil:'domcontentloaded',timeout:60000});
          console.log(`DOMCONTENT t=${Date.now()-started} status=${nav?.status()} url=${page.url()}`);
          async function snap(label){
            const x=await page.evaluate(()=>{const panel=document.querySelector('#checkout-hawaii-freight'),addr=document.querySelector('#checkout-address1'),paypal=document.querySelector('#checkout-paypal'),state=document.querySelector('#checkout-state'),hstate=document.querySelector('#checkout-hawaii-state'),status=document.querySelector('#checkout-status');return{panelHidden:panel?.hasAttribute('hidden'),panelDisplay:panel?getComputedStyle(panel).display:null,addressVisible:addr?!!(addr.offsetWidth||addr.offsetHeight||addr.getClientRects().length):null,addressParentHidden:addr?.closest('.eus-checkout-address-field')?.hasAttribute('hidden'),paypalHidden:paypal?.hasAttribute('hidden'),paypalDisplay:paypal?getComputedStyle(paypal).display:null,stateValue:state?.value,hawaiiState:hstate?.textContent,status:status?.textContent,scripts:[...document.scripts].map(s=>s.src).filter(Boolean)}});
            console.log(`${label} t=${Date.now()-started} ${JSON.stringify(x)}`);
            return x;
          }
          await snap('IMMEDIATE');
          for(const target of [100,250,500,800,1200,1800,2500,3500,5000,7000]){const left=target-(Date.now()-started);if(left>0)await page.waitForTimeout(left);await snap(`AT_${target}`)}
          await ctx.close();await browser.close();
          NODE
          BASE="$BASE" node timing.mjs
