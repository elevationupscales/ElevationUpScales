name: One-Time 4.5 Final Copy Commerce Preview V2

on:
  push:
    branches:
      - runner/4.5-final-copy-preview-v2-2026-09-03

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Preserve verifier
        run: cp .github/scripts/verify_45_final_copy_commerce_v2.mjs /tmp/verify.mjs
      - name: Download authoritative Lithium cost evidence
        uses: actions/download-artifact@v4
        with:
          name: lithium-pricing-audit-bound-preview
          path: /tmp/cost-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 33784084029
      - name: Freeze exact candidate and source gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a36beddab204d27832a37427d4b143857f373f14 main
          git checkout --detach a36beddab204d27832a37427d4b143857f373f14
          test "$(git rev-parse HEAD)" = "a36beddab204d27832a37427d4b143857f373f14"
          test "$(git rev-parse origin/main)" = "2cafb2274d1fbd7733068853554bef68fcf5c02d"
          changed=$(git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | sort)
          test "$changed" = "$(printf '%s\n' site/index.html site/start-a-project/index.html site/store.html | sort)"
          git diff --check 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD
          ! git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | grep -q '^\.github/'
          ! git diff --name-only 2cafb2274d1fbd7733068853554bef68fcf5c02d..HEAD | grep -Eq '(migration|commerce-schema-migrations)'
          test "$(git hash-object site/assets/homepage-option-2-lithium-solar.webp)" = "a46c581bb612b43b6e876b6cf3183710af198673"
          test "$(git hash-object site/assets/homepage-option-3-home-rv-lifestyle.webp)" = "04858f98e6eb344dc922e42916b4301ba8c29ddf"
      - id: deploy
        name: Deploy exact candidate preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=finalcopy45previewv2
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Route and decoded marker gate
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /store /rv-store /lithium-batteries /hawaii-lithium-batteries /start-a-project /product /checkout /terms /privacy /admin; do
            code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page.html -w '%{http_code}' "$base$route")
            echo "$route=$code"
            test "$code" = "200"
          done
          curl -fsS -L "$base/" -o /tmp/home.html
          curl -fsS -L "$base/start-a-project" -o /tmp/start.html
          python - <<'PY'
          from html import unescape
          h=unescape(open('/tmp/home.html').read())
          s=unescape(open('/tmp/start.html').read()).lower()
          for x in ('Shop Current Products','Featured products from our Lithium and RV & Outdoor stores.','Hawaii Lithium Batteries'):
              assert x in h, x
          assert 'href="/terms"' in h
          for x in ('underlying project families','intake intent tells management','management review'):
              assert x not in s, x
          PY
      - name: Exact preview commerce smoke
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
          COST_AUDIT: /tmp/cost-audit/lithium-pricing-audit-sanitized.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pw && cp /tmp/verify.mjs /tmp/pw/test.mjs && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          node test.mjs | tee /tmp/verification.json
      - name: Preview summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          echo '### Elevation 4.5 Final Repair Preview — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidate: a36beddab204d27832a37427d4b143857f373f14' >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Database migration: none' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/verification.json >> "$GITHUB_STEP_SUMMARY"
