name: WEB-COM-0905-01 Analytics Allowlist Integration

on:
  push:
    branches:
      - work/web-com-0905-01-storefront

permissions:
  contents: write

concurrency:
  group: web-com-0905-01-analytics-allowlist
  cancel-in-progress: false

jobs:
  integrate-once:
    runs-on: ubuntu-latest
    steps:
      - name: Check out storefront branch
        uses: actions/checkout@v6
        with:
          ref: work/web-com-0905-01-storefront
          fetch-depth: 0

      - name: Integrate storefront events into existing analytics owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core = Path("site/worker/core-context.js")
          source = core.read_text()
          old_events = '"homepage_sok_open", "sok_catalog_view", "sok_catalog_filter", "sok_product_view", "sok_media_view", "purchase_options_open", "purchase_inquiry_start", "purchase_inquiry_submit", "hawaii_options_open", "commercial_review_route", "add_to_cart", "checkout_start", "solar_builder_sok_cta"'
          new_events = '"homepage_sok_open", "homepage_logistics_capability_view", "homepage_logistics_route", "homepage_product_buy_open", "homepage_product_detail_open", "sok_catalog_view", "sok_catalog_filter", "sok_catalog_search", "sok_product_open", "sok_product_view", "sok_related_product_open", "sok_media_view", "purchase_options_open", "purchase_inquiry_start", "purchase_inquiry_submit", "hawaii_options_open", "commercial_review_route", "add_to_cart", "checkout_start", "solar_builder_sok_cta"'
          if source.count(old_events) != 1:
              raise SystemExit("analytics event allowlist source did not match the accepted clean-baseline form")
          source = source.replace(old_events, new_events, 1)

          old_strings = '"referrerHost", "utmSource", "utmMedium", "utmCampaign"]);'
          new_strings = '"referrerHost", "utmSource", "utmMedium", "utmCampaign", "sourceControl", "stage", "intent", "mediaIndex", "relatedSku"]);'
          if source.count(old_strings) != 1:
              raise SystemExit("analytics safe-string detail allowlist did not match expected source")
          source = source.replace(old_strings, new_strings, 1)

          old_numbers = '"arrayWatts", "batteryKwh", "inverterWatts", "dailySolarKwh", "estimatedUsageKwh"]);'
          new_numbers = '"arrayWatts", "batteryKwh", "inverterWatts", "dailySolarKwh", "estimatedUsageKwh", "characters"]);'
          if source.count(old_numbers) != 1:
              raise SystemExit("analytics safe-number detail allowlist did not match expected source")
          source = source.replace(old_numbers, new_numbers, 1)
          core.write_text(source)

          collection = Path("site/sok-batteries.js")
          text = collection.read_text()
          old_search = 'if(query.length>=2||!query)track("sok_catalog_search",query||"cleared",{characters:query.length});'
          new_search = 'if(query.length>=2||!query)track("sok_catalog_search",query?"query":"cleared",{characters:query.length});'
          if text.count(old_search) != 1:
              raise SystemExit("SOK search analytics source did not match expected form")
          collection.write_text(text.replace(old_search, new_search, 1))
          PY
          rm .github/workflows/web-com-0905-01-analytics-allowlist.yml
          node --check site/worker/core-context.js
          node --check site/sok-batteries.js
          node deployment/qa/web-com-analytics-static.mjs
          npm run qa
          git diff --check
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          expected = {
              "site/worker/core-context.js",
              "site/sok-batteries.js",
              ".github/workflows/web-com-0905-01-analytics-allowlist.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected files changed: {sorted(changed)}")
          PY
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/worker/core-context.js site/sok-batteries.js .github/workflows/web-com-0905-01-analytics-allowlist.yml
          git commit -m "WEB-COM-0905-01 integrate storefront analytics into accepted owner"
          git push origin HEAD:work/web-com-0905-01-storefront
