name: One-Time 4.5 Hawaii Checkout Immediate UI
on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths: [.github/workflows/one-time-45-hawaii-checkout-immediate-ui.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build/4.5-commerce-control-2026-09-02
          fetch-depth: 0
      - name: Apply immediate Hawaii checkout state
        run: python .github/scripts/repair_45_hawaii_checkout_immediate_ui.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check site/store-checkout.js
          git diff --check
          grep -q 'Checking Hawaii Shipping' site/store-checkout.js
          grep -q 'store-checkout.js?v=4.5.2' site/checkout/index.html
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add site/store-checkout.js site/checkout/index.html
          git commit -m "Stabilize Hawaii checkout while eligibility loads"
          git push origin HEAD:build/4.5-commerce-control-2026-09-02
