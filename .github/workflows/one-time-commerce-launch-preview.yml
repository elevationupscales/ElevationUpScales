name: One-Time Commerce Launch Preview

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  preview-commerce-launch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/commerce-launch-apparel-providers
          fetch-depth: 0
      - name: Validate release candidate source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c57bb559c5874d01f5bc741871a9d764e496efa1"
          for f in site/apparel-provider-runtime.js site/admin-commerce-media.js site/admin-commerce-media.css site/store-checkout-server.js site/_worker.js site/rv-store.js site/rv-store.css site/catalog-admin-runtime.js; do test -f "$f"; done
          for f in site/apparel-provider-runtime.js site/admin-commerce-media.js site/store-checkout-server.js site/_worker.js site/rv-store.js site/catalog-admin-runtime.js site/admin-inventory.js; do node --check "$f"; done
          grep -q 'catalogRvEntry' site/store-checkout-server.js
          grep -q 'handleApparelProviderAdminApi' site/_worker.js
          grep -q 'rv-category-rail' site/rv-store.js
          grep -q 'FOURTHWALL_STOREFRONT_TOKEN' site/apparel-provider-runtime.js
          grep -q 'printful' site/admin-catalog.html
          grep -q 'spreadconnect' site/admin-inventory.html
          ! grep -RIqE '(storefront_token=[A-Za-z0-9_-]{16,}|PRINTFUL_API_TOKEN\s*=|SPREADCONNECT_API_KEY\s*=)' site
      - name: Deploy isolated commerce preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=github-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Full preview regression
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${BASE%/}"
          for route in / /admin /admin-catalog /admin-inventory /admin-channels /admin-store-orders /admin-lithium-shipping /admin-analytics /store /rv-store /lithium-batteries /hawaii-lithium-batteries /checkout /marketplace /start-a-project /solar-project /admin-commerce-media.js /admin-commerce-media.css; do
            code=$(curl -sS -L --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "${base}${route}" || true)
            echo "${route} -> ${code}"
            test "$code" = "200"
          done
          rv=$(curl -sS -L --retry 6 "${base}/rv-store")
          printf '%s' "$rv" | grep -q 'RV & Outdoor Store'
          catalog=$(curl -sS -L --retry 6 "${base}/admin-catalog")
          printf '%s' "$catalog" | grep -q 'Products & Listings'
          channels=$(curl -sS -L --retry 6 "${base}/admin-channels")
          printf '%s' "$channels" | grep -q 'Doba — CSV Sync'
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/doba-csv-sync /api/admin/apparel-providers; do
            code=$(curl -sS -o /tmp/api -w '%{http_code}' "${base}${api}" || true)
            echo "protected ${api} -> ${code}"
            test "$code" = "401"
          done
          for runtime in /apparel-provider-runtime.js /doba-csv-sync-runtime.js /store-checkout-server.js; do
            code=$(curl -sS -o /tmp/runtime -w '%{http_code}' "${base}${runtime}" || true)
            echo "private ${runtime} -> ${code}"
            test "$code" = "404"
          done
          code=$(curl -sS -o /tmp/config -w '%{http_code}' "${base}/api/store-checkout/config" || true)
          test "$code" = "200"
      - name: Record preview receipt
        shell: bash
        run: |
          echo '### Commerce Launch preview' >> "$GITHUB_STEP_SUMMARY"
          echo '- Candidate: `c57bb559c5874d01f5bc741871a9d764e496efa1`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Preview: `${{ steps.deploy.outputs.deployment-url }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Route/auth/private-runtime regression: PASS' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove preview workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/one-time-commerce-launch-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove completed Commerce Launch preview workflow'
          git push origin main
