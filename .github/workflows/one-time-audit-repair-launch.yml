name: One-Time Audit Repair Launch

on:
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  repair-deploy-verify:
    if: ${{ contains(github.event.head_commit.message, '[audit-repair-launch]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 40

      - name: Apply audit repair patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/one_time_audit_repair_2026_08_28.py

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          node --check site/_worker.js
          node --check site/catalog-admin-runtime.js
          node --check site/rv-store.js
          node --check site/home-featured.js
          node --check site/site-shell.js
          grep -q 'handleCatalogPublicApi' site/catalog-admin-runtime.js
          grep -q '"/api/store-catalog"' site/_worker.js
          grep -q '/api/store-catalog?section=rv-outdoor' site/rv-store.js
          grep -q 'ELEVATION CATALOG' site/rv-store.html
          ! grep -q 'VERIFIED EBAY CATALOG' site/rv-store.html
          ! grep -q 'Two storefronts. One Elevation experience.' site/index.html
          grep -q 'Shop Lithium Batteries' site/index.html
          grep -q 'Hawaii Lithium Shipping' site/index.html
          grep -q 'No active listings are published right now.' site/marketplace.html
          grep -q 'Secure checkout' site/checkout/index.html
          ! grep -q 'Sandbox checkout' site/checkout/index.html
          for f in site/index.html site/home-services.html site/rv-services.html site/solar-services.html site/marketplace.html site/store.html site/rv-store.html site/collector.html site/start-a-project.html site/lithium-batteries.html site/hawaii-lithium-batteries.html; do
            test -f "$f"
            grep -q 'Lithium Battery Shop' "$f"
            grep -q 'Hawaii Lithium Shipping' "$f"
            ! grep -q 'Shop the Brand' "$f"
            grep -q 'site-shell.js?v=3.11.46' "$f"
          done

      - name: Record Marketplace state before deploy
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/market-before.json -w '%{http_code}' https://elevationupscales.com/api/marketplace/listings || true)
          echo "marketplace_api_before=${code}"
          if [ "$code" = "200" ]; then
            node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/market-before.json','utf8'));
          console.log(`marketplace_count_before=${Number(d.count ?? d.listings?.length ?? 0)}`);
          NODE
          fi

      - name: Commit permanent repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name elevationupscales
          git config user.email caseymyoung@gmail.com
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m 'Repair commerce navigation catalog and marketplace presentation'
            git push origin HEAD:main
          fi

      - name: Deploy production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all audit repairs in production
        shell: bash
        env:
          PRODUCTION_URL: https://elevationupscales.com
        run: |
          set -euo pipefail
          sleep 4
          for route in / /home-services /rv-services /solar-services /marketplace /store /rv-store /collector /start-a-project /lithium-batteries /hawaii-lithium-batteries /checkout; do
            code=$(curl -sS -L --connect-timeout 5 --max-time 20 --retry 2 --retry-delay 1 -o /tmp/page.html -w '%{http_code}' "${PRODUCTION_URL}${route}" || true)
            echo "${route}=${code}"
            test "$code" = "200"
          done

          curl -sS -L --fail "$PRODUCTION_URL/" > /tmp/home.html
          grep -q 'Apparel, RV &amp; outdoor, and lithium power' /tmp/home.html
          grep -q 'Shop Lithium Batteries' /tmp/home.html
          grep -q 'Hawaii Lithium Shipping' /tmp/home.html
          ! grep -q 'Two storefronts. One Elevation experience.' /tmp/home.html

          curl -sS -L --fail "$PRODUCTION_URL/rv-store" > /tmp/rv.html
          grep -q 'ELEVATION CATALOG' /tmp/rv.html
          ! grep -q 'VERIFIED EBAY CATALOG' /tmp/rv.html
          grep -q 'Lithium Batteries' /tmp/rv.html
          grep -q 'Hawaii Lithium Shipping' /tmp/rv.html

          curl -sS --fail "$PRODUCTION_URL/api/store-catalog?section=rv-outdoor" > /tmp/catalog.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8'));
          if(!Array.isArray(d.products) || d.products.length < 8) throw new Error(`Expected >=8 published RV catalog products, got ${d.products?.length}`);
          if(d.products.some(p=>p.publishStatus!=='published'||p.storeSection!=='rv-outdoor')) throw new Error('Public catalog leaked non-published or wrong-section records');
          const required=['168631001484','168631006501','168631017090','168631025949','168631036536','168631039073','168631043193','168646573395'];
          for(const id of required) if(!d.products.some(p=>p.ebayItemId===id)) throw new Error(`Missing published product ${id}`);
          console.log(`published_rv_catalog=${d.products.length}`);
          NODE

          curl -sS -L --fail "$PRODUCTION_URL/marketplace" > /tmp/market.html
          grep -q 'No active listings are published right now.' /tmp/market.html
          curl -sS --fail "$PRODUCTION_URL/api/marketplace/listings" > /tmp/market.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/market.json','utf8'));
          const count=Number(d.count ?? d.listings?.length ?? 0);
          console.log(`marketplace_published_count=${count}`);
          NODE

          curl -sS -L --fail "$PRODUCTION_URL/checkout" > /tmp/checkout.html
          grep -q 'Secure checkout' /tmp/checkout.html
          ! grep -q 'Sandbox checkout' /tmp/checkout.html
          curl -sS --fail "$PRODUCTION_URL/api/store-checkout/config" > /tmp/config.json
          node - <<'NODE'
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('/tmp/config.json','utf8'));
          if(c.environment!=='live'||c.credentialsConfigured!==true||c.checkoutEnabled!==true||c.liveCheckoutApproved!==true) throw new Error('PayPal live checkout regression');
          console.log('paypal_live=PASS');
          NODE

          rv_code=$(curl -sS -o /tmp/rvquote.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631001484","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631001484","name":"Vevor Portable 5 Gallon Fuel Container"}' || true)
          test "$rv_code" = "200"
          held_code=$(curl -sS -o /tmp/held.json -w '%{http_code}' -X POST "$PRODUCTION_URL/api/store-checkout/quote" -H 'Origin: https://elevationupscales.com' -H 'Referer: https://elevationupscales.com/rv-store' -H 'Content-Type: application/json' --data '{"source":"rv","id":"168631058246","quantity":1,"ebayUrl":"https://www.ebay.com/itm/168631058246","name":"Quick Set Brown Pop-Up Gazebo"}' || true)
          test "$held_code" = "409"

      - name: Receipt
        run: |
          echo '### Elevation 4.3 audit repairs — PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Shared Shop navigation: standardized' >> "$GITHUB_STEP_SUMMARY"
          echo 'Lithium + Hawaii navigation: exposed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Homepage storefront messaging: updated' >> "$GITHUB_STEP_SUMMARY"
          echo 'Homepage apparel rail: Elevation checkout' >> "$GITHUB_STEP_SUMMARY"
          echo 'Apparel checkout badge: Secure checkout' >> "$GITHUB_STEP_SUMMARY"
          echo 'RV Store: Elevation published catalog API' >> "$GITHUB_STEP_SUMMARY"
          echo 'Marketplace API: checked and truthful empty state retained when needed' >> "$GITHUB_STEP_SUMMARY"
          echo 'PayPal + RV protected routing: PASS' >> "$GITHUB_STEP_SUMMARY"
