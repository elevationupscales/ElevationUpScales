name: One-Time 4.5 Hawaii Checkout Browser Diagnostic
on:
  push:
    branches: [build/4.5-commerce-control-2026-09-02]
    paths: [.github/workflows/one-time-45-checkout-browser-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4e429ddbed40d9e200094520c6c694dec2afb938
      - name: Browser diagnostic
        shell: bash
        env:
          PREVIEW: https://5b910e77.elevationupscales.pages.dev
        run: |
          set -euo pipefail
          mkdir -p /tmp/browser && cd /tmp/browser
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          cat > diagnose.mjs <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.PREVIEW.replace(/\/$/,'');
          const id='cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1100,height:900}});
          const page=await context.newPage();
          page.on('console',m=>console.log(`CONSOLE ${m.type()}: ${m.text()}`));
          page.on('pageerror',e=>console.log(`PAGEERROR ${e.message}`));
          page.on('requestfailed',r=>console.log(`REQUEST_FAILED ${r.method()} ${r.url()} ${r.failure()?.errorText||''}`));
          page.on('response',async r=>{
            const u=r.url();
            if(u.includes('/api/store-checkout/quote')||u.includes('/store-checkout.js')){
              let body='';try{body=await r.text()}catch{}
              console.log(`RESPONSE ${r.status()} ${u} BODY=${body.slice(0,5000)}`);
            }
          });
          const url=`${base}/checkout/?source=lithium&id=${encodeURIComponent(id)}&state=HI`;
          const nav=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
          console.log(`NAV_STATUS=${nav?.status()} FINAL_URL=${page.url()}`);
          for(const wait of [500,1500,3000,6000]){
            await page.waitForTimeout(wait===500?500:wait-(wait===1500?500:wait===3000?1500:3000));
            const state=await page.locator('#checkout-state').inputValue().catch(()=>'<missing>');
            const status=await page.locator('#checkout-status').innerText().catch(()=>'<missing>');
            const panelCount=await page.locator('#checkout-hawaii-freight').count();
            const hidden=panelCount?await page.locator('#checkout-hawaii-freight').getAttribute('hidden'):null;
            const visible=panelCount?await page.locator('#checkout-hawaii-freight').isVisible():false;
            const scriptSrcs=await page.locator('script').evaluateAll(nodes=>nodes.map(n=>n.src));
            console.log(`AT_${wait}MS state=${JSON.stringify(state)} status=${JSON.stringify(status)} panelCount=${panelCount} hiddenAttr=${JSON.stringify(hidden)} visible=${visible}`);
            console.log(`SCRIPTS_${wait}MS=${JSON.stringify(scriptSrcs)}`);
          }
          const direct=await page.evaluate(async()=>{
            const r=await fetch('/api/store-checkout/quote',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({source:'lithium',id:'cat-01e78438-5fb8-4e0d-aaab-ffbe86f5cf77',name:'',quantity:1,variantId:'',couponCode:'',shipping:{fullName:'',address1:'',address2:'',city:'',state:'HI',postalCode:'',countryCode:'US'}})});
            return {status:r.status,body:await r.text()};
          });
          console.log(`IN_PAGE_DIRECT_QUOTE=${JSON.stringify(direct)}`);
          console.log('BODY_TEXT='+JSON.stringify((await page.locator('body').innerText()).slice(0,10000)));
          await browser.close();
          NODE
          PREVIEW="$PREVIEW" node diagnose.mjs
