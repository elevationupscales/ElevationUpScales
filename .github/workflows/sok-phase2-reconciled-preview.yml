name: SOK Phase 2 Reconciled Preview

on:
  push:
    paths:
      - ".github/workflows/sok-phase2-reconciled-preview.yml"

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run reconciliation QA
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          npm run qa:secrets
          git diff --check

      - name: Deploy isolated Cloudflare preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=sok-phase2-reconciled-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke reconciled preview
        env:
          BASE: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          set -euo pipefail
          npm run qa:preview -- "${BASE%/}"

      - name: Receipt
        run: |
          echo "SOK Phase 2 reconciled preview: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Production promotion: NOT PERFORMED" >> "$GITHUB_STEP_SUMMARY"
