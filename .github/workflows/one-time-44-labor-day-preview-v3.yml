name: One-Time Elevation 4.4 Labor Day Full Preview Gate v3

on:
  push:
    branches: [deploy/4.4-labor-day-preview-v3-2026-08-31]

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      EXPECTED_MAIN_SHA: ff75885cb437b05a390601245359518fea033d08
      CANDIDATE_SHA: a125d6995986bbf118a085cf0d1ee3cbd3fc2eb6
      CANONICAL_BASE: https://elevationupscales.com
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 0

      - name: Reverify lineage, protected scope and syntax
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          git -C candidate merge-base --is-ancestor "$EXPECTED_MAIN_SHA" "$CANDIDATE_SHA"
          git -C candidate diff --check "$EXPECTED_MAIN_SHA" "$CANDIDATE_SHA" -- site
          for p in site/marketplace.html site/solar-project.html site/start-a-project.html site/hawaii-lithium-runtime.js site/apparel-provider-runtime.js; do git -C candidate diff --quiet "$EXPECTED_MAIN_SHA"..."$CANDIDATE_SHA" -- "$p"; done
          for f in promotion-runtime.js store-checkout-server.js store-checkout.js product-detail.js lithium-shop.js _worker.js doba-csv-sync-runtime.js admin-promotion.js labor-day-promo.js catalog-admin-runtime.js; do node --check "candidate/site/$f"; done
          grep -q 'LABORDAY25' candidate/site/promotion-runtime.js
          grep -q 'batteryShippingCents:2799' candidate/site/promotion-runtime.js
          grep -q 'doba-download-center-45' candidate/site/doba-csv-sync-runtime.js
          grep -q 'Export Price ÷ 1.45' candidate/site/admin-channels.html
          grep -q 'breakdown.discount' candidate/site/store-checkout-server.js
          grep -q 'source=lithium' candidate/site/lithium-shop.js
          ! grep -q 'labor-day-promo.js' candidate/site/marketplace.html

      - name: Reverify pricing, coupon, battery and PayPal math
        run: |
          cat > unit.mjs <<'NODE'
          import assert from 'node:assert/strict';
          import {roundMarkup,pricingForProduct,applyCoupon,isActualLithiumBattery,batteryUnitsPerCatalogUnit,PROMOTION_APPROVED_DEFAULTS} from './candidate/site/promotion-runtime.js';
          import {__storeCheckoutTest} from './candidate/site/store-checkout-server.js';
          const active={available:true,active:true,...PROMOTION_APPROVED_DEFAULTS},inactive={...active,active:false};
          const evidence=[];
          for(const cost of [499,2499,10000,79999]){const p={supplier:'doba',storeSection:'rv-outdoor',supplierCostCents:cost,priceCents:1,title:'QA'};const x=pricingForProduct(p,active),c=applyCoupon({couponCode:'LABORDAY25',listMerchandiseCents:x.priceCents,eligible:true,config:active}),d=pricingForProduct(p,inactive);assert.equal(x.priceCents,Math.round(cost*1.6));assert.equal(c.discountCents,Math.round(x.priceCents*.25));assert.ok(Math.abs(c.merchandiseCents-Math.round(cost*1.2))<=1);assert.equal(d.priceCents,Math.round(cost*1.35));evidence.push({cost,list:x.priceCents,afterCoupon:c.merchandiseCents,everyday:d.priceCents});}
          assert.equal(Math.round(14500/1.45),10000);assert.equal(roundMarkup(10000,60),16000);
          assert.equal(applyCoupon({couponCode:'BAD',listMerchandiseCents:16000,eligible:true,config:active}).status,400);
          assert.equal(applyCoupon({couponCode:'LABORDAY25,LABORDAY25',listMerchandiseCents:16000,eligible:true,config:active}).status,400);
          assert.equal(applyCoupon({couponCode:'LABORDAY25',listMerchandiseCents:16000,eligible:false,config:active}).status,409);
          assert.equal(applyCoupon({couponCode:'LABORDAY25',listMerchandiseCents:16000,eligible:true,config:inactive}).status,409);
          const b=t=>({supplier:'doba',storeSection:'lithium-batteries',title:t,category:'LiFePO4 batteries',supplierCostCents:10000,priceCents:16000});
          assert.equal(isActualLithiumBattery(b('12V 100Ah LiFePO4 Battery')),true);assert.equal(batteryUnitsPerCatalogUnit(b('2 Pack 12V 100Ah LiFePO4 Battery')),2);assert.equal(batteryUnitsPerCatalogUnit(b('3 Pack 12V 100Ah LiFePO4 Battery')),3);assert.equal(isActualLithiumBattery(b('RV Battery Box Case')),false);assert.equal(isActualLithiumBattery(b('Portable Lithium Power Bank 1000Wh')),false);
          const pu=__storeCheckoutTest.buildPayPalPurchaseUnit({productName:'QA Battery',variantName:'',quantity:1,unitPriceCents:16000,listMerchandiseCents:16000,discountCents:4000,merchandiseCents:12000,shippingCents:2799,totalCents:14799,physical:true},'QA',{fullName:'QA Test',address1:'1 Test St',address2:'',city:'Denver',state:'CO',postalCode:'80202',countryCode:'US'});
          assert.equal(pu.amount.breakdown.item_total.value,'160.00');assert.equal(pu.amount.breakdown.discount.value,'40.00');assert.equal(pu.amount.breakdown.shipping.value,'27.99');assert.equal(pu.amount.value,'147.99');
          console.log(JSON.stringify({evidence,doba45:{export:14500,recoveredCost:10000,promoList:16000},paypal:pu.amount},null,2));
          NODE
          node unit.mjs

      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy candidate/site --project-name=elevationupscales --branch=labor-day-preview-v3-2026-08-31
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Reverify preview routes, auth boundaries and production isolation
        env: {PREVIEW_BASE: '${{ steps.deploy.outputs.deployment-url }}'}
        run: |
          set -euo pipefail
          base="${PREVIEW_BASE%/}"
          for route in / /lithium-batteries /rv-store /product /checkout /store /hawaii-lithium-batteries /marketplace /start-a-project /solar-project /admin /admin-promotion; do code=$(curl -sS -L --retry 8 --retry-all-errors --retry-delay 2 -o /tmp/page -w '%{http_code}' "$base$route"); echo "$route=$code"; test "$code" = 200; done
          for api in /api/admin/catalog /api/admin/inventory /api/admin/store-orders /api/admin/lithium-shipping /api/admin/promotion; do code=$(curl -sS -o /tmp/a -w '%{http_code}' "$base$api" || true); echo "$api=$code"; test "$code" = 401; done
          curl -sS --fail "$base/api/store/promotion" -o /tmp/p.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p.json'));assert p['active'] is True;assert p['couponCode']=='LABORDAY25';assert p['couponPercent']==25;assert p['batteryShippingCents']==2799;assert p['apparelEligible'] is False
          assert all(x in p['disclosure'] for x in ['Shipping','Marketplace','Apparel'])
          PY
          git fetch origin main --no-tags --prune; test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          curl -sS -L --fail "$CANONICAL_BASE/" -o /tmp/home; ! grep -q 'labor-day-promo.js' /tmp/home
          curl -sS -L --fail "$CANONICAL_BASE/api/store-checkout/config" -o /tmp/cfg
          python - <<'PY'
          import json
          c=json.load(open('/tmp/cfg'));assert c.get('configured') is True;assert c.get('credentialsConfigured') is True;assert c.get('checkoutEnabled') is True;assert c.get('liveCheckoutApproved') is True;assert c.get('environment')=='live'
          PY

      - name: Same-origin runtime commerce matrix
        env: {PREVIEW_BASE: '${{ steps.deploy.outputs.deployment-url }}'}
        run: |
          cat > runtime.mjs <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.PREVIEW_BASE.replace(/\/$/,'');
          const get=async p=>{const r=await fetch(base+p);const b=await r.json();if(!r.ok)throw new Error(`${p}:${r.status}`);return b;};
          const post=async body=>{const r=await fetch(base+'/api/store-checkout/quote',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','origin':base},body:JSON.stringify(body)});return{status:r.status,body:await r.json().catch(()=>({}))};};
          const live=(p,rv=false)=>String(p.publishStatus||'').toLowerCase()==='published'&&Number(p.priceCents)>0&&!(Number.isFinite(Number(p.supplierStock))&&Number(p.supplierStock)<=0)&&String(p.shippingStatus||'').toLowerCase()!=='hold'&&(!rv||String(p.shippingStatus||'').toLowerCase()!=='unverified');
          const liRaw=(await get('/api/store/catalog?section=lithium-batteries')).products,rvRaw=(await get('/api/store-catalog?section=rv-outdoor')).products,li=liRaw.filter(p=>live(p)),rv=rvRaw.filter(p=>live(p,true));
          const lh=await (await fetch(base+'/lithium-batteries')).text(),rh=await (await fetch(base+'/rv-store')).text(),lm=lh.match(/<strong data-lithium-count>(\d+)<\/strong>/),rm=rh.match(/<span id="rv-count">(\d+)<\/span>/);assert.ok(lm&&rm);assert.equal(+lm[1],li.length);assert.equal(+rm[1],rv.length);assert.ok(lh.includes('data-prerendered="true"')&&rh.includes('data-prerendered="true"'));
          for(const p of [...li,...rv].filter(x=>x.promotion?.couponEligible)){assert.equal(p.promotion.markupPercent,60);assert.equal(p.promotion.couponPriceCents,p.priceCents-Math.round(p.priceCents*.25));}
          const shipping={fullName:'QA Test',address1:'1 Test St',city:'Denver',state:'CO',postalCode:'80202',countryCode:'US'};
          async function find(rows,source,pred=()=>true){for(const p of rows.filter(x=>x.promotion?.couponEligible)){const q=await post({source,id:p.id,quantity:1,couponCode:'LABORDAY25',shipping});if(q.status===200&&q.body.ok&&pred(q.body))return{p,q:q.body};}throw new Error(`No qualified ${source}`);}
          const r=await find(rv,'rv');assert.equal(r.q.unitPriceCents,r.p.priceCents);assert.equal(r.q.discountCents,Math.round(r.q.listMerchandiseCents*.25));assert.equal(r.q.totalCents,r.q.merchandiseCents+r.q.shippingCents);
          const n=await post({source:'rv',id:r.p.id,quantity:1,shipping});assert.equal(n.status,200);assert.equal(n.body.shippingCents,r.q.shippingCents);assert.equal(n.body.discountCents,0);
          assert.equal((await post({source:'rv',id:r.p.id,quantity:1,couponCode:'BAD',shipping})).status,400);const stack=await post({source:'rv',id:r.p.id,quantity:1,couponCode:'LABORDAY25,LABORDAY25',shipping});assert.equal(stack.status,400);assert.match(String(stack.body.error),/stack/i);
          const manip=await post({source:'rv',id:r.p.id,quantity:1,couponCode:'LABORDAY25',priceCents:1,totalCents:1,name:'MANIPULATED',shipping});assert.equal(manip.status,200);assert.equal(manip.body.unitPriceCents,r.q.unitPriceCents);assert.equal(manip.body.totalCents,r.q.totalCents);assert.notEqual(manip.body.productName,'MANIPULATED');
          const apparel=await post({source:'apparel',id:'qa-exclusion',quantity:1,couponCode:'LABORDAY25'});assert.equal(apparel.status,409);assert.match(String(apparel.body.error),/Apparel/);
          const b=await find(li,'lithium',q=>q.battery?.actualBattery&&q.battery?.batteryUnitsPerItem>=1),units=b.q.battery.batteryUnitsPerItem,qty=[];assert.equal(b.q.shippingCents,2799*units);
          for(const quantity of [1,2,3]){const q=await post({source:'lithium',id:b.p.id,quantity,couponCode:'LABORDAY25',shipping});assert.equal(q.status,200);assert.equal(q.body.shippingCents,2799*units*quantity);assert.equal(q.body.discountCents,Math.round(q.body.listMerchandiseCents*.25));assert.equal(q.body.totalCents,q.body.merchandiseCents+q.body.shippingCents);qty.push({quantity,shippingCents:q.body.shippingCents,totalCents:q.body.totalCents});}
          const ak=await post({source:'lithium',id:b.p.id,quantity:1,couponCode:'LABORDAY25',shipping:{...shipping,state:'AK'}}),hi=await post({source:'lithium',id:b.p.id,quantity:1,couponCode:'LABORDAY25',shipping:{...shipping,state:'HI'}});assert.equal(ak.status,409);assert.match(String(ak.body.error),/Alaska/i);assert.equal(hi.status,409);assert.match(String(hi.body.error),/Hawaii Lithium Program|separate shipping quote/i);
          const lmnp=await post({source:'lithium',id:b.p.id,quantity:1,couponCode:'LABORDAY25',priceCents:1,shipping});assert.equal(lmnp.status,200);assert.equal(lmnp.body.unitPriceCents,b.p.priceCents);
          console.log(JSON.stringify({catalog:{lithiumRaw:liRaw.length,lithiumVisible:li.length,rvRaw:rvRaw.length,rvVisible:rv.length},rv:{id:r.p.id,list:r.q.listMerchandiseCents,discount:r.q.discountCents,shipping:r.q.shippingCents,total:r.q.totalCents},battery:{id:b.p.id,units,qty},alaska:ak.body.error,hawaii:hi.body.error,apparel:apparel.body.error},null,2));
          NODE
          node runtime.mjs

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Desktop/mobile storefront and checkout regression
        env: {PREVIEW_BASE: '${{ steps.deploy.outputs.deployment-url }}'}
        run: |
          cat > browser.mjs <<'NODE'
          import {chromium} from 'playwright';
          const base=process.env.PREVIEW_BASE.replace(/\/$/,'');
          const get=async p=>(await (await fetch(base+p)).json()).products;
          const live=(p,rv=false)=>String(p.publishStatus||'').toLowerCase()==='published'&&Number(p.priceCents)>0&&!(Number.isFinite(Number(p.supplierStock))&&Number(p.supplierStock)<=0)&&String(p.shippingStatus||'').toLowerCase()!=='hold'&&(!rv||String(p.shippingStatus||'').toLowerCase()!=='unverified');
          const li=(await get('/api/store/catalog?section=lithium-batteries')).filter(p=>live(p)),rv=(await get('/api/store-catalog?section=rv-outdoor')).filter(p=>live(p,true));
          const shipping={fullName:'QA Test',address1:'1 Test St',city:'Denver',state:'CO',postalCode:'80202',countryCode:'US'};
          const post=async body=>{const r=await fetch(base+'/api/store-checkout/quote',{method:'POST',headers:{'content-type':'application/json','origin':base},body:JSON.stringify(body)});return{status:r.status,body:await r.json().catch(()=>({}))};};
          async function sample(rows,source,battery=false){for(const p of rows.filter(x=>x.promotion?.couponEligible)){const q=await post({source,id:p.id,quantity:1,couponCode:'LABORDAY25',shipping});if(q.status===200&&q.body.ok&&(!battery||q.body.battery?.actualBattery))return p;}throw new Error(`No ${source} browser sample`);}
          const lp=await sample(li,'lithium',true),rp=await sample(rv,'rv');const imgs=p=>[p.primaryImage,...(Array.isArray(p.images)?p.images:[])].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i);
          const browser=await chromium.launch({headless:true}),e=[];
          for(const [vp,viewport] of [['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]]){const page=await browser.newPage({viewport});const errors=[];page.on('pageerror',x=>errors.push(String(x)));
            for(const route of ['/','/lithium-batteries','/rv-store',`/product?id=${encodeURIComponent(lp.id)}&store=lithium`,`/product?id=${encodeURIComponent(rp.id)}&store=rv`,`/checkout/?source=lithium&id=${encodeURIComponent(lp.id)}`,'/store','/hawaii-lithium-batteries','/marketplace']){await page.goto(base+route,{waitUntil:'domcontentloaded'});await page.waitForTimeout(300);if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+2))throw new Error(`${vp}:${route}:overflow`);}
            await page.goto(base+'/',{waitUntil:'domcontentloaded'});await page.locator('.eus-labor-day-banner').waitFor({state:'visible'});if(await page.locator('.hc-route').count()!==6)throw new Error(`${vp}:funnel`);
            for(const [store,p] of [['lithium',lp],['rv',rp]]){await page.goto(`${base}/product?id=${encodeURIComponent(p.id)}&store=${store}`,{waitUntil:'domcontentloaded'});await page.locator('[data-product-detail]').waitFor({state:'visible'});const buy=page.locator('[data-buy-now]');if(store==='lithium'&&await buy.isVisible()&&!String(await buy.getAttribute('href')).includes('source=lithium'))throw new Error(`${vp}:lithium-source`);if(imgs(p).length>1&&await page.locator('[data-gallery-next]').isVisible()){const before=await page.locator('[data-product-image]').getAttribute('src');await page.locator('[data-gallery-next]').click();if(before===await page.locator('[data-product-image]').getAttribute('src'))throw new Error(`${vp}:${store}:gallery`);}}
            await page.goto(`${base}/checkout/?source=lithium&id=${encodeURIComponent(lp.id)}`,{waitUntil:'domcontentloaded'});for(const [sel,val] of [['#checkout-full-name','QA Test'],['#checkout-address1','1 Test St'],['#checkout-city','Denver'],['#checkout-state','CO'],['#checkout-postal','80202'],['#checkout-coupon','LABORDAY25']])await page.locator(sel).fill(val);await page.locator('#checkout-apply-coupon').click();await page.locator('#checkout-discount-row').waitFor({state:'visible',timeout:10000});if(!String(await page.locator('#checkout-coupon-status').innerText()).includes('shipping is not discounted'))throw new Error(`${vp}:coupon-copy`);
            await page.goto(base+'/store',{waitUntil:'domcontentloaded'});await page.locator('.eus-labor-day-banner').waitFor({state:'visible'});if(!String(await page.locator('.eus-labor-day-banner').innerText()).includes('Apparel'))throw new Error(`${vp}:apparel-disclosure`);
            await page.goto(base+'/marketplace',{waitUntil:'domcontentloaded'});if(await page.locator('.eus-labor-day-banner').count())throw new Error(`${vp}:marketplace-leak`);
            await page.goto(base+'/hawaii-lithium-batteries',{waitUntil:'domcontentloaded'});await page.locator('[data-hawaii-request-form]').waitFor({state:'attached'});if(await page.locator('a[href*="source=lithium"]').count())throw new Error(`${vp}:hawaii-checkout`);const text=String(await page.locator('body').innerText()).toLowerCase();if(!text.includes('coming soon')&&!text.includes('shipping quote required'))throw new Error(`${vp}:hawaii-copy`);if(errors.length)throw new Error(`${vp}:errors:${errors.join(';')}`);e.push({vp,overflow:false,pageErrors:0,funnelRoutes:6,lithiumId:lp.id,rvId:rp.id});await page.close();}
          await browser.close();console.log(JSON.stringify(e,null,2));
          NODE
          node browser.mjs

      - name: Final isolation and PASS
        env: {PREVIEW_BASE: '${{ steps.deploy.outputs.deployment-url }}'}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune; test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          curl -sS -L --fail "$CANONICAL_BASE/" -o /tmp/home; ! grep -q 'labor-day-promo.js' /tmp/home
          echo '### Elevation 4.4 Labor Day — FULL PREVIEW PASS v3' >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $PREVIEW_BASE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Full pricing/coupon/shipping/AK-HI/PayPal/Catalog/product-detail/Marketplace/desktop-mobile gate: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo "Production remained: $EXPECTED_MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
