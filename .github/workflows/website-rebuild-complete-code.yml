name: Website Rebuild Complete Code

on:
  push:
    branches:
      - work/website-rebuild-complete-code-2026-09-05

permissions:
  contents: read
  deployments: write

concurrency:
  group: website-rebuild-complete-code
  cancel-in-progress: true

jobs:
  validate-clean-baseline:
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_PRODUCTION_MAIN: 995ddef117be2ba5b26e154ea43409271fc938a9
      PREVIEW_BRANCH: website-rebuild-complete-code-preview
    steps:
      - name: Check out committed code-completion branch
        uses: actions/checkout@v6
        with:
          ref: work/website-rebuild-complete-code-2026-09-05
          fetch-depth: 0

      - name: Protect accepted production lineage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags --prune
          test "$(git rev-parse origin/main)" = "$EXPECTED_PRODUCTION_MAIN"
          git merge-base --is-ancestor origin/main HEAD
          echo "Production main remains $EXPECTED_PRODUCTION_MAIN"

      - name: Verify committed rebuild source
        shell: bash
        run: |
          set -euo pipefail
          npm run qa
          git diff --check
          git diff --exit-code

      - name: Deploy isolated code-completion preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ env.PREVIEW_BRANCH }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Run canonical clean-baseline preview gate
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          npm run qa:preview -- "$PREVIEW_URL"

      - name: Verify candidate remained immutable
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          echo "Candidate SHA: $(git rev-parse HEAD)"

      - name: Summary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Website Rebuild committed code — PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Committed source invariants: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Canonical QA: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview regression: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Production main: UNCHANGED ($EXPECTED_PRODUCTION_MAIN)" >> "$GITHUB_STEP_SUMMARY"
