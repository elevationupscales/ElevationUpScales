name: One-time production deploy v3.11.29 Inventory

on:
  push:
    branches:
      - main
    paths:
      - site/admin-listings.html
      - site/admin-inventory.html
      - site/admin-inventory.css
      - site/admin-inventory.js
      - .github/patches/v3.11.29-inventory-worker.patch.part00
      - .github/patches/v3.11.29-inventory-worker.patch.part01
      - .github/patches/v3.11.29-inventory-worker.patch.part02
      - .github/patches/v3.11.29-inventory-worker.patch.part03
      - .github/patches/v3.11.29-admin-listings.patch
      - .github/workflows/deploy-pages.yml
      - .github/workflows/deploy-inventory-v3.11.29-once.yml

permissions:
  contents: write
  deployments: write

concurrency:
  group: elevation-pages-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and deploy v3.11.29 to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out authoritative main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply inventory Worker patch safely
        shell: bash
        run: |
          set -euo pipefail
          worker_patch=/tmp/v3.11.29-inventory-worker.patch
          cat .github/patches/v3.11.29-inventory-worker.patch.part00 \
              .github/patches/v3.11.29-inventory-worker.patch.part01 \
              .github/patches/v3.11.29-inventory-worker.patch.part02 \
              .github/patches/v3.11.29-inventory-worker.patch.part03 > "$worker_patch"
          admin_patch=.github/patches/v3.11.29-admin-listings.patch
          if grep -q '3.11.29-inventory-foundation' site/_worker.js; then
            echo "Inventory Worker patch is already present on main."
          else
            git apply --check "$worker_patch"
            git apply "$worker_patch"
          fi
          if grep -q 'href="/admin-inventory.html"' site/admin-listings.html; then
            echo "Mission Control inventory link is already present on main."
          else
            git apply --check "$admin_patch"
            git apply "$admin_patch"
          fi

      - name: Validate protected inventory release
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/_worker.js
          test -f site/_routes.json
          test -f site/_headers
          grep -q '3.11.29-inventory-foundation' site/_worker.js

          # Preserve current 7-stage Solar production lineage.
          test -f site/solar-visual-guide.css
          grep -q 'data-jump="panels"' site/solar-project.html
          grep -q 'data-jump="services"' site/solar-project.html
          grep -q 'Stage 1 of 7' site/solar-project.html
          cmp -s site/solar-project.html site/solar-project/index.html

          # Preserve current RV Shop and Store analytics lineage.
          test -f site/store-channel.css
          test -f site/store-channel-analytics.js
          test -f site/admin-store-analytics.css
          test -f site/admin-store-analytics.js
          grep -q '3.11.28-native-rv-catalog' site/store-channel-analytics.js
          grep -q 'store_destination_click' site/_worker.js
          grep -q 'store_section_view' site/_worker.js

          # Inventory foundation.
          test -f site/admin-inventory.html
          test -f site/admin-inventory.css
          test -f site/admin-inventory.js
          grep -q '/api/admin/inventory' site/_worker.js
          grep -q 'eus_inventory_items' site/_worker.js
          grep -q 'eus_inventory_events' site/_worker.js
          grep -q 'admin-inventory.html' site/admin-listings.html

          # Full JavaScript syntax gate.
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find site -type f -name '*.js' -print0)

          # Cloudflare Pages limits and secret scan.
          file_count=$(find site -type f | wc -l)
          test "$file_count" -le 20000
          oversized=$(find site -type f -size +25M -print -quit)
          test -z "$oversized"
          blocked=$(find site -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '*.pem' -o -name '*.key' -o -name '*.zip' \) -print -quit)
          test -z "$blocked"
          if grep -RIqE '(cfat_[A-Za-z0-9_-]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+|sk_live_[A-Za-z0-9]+|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' site; then
            echo "Credential-like value detected in site source."
            exit 1
          fi

      - name: Synchronize patched Worker to main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- site/_worker.js site/admin-listings.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/_worker.js site/admin-listings.html
            git commit -m "Apply v3.11.29 inventory Worker"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record production deployment
        shell: bash
        run: |
          echo "### v3.11.29 Inventory production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: ${{ steps.source.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
